# ---------------- Pricing ----------------
- field: device_price
  status: not_applicable
  recheck_by: '2026-11-20'
  note: Fitabase is software only; studies buy Fitbit, Google or Garmin devices themselves or use participants' own.
    The core plan lists "Compatibility with Fitbit and Garmin devices", not devices. The CIRQA blog post invites
    enquiries about "research price bulk order discounts" but publishes no prices.
- field: subscription_price
  status: not_applicable
  recheck_by: '2026-11-20'
  note: No consumer offering (the FAQ says individuals cannot use Fitabase for their own data). Study pricing is under
    api_platform_fees and quote_required.
