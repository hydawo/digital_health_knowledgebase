- field: deprecations
  status: stated
  value: Fitabase says Google turns off the Fitbit Web API on 2026-10-30 (Google itself moved the date to 2026-11-02
    on 2026-10-23; see facts/fitbit-google.yaml). Every Fitabase participant still collecting after that
    must reauthorize for the Google Health API, once, either in the Google Health app or by Fitabase link
    (platform reauthorization opened 2026-10-15); the reconnect option and links keep working through 2026-11-30.
    Late reauthorization backfills the gap if the device kept syncing to Google. Reauthorization cannot be done
    programmatically. Exports move dataset by dataset; on 2026-10-14, 29 of 40 were available, 8 delayed (including
    Intraday Calories, Intraday METs and ECG, whose import is paused) and 3 classic sleep exports Fitbit API only.
    Active Fitbit projects were extended to 2027-01-01 at no charge. Classic sleep stops being a separate dataset,
    writing step goals is not yet available, exports gain UTC, time zone and source columns, and the Fitabase API is
    unchanged.
  confidence: Verified
  sources:
  - url: https://www.fitabase.com/resources/knowledge-base/google-health-api-migration/migration-overview/
    type: vendor_docs
    quote: "Google is retiring the Fitbit Web API on October 30, 2026, and requiring every third-party app, Fitabase included, to move to the new Google Health API."
    retrieved: '2026-10-21'
  - url: https://developers.google.com/health/reference/rest/v4beta/users
    type: secondary
    quote: "On November 2, 2026 , the legacy Fitbit Web API and Fitbit OAuth endpoints will be turned off and will no longer function or sync data to or from Fitbit users."
    retrieved: '2026-10-30'
  - url: https://www.fitabase.com/resources/knowledge-base/google-health-api-migration/key-dates/
    type: vendor_docs
    quote: "Through November 30, 2026 The reconnect option stays on the Partner apps screen in the Google Health app, giving participants who missed the deadline a way back."
    retrieved: '2026-10-21'
  - url: https://www.fitabase.com/resources/knowledge-base/google-health-api-migration/if-participants-dont-reauthorize/
    type: vendor_docs
    quote: "When a participant reauthorizes, even weeks after the cutoff, Fitabase automatically goes back and fills in the data from the time they were disconnected."
    retrieved: '2026-10-21'
  - url: https://www.fitabase.com/resources/knowledge-base/google-health-api-migration/migration-faq/
    type: vendor_docs
    quote: "Each account has to go through Google's sign-in and permission screens."
    retrieved: '2026-10-21'
  - url: https://www.fitabase.com/resources/knowledge-base/google-health-api-migration/dataset-availability/
    type: vendor_docs
    quote: "Fitabase is moving its exports from the Fitbit Web API to the Google Health API one dataset at a time."
    retrieved: '2026-10-21'
  - url: https://www.fitabase.com/blog/post/google-health-api-fitbit-project-extensions/
    type: vendor_page
    quote: "These datasets are planned for the new Google Health API, but delivery will not occur before participants' required reauthorization to this new API."
    retrieved: '2026-10-21'
  - url: https://www.fitabase.com/resources/knowledge-base/google-health-api-migration/migration-faq/
    type: vendor_docs
    quote: "There will no longer be classic sleep data split out as its own dataset that is available to be downloaded."
    retrieved: '2026-10-21'
  - url: https://www.fitabase.com/resources/knowledge-base/google-health-api-migration/migration-faq/
    type: vendor_docs
    quote: "Writing step goals to the participant's app isn't available in the Google Health API yet."
    retrieved: '2026-10-21'
  - url: https://www.fitabase.com/resources/knowledge-base/google-health-api-migration/export-changes/
    type: vendor_docs
    quote: "Exports will include UTC time and time zone columns alongside the existing local time columns."
    retrieved: '2026-10-21'
  recheck_by: '2026-11-30'
  note: Changed since the 2026-10-11 drafts - reauthorization was then "Mid-to-late October 2026 (exact date TBD)"
    and is now set for 2026-10-15; the migration pages were updated 2026-10-14; the project extension and the
    dataset-availability page are new. The 2026-10-19 blog lists Intraday Calories, Intraday METs, ECG and SpO2 as
    outstanding, while the dataset table (2026-10-14) shows Daily and Minute SpO2 as Available; the counts on the
    table header (29 / 8 / 3 of 40) do not include the 5 new Google-only datasets marked Coming Soon. Google's legacy
    API support ended 2026-09-30. Google expects step-goal writing "next quarter".
