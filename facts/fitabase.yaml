facts:
# ---------------- Research access ----------------
- field: research_program
  status: stated
  value: No separate research or academic program. Fitabase itself is a research-only data platform for studies and
    trials using Fitbit (now Google Health) and Garmin wearables, with monitoring dashboards and exports. A one-off
    Fitabase and Fitbit Health Equity Research Initiative (2021) awarded devices and services; no later round found.
  confidence: Corroborated
  sources:
  - url: https://www.fitabase.com/resources/faq/
    type: vendor_page
    quote: "Fitabase is a comprehensive data management platform intended to support projects, studies, and clinical trials that deploy multiple wearable devices."
    retrieved: '2026-10-21'
  - url: https://www.fitabase.com/blog/post/health-equity-fund-announcement/
    type: vendor_page
    quote: "We are awarding up to $500,000 worth of devices and services."
    retrieved: '2026-10-21'
  - url: https://www.fitabase.com/
    type: vendor_page
    quote: "Fitabase has been used in over 1,100 research studies around the world."
    retrieved: '2026-10-21'
  - url: https://www.fitabase.com/how-it-works/customers/
    type: vendor_page
    quote: "900+ Institutions, 2500+ Studies"
    retrieved: '2026-10-21'
  recheck_by: '2026-11-20'
  note: Corroborated because "no separate program" is an absence across the site, not a statement. Fitabase's own
    study counts disagree (homepage "over 1,100" studies; customers page "2500+ Studies"); neither gives a counting
    method, so they are recorded, not reconciled.
- field: program_eligibility
  status: stated
  value: Research projects, studies and clinical trials; individuals cannot use Fitabase to access their own data. No
    other eligibility criteria are published.
  confidence: Verified
  sources:
  - url: https://www.fitabase.com/resources/faq/
    type: vendor_page
    quote: "At this time we do not support downloading or access to personal data."
    retrieved: '2026-10-21'
  recheck_by: '2026-11-20'
- field: program_application
  status: stated
  value: Sales-led, with no review step. Teams request a demo or quote; Fitabase then issues an invitation code and
    account creation link. Studies that cannot use participants' personal Google accounts can use Google-created
    de-identified demo accounts, which need a Google research application with an IRB approval or waiver (about 5
    to 7 business days); Fitabase supplies the client ID.
  confidence: Verified
  sources:
  - url: https://www.fitabase.com/how-it-works/pricing/
    type: vendor_page
    quote: "Contact our team for a customized quote based on your specific research needs."
    retrieved: '2026-10-21'
  - url: https://www.fitabase.com/resources/knowledge-base/getting-started/setting-up-your-fitabase-project/
    type: vendor_docs
    quote: "Once you've received your invitation code and account creation link from Fitabase you'll be able to create your Fitabase project."
    retrieved: '2026-10-21'
  - url: https://www.fitabase.com/resources/knowledge-base/getting-started/google-demo-accounts/
    type: vendor_docs
    quote: "To use these accounts, you'll need to complete a research application with Google."
    retrieved: '2026-10-21'
  - url: https://www.fitabase.com/resources/knowledge-base/getting-started/google-demo-accounts/
    type: vendor_docs
    quote: "Demo accounts take about 5-7 business days for Fitbit's support team to approve"
    retrieved: '2026-10-21'
  recheck_by: '2026-11-20'
  note: The demo-account process is Google's, described by Fitabase (blog 2025-03-12 and KB). The migration pages say
    demo accounts carry over and must be reauthorized like any other account. A 2024-25 blog post mentions a
    two-week trial; no current page offers one.
- field: program_status
  status: stated
  value: Active. Fitbit collection is moving to the Google Health API (reauthorization opened in the platform on
    2026-10-15). On 2026-10-19 Fitabase extended all active Fitbit projects ending before 2027-01-01 to that date at
    no charge, because some datasets are not yet available from Google. Fitabase Engage was relaunched on
    2026-04-21; on 2026-10-21 the Engage pages still label the Mobile App and Wrist App "Preview · Summer 2026",
    while the Fitabase Engage iPhone app is live on the App Store (version 1.6.8, Oct 9).
  confidence: Verified
  sources:
  - url: https://www.fitabase.com/resources/knowledge-base/google-health-api-migration/key-dates/
    type: vendor_docs
    quote: "October 15, 2026 Reauthorization opens in the Fitabase platform."
    retrieved: '2026-10-21'
  - url: https://www.fitabase.com/blog/post/google-health-api-fitbit-project-extensions/
    type: vendor_page
    quote: "we're extending all active Fitbit projects through Jan. 1, 2027 if they are set to end prior to that date"
    retrieved: '2026-10-21'
  - url: https://www.fitabase.com/blog/post/google-health-api-fitbit-project-extensions/
    type: vendor_page
    quote: "This is a no-charge extension."
    retrieved: '2026-10-21'
  - url: https://www.fitabase.com/blog/post/relaunch-of-fitabase-engage/
    type: vendor_page
    quote: "Today we're re-launching Fitabase Engage , our unified platform for designing and deploying real-time, interactive research experiences across mobile and wearable devices."
    retrieved: '2026-10-21'
  - url: https://www.fitabase.com/engage/wrist/
    type: vendor_page
    quote: "Fitabase Engage Preview · Summer 2026 Engage Wrist App"
    retrieved: '2026-10-21'
  - url: https://apps.apple.com/us/app/fitabase-engage/id6496601338
    type: app_store
    quote: "Developer Small Steps Labs LLC"
    retrieved: '2026-10-21'
  recheck_by: '2026-11-25'
  note: The relaunch post (2026-04-21) describes branching logic, triggers, variables, randomization and an AI
    Assistant that turns plain-language study descriptions into flows. The Wrist App's starting models are Garmin
    Vivoactive 5, Vivoactive 6, Venu 3 and Venu 4. "Summer 2026" has passed and the label has not been updated, so
    Engage's general availability is not stated. No Google Play listing for Fitabase Engage was found by search.
- field: developer_program_status
  status: stated
  value: The Fitabase API is a paid add-on for existing customer projects (key from the project's API portal), not an
    open developer program. Automated batch exports are a further add-on. The Fitabase API is not changing in the
    Google Health API migration.
  confidence: Verified
  sources:
  - url: https://www.fitabase.com/resources/knowledge-base/fitabase-api/what-is-the-fitabase-api/
    type: vendor_docs
    quote: "The Fitabase API and automated batch exports are currently offered as separate add ons to the Fitabase platform. Please inquire about pricing."
    retrieved: '2026-10-21'
  - url: https://www.fitabase.com/resources/knowledge-base/fitabase-api/authentication/
    type: vendor_docs
    quote: "Obtain your authentication key by logging into your Fitabase project, click on \"API\" from the project dashboard and then \"Launch API Portal\""
    retrieved: '2026-10-21'
  - url: https://www.fitabase.com/resources/knowledge-base/google-health-api-migration/migration-faq/
    type: vendor_docs
    quote: "If you pull data through the Fitabase API, your integration keeps working as-is."
    retrieved: '2026-10-21'
  recheck_by: '2026-11-20'
  note: Fitabase holds its own Google Health API connection (participants reauthorize Fitabase itself). Whether it
    has any limit on adding new customer studies is not stated. Researcher A's draft cited Google's "not onboarding
    new projects" line; that line was removed from Google's pages between 2026-10-12 and 2026-10-19 and is not used
    here (see facts/fitbit-google.yaml for Google's own access status).
