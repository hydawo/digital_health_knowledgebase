# ---------------- Data access and terms ----------------
- field: raw_streams
  status: stated
  scope: Fitbit / Google Health
  value: No raw sensor signals (no raw accelerometer or PPG); Fitabase passes through the highest resolution the
    partner API gives, including second-level heart rate (every 3 to 15 seconds), 30-second sleep stages and
    timestamped ECG logs. No GPS or location data is collected, by design.
  confidence: Verified
  sources:
  - url: https://www.fitabase.com/resources/faq/
    type: vendor_page
    quote: "The Fitabase platform offers access to the highest resolution of data available from our partner APIs."
    retrieved: '2026-10-21'
  - url: https://www.fitabase.com/resources/knowledge-base/learn-about-fitbit-data/data-resolutions/
    type: vendor_docs
    quote: "Heart Rate - variable sampling with readings every 3-15 seconds."
    retrieved: '2026-10-21'
  - url: https://www.fitabase.com/resources/knowledge-base/working-with-the-irb/data-security-privacy/
    type: vendor_docs
    quote: "No GPS or other location information is collected."
    retrieved: '2026-10-21'
  - url: https://www.fitabase.com/resources/knowledge-base/working-with-the-irb/answers-to-common-questions-irb-data-security/
    type: vendor_docs
    quote: "we currently do not support any GPS data as that is potentially identifiable as well"
    retrieved: '2026-10-21'
  recheck_by: '2026-11-20'
  note: During the Google Health API migration, ECG Logs are "Transition delayed" and Google Health ECG import is
    paused (dataset-availability page, updated 2026-10-14); see deprecations. Fitabase also supports the Fitbit Air
    screenless tracker (blog 2026-07-30), warning that a second Fitbit device on the same Google Health account
    interferes with collection.
- field: raw_streams
  status: stated
  scope: Garmin
  value: Two documented beat-to-beat routes. (1) Garmin API (OAuth, Garmin Connect app) - Enhanced BBI with a per-beat
    confidence flag, captured at the wrist during sleep, from devices with a gen 4 or later sensor (premium dataset).
    (2) Garmin SDK - a 2026-07-29 blog post says Fitabase can pull beat-to-beat intervals with the Garmin SDK when
    participants sync through the Fitabase Engage app instead of Garmin Connect; daytime coverage and sampling for
    this route are not stated. Also 15-second heart rate, and Garmin Index blood pressure monitor readings (systolic,
    diastolic, pulse, source).
  confidence: Corroborated
  sources:
  - url: https://www.fitabase.com/resources/knowledge-base/learn-about-garmin-data/collecting-enhanced-beat-to-beat-interval-data-using-garmin-devices/
    type: vendor_docs
    quote: "This dataset includes the time beat signature, as well as a confidence variable that indicates whether a beat might be of higher error."
    retrieved: '2026-10-21'
  - url: https://www.fitabase.com/resources/knowledge-base/learn-about-garmin-data/collecting-enhanced-beat-to-beat-interval-data-using-garmin-devices/
    type: vendor_docs
    quote: "It is captured during sleep directly from the wrist."
    retrieved: '2026-10-21'
  - url: https://www.fitabase.com/resources/knowledge-base/learn-about-garmin-data/collecting-enhanced-beat-to-beat-interval-data-using-garmin-devices/
    type: vendor_docs
    quote: "Garmin EBBI data can be collected using any Garmin device with a gen 4 sensor or higher."
    retrieved: '2026-10-21'
  - url: https://www.fitabase.com/resources/knowledge-base/learn-about-garmin-data/collecting-enhanced-beat-to-beat-interval-data-using-garmin-devices/
    type: vendor_docs
    quote: "In early 2025, Fitabase collaborated with Garmin to allow researchers to collect EBBI data using a new API method which transmits EBBI data to Fitabase using the Garmin API."
    retrieved: '2026-10-21'
  - url: https://www.fitabase.com/blog/post/garmin-cirqa-screenless-device-for-research/
    type: vendor_page
    quote: "If you're curious about beat-to-beat intervals (HRV), Fitabase can help you pull them using the Garmin SDK."
    retrieved: '2026-10-21'
  - url: https://www.fitabase.com/blog/post/garmin-cirqa-screenless-device-for-research/
    type: vendor_page
    quote: "You'll have participants download the Fitabase Engage app and sync through it instead of the Garmin Connect app."
    retrieved: '2026-10-21'
  - url: https://apps.apple.com/us/app/fitabase-engage/id6496601338
    type: app_store
    quote: "Connect Garmin device directly to the Fitabase Engage app."
    retrieved: '2026-10-21'
  - url: https://www.fitabase.com/blog/post/garmin-index-blood-pressure-monitor/
    type: vendor_page
    quote: "Our platform can now pull readings from the Garmin Index Blood Pressure Monitor"
    retrieved: '2026-10-21'
  recheck_by: '2026-11-20'
  note: The two routes do not contradict each other. The KB's EBBI article describes only the API route and answers
    "SDK or API?" with the API; the SDK route appears in the CIRQA blog post, a KB troubleshooting article "Setting up
    Fitabase Engage for the Garmin SDK" (last updated 2026-04-15, no streams or rates listed) and App Store release
    notes (version 1.2, "Connect Garmin device directly to the Fitabase Engage app"; 1.3 and 1.4, Garmin SDK fixes).
    What the SDK route collects outside sleep, at what rate, whether it is Enhanced or legacy BBI, and who can use
    it are not stated. Corroborated, as all sources are vendor pages.
- field: derived_metrics
  status: stated
  scope: Fitbit / Google Health
  value: Steps, intensity and METs, calories, sleep and sleep stages, breathing rate, HRV, SpO2, Active Zone Minutes,
    cardio fitness score, floors, distance, resting heart rate, skin and core temperature, wear time, plus weight,
    food and activity logs.
  confidence: Verified
  sources:
  - url: https://www.fitabase.com/resources/knowledge-base/learn-about-fitbit-data/data-resolutions/
    type: vendor_docs
    quote: "Day Steps Intensity - time spent in activity intensity classifications Calories (Estimated Energy Expenditure) Sleep and Sleep stages Breathing Rate HRV SpO2 Active Zone Minutes Cardio Fitness Score Floors Distance Food Logs Activity Logs Resting Heart Rate"
    retrieved: '2026-10-21'
  recheck_by: '2026-11-20'
  note: Under the Google Health API, 29 of 40 exports were available on 2026-10-14; Intraday Calories, Intraday
    METs, Activity Logs, Sedentary Time, ECG Logs, Weight Logs, Food Logs and Wear Time are "Transition delayed",
    and the classic Daily Sleep and Sleep Log exports are "Fitbit API only" (use the Sleep Stages exports). See
    deprecations.
- field: derived_metrics
  status: stated
  scope: Garmin
  value: Daily stress, steps, floors, VO2max, fitness age, Pulse Ox, Move IQ, body composition, calories, nightly HRV
    average and 5-minute high, wear time and activity logs; 15-minute epochs; sleep records at each stage change;
    Body Battery, respiration and sleep scores.
  confidence: Verified
  sources:
  - url: https://www.fitabase.com/resources/knowledge-base/learn-about-garmin-data/garmin-datasets/
    type: vendor_docs
    quote: "Day -Stress -Steps -Floors -VO2max -Fitness Age -PulseOx -MoveIQ -Body composition -Calorie expenditure -HRV nightly average and 5-minute high"
    retrieved: '2026-10-21'
  - url: https://www.fitabase.com/blog/post/new-features-in-fitabase-24-25/
