- field: retention_terms
  status: stated
  value: On account cancellation, personally identifiable information is deleted and backups expire on the normal
    schedule, but Fitabase may keep using de-identified, anonymized historical data. On termination Fitabase may
    delete all account data, and it may close accounts inactive for more than 30 days. Fitabase's example IRB text
    says projects are removed and data deleted from servers and backups 90 days after data collection ends. Data
    already synced is kept through the Google Health API switch.
  confidence: Verified
  sources:
  - url: https://www.fitabase.com/privacy/
    type: vendor_legal
