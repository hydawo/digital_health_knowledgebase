  confidence: Verified
  sources:
  - url: https://www.fitabase.com/resources/knowledge-base/learn-about-fitbit-data/data-resolutions/
    type: vendor_docs
    quote: "Seconds Heart Rate - variable sampling with readings every 3-15 seconds. Sleep stages - 30 seconds"
