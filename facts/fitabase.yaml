- field: history_depth
  status: stated
  scope: Garmin
  value: Data before connection can be pulled by setting sync dates in the past, but only if the participant turns on
    the off-by-default Historical Data permission in Garmin Connect. No maximum look-back is published.
  confidence: Verified
  sources:
  - url: https://www.fitabase.com/resources/knowledge-base/learn-about-garmin-data/capturing-historical-garmin-data/
    type: vendor_docs
    quote: "Fitabase can pull historical data from a participant if you set sync dates to a window in the past. However, this option is turned off by default on Garmin Connect, and participants must explicitly opt into allowing Fitabase to pull this historical data."
    retrieved: '2026-10-21'
  recheck_by: '2026-11-20'
- field: history_depth
  status: unclear
  scope: Fitbit / Google Health
  value: Whether Fitabase can retrieve Fitbit or Google Health data from before a participant connects is not clearly
    documented. Fitabase's example consent form (from a past study) describes authorizing download of historical
    Fitbit data; batch sync lengths count from the moment of connection. Devices hold minute and second data for only
    5 to 7 days before syncing, after which only daily aggregates remain.
  confidence: Unclear
  sources:
  - url: https://www.fitabase.com/resources/knowledge-base/working-with-the-irb/example-consent-form/
    type: vendor_docs
    quote: "This study included: Historical data collection Online Fitabase authorization Use of participants' personal Fitbit devices/data"
    retrieved: '2026-10-21'
  - url: https://www.fitabase.com/media/1726/exampleconsentform.pdf
