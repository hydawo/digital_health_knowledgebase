  - url: https://github.com/cbitstech/Purple-Robot/wiki/Embedded-HTTP-API
    type: vendor_docs
    quote: Purple Robot now includes a local HTTP server that is accessible to local applications on the mobile device.
    retrieved: 2026-10-22
  recheck_by: 2026-11-21
  note: The Django app pins Django 1.6 and South, long out of support. The upload protocol uses MD5 checksums.
- field: rate_limits
  status: not_applicable
  note: No hosted API. Throughput is bounded by the team's own server.
- field: retention_terms
  status: stated
  value: No vendor retention terms; the deploying research site sets its own privacy rules. On the phone, data are anonymised (MD5 hashing and AES) before storage, then deleted after transmission to the
    server.
  confidence: Verified
