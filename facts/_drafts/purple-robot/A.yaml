- field: raw_streams
  status: stated
  value: 'Android only. Probes cover the Android sensor framework (accelerometer, gyroscope, magnetometer, light, pressure, proximity, temperature, gravity, rotation, step counter), raw and fused location,
    Wi-Fi access points, Bluetooth devices, visible satellites, battery, screen state, call state, communication log, running software, application launches, telephony, hardware and software information,
    touch events and audio features. All go by HTTP upload to the research team''s own server.'
  confidence: Verified
  sources:
  - url: https://github.com/cbitstech/Purple-Robot/wiki
    type: vendor_docs
    quote: including the accelerometer, gyroscope, pressure sensor, and more.
    retrieved: 2026-10-22
  - url: https://github.com/cbitstech/Purple-Robot/wiki
    type: vendor_docs
    quote: Location sensors that use the built-in GPS and cellular triangulation options to map the user's location.
    retrieved: 2026-10-22
  - url: https://github.com/cbitstech/Purple-Robot/wiki
    type: vendor_docs
    quote: Options to scan for external devices such as wireless access points and visible Bluetooth devices.
    retrieved: 2026-10-22
