facts:
- field: research_program
  status: stated
  value: No research access program. Purple Robot is open-source Android software that Northwestern CBITS built as infrastructure for its own intervention and sensing studies. Outside teams build the
    APK from source and run their own upload server. No program, service or support offer is published by CBITS or by Audacious Software, the developer's company.
  confidence: Corroborated
  sources:
  - url: https://github.com/cbitstech/Purple-Robot
    type: repository
    quote: The app was created by the Center for Behavioral Intervention Technologies at Northwestern University as an infrastructural component for a variety of behavioral and medical intervention applications.
    retrieved: 2026-10-22
  - url: https://github.com/cbitstech/Purple-Robot
    type: repository
    quote: The instructions below describe how to create an APK Android package for your own testing and development.
    retrieved: 2026-10-22
  - url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4526997/
    type: paper
    quote: Purple Robot is an open-source Android app that we developed to collect mobile phone sensor data
    retrieved: 2026-10-22
  - url: https://cbits.northwestern.edu/our-research/our-research-projects/completed-projects.html
    type: vendor_page
    quote: The personal sensing research at the Center for Behavioral Intervention Technologies harnesses sensor data collected from mobile phones and other devices to identify behaviors and states related to mental health.
    retrieved: 2026-10-22
  recheck_by: 2026-11-21
  note: The current CBITS site (home, research projects, completed projects) does not name Purple Robot at all; personal sensing appears only under completed projects. The old project host
    tech.cbits.northwestern.edu did not resolve on 2026-10-22. phidatalab.org now answers HTTP 200, but it is the King's College London Precision Health Informatics Data Lab (NIHR Maudsley BRC), and its
    site search for "purple robot" returns nothing, so it is not a Purple Robot source.
