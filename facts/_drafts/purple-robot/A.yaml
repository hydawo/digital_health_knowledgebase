- field: history_depth
  status: not_applicable
  note: Data live on the research team's own server, so history is whatever the team keeps. On the phone, data are held only until a successful upload.
- field: export_routes
  status: stated
  value: The app POSTs JSON sensor payloads to an HTTP endpoint the researcher configures, with store-and-forward retry. The Purple-Robot-Django server app receives them and offers a date-range export page
    and CSV export jobs; a small CherryPy starter server is also documented. An embedded localhost HTTP API lets other apps on the phone reach Purple Robot data and scripts.
  confidence: Verified
  sources:
