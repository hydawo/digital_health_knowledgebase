    type: vendor_docs
    quote: Statistical summaries of the user's communication patterns, including phone logs and text-message transcripts.
    retrieved: 2026-10-22
  recheck_by: 2026-11-21
  note: Behavioural features such as location variance or circadian movement in Saeb et al. 2015 were computed by the study team offline, not by Purple Robot.
- field: sampling_rates
  status: stated
  value: Configurable per probe. Accelerometer options run from 200 per second down to every 10 seconds; other built-in sensors from 10 per second to every 10 seconds; the generic probe default interval
    is 300000 ms (5 minutes). Saeb et al. 2015 sampled GPS once every 5 minutes and screen on/off events.
  confidence: Verified
