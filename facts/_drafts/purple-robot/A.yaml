    type: repository
    quote: AudioFeaturesProbe.java
    retrieved: 2026-10-22
  recheck_by: 2026-11-21
  note: The probe list comes from the builtin probes directory of the last code (v3.0.13, January 2019). The manifest asks for READ_SMS, READ_CALL_LOG and READ_CONTACTS; current Google Play policy and
    Android versions newer than the app's target (API 28) would block or limit several of these, which is untested here.
- field: derived_metrics
  status: stated
  value: On-device features including basic statistics and frequency features for accelerometer, gyroscope, light, magnetic field, pressure, proximity and temperature, plus call history, device in use and
    sunrise/sunset features. Communication data can be summarised statistically before upload, and researchers can define new features in JavaScript. No analysis pipeline is published.
  confidence: Verified
  sources:
  - url: https://github.com/audaciouscode/Purple-Robot-Android/tree/master/app/src/main/java/edu/northwestern/cbits/purple_robot_manager/probes/features
