# ---------------- Data access and terms ----------------
- field: raw_streams
  status: stated
  value: 'Raw, unfiltered tri-axial acceleration (AX3: Analog Devices ADXL345; AX6: Bosch BMI160), plus tri-axial
    gyroscope on the AX6, with light and device temperature as lower-rate auxiliary channels. All stored raw on the
    device flash in the open .CWA format and read over USB by the researcher. No vendor cloud.'
  confidence: Verified
  sources:
  - url: https://axivity.com/product/ax6
    type: vendor_page
    quote: All data is stored in its raw unaltered format on the embedded flash memory.
    retrieved: '2026-10-11'
  - url: https://github.com/openmovementproject/openmovement/blob/master/Docs/ax3/ax3-faq.md
    type: vendor_docs
    quote: Analog Devices ADXL345 Bosch BMI160
    retrieved: '2026-10-11'
  - url: https://github.com/openmovementproject/openmovement/blob/master/Docs/ax3/ax3-faq.md
    type: vendor_docs
    quote: The auxiliary data channels (device temperature and light level indicator) are sampled at a lower rate in
      all modes.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: derived_metrics
  status: stated
  value: 'The device stores raw data only. OmGui (via omconvert) derives signal vector magnitude (SVM), MET-based
    cut-point time in sedentary/light/moderate/vigorous activity, wear-time validation and a sleep-period
    estimate. Richer metrics come from third-party open-source tools the docs recommend, chiefly GGIR.'
  confidence: Verified
  sources:
  - url: https://github.com/openmovementproject/openmovement/wiki/AX3-GUI
    type: vendor_docs
    quote: The signal vector magnitude (SVM) has been shown to be a useful measure for working with when axis
      specific information is not required.
    retrieved: '2026-10-11'
  - url: https://github.com/openmovementproject/openmovement/wiki/AX3-GUI
    type: vendor_docs
    quote: The Cut-point analysis reports the time user has spent in a specific intensity of physical activity where
      each intensity band is categorized in units of Metabolic Equivalent of Task (METS).
    retrieved: '2026-10-11'
  - url: https://github.com/openmovementproject/openmovement/wiki/AX3-GUI
    type: vendor_docs
    quote: The wear time validation (WTV) algorithm is designed to give a high level view if the device has been worn
      or not.
    retrieved: '2026-10-11'
  - url: https://github.com/openmovementproject/openmovement/wiki/AX3-GUI
    type: vendor_docs
    quote: The algorithm detects periods of sleep.
    retrieved: '2026-10-11'
  - url: https://github.com/openmovementproject/openmovement/blob/master/Docs/ax3/ax3-research.md
    type: vendor_docs
    quote: For a richer analysis, a popular option in research is the open source GGIR software, which includes
      sleep analysis and can also produce more visual reports.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: sampling_rates
  status: stated
  value: 'AX3: 12.5 to 3200 Hz configurable (6.25 Hz in unpacked mode), range +/-2/4/8/16 g. AX6: 12.5 to 1600 Hz
    configurable, gyroscope +/-125 to 2000 dps. OmGui default is 100 Hz, +/-8 g. Temperature and light are sampled
    at a lower rate.'
  confidence: Verified
  sources:
  - url: https://axivity.com/product/ax3
    type: vendor_page
    quote: Accelerometer Sample Rate 12.5 - 3200Hz Configurable
    retrieved: '2026-10-11'
  - url: https://axivity.com/product/ax6
    type: vendor_page
    quote: Accelerometer Sample Rate 12.5 - 1600Hz Configurable
    retrieved: '2026-10-11'
  - url: https://github.com/openmovementproject/openmovement/blob/master/Docs/ax3/ax3-faq.md
    type: vendor_docs
    quote: The auxiliary data channels (device temperature and light level indicator) are sampled at a lower rate in
      all modes.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: history_depth
  status: stated
  value: 'Bounded by on-device memory and battery for one recording: AX3 about 14 days at 100 Hz (30 days at 12.5
    Hz); AX6 7+ days at 100 Hz with gyroscope, 31+ days at 50 Hz accelerometer only. Once downloaded, files are held
    by the researcher indefinitely; there is no vendor-side history.'
  confidence: Verified
  sources:
  - url: https://axivity.com/product/ax3
    type: vendor_page
    quote: Battery Life 30 days @ 12.5Hz; 14 days @ 100Hz
    retrieved: '2026-10-11'
  - url: https://axivity.com/product/ax6
    type: vendor_page
    quote: Battery Life 7+ days @ 100Hz, Accel & Gyro 31+ days @ 50Hz, Accel only
    retrieved: '2026-10-11'
  - url: https://github.com/openmovementproject/openmovement/blob/master/Docs/ax3/ax3-research.md
    type: vendor_docs
    quote: The maximum duration of a single recording depends on the device and configuration, but for a typical
      rate of 100 Hz, this is almost two weeks.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
  note: The AX3v2 datasheet (v1.8, 2023) also says "up to 21 days of continuous data" in its description while its
    spec table gives 14 days at 100 Hz; the FAQ table is the more detailed source.
- field: export_routes
  status: stated
  value: 'USB only. The device mounts as a USB drive holding CWA-DATA.CWA; OmGui (Windows) downloads it and exports
    raw CSV, resampled CSV or multi-channel WAV; omconvert and cwa-convert do the same from the command line; the
    file loads directly into GGIR, openmovement-python, MATLAB and other tools; libOMAPI lets teams build their own
    download software. About 6 minutes to download 7 days of data.'
  confidence: Verified
  sources:
  - url: https://github.com/openmovementproject/openmovement/wiki/AX3-GUI
    type: vendor_docs
    quote: Data files can be downloaded by simply by mounting the AX device as USB-stick and copying (or moving off)
      the data file CWA-DATA.CWA from the devices.
    retrieved: '2026-10-11'
  - url: https://github.com/openmovementproject/openmovement/wiki/AX3-GUI
    type: vendor_docs
    quote: You can process or export the data with omconvert or cwa-convert .
    retrieved: '2026-10-11'
  - url: https://github.com/openmovementproject/openmovement/wiki/AX3-GUI
    type: vendor_docs
    quote: Download time is approximately 6 minutes for 7 days worth of data.
    retrieved: '2026-10-11'
  - url: https://github.com/openmovementproject/openmovement/wiki/AX3-GUI
    type: vendor_docs
    quote: The system requirements for the OMGUI software are a Windows PC with XP SP3 or later operating system and
      Microsoft .NET Framework v3.5 or later.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
  note: OmGui is Windows-only; Mac users need virtualization or the cross-platform command-line tools.
