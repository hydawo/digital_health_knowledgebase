- field: sampling_rates
  status: stated
  value: 12.5 to 3200 Hz configurable; range 2/4/8/16 g; up to 13-bit (10-bit packed or 13-bit unpacked modes)
  confidence: Verified
  scope: AX3
  sources:
  - url: https://axivity.com/product/ax3
    type: vendor_page
    quote: "Accelerometer Sample Rate 12.5 - 3200Hz Configurable"
    retrieved: 2026-10-11
  - url: https://axivity.com/help/22
    type: vendor_docs
    quote: "The AX3 has 2 bit depth modes; 10bit (or packed) and 13bit (un-packed)"
    retrieved: 2026-10-11
  recheck_by: 2026-11-09
  note: The sensor keeps its own timing, so the actual rate varies slightly from the nominal rate; resample afterwards if a fixed rate is needed (FAQ help/21). Default OmGui setting is 100 Hz, 8 g.
