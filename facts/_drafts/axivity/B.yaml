- field: history_depth
  status: stated
  value: Limited by on-device memory and battery per recording, not by any server. AX3 about 14 days at 100 Hz, 30 days at 12.5 Hz; AX6 about 7 days at 100 Hz with gyroscope, up to 140 days accelerometer-only at 12.5 Hz. Data stays on the device until downloaded and cleared.
  confidence: Verified
  sources:
