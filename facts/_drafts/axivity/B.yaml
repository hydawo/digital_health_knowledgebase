- field: export_routes
  status: stated
  value: Mount the device over USB and copy the binary CWA file, or download with OmGui (Windows). Convert to CSV or WAV with OmGui, omconvert or cwa-convert, or read the CWA directly in GGIR, openmovement-python, MATLAB, C (libOMAPI) and others. Parallel multi-device download and the AX-Deploy mass-deployment tool exist.
  confidence: Verified
  sources:
  - url: https://github.com/digitalinteraction/openmovement/wiki/AX3-GUI
    type: vendor_docs
    quote: "Data files can be downloaded by simply by mounting the AX device as USB-stick and copying (or moving off) the data file CWA-DATA.CWA from the devices."
    retrieved: 2026-10-11
  - url: https://github.com/digitalinteraction/openmovement/wiki/AX3-GUI
    type: vendor_docs
    quote: "You can process or export the data with omconvert or cwa-convert ."
    retrieved: 2026-10-11
  - url: https://github.com/digitalinteraction/openmovement/wiki/AX3-GUI
    type: vendor_docs
    quote: "You can also directly load the data into analysis environments with software such as: GGIR , openmovement-python , pampro , MATLAB or biobankAccelerometerAnalysis ."
    retrieved: 2026-10-11
  - url: https://github.com/digitalinteraction/openmovement/wiki/AX3-GUI
    type: vendor_docs
    quote: "The system requirements for the OMGUI software are a Windows PC with XP SP3 or later operating system and Microsoft .NET Framework v3.5 or later."
    retrieved: 2026-10-11
  - url: https://axivity.com
    type: vendor_page
    quote: "With an open API, RAW data format and parallel download options, it is the sensor of choice for large and small cohort studies."
    retrieved: 2026-10-11
  recheck_by: 2026-11-09
  note: No wireless sync, phone app or cloud for AX3/AX6. OmGui is Windows-only; Mac and Linux users use the cross-platform command-line converters or the web configurator (configures but cannot download). AX-Deploy is not compatible with AX6 gyroscopes.
