- field: raw_streams
  status: stated
  value: Raw triaxial acceleration (AX3) or raw acceleration plus gyroscope (AX6), each sample timestamped, plus light and temperature channels. Read directly off the device over USB as a .CWA file; no cloud.
  confidence: Verified
  sources:
  - url: https://axivity.com/product/ax6
    type: vendor_page
    quote: "All data is stored in its raw unaltered format on the embedded flash memory."
    retrieved: 2026-10-11
  - url: https://axivity.com/product/ax6
    type: vendor_page
    quote: "It features a state of the art 6-Axis movement sensor measuring linear acceleration and angular velocity at high precision."
    retrieved: 2026-10-11
  - url: https://axivity.com/product/ax3
    type: vendor_page
    quote: "The light sensor can be used to help determine periods of wear as well as provide useful environmental data."
    retrieved: 2026-10-11
  - url: https://axivity.com/help/21
    type: vendor_docs
    quote: "Instead, timestamps are stored (at a high precision)"
    retrieved: 2026-10-11
  recheck_by: 2026-11-09
  note: The FAQ notes the light sensor is only qualitative without per-device calibration. No PPG, ECG or heart rate.
- field: derived_metrics
  status: stated
  value: Derived metrics come only from software run by the researcher. OmGui offers signal vector magnitude, MET cut-point intensity bands, wear time validation and a sleep-segment detector; the docs point to GGIR, biobankAccelerometerAnalysis, pampro and others for richer analysis. The device itself produces no derived metrics.
  confidence: Verified
