# ---------------- Research access ----------------
- field: research_program
  status: stated
  value: 'Three routes, none a dedicated academic-data program. (1) Partnerships: a "Research Institutions" offering
    (devices plus an enterprise dashboard), reached through a "Become a partner" contact. (2) Pulsomics: Ultrahuman''s
    own opt-in in-app research program (raw overnight pulse windows plus participant context), registered with CTRI;
    universities, hospitals and research groups can collaborate on study design, cohort access and co-authored
    publications, but raw recordings stay with the Ultrahuman science team. (3) UltraSignal: an application-based
    developer platform (loaned Ring AIR developer kit) for PPG, temperature and accelerometer streams.'
  confidence: Corroborated
  sources:
  - url: https://www.ultrahuman.com/global/partners/
    type: vendor_page
    quote: Ultrahuman enables researchers to collect high-resolution, longitudinal biomarker data in real-world settings.
    retrieved: '2026-10-21'
  - url: https://www.ultrahuman.com/global/partners/
    type: vendor_page
    quote: A unified enterprise-grade dashboard for teams and clinicians to track sleep, recovery, movement, cycles, and
      long-term health using continuous biomarkers.
    retrieved: '2026-10-21'
  - url: https://www.ultrahuman.com/global/pulsomics/
    type: vendor_page
    quote: Universities, hospitals and research groups can work with us on study design, cohort access and co-authored
      publications.
    retrieved: '2026-10-21'
  - url: https://www.ultrahuman.com/science/explainers/pulsomics/
    type: vendor_page
    quote: Access to the raw recordings is limited to the Ultrahuman science team.
    retrieved: '2026-10-21'
  - url: https://www.ultrahuman.com/global/ultrasignal/
    type: vendor_page
    quote: Using the Ring AIR's Photoplethysmography (PPG), temperature and accelerometer data stream, developers can
      now build bespoke algorithms on top of their data.
    retrieved: '2026-10-21'
  recheck_by: '2026-11-20'
  note: Corroborated rather than Verified because the research offering is described only in marketing copy; what a
    research partnership actually delivers (dashboard features, export, data rights) is not documented publicly.
- field: program_eligibility
  status: stated
  value: 'UltraSignal: anyone may apply; applications are reviewed and priority goes to applicants building an app that
    uses Ring AIR data. Pulsomics collaboration: universities, hospitals and research groups. Pulsomics participants:
    Ring AIR and Ring PRO users aged 18 and over. Partnerships page lists research institutions, healthcare providers,
    sports teams, gyms and companies; no further eligibility criteria published.'
  confidence: Verified
  sources:
