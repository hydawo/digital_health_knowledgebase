- field: deprecations
  status: stated
  value: 'Ring AIR is no longer sold in the US or Puerto Rico, following the USITC limited exclusion order in
    337-TA-1398 (final determination August 2025, Oura patent); the redesigned Ring PRO is the US product. The API
    agreement reserves the right to modify or discontinue the API with at least 30 days'' notice for significant
    changes. The older Notion-hosted API docs used /api/v1/metrics; current docs use /api/v1/partner/daily_metrics,
    with no published deprecation date for the old path.'
  confidence: Verified
