- field: developer_program_status
  status: stated
  value: 'Open. Two routes on the live UltraSignal API docs: a self-serve Personal API token from the developer portal
    (vision.ultrahuman.com, login required), which reads your own data or another user''s after they enter your data
    sharing code in the app; and an OAuth 2.0 Partner API for approved apps, with client credentials issued at partner
    onboarding. A read-only MCP server (OAuth 2.1, per-user) is also documented.'
  confidence: Verified
  sources:
