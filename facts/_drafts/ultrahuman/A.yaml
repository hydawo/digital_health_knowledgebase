- field: derived_metrics
  status: stated
  value: 'Daily metrics API: heart rate, skin temperature, HRV, steps, motion, night and sleep resting HR, sleep (score,
    total, efficiency, time in bed, REM/deep/light, temperature deviation, HR drop, restorative sleep, movements,
    morning alertness, full sleep cycles, tosses and turns, average body temperature), recovery and recovery index,
    movement index, VO2 max, SpO2, active minutes, and, with the CGM, glucose, metabolic score, glucose variability,
    average glucose, estimated HbA1c and time in target. Separate APIs cover Home environment sensors and Blood Vision
    reports.'
  confidence: Verified
  sources:
  - url: https://vision.ultrahuman.com/developer-docs
    type: vendor_docs
    quote: hr Heart rate measurements throughout the day in beats per minute (BPM)
    retrieved: '2026-10-21'
  - url: https://vision.ultrahuman.com/developer-docs
    type: vendor_docs
    quote: glucose Continuous glucose monitoring data in mg/dL
    retrieved: '2026-10-21'
  recheck_by: '2026-11-20'
- field: sampling_rates
  status: stated
  value: Raw PPG recordings are typically 50 Hz. The temporal resolution of daily-metric series (heart rate,
    temperature, HRV and so on) is not documented; the example response is illustrative only.
