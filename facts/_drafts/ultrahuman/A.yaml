# ---------------- Data access and terms ----------------
- field: raw_streams
  status: stated
  value: 'Raw PPG only, via the PPG Recordings API: sessions recorded by the account holder in the app''s Developer
    Mode, downloadable as gzip-compressed NDJSON. The API returns only the token owner''s own recordings, so it does
    not scale to a participant cohort without per-participant accounts. UltraSignal markets PPG, temperature and
    accelerometer streams via a loaned Ring AIR developer kit; no public API documents raw temperature or accelerometer
    access. The daily metrics API returns processed values only.'
  confidence: Verified
  sources:
  - url: https://vision.ultrahuman.com/developer-docs
    type: vendor_docs
    quote: The PPG Recordings API provides access to raw photoplethysmography (PPG) data recorded through Developer Mode
      on Ultrahuman Ring.
    retrieved: '2026-10-21'
    fetch_url: https://vision.ultrahuman.com/_next/static/chunks/5898-7e1e79f1b88fcd98.js
  - url: https://vision.ultrahuman.com/developer-docs
    type: vendor_docs
    quote: This API returns only your own PPG recordings (associated with your partner account email)
    retrieved: '2026-10-21'
    fetch_url: https://vision.ultrahuman.com/_next/static/chunks/5898-7e1e79f1b88fcd98.js
  - url: https://vision.ultrahuman.com/developer-docs
