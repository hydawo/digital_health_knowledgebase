- field: raw_streams
  status: stated
  value: 'Raw PPG only, through the UltraSignal PPG Recordings API: sessions are started and stopped manually in the app''s
    Developer Mode, and the API returns only the token holder''s own recordings (gzip NDJSON files via expiring download links).
    The UltraSignal page also names temperature and accelerometer streams for developer-kit holders, but no public endpoint
    for raw temperature or accelerometer data is documented. No continuous raw stream for other users'' rings is documented.'
  confidence: Verified
  sources:
  - url: https://vision.ultrahuman.com/developer-docs
    type: vendor_docs
    quote: The PPG Recordings API provides access to raw photoplethysmography (PPG) data recorded through Developer Mode on
      Ultrahuman Ring. This API allows partners to retrieve their PPG recording sessions and download the raw signal data
      for research and analysis purposes.
    retrieved: '2026-10-21'
    fetch_url: https://vision.ultrahuman.com/_next/static/chunks/5898-7e1e79f1b88fcd98.js
  - url: https://vision.ultrahuman.com/developer-docs
    type: vendor_docs
    quote: This API returns only your own PPG recordings (associated with your partner account email)
    retrieved: '2026-10-21'
    fetch_url: https://vision.ultrahuman.com/_next/static/chunks/5898-7e1e79f1b88fcd98.js
  - url: https://vision.ultrahuman.com/developer-docs
    type: vendor_docs
    quote: Use the Ultrahuman app's Developer Mode to start and stop PPG recording sessions.
    retrieved: '2026-10-21'
    fetch_url: https://vision.ultrahuman.com/_next/static/chunks/5898-7e1e79f1b88fcd98.js
  - url: https://www.ultrahuman.com/us/ultrasignal/
    type: vendor_page
    quote: Using the Ring AIR's Photoplethysmography (PPG), temperature and accelerometer data stream, developers can now
      build bespoke algorithms on top of their data.
    retrieved: '2026-10-21'
  recheck_by: '2026-11-20'
  note: 'Practical consequence: raw PPG at scale across a cohort is not available through the public API; each participant
    would need their own token and manual sessions.'
- field: derived_metrics
  status: stated
  value: 'Daily metrics API: heart rate, skin temperature, HRV, steps, motion, night and sleep resting HR, sleep (stages,
    efficiency, score, time in bed, REM/deep/light, temperature deviation, HR drop, restorative sleep, movements, full cycles,
    tosses and turns, morning alertness), recovery score and index, movement index, VO2 max, SpO2, active minutes, average
    body temperature; with CGM: glucose, metabolic score, glucose variability, average glucose, estimated HbA1c, time in target.
    Separate endpoints for Home environment metrics and Blood Vision reports. Workouts are not exposed.'
  confidence: Verified
  sources:
  - url: https://vision.ultrahuman.com/developer-docs
    type: vendor_docs
    quote: hr Heart rate measurements throughout the day in beats per minute (BPM)
    retrieved: '2026-10-21'
  - url: https://vision.ultrahuman.com/developer-docs
    type: vendor_docs
