facts:
- field: research_program
  status: stated
  value: 'No named academic programme with published terms. Three routes: (1) research partnerships ("Ultrahuman for Research
    Institutions" on the partners page; Pulsomics invites universities, hospitals and research groups to collaborate on study
    design, cohort access and co-authored publications); (2) UltraSignal, a developer platform giving access to Ring PPG,
    temperature and accelerometer streams, with loaned developer kits; (3) Pulsomics, Ultrahuman''s own opt-in in-app research
    programme that collects raw overnight pulse windows from users to train a pulse foundation model.'
  confidence: Verified
  sources:
  - url: https://www.ultrahuman.com/us/pulsomics/
    type: vendor_page
    quote: Universities, hospitals and research groups can work with us on study design, cohort access and co-authored publications.
    retrieved: '2026-10-21'
  - url: https://www.ultrahuman.com/us/partners/
    type: vendor_page
    quote: Ultrahuman enables researchers to collect high-resolution, longitudinal biomarker data in real-world settings.
    retrieved: '2026-10-21'
  - url: https://www.ultrahuman.com/us/ultrasignal/
    type: vendor_page
    quote: Using the Ring AIR's Photoplethysmography (PPG), temperature and accelerometer data stream, developers can now
      build bespoke algorithms on top of their data.
    retrieved: '2026-10-21'
  recheck_by: '2026-11-20'
  note: Pulsomics is Ultrahuman's internal study, not a data service to outside researchers; external groups join it only
    as collaborators.
- field: program_eligibility
  status: stated
  value: 'Pulsomics participants: anyone 18 or over actively using a Ring AIR or Ring PRO. Research collaborators: universities,
    hospitals and research groups (no further criteria published). UltraSignal developer kits: open application, priority
    to applicants building an app on Ring AIR data.'
