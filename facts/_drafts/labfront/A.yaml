  recheck_by: '2026-11-09'
- field: derived_metrics
  status: stated
  value: 'Garmin Connect post-processed metrics (daily and activity summaries, sleep, stress, respiration, SpO2, heart
    rate, steps); sleep requires Garmin Connect. Paid Labfront Analytics reports add HRV time and frequency domain,
    non-linear HRV (DFA, MSE), actigraphy sleep, and sleep regularity and timing indices.'
  confidence: Verified
  sources:
  - url: https://help.labfront.com/choosing-your-garmin-data
    type: vendor_docs
    quote: The Garmin Connect app captures the standard default data that can be collected by individual consumers
      using Garmin wearables (e.g. sleep, stress, HR at every minute, steps at every minute, etc.).
    retrieved: '2026-10-11'
  - url: https://help.labfront.com/choosing-your-garmin-data
    type: vendor_docs
    quote: Without Garmin Connect, you will not be able to able to collect Garmin sleep data, as that is a
      post-processed metric derived by the Garmin Health team.
    retrieved: '2026-10-11'
  - url: https://www.labfront.com/pricing
    type: vendor_page
    quote: Measures time-domain (HR, pRR50, SDRR, RMSSD) and frequency-domain (TP, VLF, LF, HF, LF/HF ratio) markers
      of autonomic nervous system activity
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: sampling_rates
  status: stated
  value: 'Advanced: heart rate 1 s to 60 min; respiration, SpO2 and stress 10 s to 60 min; steps 1 or 15 min; BBI
    every beat; actigraphy 10 s to 1 min; accelerometer 25, 50 or 100 Hz; Movesense IMU 12.5 to 208 Hz, ECG 125,
    250 or 500 Hz, recordings up to 12 h. Basic: heart rate 1 min; respiration, SpO2 and stress 3 min; steps 15 min;
    no BBI, actigraphy or accelerometer. Tester: some rates capped (accelerometer 25 Hz, Movesense 15 min recordings).'
  confidence: Verified
