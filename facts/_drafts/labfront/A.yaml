facts:
# ---------------- Research access ----------------
- field: research_program
  status: stated
  value: Two programs. (1) Labfront Grants, run year-round with partners such as Garmin Health, which award
    subsidized or free platform access (typically one year of the Advanced plan), analytics packages and devices.
    (2) The Research Collaborator Program, free for academic institutions, offering collaborator-only grants,
    discounts, digital biomarker guidance, tailored webinars and a device loaner program.
  confidence: Verified
  sources:
  - url: https://www.labfront.com/pricing
    type: vendor_page
    quote: Our Grants Program provides subsidized access to the Labfront platform, analytics packages, and devices
      for researchers with limited budgets.
    retrieved: '2026-10-11'
  - url: https://www.labfront.com/collaborator
    type: vendor_page
    quote: Access unique grant opportunities reserved only for collaborators
    retrieved: '2026-10-11'
  - url: https://www.labfront.com/collaborator
    type: vendor_page
    quote: Test wearable devices firsthand before making a commitment
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: program_eligibility
  status: stated
  value: 'Collaborator Program: any academic institution. Grants vary by call: the 2026 Labfront x Garmin Health grant
    is open to researchers worldwide (EMEA, APAC, Americas) but not to previous recipients of that grant; the 2026
    Aging Science grant requires affiliation with an accredited academic, research or professional institution;
    Garmin-sponsored grants are for academic or healthcare institutions, not private companies.'
  confidence: Verified
