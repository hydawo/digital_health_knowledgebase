# ---------------- Pricing ----------------
- field: device_price
  status: stated
  value: Labfront sells no hardware and no plan includes devices. Devices are bought from Garmin, Movesense or
    Dexcom; Labfront customers get a Garmin discount the FAQ gives as typically around 20% (elsewhere 20 to 25%),
    plus a Movesense discount, by quote.
  confidence: Verified
  sources:
  - url: https://www.labfront.com/pricing
    type: vendor_page
    quote: No, hardware is not included in any plan.
    retrieved: '2026-10-11'
  - url: https://help.labfront.com/pricing-plans-and-payment-1
    type: vendor_docs
    quote: The discount varies by device model and quantity, but is typically around 20%
    retrieved: '2026-10-11'
  - url: https://help.labfront.com/pricing-plans-and-payment-1
