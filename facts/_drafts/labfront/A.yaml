# ---------------- Data access and terms ----------------
- field: raw_streams
  status: stated
  scope: Advanced plan
  value: 'Garmin device-direct data through the Labfront Companion app: beat-to-beat intervals, actigraphy and 3-axis
    accelerometer (25 to 100 Hz). Movesense (manually started recordings): ECG waveform, 9-axis IMU, RR interval.
    Dexcom CGM glucose via the Dexcom cloud, after Dexcom approves each project (about 2 months, with a data use
    agreement). No Polar integration is listed.'
  confidence: Verified
  sources:
  - url: https://help.labfront.com/download-your-data
    type: vendor_docs
    quote: Yes, the device-direct raw data can be downloaded if you have an Advanced Plan.
    retrieved: '2026-10-11'
  - url: https://www.labfront.com/pricing
    type: vendor_page
    quote: IMU (9-axis) 12.5Hz - 208Hz ECG Waveform 125Hz, 250Hz, 500Hz RR Interval Each beat
    retrieved: '2026-10-11'
  - url: https://help.labfront.com/dexcom-overview
    type: vendor_docs
    quote: Obtaining Dexcom's permission for Labfront integration takes about 2 months and involves two steps
    retrieved: '2026-10-11'
  - url: https://www.labfront.com/compatible-devices
    type: vendor_page
    quote: Labfront is currently compatible with select Garmin, Movesense and Dexcom devices
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: raw_streams
  status: stated
  scope: Basic plan
  value: No raw sensor streams. Only standard Garmin Connect data, from one device integration (Garmin Connect or
    Dexcom).
  confidence: Verified
