- field: retention_terms
  status: stated
  value: Research data is kept for 3 years after study completion (the security statement says at least 3 years,
    longer on request where local law requires), with NIH DMS Policy compliance stated. Researchers can request full
    deletion at any time; participant withdrawal triggers deletion on the researcher's request. The Terms say
    closing all services deletes the account's data.
  confidence: Verified
  sources:
  - url: https://help.labfront.com/privacy-and-security-faqs
    type: vendor_docs
    quote: We typically retain research data for 3 years after study completion
    retrieved: '2026-10-11'
  - url: https://help.labfront.com/privacy-and-security-faqs
    type: vendor_docs
    quote: Researchers can also request full data deletion at any time.
    retrieved: '2026-10-11'
  - url: https://help.labfront.com/security-statement
    type: vendor_docs
    quote: Labfront stores all data for at least 3 years after your study finishes and allows you to easily export
      it at any time.
    retrieved: '2026-10-11'
  - url: https://help.labfront.com/terms-of-service
    type: vendor_legal
    quote: Termination of all Services also includes deletion of your password and all related information, files
      and data associated with or inside your Account
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
  note: The Terms (effective 2022-08-05) and the 3-year retention FAQ are not reconciled; ask Labfront which applies
    when an account closes.
