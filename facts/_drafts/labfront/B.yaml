# ---------------- Data access ----------------
- field: raw_streams
  status: stated
  value: 'Advanced plan: Garmin device-direct data through the Labfront app (raw 3-axis accelerometer, enhanced
    beat-to-beat interval, actigraphy), Movesense ECG waveform, RR interval and 9-axis IMU, and Dexcom CGM. Basic plan:
    standard Garmin Connect data only. Movesense recordings must be started by the participant in a task; they cannot run
    continuously in the background. Current supported brands are Garmin, Movesense and Dexcom.'
  confidence: Verified
  sources:
  - url: https://help.labfront.com/download-your-data
    type: vendor_docs
    quote: Yes, the device-direct raw data can be downloaded if you have an Advanced Plan.
    retrieved: '2026-10-11'
  - url: https://help.labfront.com/download-your-data
    type: vendor_docs
    quote: On Basic plans, only the standard Garmin Connect data will be available to download.
    retrieved: '2026-10-11'
  - url: https://help.labfront.com/movesense-overview
    type: vendor_docs
    quote: The data cannot be captured continuously in the background.
    retrieved: '2026-10-11'
  - url: https://www.labfront.com/compatible-devices
    type: vendor_page
    quote: Labfront is currently compatible with select Garmin, Movesense and Dexcom devices, but we plan to add more devices
      in the near future.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: raw_streams
  status: conflict
  scope: Polar devices
  value: A 2022 founder interview says Labfront works with Garmin and Polar; Labfront's current device pages list only
    Garmin, Movesense and Dexcom. No current Labfront page mentions Polar.
  confidence: Unclear
  sources:
  - url: https://insider.fitt.co/?p=4903
    type: secondary
    quote: we focused on building an analytics engine that works with consumer wearables like Garmin and Polar
    retrieved: '2026-10-11'
  - url: https://www.labfront.com/compatible-devices
    type: vendor_page
    quote: Labfront is currently compatible with select Garmin, Movesense and Dexcom devices, but we plan to add more devices
      in the near future.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
  note: Likely a dropped or never-shipped integration; worth asking Labfront before planning a Polar study.
- field: derived_metrics
  status: stated
  value: Garmin Connect summaries (daily summary, activity, sleep, stress, respiration, SpO2), Labfront's own actigraphy
    sleep algorithms run on Garmin accelerometer data, and paid analytics reports (HRV time and frequency domain, HRV
    non-linear, actigraphy sleep, sleep regularity and timing).
  confidence: Verified
  sources:
  - url: https://www.labfront.com/collect/physiological-data
    type: vendor_page
    quote: Researchers are able to observe high-level data for each day such as average heart rate, maximum/minimum stress
      levels, total steps taken, calories burned, etc.
    retrieved: '2026-10-11'
  - url: https://www.labfront.com/collect/physiological-data
    type: vendor_page
    quote: We've adapted medical-grade actigraphy algorithms to process raw accelerometer data from Garmin wearables, achieving
      over 95% accuracy.
    retrieved: '2026-10-11'
  - url: https://www.labfront.com/pricing
    type: vendor_page
    quote: Measures time-domain (HR, pRR50, SDRR, RMSSD) and frequency-domain (TP, VLF, LF, HF, LF/HF ratio) markers of
      autonomic nervous system activity, computed from beat-to-beat interval data.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
  note: The 95% actigraphy accuracy figure is a vendor claim with no linked validation on the page.
- field: sampling_rates
  status: stated
  value: 'Advanced: Garmin heart rate 1 s to 60 min, accelerometer streaming 25, 50 or 100 Hz, beat-to-beat each beat,
    actigraphy 10 s to 1 min; Movesense IMU 12.5 to 208 Hz, ECG 125, 250 or 500 Hz, RR each beat, recordings up to
    12 h. Basic: Garmin Connect heart rate 1 min, respiration, SpO2 and stress 3 min, no beat-to-beat or accelerometer,
    no Movesense. Tester: Movesense recordings capped at 15 min. Dexcom CGM every 5 min.'
  confidence: Verified
  sources:
  - url: https://www.labfront.com/pricing
    type: vendor_page
    quote: Adjust sampling rates from 100 Hz accelerometry down to beat-to-beat intervals for HRV.
    retrieved: '2026-10-11'
  - url: https://www.labfront.com/pricing
    type: vendor_page
    quote: ECG Waveform 125Hz 125Hz, 250Hz, 500Hz
    retrieved: '2026-10-11'
  - url: https://www.labfront.com/pricing
    type: vendor_page
    quote: Maximum Data Recording Duration 15 min Movesense Not Available 12 hrs
    retrieved: '2026-10-11'
  - url: https://www.labfront.com/collect/physiological-data
    type: vendor_page
    quote: Sampling Rate 5 min
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
  note: The physiological-data page gives Movesense RR as 128 Hz to 512 Hz, while the pricing table gives ECG as 125,
