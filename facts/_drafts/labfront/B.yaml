facts:
# ---------------- Research access ----------------
- field: research_program
  status: stated
  value: 'Two programs. A Grants Program that subsidises Labfront platform access, analytics packages and Garmin devices
    (2026 calls include the Labfront x Garmin Health Research Grant, a Sleep Science grant and an Aging Science grant,
    each worth about $5,000 to $5,500), plus institution-specific grants. And a free Research Collaborator Program for
    academic institutions offering dedicated grants, product discounts, analytics guidance and a device loaner program.'
  confidence: Verified
  sources:
  - url: https://www.labfront.com/pricing
    type: vendor_page
    quote: Our Grants Program provides subsidized access to the Labfront platform, analytics packages, and devices for
      researchers with limited budgets.
    retrieved: '2026-10-11'
  - url: https://www.labfront.com/grant
    type: vendor_page
    quote: '1-year access to a Labfront Advanced account (incl. 20 participants) 1 x Labfront analytics package (standard)
      Onboarding support Total value: $5500'
    retrieved: '2026-10-11'
  - url: https://www.labfront.com/collaborator
    type: vendor_page
    quote: Access unique grant opportunities reserved only for collaborators
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: program_eligibility
  status: stated
  scope: Research Collaborator Program
  value: Any academic institution may register.
  confidence: Verified
  sources:
  - url: https://www.labfront.com/collaborator
    type: vendor_page
    quote: Any academic institution is welcome to register and become part of the Labfront Collaborator Program.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: program_eligibility
  status: stated
  scope: Grants (2026 calls)
  value: Set per call. The Labfront x Garmin Health grant is open globally (EMEA, APAC, Americas) and excludes previous
    recipients of that grant; the Aging Science grant requires affiliation with an accredited academic, research or
    professional institution and a plan to collect data with Labfront.
  confidence: Verified
  sources:
  - url: https://www.labfront.com/grant
    type: vendor_page
    quote: Open to a global audience of researchers (EMEA, APAC, and Americas), subject to applicable mandatory regulation
      and legislation.
    retrieved: '2026-10-11'
  - url: https://www.labfront.com/grant
    type: vendor_page
    quote: Open to researchers at any career stage affiliated with an accredited academic, research, or professional institution.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: program_application
  status: stated
  value: 'Collaborator Program: fill out a form; selected institutions get a dedicated Labfront liaison. Grants: a
    short study summary or abstract (about 200 words), a personal statement (200 words max) and a CV, by each call''s
    deadline; Garmin and Labfront may reject applications, for example for compliance reasons.'
  confidence: Verified
  sources:
  - url: https://www.labfront.com/collaborator
    type: vendor_page
    quote: Applying is as simple as filling out a form. If selected, a dedicated Labfront liaison will be provided to your
      institution to guide you through the program.
    retrieved: '2026-10-11'
  - url: https://www.labfront.com/grant
    type: vendor_page
    quote: Summary of research study (Apx. 200 words) Personal statement (Max. 200 words) Curriculum Vitae Application deadline
      November 2, 2026
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: program_status
  status: stated
  value: Active. Three 2026 grant calls are open with deadlines of 2 November, 27 November and 7 December 2026, and
    grants are described as rolling and year-round. The Collaborator Program is taking applications.
  confidence: Verified
  sources:
  - url: https://www.labfront.com/grant
    type: vendor_page
    quote: Application deadline December 7, 2026
    retrieved: '2026-10-11'
  - url: https://www.labfront.com/pricing
    type: vendor_page
    quote: we award grants on a rolling basis
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: developer_program_status
  status: stated
  value: Developer Access is a paid beta add-on (from $4,000, Advanced plan only). The project owner emails support and
    Labfront grants access within 5 working days. Access is to an S3 bucket; there is no external API or SDK.
  confidence: Verified
  sources:
  - url: https://help.labfront.com/developer-access
    type: vendor_docs
    quote: Labfront does not currently provide an external SDK or API for data access.
    retrieved: '2026-10-11'
  - url: https://help.labfront.com/developer-access
    type: vendor_docs
    quote: Labfront will review your access request and, within 5 working days, grant the appropriate access rights.
    retrieved: '2026-10-11'
  - url: https://www.labfront.com/pricing
    type: vendor_page
    quote: Add-ons Available on Advanced Plan Only
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: user_cap
  status: stated
  value: Tester (free) 5 participants; Basic and Advanced 20 participants included, with more at $10 (Basic) or $25
    (Advanced) per participant per year. Every participant account counts, even when participants share a device.
  confidence: Verified
  sources:
  - url: https://www.labfront.com/pricing
    type: vendor_page
    quote: Participants Included 5 20 20 Additional Participants N/A $10/participant $25/participant
    retrieved: '2026-10-11'
  - url: https://www.labfront.com/pricing
    type: vendor_page
    quote: Every new participant created in Labfront counts as one participant, regardless of whether participants share
      the same device.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: academic_vs_commercial
  status: stated
  value: One published price list with no separate academic or commercial plan. Academic-only extras are the Garmin
    and Movesense device discounts, the Collaborator Program (academic institutions) and the grants. Commercial terms
    are not described separately.
  confidence: Corroborated
  sources:
  - url: https://www.labfront.com/compatible-devices
    type: vendor_page
    quote: We’ve partnered with Garmin and Movesense to offer exclusive discounts to academic researchers.
    retrieved: '2026-10-11'
  - url: https://www.labfront.com/collaborator
    type: vendor_page
    quote: Any academic institution is welcome to register and become part of the Labfront Collaborator Program.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
  note: The absence of a commercial tier is read from the pricing page, which lists one set of plans for everyone.
# ---------------- Pricing ----------------
- field: device_price
  status: stated
  value: Labfront does not sell or include hardware. Customers get a Garmin discount, typically about 20% (20 to 25%
    on the help centre), and a Movesense discount, by quote.
  confidence: Verified
  sources:
  - url: https://www.labfront.com/pricing
    type: vendor_page
    quote: No, hardware is not included in any plan.
    retrieved: '2026-10-11'
  - url: https://help.labfront.com/pricing-plans-and-payment-1
    type: vendor_docs
    quote: The discount varies by device model and quantity, but is typically around 20%
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: subscription_price
  status: not_applicable
  note: No consumer subscription. Participants use the free Labfront Companion app; researcher plan prices are under
    api_platform_fees.
- field: academic_pricing
  status: stated
  value: No discounted academic plan price. Academic support comes as grants (subsidised platform, analytics and
    devices), Collaborator Program discounts on Labfront products, and academic device discounts.
  confidence: Verified
  sources:
