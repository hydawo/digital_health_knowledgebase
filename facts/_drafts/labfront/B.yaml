- field: history_depth
  status: stated
  value: Tester downloads are limited to the last 30 days; paid plans have unlimited history for data collected in the
    project. A separately quoted service extracts participants' existing Garmin Connect data up to two years back.
  confidence: Verified
  sources:
  - url: https://www.labfront.com/pricing
    type: vendor_page
    quote: Access Data History Last 30 days Unlimited Unlimited
    retrieved: '2026-10-11'
  - url: https://www.labfront.com/blog/retroactively-collect-garmin-data
    type: vendor_page
    quote: We can collect data that's up to two years old.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
  note: The 2022 retroactive-extraction post says it needs the participant's Garmin Connect login details, which an IRB
    may object to.
- field: export_routes
  status: stated
  value: Dashboard download as a ZIP of CSV files, filterable by participant and date. Developer Access (paid add-on)
    gives an S3 bucket refreshed every 6 hours. No API or SDK. Participants can download a copy of their own data.
  confidence: Verified
  sources:
  - url: https://help.labfront.com/download-your-data
    type: vendor_docs
    quote: as we can only provide ZIP files for data downloads
    retrieved: '2026-10-11'
  - url: https://help.labfront.com/developer-access
    type: vendor_docs
    quote: Developers are provided access to an S3 Bucket, which is updated every 6 hours with the latest available data.
    retrieved: '2026-10-11'
  - url: https://help.labfront.com/labfront-documentation-for-irb
    type: vendor_docs
    quote: Labfront also offers study participants the opportunity to download a copy of their collected data.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: rate_limits
  status: not_applicable
  note: Labfront has no external API (help.labfront.com/developer-access, checked 2026-10-11), so there are no API
    rate limits. The S3 bucket refresh interval (every 6 hours) is under export_routes.
- field: retention_terms
  status: stated
  value: Research data is typically kept for 3 years after study completion (the Security Statement says at least 3
    years, longer on request for local law). Researchers can ask for full deletion at any time, and terminating all
    services deletes the account's data.
  confidence: Verified
  sources:
  - url: https://www.labfront.com/trust-security
    type: vendor_page
    quote: We typically save research data for 3 years after study completion, following the write-up of the results.
    retrieved: '2026-10-11'
  - url: https://help.labfront.com/security-statement
    type: vendor_legal
    quote: Labfront stores all data for at least 3 years after your study finishes and allows you to easily export it at
      any time.
    retrieved: '2026-10-11'
  - url: https://help.labfront.com/privacy-and-security-faqs
    type: vendor_docs
    quote: Researchers can also request full data deletion at any time.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: ai_training_terms
  status: conflict
  value: The Privacy Policy (updated 30 December 2025) defines personal information to include participants' Experiment
    Data, wearable data among it, and says Labfront uses data to train its machine learning models. The Trust page and
