facts:
- field: research_program
  status: stated
  value: No separate research or academic program; Fitabase itself is a research-only data platform for studies and
    trials using Fitbit (now Google Health) and Garmin wearables. A one-off Fitabase and Fitbit Health Equity Research
    Initiative (2021) awarded devices and services to early career researchers.
  confidence: Corroborated
  sources:
  - url: https://www.fitabase.com/resources/faq/
    type: vendor_page
    quote: "Fitabase is a comprehensive data management platform intended to support projects, studies, and clinical trials that deploy multiple wearable devices."
    retrieved: '2026-10-11'
  - url: https://www.fitabase.com/blog/post/health-equity-fund-announcement/
    type: vendor_page
    quote: "We are awarding up to $500,000 worth of devices and services."
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
  note: Corroborated rather than Verified because "no separate program" is an absence across the site, not a statement.
- field: program_eligibility
  status: stated
  value: Research projects, studies and clinical trials; individuals cannot use Fitabase to access their own personal
    data. No other eligibility criteria are published.
  confidence: Verified
  sources:
  - url: https://www.fitabase.com/resources/faq/
    type: vendor_page
    quote: "At this time we do not support downloading or access to personal data."
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: program_application
  status: stated
  value: Sales-led. Teams request a demo or quote; Fitabase then issues an invitation code and account creation link,
    and the account holder must accept the Terms of Use and Privacy Policy. A two-week trial has been offered.
  confidence: Verified
  sources:
  - url: https://www.fitabase.com/resources/knowledge-base/getting-started/setting-up-your-fitabase-project/
    type: vendor_docs
    quote: "Once you've received your invitation code and account creation link from Fitabase you'll be able to create your Fitabase project."
