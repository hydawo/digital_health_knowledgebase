- field: retention_terms
  status: stated
  value: Account cancellation deletes personal information, with backups expiring on the normal schedule, but Fitabase
    may keep using de-identified historical data afterwards. Fitabase's sample IRB text says projects are removed and
    data deleted from servers and backups 90 days after data collection ends. Fitabase may delete data on termination
    and may close accounts inactive more than 30 days.
  confidence: Verified
  sources:
  - url: https://www.fitabase.com/privacy/
    type: vendor_legal
    quote: "Following cancellation or termination of your account, Fitabase may continue to utilize de-identified and anonymized historical data associated with your use of the Fitabase Products."
    retrieved: '2026-10-11'
  - url: https://www.fitabase.com/resources/knowledge-base/working-with-the-irb/example-irb-text/
    type: vendor_docs
    quote: "90 days after the completion of data collection Fitabase will remove the project from their data management system, disassociate the data from the project, and begin remove access to the data by deleting it from its servers and backup systems."
    retrieved: '2026-10-11'
  - url: https://www.fitabase.com/terms/
    type: vendor_legal
    quote: "we may, without notice to the applicable user, terminate individual accounts that have been inactive for more than 30 days, but we have no obligation to do so."
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
  note: The 90-day rule appears only in example IRB language, not in the Terms or Privacy Policy, so confirm it in the
    contract.
