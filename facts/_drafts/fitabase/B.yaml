- field: raw_streams
  status: stated
  value: Fitabase passes through the highest resolution the partner APIs give, not sensor raw. Fitbit/Google Health
    second-level heart rate (every 3-15 s), ECG logs; Garmin Enhanced Beat-to-Beat Interval (premium, during sleep,
    Gen 4+ sensors) with per-beat confidence, 15 s heart rate. No GPS or location is collected.
  confidence: Verified
  sources:
  - url: https://www.fitabase.com/resources/faq/
    type: vendor_page
    quote: "The Fitabase platform offers access to the highest resolution of data available from our partner APIs."
    retrieved: '2026-10-11'
  - url: https://www.fitabase.com/resources/knowledge-base/learn-about-fitbit-data/data-resolutions/
    type: vendor_docs
    quote: "Heart Rate - variable sampling with readings every 3-15 seconds."
    retrieved: '2026-10-11'
