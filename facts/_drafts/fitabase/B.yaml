- field: history_depth
  status: stated
  value: Collection is bounded by per-participant sync windows. Garmin history before connection is available only if
    the participant opts in (off by default). Fitbit/Google Health devices hold minute and second data on-device for
    only 5-7 days before syncing, after which only daily aggregates remain.
  confidence: Verified
  sources:
  - url: https://www.fitabase.com/resources/knowledge-base/learn-about-garmin-data/capturing-historical-garmin-data/
    type: vendor_docs
    quote: "Fitabase can pull historical data from a participant if you set sync dates to a window in the past. However, this option is turned off by default on Garmin Connect, and participants must explicitly opt into allowing Fitabase to pull this historical data."
    retrieved: '2026-10-11'
  - url: https://www.fitabase.com/resources/knowledge-base/learn-about-fitbit-data/data-availability-integrity/
    type: vendor_docs
    quote: "Due to limited onboard memory, Google Health devices only store high resolution (minute or second) data for 5-7 days, depending on the device model."
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
  note: No public statement on pulling Fitbit/Google Health history from before a participant connects.
