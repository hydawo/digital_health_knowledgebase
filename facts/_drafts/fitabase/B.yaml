- field: deprecations
  status: stated
  value: Google turns off the Fitbit Web API on October 30, 2026 (support ended September 30, 2026). Every active
    Fitabase participant must reauthorize for the Google Health API; reauthorization opens mid-to-late October, and the
    reconnect banner and links stay live through November 30, 2026. Past data is kept; new data pauses until
    reauthorization and is backfilled if the device kept syncing. Exports gain UTC, time zone and source columns, a
    separate classic sleep dataset ends, writing step goals is not yet supported, and the Fitabase API is unchanged.
  confidence: Verified
  sources:
  - url: https://www.fitabase.com/resources/knowledge-base/google-health-api-migration/key-dates/
    type: vendor_docs
    quote: "Through November 30, 2026 The reconnect banner stays in the Google Health app, giving participants who missed the deadline a way back."
    retrieved: '2026-10-11'
  - url: https://www.fitabase.com/resources/knowledge-base/google-health-api-migration/migration-overview/
    type: vendor_docs
    quote: "Google is retiring the Fitbit Web API at the end of October 2026 and requiring every third-party app, Fitabase included, to move to the new Google Health API."
    retrieved: '2026-10-11'
  - url: https://www.fitabase.com/resources/knowledge-base/google-health-api-migration/migration-faq/
    type: vendor_docs
    quote: "Writing step goals to the participant's app isn't available in the Google Health API yet."
    retrieved: '2026-10-11'
  - url: https://www.fitabase.com/resources/knowledge-base/google-health-api-migration/if-participants-dont-reauthorize/
    type: vendor_docs
    quote: "When a participant reauthorizes, even weeks after the cutoff, Fitabase automatically goes back and fills in the data from the time they were disconnected."
    retrieved: '2026-10-11'
  - url: https://developers.google.com/health/reference/rest/v4beta/users
    type: secondary
    quote: "On October 30, 2026 , the Fitbit Web API will be turned off and will no longer function or sync data to or from Fitbit users."
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
  note: Fitabase's own March 25, 2026 blog post still says the transition was planned for September 2026. Google's
    page also says it is not onboarding new Google Health API projects at this time, which matters to teams weighing a
    direct integration against an intermediary.
