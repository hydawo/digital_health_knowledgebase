facts:
# ---------------- Research access ----------------
- field: research_program
  status: stated
  value: Fitabase itself is the research offering, a hosted data management platform for studies using Fitbit (now
    Google Health) and Garmin wearables, with dashboards, compliance monitoring and exports. There is no separate
    research or academic program on top of it.
  confidence: Corroborated
  sources:
  - url: https://www.fitabase.com/resources/faq/
    type: vendor_page
    quote: "Fitabase is a comprehensive data management platform designed to support innovative research projects using wearable and internet-connected devices."
    retrieved: '2026-10-11'
  - url: https://www.fitabase.com/
    type: vendor_page
    quote: "Fitabase has been used in over 1,100 research studies around the world."
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: program_eligibility
  status: stated
  value: Aimed at projects, studies and clinical trials that deploy multiple wearables; individuals cannot use it to
    access their own data. No further eligibility criteria are published.
  confidence: Corroborated
  sources:
  - url: https://www.fitabase.com/resources/faq/
    type: vendor_page
    quote: "Fitabase is a comprehensive data management platform intended to support projects, studies, and clinical trials that deploy multiple wearable devices. At this time we do not support downloading or access to personal data."
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: program_application
  status: stated
  value: No application or review step published. Prospective customers request a demo or a quote; Fitabase then
    issues an invitation code and account creation link. Studies that cannot use participants' personal Google
    accounts can request Google demo accounts through a separate Google research application that needs an IRB
    approval or waiver, and Fitabase supplies the client ID.
  confidence: Corroborated
  sources:
  - url: https://www.fitabase.com/how-it-works/pricing/
    type: vendor_page
    quote: "Contact our team for a customized quote based on your specific research needs."
    retrieved: '2026-10-11'
  - url: https://www.fitabase.com/resources/knowledge-base/getting-started/setting-up-your-fitabase-project/
    type: vendor_docs
    quote: "Once you've received your invitation code and account creation link from Fitabase you'll be able to create your Fitabase project."
    retrieved: '2026-10-11'
  - url: https://www.fitabase.com/resources/knowledge-base/getting-started/google-demo-accounts/
    type: vendor_docs
    quote: "To use these accounts, you'll need to complete a research application with Google."
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: program_status
  status: stated
  value: Active. Fitbit data collection is moving from the Fitbit Web API to the Google Health API; participant
    reauthorization was due to open mid-to-late October 2026 (exact date not yet set on 2026-10-11).
  confidence: Corroborated
  sources:
  - url: https://www.fitabase.com/resources/knowledge-base/google-health-api-migration/key-dates/
    type: vendor_docs
    quote: "Mid-to-late October 2026 (exact date TBD) Reauthorization opens."
    retrieved: '2026-10-11'
  - url: https://www.fitabase.com/resources/knowledge-base/google-health-api-migration/migration-overview/
    type: vendor_docs
    quote: "All apps built on the Fitbit Web API, Fitabase included, are moving to the Google Health API."
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: developer_program_status
  status: stated
  value: The Fitabase API is available to Fitabase customers as a paid add-on (not a public developer program).
    Upstream, Google says it is not onboarding new projects to the Google Health API, so a study wanting Fitbit data
    after 2026-10-30 without its own Google access currently depends on an approved intermediary such as Fitabase.
  confidence: Corroborated
  sources:
  - url: https://www.fitabase.com/resources/knowledge-base/fitabase-api/what-is-the-fitabase-api/
    type: vendor_docs
    quote: "The Fitabase API and automated batch exports are currently offered as separate add ons to the Fitabase platform. Please inquire about pricing."
    retrieved: '2026-10-11'
  - url: https://developers.google.com/health/reference/rest/v4beta/users
    type: secondary
    quote: "While we are not onboarding new projects at this time, we are actively working to open access to more developers"
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
