- field: retention_terms
  status: stated
  value: On account cancellation, personally identifiable information is deleted and backups expire on the normal
    schedule, but Fitabase may keep using de-identified, anonymized historical data. On termination Fitabase may
    delete account data. Data already synced is kept through the Google Health API switch.
  confidence: Verified
  sources:
  - url: https://www.fitabase.com/privacy/
    type: vendor_legal
    quote: "When you request cancellation of your account, your personally identifiable information will be deleted"
    retrieved: '2026-10-11'
  - url: https://www.fitabase.com/privacy/
    type: vendor_legal
    quote: "Following cancellation or termination of your account, Fitabase may continue to utilize de-identified and anonymized historical data associated with your use of the Fitabase Products."
    retrieved: '2026-10-11'
  - url: https://www.fitabase.com/terms/
    type: vendor_legal
    quote: "upon any termination of your account or access to the Fitabase Services we may delete all User Generated Content and other information related to your account and data."
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
  note: No fixed retention period for study data is published. Terms of Use last updated Dec 3, 2013; privacy
    policy updated October 1, 2026.
