# ---------------- Data access and terms ----------------
- field: raw_streams
  status: stated
  scope: Fitbit / Google Health
  value: No raw sensor signals (no raw accelerometer or PPG). The highest-resolution data the partner API provides,
    including second-level heart rate (every 3 to 15 seconds), 30-second sleep stages and ECG logs. No GPS or
    location data is collected.
  confidence: Corroborated
  sources:
  - url: https://www.fitabase.com/resources/faq/
    type: vendor_page
    quote: "The Fitabase platform offers access to the highest resolution of data available from our partner APIs."
    retrieved: '2026-10-11'
  - url: https://www.fitabase.com/resources/knowledge-base/learn-about-fitbit-data/data-resolutions/
    type: vendor_docs
    quote: "Heart Rate - variable sampling with readings every 3-15 seconds."
    retrieved: '2026-10-11'
  - url: https://www.fitabase.com/resources/knowledge-base/working-with-the-irb/data-security-privacy/
    type: vendor_docs
    quote: "No GPS or other location information is collected."
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: raw_streams
  status: stated
  scope: Garmin
  value: Enhanced beat-to-beat intervals (EBBI) captured at the wrist during sleep, with a per-beat confidence flag,
    from devices with a gen 4 or later sensor, delivered through the Garmin API; 15-second heart rate.
  confidence: Corroborated
  sources:
  - url: https://www.fitabase.com/resources/knowledge-base/learn-about-garmin-data/collecting-enhanced-beat-to-beat-interval-data-using-garmin-devices/
    type: vendor_docs
    quote: "This dataset includes the time beat signature, as well as a confidence variable that indicates whether a beat might be of higher error."
    retrieved: '2026-10-11'
  - url: https://www.fitabase.com/resources/knowledge-base/learn-about-garmin-data/collecting-enhanced-beat-to-beat-interval-data-using-garmin-devices/
    type: vendor_docs
    quote: "It is captured during sleep directly from the wrist."
    retrieved: '2026-10-11'
  - url: https://www.fitabase.com/resources/knowledge-base/learn-about-garmin-data/collecting-enhanced-beat-to-beat-interval-data-using-garmin-devices/
    type: vendor_docs
    quote: "Garmin EBBI data can be collected using any Garmin device with a gen 4 sensor or higher."
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: derived_metrics
  status: stated
  scope: Fitbit / Google Health
  value: Steps, intensity and METs, calories, sleep and sleep stages, breathing rate, HRV, SpO2, Active Zone Minutes,
    cardio fitness score, floors, distance, resting heart rate, skin and core temperature, wear time, plus weight,
    food and activity logs.
  confidence: Corroborated
  sources:
  - url: https://www.fitabase.com/resources/knowledge-base/learn-about-fitbit-data/data-resolutions/
    type: vendor_docs
    quote: "Day Steps Intensity - time spent in activity intensity classifications Calories (Estimated Energy Expenditure) Sleep and Sleep stages Breathing Rate HRV SpO2 Active Zone Minutes Cardio Fitness Score Floors Distance Food Logs Activity Logs Resting Heart Rate"
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: derived_metrics
  status: stated
  scope: Garmin
  value: Daily stress, steps, floors, VO2max, fitness age, pulse ox, Move IQ, body composition, calories, nightly HRV
    average and 5-minute high, wear time and activity logs; 15-minute epochs; sleep with Garmin validation levels.
  confidence: Corroborated
  sources:
  - url: https://www.fitabase.com/resources/knowledge-base/learn-about-garmin-data/garmin-datasets/
    type: vendor_docs
    quote: "Day -Stress -Steps -Floors -VO2max -Fitness Age -PulseOx -MoveIQ -Body composition -Calorie expenditure -HRV nightly average and 5-minute high"
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: sampling_rates
  status: stated
  scope: Fitbit / Google Health
  value: Heart rate every 3 to 15 seconds (variable); sleep stages 30 seconds; minute-level steps, intensity, METs,
    calories, SpO2, AZM; HRV 5-minute readings; hourly and daily totals.
  confidence: Corroborated
  sources:
  - url: https://www.fitabase.com/resources/knowledge-base/learn-about-fitbit-data/data-resolutions/
    type: vendor_docs
    quote: "Seconds Heart Rate - variable sampling with readings every 3-15 seconds. Sleep stages - 30 seconds"
    retrieved: '2026-10-11'
  - url: https://www.fitabase.com/resources/knowledge-base/learn-about-fitbit-data/data-resolutions/
    type: vendor_docs
    quote: "HRV - 5-minute readings"
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: sampling_rates
  status: stated
  scope: Garmin
  value: Heart rate 15 seconds; stress 3 minutes; activity epochs 15 minutes; sleep as records at each stage change;
    beat-to-beat intervals during sleep.
  confidence: Corroborated
  sources:
  - url: https://www.fitabase.com/resources/knowledge-base/learn-about-garmin-data/garmin-datasets/
    type: vendor_docs
    quote: "Minute -Stress (3min) -Sleep (measurement records with each change in sleep stage) -PulseOx Seconds -HR (15sec)"
    retrieved: '2026-10-11'
  - url: https://www.fitabase.com/resources/knowledge-base/learn-about-garmin-data/garmin-datasets/
    type: vendor_docs
    quote: "15 Min Epochs -Steps -Heart rate -Distance -MET -Intensity -MeanMotion, MaxMotion"
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: history_depth
  status: stated
  scope: Garmin
  value: Data before connection can be pulled by setting sync dates in the past, but only if the participant turns on
    the off-by-default Historical Data permission in Garmin Connect. No maximum look-back is published.
  confidence: Corroborated
  sources:
  - url: https://www.fitabase.com/resources/knowledge-base/learn-about-garmin-data/capturing-historical-garmin-data/
    type: vendor_docs
    quote: "Fitabase can pull historical data from a participant if you set sync dates to a window in the past. However, this option is turned off by default on Garmin Connect, and participants must explicitly opt into allowing Fitabase to pull this historical data."
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: history_depth
  status: conflict
  scope: Fitbit / Google Health
  value: One Fitabase article says data from before the Fitbit account was connected cannot be retrieved; the example
    consent form page describes a Fitabase study that included historical data collection with personal Fitbit
    devices. Separately, devices hold minute and second data for only 5 to 7 days before sync.
  confidence: Unclear
  sources:
  - url: https://www.fitabase.com/resources/knowledge-base/getting-started/example-markdown-article/
    type: vendor_docs
    quote: "Fitabase cannot retrieve historical data from before the participant's Fitbit account was connected."
    retrieved: '2026-10-11'
  - url: https://www.fitabase.com/resources/knowledge-base/working-with-the-irb/example-consent-form/
    type: vendor_docs
    quote: "This study included: Historical data collection Online Fitabase authorization Use of participants' personal Fitbit devices/data"
    retrieved: '2026-10-11'
  - url: https://www.fitabase.com/resources/knowledge-base/learn-about-fitbit-data/data-availability-integrity/
    type: vendor_docs
    quote: "Google Health devices only store high resolution (minute or second) data for 5-7 days, depending on the device model."
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
  note: The first source's URL slug is "example-markdown-article" though it is titled "Setting Up a New Participant
    with a Fitbit Device" (last updated February 6, 2026), so it may be template text. Ask Fitabase.
- field: export_routes
  status: stated
  value: CSV downloads from individual participant report pages and the Batch Export Tool (per-participant or merged
    files, minute, hour and day level); the Fitabase API (Daily Activity, Profiles, Sync, Batch Export endpoints,
    key-authenticated) and an Aggregate Data API for bulk JSON or CSV export; automated batch exports at most daily.
  confidence: Corroborated
  sources:
  - url: https://www.fitabase.com/resources/knowledge-base/exporting-data/individual-report-page-exports/
    type: vendor_docs
    quote: "The Fitabase platform provides two options for exporting (downloading) participant data: individual report page export and batch export."
    retrieved: '2026-10-11'
  - url: https://www.fitabase.com/resources/knowledge-base/fitabase-api/available-core-apis/
    type: vendor_docs
    quote: "Batch Export: Programmatic access to the batch export objects and .csv data download binaries from your Fitabase project."
    retrieved: '2026-10-11'
  - url: https://www.fitabase.com/how-it-works/pricing/
    type: vendor_page
    quote: "Enables large-volume programmatic data exports in JSON or CSV formats, eliminating manual per-participant data retrieval."
    retrieved: '2026-10-11'
  - url: https://www.fitabase.com/resources/knowledge-base/fitabase-api/automatic-file-transfers-with-the-batch-export-api/
    type: vendor_docs
    quote: "Currently, the most frequent schedule available is a daily batch export."
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
