- field: deprecations
  status: stated
  value: Google turns off the Fitbit Web API on 2026-10-30 (support ended 2026-09-30); every active Fitbit participant
    must reauthorize Fitabase for the Google Health API, through 2026-11-30 via the in-app banner. The separate
    classic-sleep dataset is dropped (folded into the main sleep export) and writing step goals is not yet available.
    Exports gain UTC, time zone and source columns; the Fitabase API does not change.
  confidence: Verified
  sources:
  - url: https://www.fitabase.com/resources/knowledge-base/google-health-api-migration/migration-overview/
    type: vendor_docs
    quote: "Google is retiring the Fitbit Web API at the end of October 2026 and requiring every third-party app, Fitabase included, to move to the new Google Health API."
    retrieved: '2026-10-11'
  - url: https://developers.google.com/health/reference/rest/v4beta/users
    type: secondary
    quote: "the Fitbit Web API will be turned off and will no longer function or sync data to or from Fitbit users."
    retrieved: '2026-10-11'
  - url: https://www.fitabase.com/resources/knowledge-base/google-health-api-migration/key-dates/
    type: vendor_docs
    quote: "Through November 30, 2026 The reconnect banner stays in the Google Health app, giving participants who missed the deadline a way back."
    retrieved: '2026-10-11'
  - url: https://www.fitabase.com/resources/knowledge-base/google-health-api-migration/migration-faq/
    type: vendor_docs
    quote: "There will no longer be classic sleep data split out as its own dataset that is available to be downloaded."
    retrieved: '2026-10-11'
  - url: https://www.fitabase.com/resources/knowledge-base/google-health-api-migration/migration-faq/
    type: vendor_docs
    quote: "Writing step goals to the participant's app isn't available in the Google Health API yet."
    retrieved: '2026-10-11'
  - url: https://www.fitabase.com/resources/knowledge-base/google-health-api-migration/export-changes/
    type: vendor_docs
    quote: "Exports will include UTC time and time zone columns alongside the existing local time columns."
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
  note: Reauthorization cannot be done programmatically or in bulk; each account goes through Google sign-in.
