- field: program_status
  status: stated
  value: >-
    Active as of 2026-10-10. The Advanced Research API is listed as a current solution and is
    compatible only with the ScanWatch. No pause or closure notice found.
  confidence: Corroborated
  sources:
  - url: https://developer.withings.com/developer-guide/v3/withings-solutions/research-apis/
