- field: developer_program_status
  status: stated
  value: >-
    Open and self-serve. The Public API needs no contract; apps are created in the developer
    dashboard. From 2026-10-12, Withings accounts created after that date need a Withings+
    membership to share data with apps on the free plan, unless the app is on Enterprise or
    Advanced Biomarkers.
