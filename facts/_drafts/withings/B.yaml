- field: raw_streams
  status: stated
  scope: Advanced Research API (ScanWatch only, contracted partners)
  value: >-
    Raw 3-axis accelerometer and 3-wavelength PPG (green, red, infrared) via the Rawdata v2
    Activate, Deactivate and Get services. Activation puts the watch in a raw-only mode that disables
    all other features and cuts battery life to about 3 to 4 days on continuous capture.
  confidence: Verified
  sources:
  - url: https://developer.withings.com/developer-guide/v3/integration-guide/public-health-data-api/data-api/raw-data
    type: vendor_docs
    quote: "This includes accelerometer and optical sensor (PPG) data sampled at approximately 25 Hz"
    retrieved: 2026-10-10
  - url: https://developer.withings.com/developer-guide/v3/integration-guide/public-health-data-api/data-api/raw-data
    type: vendor_docs
    quote: "Raw data activation will put the Withings device in a specific mode that will disable all features except raw data capture."
    retrieved: 2026-10-10
  recheck_by: 2026-11-09
- field: raw_streams
  status: stated
  scope: Health data API (ECG signal)
  value: Full single-lead ECG waveform in microvolts through Heart v2 Get (ScanWatch 30 s recordings).
  confidence: Verified
  sources:
  - url: https://developer.withings.com/openapi.yaml
    type: vendor_docs
    quote: "Provides the high frequency data of an ECG recording in micro-volt"
    retrieved: 2026-10-10
  recheck_by: 2026-11-09
- field: derived_metrics
  status: stated
  value: >-
    Activity (steps, distance, calories, intensity, workouts), heart rate, HRV, SpO2, core body
    temperature, sleep stages and scores, respiratory rate, VO2 max, ECG intervals, AFib (PPG and
    ECG), plus scale, blood pressure and sleep-mat metrics. Access depends on plan: the free plan
    carries core biomarkers; FDA/CE cleared biomarkers (ECG, AFib, SpO2, vascular age, AHI) need
    Advanced Biomarkers.
  confidence: Verified
  sources:
  - url: https://static.withings.com/content/api/plans/plans.html
