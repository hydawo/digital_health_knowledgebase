facts:
- field: research_program
  status: stated
  value: >-
    Two research routes. (1) Advanced Research API: raw ScanWatch accelerometer and PPG data for
    research groups, universities and health studies, under contract. (2) The Advanced Biomarkers API
    plan, which Withings markets for clinical studies and AI research (cleared biomarkers, custom
    device provisioning, anonymization, AI training rights). Withings also runs a research page with
    a publication library and a "Conduct a study" contact route.
  confidence: Verified
  sources:
  - url: https://developer.withings.com/developer-guide/v3/withings-solutions/research-apis/
    type: vendor_docs
    quote: "The Advanced Research API provides research institutions, universities, and healthcare innovators with direct access to raw sensor data from Withings devices"
    retrieved: 2026-10-10
  - url: https://static.withings.com/content/api/plans/plans.html
    type: vendor_page
    quote: "Trusted by 100+ research labs. Cleared biomarkers, custom device provisioning, anonymization and explicit AI training rights, all part of Advanced Biomarkers."
    retrieved: 2026-10-10
  recheck_by: 2026-11-09
- field: program_eligibility
  status: stated
  value: >-
    Aimed at research groups, universities and advanced health studies. Raw data access is limited
    to contracted partners. No published eligibility criteria beyond that.
  confidence: Verified
  sources:
  - url: https://developer.withings.com/developer-guide/v3/withings-solutions/research-apis/
    type: vendor_docs
    quote: "Designed for research groups, universities, and advanced health studies."
    retrieved: 2026-10-10
  - url: https://developer.withings.com/developer-guide/v3/integration-guide/public-health-data-api/data-api/raw-data
    type: vendor_docs
    quote: "Access to raw data is a special feature available only for contracted partners."
    retrieved: 2026-10-10
  recheck_by: 2026-11-09
- field: program_application
  status: stated
  value: >-
    Contact Withings and sign a contract. No public application form, review criteria or turnaround
    time is published for the research route.
  confidence: Corroborated
  sources:
