# ---------------- Data access and terms ----------------
- field: raw_streams
  status: stated
  value: 'Researcher-enabled streams: background location (latitude, longitude, altitude, speed) with geofencing;
    smartphone sensors such as accelerometer; ambient noise levels (no audio recorded); multimedia uploads (images,
    video, audio, PDF); connected wearables (Fitbit, Polar named); Apple HealthKit and Android Health Connect. Data
    reach researchers through the MetricWire researcher portal.'
  confidence: Corroborated
  sources:
  - url: https://metricwire.com/participant-privacy-policy/
    type: vendor_legal
    quote: This data includes the longitude, latitude, altitude and speed during the use of the MetricWire application.
    retrieved: '2026-10-11'
  - url: https://metricwire.com/participant-privacy-policy/
    type: vendor_legal
    quote: 'Data from connected devices/wearables: we may collect this data after you authorize and connect your wearable
      devices to the MetricWire platform if researchers enable these features.'
    retrieved: '2026-10-11'
  - url: https://metricwire.com/portfolio/symptom-tracking/
    type: vendor_page
    quote: With the inclusion of multimedia (images, videos, audio, PDF) and passive sensors (accelerometer, passive
      location tracking, etc), Metricwire offers a unique blend of participant submitted data and objective data that
      can supplement traditional methods.
    retrieved: '2026-10-11'
  - url: https://apps.apple.com/us/app/catalyst-by-metricwire/id1585123028
    type: app_store
    quote: Ambient noise measurement can now continue in the background for studies that include it. Only sound levels
      are measured; no audio is recorded.
    retrieved: '2026-10-11'
  - url: https://play.google.com/store/apps/details?id=com.metricwire.digitalhealth&hl=en_US
    type: app_store
    quote: Researchers may ask questions about activity and fitness or collect data through wearable sensors like Fitbit
      or Polar.
    retrieved: '2026-10-11'
  - url: https://metricwire.com/participant-privacy-policy/
    type: vendor_legal
    quote: The use of information received from Health Connect will adhere to the Health Connect Permissions Policy,
      including the Limited Use requirements.
    retrieved: '2026-10-11'
  recheck_by: 2026-11-09
  note: No public list of sensor streams, per-OS availability or raw versus processed format. Whether wearable data
    arrive as raw samples or vendor summaries is not documented.
- field: derived_metrics
  status: stated
  value: Documented derived data are what partner ecosystems supply, such as HealthKit sleep, step count, exercise and
    distance, plus ambient sound levels. No platform-native feature extraction (mobility, sociability, sleep inference)
    is documented.
  confidence: Reported
  sources:
  - url: https://apps.apple.com/us/app/catalyst-by-metricwire/id1585123028
    type: app_store
    quote: Catalyst integrates with Apple HealthKit to collect movement data such as sleep, step count, exercise, and
      distance if enabled by the Study Team.
    retrieved: '2026-10-11'
  recheck_by: 2026-11-09
