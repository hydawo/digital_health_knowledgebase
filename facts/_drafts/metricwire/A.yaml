- field: retention_terms
  status: stated
  value: Data sync to US servers and are removed from the phone; after the study the research team deletes the data from
    MetricWire servers, and MetricWire says it keeps no further copies. Participants may ask the Privacy Officer for
    deletion, subject to one archival copy where law requires.
  confidence: Verified
  sources:
  - url: https://metricwire.com/participant-privacy-policy/
    type: vendor_legal
    quote: When the study is over, the Research Team will delete your data from the MetricWire servers. MetricWire does
      not retain any additional copies of your data on our servers or in the MetricWire Mobile Application.
    retrieved: '2026-10-11'
  - url: https://metricwire.com/participant-privacy-policy/
    type: vendor_legal
    quote: When the MetricWire Mobile Application detects an internet connection, your encrypted data are securely
      transmitted to MetricWire servers and removed from your device.
    retrieved: '2026-10-11'
  recheck_by: 2026-11-09
- field: ai_training_terms
  status: unclear
  confidence: Unclear
  sources:
