# ---------------- Pricing ----------------
- field: device_price
  status: not_applicable
  note: Software platform; MetricWire sells no hardware. Wearables (Fitbit, Polar, Apple) are bought separately.
- field: subscription_price
  status: not_applicable
  note: No consumer subscription. Participant apps (Catalyst By MetricWire, MetricWire, study-branded apps) are free
    store downloads; the researcher side is licensed (see academic_pricing, quote_required).
- field: academic_pricing
  status: stated
  value: An Academic Site Licence is offered as cost-effective but no figures are published. Penn State's Survey
    Research Center resells MetricWire licences at reduced cost, and free for pilot and thesis or dissertation data
    collection (services extra).
  confidence: Corroborated
  sources:
  - url: https://metricwire.com/site-licence/
    type: vendor_page
    quote: Metricwire has created a balance between impactful tools and feasible pricing.
