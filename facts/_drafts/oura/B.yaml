facts:
- field: research_program
  status: stated
  value: 'Oura for Research: the Oura Enterprise Platform (research dashboards, group and access management, per-individual
    or per-group download, Oura API integration, raw data export to CSV or JSON) plus a customer success team for
    onboarding and data access. A separate Oura Research App (iOS, Oura Health Oy) collects ring data for enrolled
    study participants on behalf of a Research Sponsor.'
  confidence: Verified
  sources:
  - url: https://organizations.ouraring.com/solutions/research
    type: vendor_page
    quote: Oura offers a solution for researchers, combining the unparalleled accuracy of Oura Ring with customizable
      dashboards and simple data integration.
    retrieved: '2026-10-10'
  - url: https://organizations.ouraring.com/solutions/research
    type: vendor_page
    quote: Flexible data access and dedicated support
    retrieved: '2026-10-10'
  - url: https://ouraring.com/privacy-policy
    type: vendor_legal
    quote: The Oura Research App is a separate application that enables individuals to participate in research studies
      conducted by or on behalf of Oura or an independent research sponsor
    retrieved: '2026-10-10'
  - url: https://apps.apple.com/us/app/oura-research/id6748037636
    type: app_store
    quote: For participants enrolled in research studies using the Oura Ring.
    retrieved: '2026-10-10'
  recheck_by: '2026-11-09'
