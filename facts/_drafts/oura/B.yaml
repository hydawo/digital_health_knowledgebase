    users with or without membership (up to 10 days to prepare); Apple Health and Health Connect sync; Enterprise
    Platform download by individual or group, Enterprise API, CSV or JSON export; Oura Research App for sponsored
    studies. API access for Gen3 and later rings requires an active membership, including through partner integrations.
  confidence: Verified
  sources:
