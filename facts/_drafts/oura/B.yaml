- field: raw_streams
  status: stated
  value: 'No raw sensor signals (PPG, accelerometer, temperature) through the public API: the docs say algorithms
    process raw data and only processed data reaches the API. The finest-grained series are heart rate (5-minute
    increments), sleep HR and HRV sample series, and 30-second sleep movement.'
  confidence: Verified
  sources:
