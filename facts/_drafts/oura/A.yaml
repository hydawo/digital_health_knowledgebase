      type: vendor_legal
      quote: "You shall not use, and shall not permit any third party to use, the Oura API to develop, train, fine-tune, evaluate, prompt, or otherwise provide input or data to any AI Model or AI Platform."
      retrieved: 2026-10-10
  recheck_by: 2026-11-09
- field: rate_limits
  status: stated
  value: 5,000 requests per 5-minute period. Limits apply per access token and per application (aggregate across all a study's participants); a 429 response carries Retry-After and X-RateLimit headers. Higher limits on request to api-support@ouraring.com.
  confidence: Verified
  sources:
    - url: https://cloud.ouraring.com/v2/docs
      fetch_url: https://cloud.ouraring.com/v2/static/json/openapi-1.41.json
      type: vendor_docs
      quote: "The Oura API is limited to 5000 requests per 5-minute period."
      retrieved: 2026-10-10
    - url: https://cloud.ouraring.com/v2/docs
      fetch_url: https://cloud.ouraring.com/v2/static/json/openapi-1.41.json
      type: vendor_docs
      quote: "a per-application limit, which caps the aggregate traffic across all of an application's end-user tokens"
      retrieved: 2026-10-10
  recheck_by: 2026-11-09
  note: The 5000/5-min figure appears in the FAQ part of the docs; the newer two-layer rate-limit section gives no numbers, so the per-token and per-application ceilings may differ.
- field: retention_terms
  status: stated
  value: API data may not be stored or retained beyond the duration strictly necessary; deletion requests must be honoured within 72 hours; data obtained through the MCP Server may not be stored or cached at all without separate written authorization; storing location data is prohibited.
  confidence: Verified
  sources:
    - url: https://cloud.ouraring.com/legal/api-agreement
      type: vendor_legal
      quote: "User Data or Oura Data and User Data accessed or obtained through the Oura API may not be stored or retained beyond the duration strictly necessary."
      retrieved: 2026-10-10
    - url: https://cloud.ouraring.com/legal/api-agreement
      type: vendor_legal
      quote: "Upon a request for deletion, you shall delete all User Data relating to such User within seventy-two (72) hours."
      retrieved: 2026-10-10
    - url: https://cloud.ouraring.com/legal/api-agreement
      type: vendor_legal
      quote: "aggregating, caching, or storing geographic location information or other User Data accessible via the Oura API or MCP Server"
      retrieved: 2026-10-10
  recheck_by: 2026-11-09
  note: "Agreement effective date June 8, 2026. Read literally, the retention and linking clauses sit awkwardly with a longitudinal research dataset; a study team should seek a separate written agreement (the Enterprise or Research App route) before relying on the public API."
- field: ai_training_terms
  status: stated
  value: API users may not use Oura user data to train, fine-tune, develop or improve any AI or ML model, and may not feed API data to any AI model or platform at all; LLM use is permitted only through Oura's MCP Server. Violation is a material breach, and Oura may audit for it. Oura itself may use member data to improve its own AI features.
  confidence: Verified
  sources:
    - url: https://cloud.ouraring.com/legal/api-agreement
      type: vendor_legal
      quote: "YOU SHALL NOT USE OR ALLOW THE USE OF USER DATA TO TRAIN, FINE-TUNE, DEVELOP, IMPROVE, OR ENHANCE ANY AI MODEL OR OTHER ARTIFICIAL INTELLIGENCE OR MACHINE LEARNING SYSTEM, WHETHER DEVELOPED OR OPERATED BY YOU OR ANY THIRD PARTY."
      retrieved: 2026-10-10
    - url: https://cloud.ouraring.com/legal/api-agreement
      type: vendor_legal
      quote: "You shall not use, and shall not permit any third party to use, the Oura API to develop, train, fine-tune, evaluate, prompt, or otherwise provide input or data to any AI Model or AI Platform."
      retrieved: 2026-10-10
    - url: https://ouraring.com/privacy-policy
      type: vendor_legal
      quote: "We may collect and use personal data to develop, test, improve, and support Oura’s own AI, machine learning, and large language model-powered features."
      retrieved: 2026-10-10
  recheck_by: 2026-11-09
  note: The AI-model definition covers "any artificial intelligence system, machine learning model, neural network", which on its face includes ordinary statistical ML in a research analysis.
