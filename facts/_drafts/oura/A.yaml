# ---------------- Research access ----------------
- field: research_program
  status: stated
  value: "Oura for research: a commercial offering for research teams combining Oura Ring, the Oura Enterprise Platform (dashboards, group management, download by individual or group, Oura API integration, CSV/JSON export) and a separate Oura Research App for enrolled participants, in which the research sponsor is the data controller and Oura may act as processor."
  confidence: Verified
  sources:
    - url: https://organizations.ouraring.com/solutions/researchers
      type: vendor_page
      quote: "Oura offers a solution for researchers, combining the unparalleled accuracy of Oura Ring with customizable dashboards and simple data integration."
      retrieved: 2026-10-10
    - url: https://ouraring.com/privacy-policy
      type: vendor_legal
      quote: "The Oura Research App is a separate application that enables individuals to participate in research studies conducted by or on behalf of Oura or an independent research sponsor (“Research Sponsor”)."
      retrieved: 2026-10-10
    - url: https://apps.apple.com/us/app/oura-research/id6748037636
      type: app_store
      quote: "Oura Research App collects data from your Oura Ring and shares it securely with your study's research team with your consent."
      retrieved: 2026-10-10
  recheck_by: 2026-11-09
  note: No free or grant-style academic program found; the offering is sold through the Oura for Organizations sales channel. Oura Labs (in-app, member-facing studies) is a different thing and not a researcher access route.
- field: program_eligibility
  status: stated
  value: The research page lists academic researchers, life science researchers, academic medical centers, government and non-profits, contract research organizations and consumer product researchers as target customers. No formal eligibility criteria are published.
  confidence: Verified
  sources:
    - url: https://organizations.ouraring.com/solutions/researchers
      type: vendor_page
      quote: "Academic researchers Life science researchers Academic medical centers Government and non-profits Contract research organizations (CRO) Consumer product researchers"
      retrieved: 2026-10-10
  recheck_by: 2026-11-09
- field: program_application
  status: not_public
  confidence: Verified
  sources:
    - url: https://organizations.ouraring.com/solutions/researchers
      type: vendor_page
      retrieved: 2026-10-10
    - url: https://partnersupport.ouraring.com
      type: vendor_docs
      retrieved: 2026-10-10
  recheck_by: 2026-11-09
  note: The research page offers only a "Contact us" sales form. No application, review or approval process for the research offering is published. The separate self-serve API route (register an app, submit for review above 10 users) is covered under developer_program_status and user_cap.
- field: program_status
  status: stated
  value: Active. The research page (2026) markets the offering and claims 200+ active research collaborations; the Oura Research App had iOS releases through version 1.0.11 (Sep 15).
  confidence: Corroborated
  sources:
    - url: https://organizations.ouraring.com/solutions/researchers
      type: vendor_page
      quote: "200+ active research collaborations worldwide"
      retrieved: 2026-10-10
    - url: https://apps.apple.com/us/app/oura-research/id6748037636
      type: app_store
      quote: "Oura Research App collects data from your Oura Ring and shares it securely with your study's research team with your consent."
      retrieved: 2026-10-10
  recheck_by: 2026-11-09
- field: developer_program_status
  status: stated
  value: Open. Anyone with an Oura account can register an OAuth2 API application (now through the developer portal at developer.ouraring.com; the older cloud.ouraring.com portal still edits existing apps). Personal access tokens were withdrawn in December 2025, so OAuth2 is the only route.
  confidence: Verified
  sources:
    - url: https://partnersupport.ouraring.com/hc/en-us/articles/20949682312211-Using-the-Oura-API
      type: vendor_docs
      quote: "You can use the Oura API by creating an API application in our developer portal ."
      retrieved: 2026-10-10
    - url: https://cloud.ouraring.com/v2/docs
      fetch_url: https://cloud.ouraring.com/v2/static/json/openapi-1.41.json
      type: vendor_docs
      quote: "Please note that personal access tokens were deprecated in December 2025 and are no longer available for use."
      retrieved: 2026-10-10
  recheck_by: 2026-11-09
- field: user_cap
  status: stated
  value: An API application is limited to 10 users until Oura approves it; after approval there is no user limit. Approval is requested from the application's page.
  confidence: Verified
  sources:
    - url: https://cloud.ouraring.com/v2/docs
      fetch_url: https://cloud.ouraring.com/v2/static/json/openapi-1.41.json
      type: vendor_docs
      quote: "API Applications are limited to **10** users before requiring approval from Oura. There is no limit once an application is approved."
      retrieved: 2026-10-10
    - url: https://cloud.ouraring.com/docs/
      type: vendor_docs
      quote: "By default, API Applications have a ten user limit. If you want to release your application to a wider audience, your application needs to be approved. Once you have finished developing your application, you can submit it for review from the application's page."
      retrieved: 2026-10-10
  recheck_by: 2026-11-09
- field: academic_vs_commercial
  status: stated
  value: The public API agreement makes no academic/commercial distinction (one agreement for all API users, no fees today, but Oura reserves the right to introduce differentiated pricing for business users). On the Enterprise Platform, Oura says academic researchers can access premium metrics; what that covers is not defined.
  confidence: Corroborated
  sources:
    - url: https://organizations.ouraring.com/solutions/researchers
      type: vendor_page
      quote: "Academic researchers can access premium metrics"
      retrieved: 2026-10-10
    - url: https://cloud.ouraring.com/legal/api-agreement
      type: vendor_legal
      quote: "Oura reserves the right to charge you fees for use of the MCP Server, the Oura API, or for access to the Oura Platform in the future at its discretion, including, without limitation, rated pricing and/or differentiated pricing for business users. Oura will provide you with notice in the event Oura decides to start charging for such use or access."
      retrieved: 2026-10-10
  recheck_by: 2026-11-09
