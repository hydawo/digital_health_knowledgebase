# ---------------- Data access and terms ----------------
- field: raw_streams
  scope: Oura API
  status: stated
  value: None. The API serves only processed data (scores, summaries and 5-minute heart rate/HRV series); raw PPG, accelerometer and temperature signals are not exposed. Interpreted from the docs' data-flow description and the endpoint list (no raw-signal endpoint exists in OpenAPI spec 1.41).
  confidence: Corroborated
  sources:
    - url: https://cloud.ouraring.com/v2/docs
      fetch_url: https://cloud.ouraring.com/v2/static/json/openapi-1.41.json
      type: vendor_docs
      quote: "Processed data becomes available through API endpoints"
      retrieved: 2026-10-10
    - url: https://cloud.ouraring.com/v2/docs
      fetch_url: https://cloud.ouraring.com/v2/static/json/openapi-1.41.json
      type: vendor_docs
      quote: "Algorithms analyze raw data to generate insights and scores"
      retrieved: 2026-10-10
  recheck_by: 2026-11-09
  note: Corroborated rather than Verified because the absence of raw signals is inferred from the endpoint list, not stated outright. The API agreement also forbids deriving Oura's signal processing techniques.
- field: raw_streams
  scope: Oura Enterprise Platform
  status: unclear
  confidence: Unclear
  sources:
    - url: https://organizations.ouraring.com/solutions/researchers
      type: vendor_page
      quote: "Flexible data export of raw data to CSV or JSON file"
      retrieved: 2026-10-10
    - url: https://ouraring.com/assets/documents/public-security-whitepaper.pdf
      type: vendor_docs
      quote: "Research partners may receive data that has been processed to protect data subject privacy (“Research Data”)."
      retrieved: 2026-10-10
  recheck_by: 2026-11-09
  note: Marketing promises "raw data" export, but no page defines whether that means sensor-level signals or just unaggregated metrics. Needs vendor confirmation.
- field: derived_metrics
  status: stated
  value: "API v2 endpoints: daily activity, readiness, sleep, SpO2, stress, resilience, cardiovascular age, VO2 max; sleep periods (staging, average and lowest HR, average HRV, respiratory rate, temperature deviation); sleep time recommendations; heart rate series; sessions; workouts; tags and enhanced tags; rest mode periods; ring configuration and battery level; personal info. Users must consent to each data type."
  confidence: Verified
  sources:
    - url: https://partnersupport.ouraring.com/hc/en-us/articles/28571089902227-Metrics-Available-via-the-Oura-API
      type: vendor_docs
      quote: "Temperature Deviation from Baseline SpO2 average"
      retrieved: 2026-10-10
    - url: https://cloud.ouraring.com/v2/docs
      fetch_url: https://cloud.ouraring.com/v2/static/json/openapi-1.41.json
      type: vendor_docs
      quote: "Oura users **must provide consent** to share each data type an API Application has access to."
      retrieved: 2026-10-10
  recheck_by: 2026-11-09
  note: Endpoint list read from OpenAPI spec openapi-1.41.json (paths under /v2/usercollection/).
- field: sampling_rates
  status: stated
  value: Heart rate and HRV time series at 5-minute resolution; 30-second movement classification and 5-minute activity classification strings; sleep HR averages computed from 30-second samples (differs from the app, which uses 5-minute aggregates).
  confidence: Verified
