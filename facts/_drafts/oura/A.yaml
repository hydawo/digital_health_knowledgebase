- field: export_routes
  status: stated
  value: "(1) Oura API v2, OAuth2 only, with webhooks recommended (about 30 s after app sync); (2) Oura MCP Server, the only permitted route for use with LLMs; (3) participant self-export via Membership Hub (CSV, up to 10 days to prepare, available without membership); (4) Shareable Reports PDF; (5) Oura Enterprise Platform download by individual or group, CSV/JSON export and Enterprise API; (6) Oura Research App for sponsor-run studies. Oura on the Web was discontinued on 5 Oct 2026."
  confidence: Verified
  sources:
    - url: https://cloud.ouraring.com/v2/docs
      fetch_url: https://cloud.ouraring.com/v2/static/json/openapi-1.41.json
      type: vendor_docs
      quote: "Webhook notifications come approximately 30 seconds after data syncs from the mobile app"
      retrieved: 2026-10-10
    - url: https://support.ouraring.com/hc/en-us/articles/360025441594
      type: vendor_docs
      quote: "Note that it may take up to 10 days from the time of request before your data is available for download"
      retrieved: 2026-10-10
    - url: https://organizations.ouraring.com/solutions/researchers
      type: vendor_page
      quote: "Integrate data into existing systems with Oura API"
      retrieved: 2026-10-10
