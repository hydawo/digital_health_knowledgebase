# ---------------- Compliance ----------------
- field: baa
  status: stated
  value: Yes, for business partners. Oura says it runs an enclave for processing HIPAA data from partners who sign a BAA with it, with third-party HIPAA audits. Not offered for the public API (whose agreement treats each party as an independent controller).
  confidence: Corroborated
  sources:
    - url: https://ouraring.com/assets/documents/public-security-whitepaper.pdf
      type: vendor_docs
      quote: "We have an enclave available for processing HIPAA Eligibility data from our partners signing a Business Associate Agreement (BAA) with us."
      retrieved: 2026-10-10
  recheck_by: 2027-01-08
  note: Whitepaper dated August 2026. The phrase "HIPAA Eligibility data" suggests health-plan eligibility files; whether a BAA covers research cohorts on the Enterprise Platform needs vendor confirmation.
- field: dpa
  status: unclear
  confidence: Unclear
  sources:
    - url: https://ouraring.com/privacy-policy
      type: vendor_legal
      quote: "Oura may act as a processor or service provider to the Research Sponsor in connection with the hosting, storage, or technical administration of the Oura Research App, unless otherwise described in the applicable ICF."
      retrieved: 2026-10-10
    - url: https://cloud.ouraring.com/legal/api-agreement
      type: vendor_legal
      quote: "For the purposes of Article 26 of the GDPR, the Parties acknowledge that each Party is a separate and independent controller of the Personal Data which it discloses or receives under this Agreement."
      retrieved: 2026-10-10
  recheck_by: 2027-01-08
  note: No DPA template is published. Oura can be a processor for Research App sponsors, which would normally require one, but no page says a DPA is offered. Under the public API both parties are independent controllers, so no DPA applies there.
- field: hipaa_statement
  status: stated
  value: Oura says it is generally not a HIPAA covered entity for direct-to-consumer services, but meets HIPAA requirements where it handles PHI for a healthcare partner, and markets the Enterprise Platform as processing PHI in accordance with HIPAA.
  confidence: Corroborated
  sources:
    - url: https://ouraring.com/security
      type: vendor_page
      quote: "We also meet HIPAA requirements where we handle protected health information for a healthcare partner."
      retrieved: 2026-10-10
    - url: https://ouraring.com/privacy-policy
      type: vendor_legal
      quote: "Oura is generally not a Covered Entity under HIPAA for our direct-to-consumer Services."
      retrieved: 2026-10-10
    - url: https://organizations.ouraring.com/solutions/researchers
      type: vendor_page
      quote: "Complies with stringent data protection laws like GDPR and processes PHI in accordance with HIPAA"
      retrieved: 2026-10-10
  recheck_by: 2027-01-08
- field: gdpr_statement
  status: stated
  value: Oura Health Oy (Finland) is the controller for most processing and says it adheres to the EU and UK GDPR; it participates in the EU-US, UK and Swiss-US Data Privacy Frameworks for transfers.
  confidence: Corroborated
  sources:
    - url: https://ouraring.com/assets/documents/public-security-whitepaper.pdf
      type: vendor_docs
      quote: "Oura processes personal data of data subjects in the European Economic Area (EEA) and adheres to the EU and UK General Data Protection Regulation."
      retrieved: 2026-10-10
    - url: https://ouraring.com/privacy-policy
      type: vendor_legal
      quote: "Oura participates in the EU-US Data Privacy Framework, the UK Extension to the EU-US Data Privacy Framework, and the Swiss-US Data Privacy Framework"
      retrieved: 2026-10-10
  recheck_by: 2027-01-08
  note: DPF participation could be confirmed on dataprivacyframework.gov (JavaScript list, not checked here).
