- field: soc2
  status: stated
  value: Oura says it undergoes an annual SOC 2 examination and also holds HITRUST certification. Reports are not public; the Trust Center points enterprise customers to a Security Resource Center "upon request".
  confidence: Corroborated
  sources:
    - url: https://ouraring.com/assets/documents/public-security-whitepaper.pdf
      type: vendor_docs
      quote: "We undergo an annual SOC 2 examination and maintain HITRUST certification, assessed on its certification cycle."
      retrieved: 2026-10-10
    - url: https://ouraring.com/security
      type: vendor_page
      quote: "Each year, independent auditors carefully review our security controls and verify that they are designed and operating as effectively as intended."
      retrieved: 2026-10-10
  recheck_by: 2027-01-08
  note: SOC 2 type (I or II) is not stated.
- field: fda_clearances
  status: stated
  value: "No FDA 510(k) clearance found for Oura (openFDA 510(k) search on applicant 'oura' returns no matches). Oura Health Oy holds an FDA establishment registration listing one device, 'Fertile Window', under product code LHD (Device, Fertility Diagnostic, Proceptive; unclassified), with no 510(k) or PMA number. Oura states the Ring is not a medical device."
  confidence: Corroborated
  sources:
    - url: https://api.fda.gov/device/registrationlisting.json?search=registration.owner_operator.firm_name:oura
      type: regulator_db
      quote: "Device, Fertility Diagnostic, Proceptive"
      retrieved: 2026-10-10
    - url: https://api.fda.gov/device/510k.json?search=applicant:oura
      type: regulator_db
      retrieved: 2026-10-10
    - url: https://organizations.ouraring.com/solutions/researchers
      type: vendor_page
      quote: "Oura Ring is not a medical device and is not intended to diagnose, treat, cure, monitor, or prevent medical conditions or illnesses."
      retrieved: 2026-10-10
  recheck_by: 2027-01-08
  note: Capped at Corroborated because the accessdata.fda.gov 510(k), De Novo and registration search pages could not be read (Akamai bot protection redirects the fact-check fetcher; WebFetch returned only the blank search form). De Novo and PMA not checked. Press reports in 2026 say Oura is pursuing clearance for a hypertension-risk feature; confirm against accessdata by hand.
- field: data_residency
  status: stated
  value: Consumer data may be processed on servers worldwide, on a single unnamed leading cloud provider. For enterprise customers and partners, Oura says deployment options can support geo-specific residency and secure enclaves, with enterprise partner data segmented from member data.
  confidence: Corroborated
  sources:
    - url: https://ouraring.com/assets/documents/public-security-whitepaper.pdf
      type: vendor_docs
      quote: "Deployment options can support geo-specific residency and secure enclave deployment needs that may vary among customers & partners."
      retrieved: 2026-10-10
    - url: https://ouraring.com/privacy-policy
      type: vendor_legal
      quote: "Oura is a global company with servers around the world, and your personal data may at times be processed on servers located outside of the country where you live."
      retrieved: 2026-10-10
  recheck_by: 2027-01-08
