- field: history_depth
  status: unclear
  confidence: Unclear
  sources:
  - url: https://evidation.com/for-customers/datasets
    type: vendor_page
    quote: Access rich, historical data unified at the individual level, capturing how health, treatment, and behavior evolve over time across multiple dimensions.
    retrieved: '2026-10-11'
  - url: https://help.evidation.com/hc/en-us/articles/360012332094
    type: vendor_docs
    quote: We will be unable to award points for activities that are over two weeks old and have not yet been synced with Evidation.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
  note: Sponsors are offered "historical" longitudinal data with no stated depth. The company dates to 2012, but how far
    back member wearable data goes per person, and how much history is pulled at connection, is not published. The
    two-week rule governs points, not data.
- field: export_routes
  status: stated
  value: Sponsors get dataset deliveries (one-time extract or subscription), with no public API. Members can export
    their own Evidation data as a .json file by email from account settings. Data from a sponsored program is requested
    through support and routed to the study team or sponsor.
  confidence: Verified
  sources:
  - url: https://evidation.com/for-customers/datasets
    type: vendor_page
    quote: License de-identified, individual-level datasets as a one-time extract or through a subscription model with recurring updates and continuous data enrichment.
    retrieved: '2026-10-11'
  - url: https://evidation.com/frequently-asked-questions/how-do-i-download-my-data
    type: vendor_docs
    quote: We will email you a .json file with your Evidation data.
    retrieved: '2026-10-11'
  - url: https://evidation.com/frequently-asked-questions/how-do-i-download-my-data
    type: vendor_docs
    quote: We will escalate your request to the Evidation study or program team, or to the sponsor on whose behalf the data was collected.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: rate_limits
  status: not_applicable
  note: No public API, so no published rate limits. Sponsor data arrives as dataset deliveries.
  recheck_by: '2026-11-09'
- field: retention_terms
  status: stated
  value: Member data is kept as long as reasonably necessary, with periods varying by data type and service. Members can
    delete their account in settings, which is irreversible. Sponsored-program data falls under each program's own
    consent terms and needs a support request to delete. Sponsor-side retention terms for licensed datasets are not
    published.
  confidence: Verified
  scope: Member data
  sources:
  - url: https://evidation.com/members-privacy
    type: vendor_legal
    quote: We retain personal information for so long as reasonably necessary to provide the Services and fulfill the transactions you have requested
    retrieved: '2026-10-11'
  - url: https://evidation.com/members-privacy
    type: vendor_legal
    quote: may be subject to terms provided in the specific informed consent and/or other disclosures for the relevant Health Program
    retrieved: '2026-10-11'
  - url: https://evidation.com/frequently-asked-questions/how-do-i-delete-my-data
    type: vendor_docs
    quote: After deletion, your Evidation account and data cannot be downloaded or recovered (including any points you may have earned).
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
