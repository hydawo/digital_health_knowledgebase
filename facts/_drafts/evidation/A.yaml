# ---------------- Research access ----------------
- field: research_program
  status: stated
  value: 'No academic or research-access program in the sense of a data API. Evidation sells sponsor services built on
    its member community: data offerings (Real-World Data, Patient Insights, Prospective Studies) and activation
    offerings (Recruitment, Activation), available as one-time engagements or ongoing subscriptions, plus a licensable
    Research & Engagement Platform.'
  confidence: Verified
  sources:
  - url: https://evidation.com/for-customers/our-solutions
    type: vendor_page
    quote: Combine data and activation offerings to support research, evidence generation, and commercialization.
    retrieved: '2026-10-11'
  - url: https://evidation.com/for-customers/our-solutions
    type: vendor_page
    quote: Access deeply characterized populations through one-time engagements or ongoing subscriptions
    retrieved: '2026-10-11'
  - url: https://evidation.com/for-customers/non-profit
    type: vendor_page
    quote: Collect longitudinal, prospective data directly from participants by licensing our Research & Engagement Platform
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: program_eligibility
  status: stated
  value: Sponsors are organizations (biopharma, consumer health, technology, non-profit and government). No published
    eligibility criteria for sponsors.
