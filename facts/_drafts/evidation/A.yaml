# ---------------- Data access and terms ----------------
- field: raw_streams
  status: stated
  value: 'Delivered to sponsors as licensed de-identified, individual-level datasets: PROs and surveys, behavioral and
    functional measures, connected device and wearable data, clinical data (EHR via 1upHealth), and molecular data
    where available. Whether wearable data comes at raw, intraday or daily-summary level is not documented. Wearable
    data arrives through members'' connected apps (Apple Health, Fitbit, Garmin, Dexcom, MyFitnessPal, Oura, RunKeeper,
    Strava, Withings, Samsung Health), not from the devices directly.'
  confidence: Corroborated
  sources:
  - url: https://evidation.com/for-customers/datasets
    type: vendor_page
    quote: 'Data includes: Patient-reported outcomes and survey data Behavioral and functional measures Connected device and wearable data Clinical data Molecular data, where available'
    retrieved: '2026-10-11'
  - url: https://help.evidation.com/hc/en-us/articles/50630998040211-How-to-Earn-Activity-Points-After-Google-Fit-Connection-Changes
    type: vendor_docs
    quote: Fitbit, Garmin, Dexcom, MyFitnessPal, Oura, RunKeeper, Strava, Withings
    retrieved: '2026-10-11'
  - url: https://help.evidation.com/hc/en-us/articles/44473708031635-Electronic-Health-Record-FAQ
    type: vendor_docs
    quote: You’ll earn points when you successfully connect your first health care provider through 1UpHealth.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: derived_metrics
  status: stated
  value: Digital measures from wearables, program-level analytics, executive-ready reports and member
    characterization labels (conditions, treatment, SDOH, digital health measures). No metric list or definitions
    published.
