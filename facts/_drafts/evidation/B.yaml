  - url: https://help.evidation.com/hc/en-us/articles/52654735762451-The-GLP-1-Program-Terms
    type: vendor_legal
    quote: Your connected activity data (e.g., steps, sleep, heart rate), which will be regularly analyzed during the
      course of the program.
