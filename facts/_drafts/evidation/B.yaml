# ---------------- Data access and terms ----------------
- field: raw_streams
  status: stated
  value: 'No raw sensor signals. Device data reaches Evidation only from members'' connected third-party apps (Apple
    Health, Dexcom, Fitbit, Garmin, Google Fit, MyFitnessPal, Oura, Qardio, RunKeeper, Samsung Health, Strava, Withings),
    plus EHR records and surveys. Sponsors receive it as datasets or study deliveries, with member consent per program.'
  confidence: Verified
  sources:
  - url: https://help.evidation.com/hc/en-us/articles/360008060493-Currently-available-apps
    type: vendor_docs
    quote: 'Health and Fitness Apps: Apple Health Dexcom Fitbit Garmin Google Fit MyFitnessPal Oura Qardio RunKeeper
      Samsung Health Strava Withings'
    retrieved: '2026-10-11'
  - url: https://help.evidation.com/hc/en-us/articles/360012493253-Data-syncing-101
    type: vendor_docs
    quote: If you are using a wearable, such as a Fitbit , data will not sync from your wearable directly into Evidation.
    retrieved: '2026-10-11'
  - url: https://evidation.com/for-customers/datasets
    type: vendor_page
    quote: Connected device and wearable data
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: derived_metrics
  status: stated
  value: 'Vendor-processed metrics from connected apps (activity, steps, sleep, heart rate, HRV), ePROs and surveys,
    behavioural and functional measures, EHR-derived clinical data, and in some cohorts molecular data. Evidation also
    builds study-specific features.'
  confidence: Verified
  sources:
  - url: https://evidation.com/resources/evidation-launches-temporal-proteomics-platform-and-autoimmune-cohort
    type: vendor_page
    quote: Continuous wearable data capture (e.g., activities, sleep, HRV, heart rate)
    retrieved: '2026-10-11'
  - url: https://evidation.com/for-customers/datasets
    type: vendor_page
    quote: Patient-reported outcomes and survey data Behavioral and functional measures Connected device and wearable
      data Clinical data Molecular data, where available
