# ---------------- Research access ----------------
- field: research_program
  status: stated
  value: 'No academic or self-serve research program. Evidation sells sponsor services built on its member community:
    licensed real-world datasets, patient insights, sponsor-driven prospective observational studies, recruitment,
    activation, and a licensable Research & Engagement Platform.'
  confidence: Verified
  sources:
  - url: https://evidation.com/for-customers/our-solutions
    type: vendor_page
    quote: Access deeply characterized populations through one-time engagements or ongoing subscriptions, enabling
      longitudinal data collection, repeated measurement, and real-time engagement over time.
    retrieved: '2026-10-11'
  - url: https://evidation.com/for-customers/our-solutions
    type: vendor_page
    quote: Combine data and activation offerings to support research, evidence generation, and commercialization.
    retrieved: '2026-10-11'
  - url: https://evidation.com/for-customers/our-platform
    type: vendor_page
    quote: License Evidation's platform to enhance participant engagement, ensure protocol compliance, and improve
      patient outcomes.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: program_eligibility
  status: stated
  value: Sponsors are organisations (biopharma, consumer health, technology, non-profit, government); no eligibility
    criteria for sponsors are published.
  confidence: Verified
  scope: Sponsors
  sources:
  - url: https://evidation.com/for-customers/our-solutions
    type: vendor_page
    quote: Evidation partners include top biopharma companies , as well as consumer health companies, technology companies,
      non-profit organizations, and government agencies.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: program_eligibility
