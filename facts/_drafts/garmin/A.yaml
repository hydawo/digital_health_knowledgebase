facts:
- field: research_program
  status: stated
  value: 'Garmin Health research offering (launched 2022 as Garmin Health Research Solutions): device sync, definable
    interval logging of high-resolution data, independent hosting, full device control; plus periodic research grants
    run with partners such as Fitrockr'
  confidence: Verified
  sources:
  - url: https://www.garmin.com/en-US/newsroom/?p=3942
    type: vendor_page
    retrieved: '2026-10-10'
    quote: an online resource featuring more than 500 research projects and third-party studies
  - url: https://www.garmin.com/en-US/newsroom/?p=3942
    type: vendor_page
    retrieved: '2026-10-10'
    quote: Raw, high-resolution data is accessible through definable interval logging with the option to adjust granularity
      and frequency.
  - url: https://www.garmin.com/en-PH/newsroom/press-release/news-2026-mar-fitrockr/
    type: vendor_page
    retrieved: '2026-10-10'
    quote: Garmin Health officially launched its first research grant specific to Asia on February 2, in collaboration
      with Fitrockr.
  recheck_by: '2026-11-09'
  note: The current research page (garmin.com/en-US/health/solutions/research-and-clinical-trials/) is rendered by JavaScript
    and gave no checkable text, so the 2022 launch release and the 2026 grant release are cited instead.
