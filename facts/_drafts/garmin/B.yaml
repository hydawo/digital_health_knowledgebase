facts:
- field: research_program
  status: stated
  value: No formal academic program with its own terms. Garmin Health sells research access as an enterprise
    offering (Health API, Standard and Companion SDKs, independent hosting, device control), branded Garmin Health
    Research Solutions in 2022, plus periodic research grants run with Fitrockr (devices plus platform access).
  confidence: Corroborated
  sources:
  - url: https://garmin.com/en-US/newsroom/?p=3942
    type: vendor_page
    retrieved: '2026-10-10'
    quote: Whether it is access to high-resolution raw data, independent data hosting or full wearable device control,
      the Garmin Health ecosystem offers researchers everything they need to conduct best-in-class studies across a
      wide range of topics.
  - url: https://www.fitrockr.com/research/research-grants/
    type: secondary
    retrieved: '2026-10-10'
    quote: Fitrockr and Garmin support innovate research through grant programs that provide the tools to conduct
      health data research studies based on wearable data.
  recheck_by: '2026-11-09'
  note: Garmin's own research page (garmin.com/en-US/health/solutions/research-and-clinical-trials/) renders its text
    from embedded script data, so quote_probe cannot read it. Read by hand on 2026-10-10, it describes high-resolution
    raw data, independent hosting, device control, a Research Participation Program for recruitment, and grants.
- field: program_eligibility
  status: stated
  value: Enterprise access only. The Connect Developer Program is for business use only (integrators report personal
    applications are rejected). Grants have their own eligibility; the 2026 Asia grant took academic researchers,
    post-docs and graduate students in Asia.
  confidence: Verified
  sources:
  - url: https://developer.garmin.com/gc-developer-program/program-faq/
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: There are no licensing or maintenance fees for access to the Garmin Connect Developer Program, but it is
      only for business use.
  - url: https://developer.garmin.com/health-sdk/overview/
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: Available to Garmin Health enterprise partners, the Garmin Health SDKs allow for direct integration of Garmin
      wearables in your Android
  - url: https://www.garmin.com/en-PH/newsroom/press-release/news-2026-mar-fitrockr/
    type: vendor_page
    retrieved: '2026-10-10'
    quote: 'Eligibility: Academic researchers, post-docs, and graduate students in Asia (including Taiwan, Japan, Korea,
      and Southeast Asia) conducting health or sports science studies using Garmin wearables.'
  - url: https://openwearables.io/docs/providers/garmin-api-integration
    type: secondary
    retrieved: '2026-10-10'
    quote: You must apply as a legal entity (company, university, hospital, research institution, etc.). Personal-use
      applications are rejected.
  recheck_by: '2026-11-09'
- field: program_application
  status: stated
  value: 'Health SDKs: Request Now form, then the Garmin Health team arranges evaluation licences. Connect Developer
    Program: application form with a stated two-business-day review, but the form has been withdrawn and reviews are
    paused (see developer_program_status).'
  confidence: Verified
  sources:
  - url: https://developer.garmin.com/health-sdk/overview/
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: Request access using the “Request Now” form and a member of the Garmin Health team will be in touch to
      discuss your business needs and arrange evaluation licenses.
  - url: https://developer.garmin.com/gc-developer-program/program-faq/
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: After you request the Garmin Connect Developer Program, we will confirm the status of your application within
      two business days.
  recheck_by: '2026-11-09'
- field: program_status
