- field: academic_vs_commercial
  status: stated
  value: No separate academic tier. Access is business-only; fees attach to commercial use (licence fee or minimum
    device order for some metrics and for the SDKs). The March 2026 agreement version exempts Health API data used in
    research from Garmin attribution rules.
  confidence: Verified
  sources:
