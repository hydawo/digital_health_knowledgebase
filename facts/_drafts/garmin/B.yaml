    type: vendor_docs
    retrieved: '2026-10-10'
    quote: Access to some metrics may require a license fee payment or minimum device order quantity for commercial
      use.
  - url: https://www8.garmin.com/en-US/GARMINCONNECTDEVELOPERPROGRAMAGREEMENT/GARMINCONNECTDEVELOPERPROGRAMAGREEMENT_EN.pdf
    type: vendor_legal
    retrieved: '2026-10-10'
