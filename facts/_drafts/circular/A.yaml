- field: raw_streams
  status: stated
  value: Raw signal (PPG green/red/IR, single-lead ECG, skin temperature, 3-axis accelerometer) only through a research
    partnership, under agreement. No public route to raw signal; the app's Apple Health and Health Connect sync carries
    processed intraday values, not waveforms.
  confidence: Corroborated
  sources:
  - url: https://www.circular.xyz/science
    type: vendor_page
    quote: "Bring us a protocol. We supply devices, raw signal access under agreement and engineering time for studies that hold us to a reference standard."
