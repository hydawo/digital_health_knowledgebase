- field: derived_metrics
  status: stated
  value: Through the team dashboard, CSV export of any metric with daily and historical detail per wearer. Through the
    phone, intraday values (temperature, SpO2, breathing rate and others), HRV and sport sessions sync to Apple Health and
    Health Connect. ECG and blood pressure reports export as PDF.
  confidence: Verified
  sources:
  - url: https://www.circular.xyz/professionals
    type: vendor_page
    quote: "Export clean CSV Any metric, readable columns, ready for your own analysis or a clinician's records."
    retrieved: '2026-10-22'
  - url: https://www.circular.xyz/release-notes
    type: vendor_docs
    quote: "Intra day data is now sent to Android Health Connect & Apple Health (temperature, SpO2, Breathing rate, etc)"
    retrieved: '2026-10-22'
  - url: https://www.circular.xyz/release-notes
    type: vendor_docs
    quote: "Sport sessions can be now uploaded to HealthKit an Health Connect"
    retrieved: '2026-10-22'
  recheck_by: '2026-11-21'
  note: Circular's own science page says it does not infer blood glucose, blood pressure or hydration from optical data,
    while its BP page and app offer calibrated blood pressure estimates and the firmware notes add glucose compatibility.
    Treat BP and glucose outputs with caution.
- field: sampling_rates
  status: stated
  value: Ring 2 sensor rates per the science page; PPG (green, red, infrared) 25 Hz, single-lead ECG 510 Hz (40 s
    recordings), skin temperature 1 Hz at 0.01 °C resolution, 3-axis accelerometer 25 Hz. Resolution of exported
    metrics is not documented.
  confidence: Verified
  sources:
  - url: https://www.circular.xyz/science
    type: vendor_page
    quote: "Green, red and infrared LEDs sample blood volume at 25 Hz."
    retrieved: '2026-10-22'
  - url: https://www.circular.xyz/science
    type: vendor_page
    quote: "Two dry electrodes record the heart’s electrical activity at 510 Hz."
    retrieved: '2026-10-22'
  - url: https://www.circular.xyz/science
    type: vendor_page
    quote: "A thermistor in contact with the finger resolves 0.01 °C every second."
    retrieved: '2026-10-22'
  - url: https://www.circular.xyz/science
    type: vendor_page
    quote: "A 3-axis accelerometer at 25 Hz classifies activity type, cadence and intensity"
    retrieved: '2026-10-22'
  recheck_by: '2026-11-21'
  scope: Circular Ring 2
  note: These are on-ring sensor rates. Release notes (firmware 1.0.47) mention a PPG frequency switch between sport,
    performance and eco modes, so the continuous rate may differ by mode.
