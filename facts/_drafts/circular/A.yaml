facts:
- field: research_program
  status: stated
  value: No named program. The science page invites research partners to "bring us a protocol"; Circular supplies
    devices, raw signal access under agreement and engineering time for studies run against a reference standard.
  confidence: Verified
  sources:
  - url: https://www.circular.xyz/science
    type: vendor_page
    quote: "Bring us a protocol. We supply devices, raw signal access under agreement and engineering time for studies that hold us to a reference standard."
    retrieved: '2026-10-22'
  recheck_by: '2026-11-21'
  note: The same page lists six internal study protocols (sleep apnoea, AFib after ablation, cycle phase, illness
    detection, shift work, athletes) whose summaries partners can request. No terms, cost or agreement template is published.
- field: program_eligibility
  status: stated
  value: Clinical, academic and enterprise partners; no further criteria published beyond studies that use a reference
    standard.
  confidence: Verified
  sources:
  - url: https://www.circular.xyz/science
    type: vendor_page
    quote: "Clinical, academic and enterprise partners are all welcome."
    retrieved: '2026-10-22'
  recheck_by: '2026-11-21'
- field: program_application
  status: stated
  value: Contact the research team through the science page (typical reply within five working days); no application
    form, review criteria or timeline published. API access for business customers is by contact and limited to selected projects.
  confidence: Verified
  sources:
  - url: https://www.circular.xyz/science
    type: vendor_page
    quote: "Contact the research team Request the validation summary Typical response within five working days."
    retrieved: '2026-10-22'
  - url: https://www.circular.xyz/professionals
    type: vendor_page
    quote: "Is there an API or data export? Yes. Please contact us for more information — access is currently limited to selected projects."
    retrieved: '2026-10-22'
  recheck_by: '2026-11-21'
- field: program_status
  status: unclear
  value: The research offer is live on the site, but the original operator Circular SAS (SIREN 850 542 804) was converted
    to judicial liquidation on 14 October 2025. Products and terms are now issued by Circular Health Limited, a Hong Kong
    company registered in Paris (990 900 326). Whether research agreements signed with the old entity carry over is not published.
  confidence: Unclear
  sources:
  - url: https://www.circular.xyz/science
    type: vendor_page
    quote: "Six active protocols, each with a named reference standard and a defined read-out date. Partners can request the protocol summary for any of them."
    retrieved: '2026-10-22'
  - url: https://www.societe.com/societe/circular-850542804.html
    type: secondary
    quote: "14/10/2025 Annonce BODACC - Jugement de conversion en liquidation judiciaire"
    retrieved: '2026-10-22'
  - url: https://www.circular.xyz/terms-of-use
    type: vendor_legal
    quote: "Circular Health Limited, which is registered in the Paris Register of Trade & Companies under the number 990 900 326"
    retrieved: '2026-10-22'
  - url: https://gadgetsandwearables.com/2026/02/14/circular-ring-liquidation/
    type: secondary
    quote: "The French company behind the Circular Ring officially entered judicial liquidation at the end of last year as part of a major corporate shuffle."
    retrieved: '2026-10-22'
  recheck_by: '2026-11-21'
  note: BODACC (official gazette) record A202502091404, published 2025-10-30, records the 2025-10-14 conversion of the
    redressement judiciaire (opened 2024-10-08, cessation of payments 2024-08-31) into liquidation, liquidator Selarl Asteren.
    Read through the BODACC open-data API on 2026-10-22; robots.txt blocks scripted re-checks, so societe.com is cited.
    The founders told press the business moved to Hong Kong under Circular Health Limited.
