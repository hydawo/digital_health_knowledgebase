    fetch_url: https://web.archive.org/web/20250909230659/https://www.fitrockr.com/help-center/fitrockr-api/
    type: vendor_docs
    quote: Request API access information at support@fitrockr.com
    retrieved: '2026-10-21'
    note: Internet Archive capture of 2025-09-09, the newest capture of this help article.
