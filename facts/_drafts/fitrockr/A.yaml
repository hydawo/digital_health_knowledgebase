facts:
- field: research_program
  status: stated
  value: 'Garmin Health x Fitrockr research grants, run as regional rounds (EMEA 2023, Americas 2023, India 2024,
    Biomarkers 2024, Australia & New Zealand 2025, Asia 2026). Awards are 5 Garmin wearables plus 3 months (6 months
    for Asia 2026) of unrestricted Fitrockr platform access for up to 50 participants, and a possible feature in
    Garmin Health communications. No separate standing academic program'
  confidence: Reported
  sources:
  - url: https://www.fitrockr.com/research/research-grants/
    fetch_url: https://web.archive.org/web/20260713062221/https://www.fitrockr.com/research/research-grants/
    type: vendor_page
    quote: Fitrockr and Garmin support innovate research through grant programs that provide the tools to conduct
      health data research studies based on wearable data.
    retrieved: '2026-10-21'
    note: Internet Archive capture of 2026-07-13. Live page is 403 to scripts.
  - url: https://www.fitrockr.com/research/research-grants/
    fetch_url: https://web.archive.org/web/20260713062221/https://www.fitrockr.com/research/research-grants/
    type: vendor_page
    quote: 5 units of Garmin vívoactive 5, ▶︎ 6 months unrestricted access to the Fitrockr Health Solutions Platform
      for up to 50 participants
    retrieved: '2026-10-21'
  - url: https://www.garmin.com/en-PH/newsroom/press-release/news-2026-mar-fitrockr/
    type: secondary
    quote: 'Full Platform Access: 6 months of unrestricted access to the Fitrockr Health Solutions Platform.'
    retrieved: '2026-10-21'
    note: Garmin Philippines press release of 2026-03-05, read live. Garmin is the co-sponsor, not Fitrockr.
  recheck_by: '2026-11-04'
  note: Earlier rounds (2023 to 2025) list "3 months unrestricted access to the Fitrockr Health Solution Platform for
    up to 50 users" on the same capture.
- field: program_eligibility
  status: stated
  value: Set per regional round. Asia 2026 was open to academic researchers, post-docs and graduate students in Asia
    (11 markets) doing health or sports science studies with Garmin wearables, projects to start within 2026. Earlier
    rounds were limited to researchers from the named region (for example North or South America for Americas 2023;
    India for India 2024)
  confidence: Reported
  sources:
  - url: https://www.garmin.com/en-PH/newsroom/press-release/news-2026-mar-fitrockr/
    type: secondary
    quote: 'Eligibility: Academic researchers, post-docs, and graduate students in Asia (including Taiwan, Japan, Korea,
      and Southeast Asia) conducting health or sports science studies using Garmin wearables.'
    retrieved: '2026-10-21'
  - url: https://www.fitrockr.com/research/research-grants/
    fetch_url: https://web.archive.org/web/20260713062221/https://www.fitrockr.com/research/research-grants/
