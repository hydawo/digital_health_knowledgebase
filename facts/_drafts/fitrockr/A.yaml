- field: raw_streams
  status: stated
  value: 'Pro plan with Garmin devices synced through the Fitrockr app: raw beat-to-beat intervals (Raw BBI and
    Enhanced BBI, each beat), 3-axis accelerometer (25 Hz) and gyroscope (32 Hz), plus 1 s heart rate. ECG samples are
    listed for Polar straps. Garmin Connect sync gives less data, and wearables record GPS only during recorded
    activities'
  confidence: Reported
  sources:
  - url: https://www.fitrockr.com/research/pricing/
    fetch_url: https://web.archive.org/web/20260713062111/https://www.fitrockr.com/research/pricing/
    type: vendor_page
    quote: Accelerometer – 25Hz Gyroscope – 32Hz
    retrieved: '2026-10-21'
  - url: https://www.fitrockr.com/research/pricing/
    fetch_url: https://web.archive.org/web/20260713062111/https://www.fitrockr.com/research/pricing/
