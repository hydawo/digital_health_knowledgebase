- field: developer_program_status
  status: stated
  value: No open public developer program. The Fitrockr REST API (data API) and live-data API are a paid add-on for
    customers (API Access, +20% on licence); access details and documentation are requested from support. Reference
    implementations for the live API are shared through GitLab on request
  confidence: Reported
  sources:
