- field: retention_terms
  status: stated
  value: Data is kept for the subscription; each project has its own instance that is irreversibly deleted with all
    data at the end of service, and the customer must export before then. Longer storage is available as a quoted
    low-cost hosting option, the Data Vault add-on (EUR 150 per month), or a free BSON dump. Participants can ask
    support to delete their account; activity logs are then kept anonymously
  confidence: Reported
  sources:
