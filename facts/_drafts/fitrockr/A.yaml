- field: sampling_rates
  status: stated
  value: 'Configurable by plan (Basic vs Pro): heart rate 1 min vs 1 s to 60 min; stress 3 min vs 1 s to 60 min;
    respiration and SpO2 3 min vs 10 s to 60 min; steps 15 min vs 60 s; actigraphy 1 s to 30 s and skin temperature 1 s
    to 60 min (Pro); accelerometer fixed at 25 Hz and gyroscope at 32 Hz (Pro). HRV night only on Basic, day and night
    on Pro; via Garmin Connect sync HRV is RMSSD in 5-minute intervals during sleep only'
  confidence: Reported
  sources:
