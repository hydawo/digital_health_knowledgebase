- field: api_platform_fees
  status: stated
  value: 'Basic from EUR 50 (USD 55) per month and Pro from EUR 150 (USD 165) per month, each with 5 device licences;
    extra device licences EUR 1 to 7.5 (Basic) or EUR 1 to 15 (Pro) per month. Add-ons: API Access +20% on licence;
    Surveys & Notifications +20%; Live Streaming EUR 500 + 20%; On-Premise Hosting EUR 5,000 + 20%; Data Vault EUR
    150 per month; accelerometer and gyroscope collection volume based; country-of-choice hosting effort based'
  confidence: Reported
  sources:
