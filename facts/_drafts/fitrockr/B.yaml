facts:
# ---------------- Research access ----------------
- field: research_program
  status: stated
  value: 'Garmin Health x Fitrockr research grants, run in regional or themed rounds (EMEA 2023, Americas 2023, India
    2024, Biomarkers 2024, Australia and New Zealand 2025, Asia 2026). Awards are 5 Garmin wearables, unrestricted
    Fitrockr platform access for up to 50 participants (3 months in earlier rounds, 6 months in Asia 2026) and a
    chance to be featured in Garmin Health communications. There is no standing academic program; research teams
    otherwise buy the normal research subscription.'
  confidence: Verified
  sources:
  - url: https://www.fitrockr.com/research/research-grants/
    type: vendor_page
    quote: Fitrockr and Garmin support innovate research through grant programs that provide the tools to conduct
      health data research studies based on wearable data.
    retrieved: '2026-10-21'
  - url: https://www.fitrockr.com/research/research-grants/
    type: vendor_page
    quote: 6 months unrestricted access to the Fitrockr Health Solutions Platform for up to 50 participants
    retrieved: '2026-10-21'
  - url: https://www.garmin.com/en-PH/newsroom/press-release/news-2026-mar-fitrockr/
    type: secondary
    quote: Garmin Health officially launched its first research grant specific to Asia on February 2, in collaboration
      with Fitrockr.
    retrieved: '2026-10-21'
  recheck_by: '2026-11-20'
- field: program_eligibility
  status: stated
  value: Set per round, usually by region. Asia 2026 was open to academic researchers, post-docs and graduate students
    in Asia doing health or sports science studies with Garmin wearables; Americas 2023 to researchers in any North or
    South American country.
  confidence: Corroborated
  sources:
  - url: https://www.garmin.com/en-PH/newsroom/press-release/news-2026-mar-fitrockr/
    type: secondary
    quote: 'Eligibility: Academic researchers, post-docs, and graduate students in Asia (including Taiwan, Japan, Korea,
      and Southeast Asia) conducting health or sports science studies using Garmin wearables.'
    retrieved: '2026-10-21'
  - url: https://www.fitrockr.com/research/research-grants/
    type: vendor_page
    quote: For our grant, we invite researchers from any country in North or South America.
    retrieved: '2026-10-21'
  recheck_by: '2026-11-20'
- field: program_application
  status: stated
  value: Applicants apply through a per-round grant page before a fixed deadline. Selection criteria and the review
    process are not published.
  confidence: Verified
  sources:
  - url: https://www.fitrockr.com/research/research-grants/
    type: vendor_page
    quote: Apply here for a grant which will provide support for research projects with up to 50 participants.
    retrieved: '2026-10-21'
  - url: https://www.garmin.com/en-PH/newsroom/press-release/news-2026-mar-fitrockr/
    type: secondary
    quote: 'How to Apply: Visit the Garmin Health x Fitrockr Research Grant Asia 2026 official page for details and
      submission.'
    retrieved: '2026-10-21'
  recheck_by: '2026-11-20'
- field: program_status
  status: stated
  value: No round open. The most recent round (Asia 2026) closed on 31 March 2026 and its winners are listed; the next
    round is "to be announced".
  confidence: Verified
  sources:
  - url: https://www.fitrockr.com/research/research-grants/
    type: vendor_page
    quote: New grants will be announced soon.
    retrieved: '2026-10-21'
  - url: https://www.fitrockr.com/research/research-grants/
    type: vendor_page
    quote: Applications closed on March 31, 2026.
    retrieved: '2026-10-21'
  recheck_by: '2026-11-20'
- field: developer_program_status
  status: stated
  value: 'Open to paying customers: the REST API (all synced data) and a separate live-streaming API are granted on
    request to support, and API access is a priced add-on (+20% on licence). API documentation is not public. A
    separate "Wearable API" product is also sold (from EUR 150 per month for up to 20 users).'
  confidence: Verified
  sources:
  - url: https://www.fitrockr.com/help-center/fitrockr-api/
    type: vendor_docs
    quote: Request API access information at support@fitrockr.com
    retrieved: '2026-10-21'
  - url: https://www.fitrockr.com/pricing/
    type: vendor_page
    quote: API Access Automatically import data via API. +20% on license
    retrieved: '2026-10-21'
  recheck_by: '2026-11-20'
- field: user_cap
  status: stated
  value: Participants are unlimited on the research plans; billing is by connected devices, with 5 device licences
    included and more bought per device. The free trial is capped at 5 device connections for 2 weeks. Grants cover
    up to 50 participants.
  confidence: Verified
  sources:
  - url: https://www.fitrockr.com/pricing/
    type: vendor_page
    quote: 'Users: Unlimited Licenses Included: 5 Device Licenses'
    retrieved: '2026-10-21'
  - url: https://www.fitrockr.com/pricing/
    type: vendor_page
    quote: Up to 5 Device Connections 2 Weeks
    retrieved: '2026-10-21'
  recheck_by: '2026-11-20'
  note: The help center's licence article says subscriptions are either user-based or device-based, so older
    contracts may still cap users.
