    type: vendor_page
    retrieved: '2026-10-21'
  - url: https://www.fitrockr.com/help-center/pricing-plans-payment/
    type: vendor_docs
    retrieved: '2026-10-21'
  - url: https://www.fitrockr.com/health-solutions/terms-of-use/
    type: vendor_legal
    retrieved: '2026-10-21'
  recheck_by: '2026-11-20'
  note: One "Research & Clinical Trials" price list and one set of business terms cover universities, hospitals and
    companies alike; no academic tier is published. The grants are the only academic-specific route.
# ---------------- Pricing ----------------
- field: device_price
  status: not_applicable
  note: Fitrockr sells software only; teams buy the wearables (Garmin and others) themselves. Its devices page says
    "Confirm device compatibility and available data types with us prior purchasing devices."
    (https://www.fitrockr.com/research/compatible-devices/, read 2026-10-21).
- field: subscription_price
  status: not_applicable
  note: No consumer membership. The organisation subscription is recorded under api_platform_fees.
- field: academic_pricing
  status: stated
  value: No published academic price or discount. Teams with limited research funds are asked to contact Fitrockr for
    a custom quote.
  confidence: Verified
  sources:
  - url: https://www.fitrockr.com/help-center/pricing-plans-payment/
    type: vendor_docs
    quote: Please contact us in case of large user numbers, limited research funds or if you need a custom quote.
    retrieved: '2026-10-21'
  recheck_by: '2026-11-20'
- field: api_platform_fees
  status: stated
  value: 'Research & Clinical Trials plans per month: Basic from EUR 50 (USD 55), Pro from EUR 150 (USD 165), each with
    5 device licences; extra device licences EUR 1 to 7.5 (Basic) or EUR 1 to 15 (Pro) per month. Add-ons as a
    surcharge on the licence: API access +20%, accelerometer and gyroscope collection +25%, live streaming +20%,
    surveys +20%, all-day GPS +10%; on-premise hosting EUR 5,000 setup + 20%; Data Vault EUR 250 per month after the
    project; historic Garmin Connect import EUR 500 setup. Germany cloud hosting, support and admin accounts are
    included.'
  confidence: Verified
  sources:
