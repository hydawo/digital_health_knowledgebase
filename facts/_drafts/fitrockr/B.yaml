# ---------------- Data access and terms ----------------
- field: raw_streams
  status: stated
  value: 'Through the Fitrockr app (direct device sync, not Garmin Connect): raw and enhanced beat-to-beat intervals,
    accelerometer (25 Hz) and gyroscope (32 Hz) as a paid add-on, actigraphy, zero crossing, skin temperature, plus
    heart rate, stress, SpO2 and respiration at configurable epochs. Syncing through Garmin Connect gives less data.
    Garmin is the main source; Apple, Google, Withings, Oura, Polar, Samsung, Omron and Dexcom are also supported.'
  confidence: Verified
  sources:
  - url: https://www.fitrockr.com/help-center/data-dictionary/
    type: vendor_docs
    quote: Raw BBI timestamps will likely not maintain millisecond alignment with the BBI values over time
    retrieved: '2026-10-21'
  - url: https://www.fitrockr.com/pricing/
    type: vendor_page
    quote: Collection of Accelerometer (25Hz) & Gyroscope (32 Hz) data. +25% on license
    retrieved: '2026-10-21'
  - url: https://www.fitrockr.com/help-center/data-export/
    type: vendor_docs
    quote: Availability and granularity of health data depends on the wearable model and whether the wearable has been
      synchronised using the Fitrockr app or Garmin Connect. The latter supports less data.
    retrieved: '2026-10-21'
  recheck_by: '2026-11-20'
- field: derived_metrics
  status: stated
  value: Garmin-derived metrics (stress, Body Battery, sleep stages, intensity minutes, MET) passed through, plus
    Fitrockr-computed HRV indices (RMSSD, SDNN, pNN50, SD1/SD2, LF/HF) and reports (HRV, sleep, 6-minute walk test,
    Body Battery, heart rate, stress, vitality, performance).
  confidence: Verified
  sources:
  - url: https://www.fitrockr.com/research/
    type: vendor_page
    quote: HRV Report Sleep Report 6-Min Walk Test Body Battery Report Heart Rate Report Stress Report Vitality Report
      Performance Report
    retrieved: '2026-10-21'
  - url: https://www.fitrockr.com/help-center/data-dictionary/
    type: vendor_docs
    quote: LF/HF ratio, calculated by the Fitrockr platform
    retrieved: '2026-10-21'
  recheck_by: '2026-11-20'
- field: sampling_rates
  status: stated
  value: Accelerometer fixed at 25 Hz and gyroscope at 32 Hz on Garmin (not adjustable, recorded 24/7); BBI every beat;
    other streams configurable (Fitrockr lists 1 s, 60 s, 90 s and so on).
  confidence: Verified
  sources:
  - url: https://www.fitrockr.com/help-center/data-dictionary/
    type: vendor_docs
    quote: Resolution is fixed at 25Hz (i.e. 25 measurements per second).
    retrieved: '2026-10-21'
  - url: https://www.fitrockr.com/help-center/data-dictionary/
    type: vendor_docs
    quote: Resolution is fixed at 32Hz (i.e. 32 measurements per second).
    retrieved: '2026-10-21'
  - url: https://www.fitrockr.com/features/
    type: vendor_page
    quote: Flexibly adjust data samplings rates (32Hz, 25Hz, 1s, 60s, 90s, etc.).
    retrieved: '2026-10-21'
  recheck_by: '2026-11-20'
  note: The 2026-07-13 capture of the old pricing page gave per-stream ranges (Pro, heart rate 1 s to 60 min, SpO2 and
    respiration 10 s to 60 min, actigraphy 1 to 30 s; Basic, heart rate 1 min, SpO2 3 min). That table is no longer on
    the live page.
- field: history_depth
  status: stated
  value: For Garmin Connect-linked users, up to 2 years of history can be backfilled on request (EUR 500 setup). For
    direct Fitrockr app sync, history is limited to what is still on the watch; when storage is full, default data
    overwrites the oldest files and logging data (BBI, accelerometer) stops recording.
  confidence: Verified
  sources:
  - url: https://www.fitrockr.com/help-center/smartphone-sync-single-sync-with-garmin-connect-app/
    type: vendor_docs
    quote: With up to 2 years of historical health data can be potentially available depending on what the Garmin
      device can provide.
    retrieved: '2026-10-21'
  - url: https://www.fitrockr.com/pricing/
    type: vendor_page
    quote: Import of up to 2 years of historic data (Garmin Connect only). €500 setup
    retrieved: '2026-10-21'
  - url: https://www.fitrockr.com/help-center/what-happens-when-a-garmin-device-runs-full/
    type: vendor_docs
    quote: Default data will overwrite oldest data files if device runs out of space.
    retrieved: '2026-10-21'
  recheck_by: '2026-11-20'
- field: export_routes
  status: stated
  value: On-demand exports from the web console in XLS, CSV or JSON (accelerometer and gyroscope in CSV or JSON only);
    REST API for all synced data and a live-streaming API (add-ons); a full database dump in BSON on request for
    long-term storage.
  confidence: Verified
  sources:
  - url: https://www.fitrockr.com/research/
    type: vendor_page
    quote: Exports can be triggered on demand supporting multiple formats (XLS, CSV, JSON) and customizable data ranges.
    retrieved: '2026-10-21'
  - url: https://www.fitrockr.com/help-center/fitrockr-api/
    type: vendor_docs
    quote: Fitrockr REST-API can be used to import all synced data.
    retrieved: '2026-10-21'
  - url: https://www.fitrockr.com/help-center/long-term-data-storage/
    type: vendor_docs
    quote: Fitrockr can provide a full data base dump as BSON file format that can be stored by yourself.
    retrieved: '2026-10-21'
  recheck_by: '2026-11-20'
- field: rate_limits
  status: not_public
  confidence: Verified
  sources:
  - url: https://www.fitrockr.com/help-center/fitrockr-api/
    type: vendor_docs
    retrieved: '2026-10-21'
  - url: https://www.fitrockr.com/api-access/
    type: vendor_page
    retrieved: '2026-10-21'
  - url: https://www.fitrockr.com/health-solutions/terms-of-use/
    type: vendor_legal
    retrieved: '2026-10-21'
  recheck_by: '2026-11-20'
  note: The terms forbid automated access that "materially exceeds documented API or usage limits", so limits exist,
    but the API documentation is shared only on request to support@fitrockr.com.
- field: retention_terms
  status: stated
  value: Each research project runs in its own server instance, deleted with all data at the end of the study. Under
    the 2026-09-19 terms, Fitrockr deletes or returns customer data after a post-termination retrieval period (backups
    until overwritten, legal holds and anonymised data excepted); the customer must run its own exports. Post-project
    read-only storage is the paid Data Vault add-on, or a free BSON dump.
  confidence: Verified
  sources:
  - url: https://www.fitrockr.com/health-solutions/terms-of-use/
    type: vendor_legal
    quote: Unless otherwise required by law or agreed in writing, Fitrockr will delete or return Customer Data following
      the applicable post-termination retrieval period.
    retrieved: '2026-10-21'
  - url: https://www.fitrockr.com/help-center/privacy-security/
    type: vendor_docs
    quote: Each research project receives its own server instance which will be completely deleted including all data
      at the end of the study.
    retrieved: '2026-10-21'
  - url: https://www.fitrockr.com/data-vault/
    type: vendor_page
    quote: Secure, hosted storage of your collected data with read-only access after your main project phase.
    retrieved: '2026-10-21'
  - url: https://www.fitrockr.com/health-solutions/privacy-policy/
    type: vendor_legal
    quote: When personal data is no longer required, it is deleted, anonymized or otherwise securely disposed of in
      accordance with applicable requirements.
    retrieved: '2026-10-21'
  recheck_by: '2026-11-20'
  note: The previous terms (effective 2025-11-09) said "Provider irreversibly deletes all data at the end of Service".
- field: ai_training_terms
  status: stated
  value: Fitrockr will not use identifiable customer or participant health data to train general-purpose AI models
    unrelated to the customer's project, unless agreed in writing or otherwise lawfully authorised. It may use
    aggregated or irreversibly anonymised data for statistics, product development, and research and analytics.
  confidence: Verified
  sources:
  - url: https://www.fitrockr.com/health-solutions/terms-of-use/
    type: vendor_legal
    quote: Fitrockr will not use identifiable Customer Data or identifiable participant health data to train
      general-purpose AI models unrelated to the Customer’s Project.
    retrieved: '2026-10-21'
  - url: https://www.fitrockr.com/health-solutions/terms-of-use/
    type: vendor_legal
    quote: Fitrockr may create aggregated or irreversibly anonymized information derived from use of the Service
    retrieved: '2026-10-21'
  - url: https://www.fitrockr.com/health-solutions/privacy-policy/
    type: vendor_legal
    quote: we do not use identifiable health data belonging to customers or research participants to train
      general-purpose AI models for unrelated purposes.
    retrieved: '2026-10-21'
  recheck_by: '2026-11-20'
  note: The carve-outs are narrow in wording only. Training on identifiable data for project-related or "lawfully
    authorized" purposes, and on anonymised data generally, is not excluded.
- field: deprecations
  status: stated
  value: 'Fitrockr moved to a new Garmin sync technology by 7 September 2025; for projects syncing with the Fitrockr app,
    Garmin no longer provides sleep data on older models (vivosmart 4, vivofit 4, vivomove 3/Style/Sport, vivoactive
    4, Venu, Venu Sq, Lily, Instinct, Instinct Solar, Forerunner 245/45/55). Garmin Connect sync is unaffected. The
    2026-09-19 terms add that third-party integrations are not guaranteed to remain available.'
  confidence: Verified
  sources:
  - url: https://www.fitrockr.com/help-center/important-update-upcoming-transition-to-new-garmin-sync-technology/
    type: vendor_docs
    quote: Fitrockr will update to a new and improved Garmin sync technology within the next weeks (by Sep 7, 2025).
    retrieved: '2026-10-21'
  - url: https://www.fitrockr.com/help-center/important-update-upcoming-transition-to-new-garmin-sync-technology/
    type: vendor_docs
    quote: sleep data provision will no longer be supported by Garmin for the following device models
    retrieved: '2026-10-21'
  - url: https://www.fitrockr.com/health-solutions/terms-of-use/
    type: vendor_legal
    quote: Fitrockr will use reasonable efforts to maintain supported integrations but does not guarantee that a
      third-party integration will remain available indefinitely.
    retrieved: '2026-10-21'
  recheck_by: '2026-11-20'
# ---------------- Compliance ----------------
- field: baa
  status: stated
  value: Offered where Fitrockr handles protected health information for a HIPAA covered entity; the privacy policy says
    Fitrockr may then act as a Business Associate under a BAA. The BAA text is not published.
  confidence: Corroborated
  sources:
  - url: https://www.fitrockr.com/health-solutions/privacy-policy/
    type: vendor_legal
    quote: Fitrockr may act as a Business Associate and the applicable Business Associate Agreement governs the
      relevant processing.
    retrieved: '2026-10-21'
  recheck_by: '2027-01-19'
  note: New in the 2026-09-19 privacy policy; the earlier policy (last updated 2026-01-28) did not mention a BAA.
- field: dpa
  status: stated
  value: Yes, where required. Fitrockr acts as processor for customer projects, and a Data Processing Agreement under
    Article 28 GDPR takes precedence over the terms on data protection. The DPA text is not published.
  confidence: Corroborated
  sources:
  - url: https://www.fitrockr.com/health-solutions/terms-of-use/
    type: vendor_legal
    quote: Where Fitrockr processes personal data on behalf of the Customer, the parties will enter into a Data
      Processing Agreement where required.
    retrieved: '2026-10-21'
  recheck_by: '2027-01-19'
- field: hipaa_statement
  status: stated
  value: Fitrockr markets itself as "HIPAA certified" and says it complies with HIPAA (a 2023 news post says it
    "received the certification", with no certifying body named; HHS issues no HIPAA certification). The privacy
    policy adds that HIPAA applies only where Fitrockr handles PHI for a covered entity.
  confidence: Corroborated
  sources:
  - url: https://www.fitrockr.com/features/
    type: vendor_page
    quote: We are HIPAA certified
    retrieved: '2026-10-21'
  - url: https://www.fitrockr.com/help-center/privacy-security/
    type: vendor_docs
    quote: We comply to HIPAA
    retrieved: '2026-10-21'
  - url: https://www.fitrockr.com/fitrockr-received-hipaa-certification/
