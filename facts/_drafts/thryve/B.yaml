- field: raw_streams
  status: stated
  value: 'No sensor-level raw signals: Thryve passes on the processed values each source exposes, at the source''s
    finest granularity (epoch data up to second precision), without pre-aggregating. Granularity depends on the
    source, e.g. Fitbit epoch data mostly only during recorded activities and sleep unless the customer has Fitbit
    intraday access; Polar hourly. ThryveBLE adds direct Bluetooth devices including live heart rate.'
  confidence: Verified
  sources:
  - url: https://docs.thryve.health/thryve-product-overview/access/data-model
    type: vendor_docs
    quote: Thryve always stores data at the highest possible granularity and does not pre-aggregate epoch data.
    retrieved: '2026-10-11'
    fetch_url: https://docs.thryve.health/thryve-product-overview/access/data-model.md
  - url: https://docs.thryve.health/thryve-data-sources/fitbit
    type: vendor_docs
    quote: Almost all epoch data from Fitbit is only provided when users actively record activities or during sleep
      periods. Daily data is always available.
    retrieved: '2026-10-11'
    fetch_url: https://docs.thryve.health/thryve-data-sources/fitbit.md
  - url: https://www.thryve.health/wearable-api
    type: vendor_page
    quote: ThryveBLE is available as a native SDK module for iOS and Android.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: raw_streams
  status: stated
  value: 'Google Health data via the on-device bridge (Path B): Google Health writes into Apple Health (iOS 16.4+)
    or Health Connect (Android 9+) and Thryve reads it with its SDK. On Health Connect this includes heart rate,
    resting heart rate, HRV, skin temperature, respiratory rate and blood glucose, plus sleep stages, activity and
    nutrition.'
  confidence: Corroborated
  sources:
  - url: https://www.thryve.health/blog/fitbit-shutdown-september-2026-migration-options
    type: vendor_page
    quote: Google Health writes the user's data into the platform health store, and Thryve reads it from there via
      our SDK.
    retrieved: '2026-10-11'
  - url: https://www.thryve.health/blog/fitbit-shutdown-september-2026-migration-options
    type: vendor_page
    quote: Heart rate, Resting heart rate, Heart rate variability, Skin temperature, Respiratory rate, Blood glucose
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
  scope: Google Health (Fitbit successor)
  note: Data arrives tagged as Apple Health or Health Connect, not Google Health; the originating app is in a third-party
    source parameter.
