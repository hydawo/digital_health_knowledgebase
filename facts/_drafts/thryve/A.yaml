- field: raw_streams
  status: stated
  value: 'No raw sensor signals (accelerometer, PPG): Thryve passes on the manufacturer-processed values each source
    exposes, unaggregated, as epoch data via REST API. Through the Apple Health SDK module it also reads heartbeat
    series and ECG.'
  confidence: Verified
  sources:
  - url: https://docs.thryve.health/thryve-product-overview/access/data-model
    type: vendor_docs
    quote: Sensors in wearables typically record data at high sampling rates (50Hz and higher), which manufacturers
      transform into digestible values.
    retrieved: '2026-10-11'
  - url: https://docs.thryve.health/thryve-product-overview/access/data-model
    type: vendor_docs
    quote: Thryve always stores data at the highest possible granularity and does not pre-aggregate epoch data.
    retrieved: '2026-10-11'
  - url: https://docs.thryve.health/thryve-data-sources/apple-health
    type: vendor_docs
    quote: The ThryveAppleHealth module supports over 90 HealthKit data types, including quantity types (e.g. steps,
      heart rate, body mass), category types (e.g. sleep analysis, mindful sessions), workouts, heartbeat series,
      ECG and characteristics
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
