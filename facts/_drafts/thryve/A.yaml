- field: sampling_rates
  status: stated
  value: 'Set by each source: epoch data at seconds precision, but for example Withings steps in up to 10-minute
    chunks, Polar hourly, Fitbit intraday only for sleep and workouts without Fitbit intraday access. Retrieval
    latency: ping sources near real time, bulk sources every 15 minutes at most.'
  confidence: Verified
  sources:
  - url: https://docs.thryve.health/thryve-product-overview/access/data-model
    type: vendor_docs
    quote: All timestamps maintain seconds-level precision
    retrieved: '2026-10-11'
