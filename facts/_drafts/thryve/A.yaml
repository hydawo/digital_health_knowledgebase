- field: history_depth
  status: stated
  value: Default 14 days of data from before user creation; Start Up and Scale Up up to 14 days, Enterprise flexible.
    Polar has no historic retrieval; Health Connect beyond 30 days needs an extra user permission; Google Health
    lookback undefined. Per call the API returns at most 30 days of epoch or 364 days of daily data.
  confidence: Verified
  sources:
  - url: https://docs.thryve.health/thryve-product-overview/control
    type: vendor_docs
    quote: By default, we allow for the retrieval of 14 days of historic data. When set to 0, only data from the
      user creation date onwards will be stored.
    retrieved: '2026-10-11'
