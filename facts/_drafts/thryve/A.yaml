- field: retention_terms
  status: stated
  value: 'Thryve stores data only for the plan''s storage window: 1 day (trial), 2 weeks (Start Up), 1 month (Scale
    Up), flexible (Enterprise). Users and their data can be deleted by API (asynchronous, from midnight UTC after
    the deletion date). Stored data types are configurable.'
  confidence: Verified
  sources:
  - url: https://www.thryve.health/pricing
    type: vendor_page
    quote: Data storage options 1 Day 2 Weeks 1 Month Flexible
    retrieved: '2026-10-11'
  - url: https://www.thryve.health/free-trial
    type: vendor_page
    quote: Data storage 1 Day
    retrieved: '2026-10-11'
  - url: https://docs.thryve.health/further-resources/v5-api-reference/delete-end-user
    type: vendor_docs
    quote: Users are deleted asynchronously starting at midnight (UTC) following the specified deletion date. Data
      remains accessible via API until deletion is executed.
    retrieved: '2026-10-11'
  - url: https://docs.thryve.health/thryve-product-overview/control
    type: vendor_docs
    quote: you can granularly define the data types we will store for your end users by data type
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
  note: For studies this means data must be pulled continuously into your own store; Thryve is not a long-term archive
    below Enterprise.
