# ---------------- Research access ----------------
- field: research_program
  status: stated
  value: 'Polar Research Center collaboration: research units submit a proposal to research@polar.com for a joint
    study with Polar Electro Oy, and may request Polar support in technology, money or other forms. Separately, Polar
    markets the H10, Verity Sense, AccessLink API and Team Pro as research tools, but this is product information,
    not a program with its own terms.'
  confidence: Verified
  sources:
  - url: https://www.polar.com/en/science/collaborate-with-us
    type: vendor_page
    quote: These guidelines apply to the scientific studies done in collaboration with Polar Electro Oy.
    retrieved: '2026-10-11'
  - url: https://www.polar.com/en/science/collaborate-with-us
    type: vendor_page
    quote: budget and proposal for Polar support (technology, money, other)
    retrieved: '2026-10-11'
  - url: https://www.polar.com/en/science/research-tools
    type: vendor_page
    quote: Find out how Polar technology and services can be used for research and science.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: program_eligibility
  status: stated
  value: No formal eligibility criteria. The proposal is expected from a research unit (institute, university,
    department or similar), and proposals are rated by value to Polar, so studies outside Polar's interests are
    rejected or wait-listed.
  confidence: Verified
  sources:
  - url: https://www.polar.com/en/science/collaborate-with-us
    type: vendor_page
    quote: Presentation of the research unit (institute, university, department etc.)
    retrieved: '2026-10-11'
  - url: https://www.polar.com/en/science/collaborate-with-us
    type: vendor_page
    quote: Not interesting and not in relation to Company actions to be rejected
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: program_application
  status: stated
  value: 'Email a proposal (research unit, lead researcher CV, research plan of at most 10 pages) to research@polar.com.
    Polar replies within two weeks; an accepted study gets a signed research agreement, and the research partner
    handles ethical approvals.'
  confidence: Verified
  sources:
  - url: https://www.polar.com/en/science/collaborate-with-us
    type: vendor_page
    quote: Proposals are evaluated and response given to applicant within two weeks.
    retrieved: '2026-10-11'
  - url: https://www.polar.com/en/science/collaborate-with-us
    type: vendor_page
    quote: After study proposal and a study plan are accepted a research agreement is signed.
    retrieved: '2026-10-11'
  - url: https://www.polar.com/en/science/collaborate-with-us
    type: vendor_page
    quote: Research partner takes care of ethical approvals needed.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: program_status
  status: stated
  value: Active; the collaboration page invites proposals and gives a submission address.
  confidence: Corroborated
  sources:
  - url: https://www.polar.com/en/science/collaborate-with-us
    type: vendor_page
    quote: At Polar Research Center, we are always open to suggestions for new collaboration opportunities.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
  note: Status inferred from a live invitation page; no dated program announcement found.
- field: developer_program_status
  status: stated
  value: Open. Any Polar Flow user can self-register an AccessLink API client at admin.polaraccesslink.com after
    accepting the API Limited License Agreement; no review step is documented. The BLE SDK is public on GitHub
    (latest release 8.4.0, 2026-10-01). EU Digital Markets Act gatekeepers are excluded.
  confidence: Verified
  sources:
  - url: https://www.polar.com/accesslink-api/
    type: vendor_docs
    quote: Any registered Polar Flow user can create API client to AccessLink by filling application details at
    retrieved: '2026-10-11'
  - url: https://www.polar.com/en/legal/polar-api-agreement
    type: vendor_legal
    quote: Gatekeepers shall not be eligible to enter into this Agreement.
    retrieved: '2026-10-11'
  - url: https://github.com/polarofficial/polar-ble-sdk
    type: repository
    quote: Build apps that connect via Bluetooth LE and stream real-time heart rate, ECG, accelerometer, PPG, and more
      from Polar devices.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: user_cap
  status: not_public
  confidence: Verified
  sources:
  - url: https://www.polar.com/accesslink-api/
    type: vendor_docs
    retrieved: '2026-10-11'
  - url: https://www.polar.com/en/legal/polar-api-agreement
    type: vendor_legal
    retrieved: '2026-10-11'
  - url: https://github.com/polarofficial/polar-ble-sdk
    type: repository
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
  note: No participant or user cap is published for AccessLink or the SDK. AccessLink rate limits grow with the number
    of registered users (see rate_limits) rather than capping them.
- field: academic_vs_commercial
  status: stated
  value: No separate academic tier. AccessLink and the BLE SDK are offered free under the same licence to everyone,
    and the SDK licence explicitly permits private and commercial use. The research collaboration route is a separate,
    proposal-based partnership, and B2B partnerships go through a contact form.
  confidence: Corroborated
  sources:
  - url: https://github.com/polarofficial/polar-ble-sdk/blob/master/Polar_SDK_License.txt
    fetch_url: https://raw.githubusercontent.com/polarofficial/polar-ble-sdk/master/Polar_SDK_License.txt
    type: vendor_legal
    quote: You are allowed to use the SDK for the development of software for your private as well as for commercial
      use for as long as you use the SDK in compliance with the license terms.
    retrieved: '2026-10-11'
  - url: https://www.polar.com/en/legal/polar-api-agreement
    type: vendor_legal
    quote: At the moment Polar offers the use and activation of Polar API’s free of charge.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
  note: '"No separate academic tier" is an inference from the absence of any academic terms on the API, SDK and
    science pages.'
