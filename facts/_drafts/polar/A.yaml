- field: derived_metrics
  status: stated
  value: 'AccessLink: daily activity (steps, calories, activity zones), sleep and Sleep Plus Stages, Nightly Recharge
    (overnight HRV as RMSSD, breathing rate, ANS charge), Cardio Load (TRIMP-based strain, tolerance), SleepWise
    alertness and circadian bedtime, Training Load Pro, body and sleep skin temperature. SDK on Loop/360: steps,
    active time, calories, MET samples, Nightly Recharge, sleep.'
  confidence: Verified
  sources:
  - url: https://www.polar.com/accesslink-api/
    type: vendor_docs
    quote: The Heart rate variability is Root Mean Square of Successive Differences (RMSSD) in beat-to-beat intervals.
    retrieved: '2026-10-11'
  - url: https://www.polar.com/accesslink-api/
    type: vendor_docs
    quote: Cardio load is based on training impulse calculation (TRIMP), a commonly accepted and scientifically proven
      method to quantify training load.
    retrieved: '2026-10-11'
  - url: https://github.com/polarofficial/polar-ble-sdk/blob/master/documentation/products/Polar360.md
    fetch_url: https://raw.githubusercontent.com/polarofficial/polar-ble-sdk/master/documentation/products/Polar360.md
