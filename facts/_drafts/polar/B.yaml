    quote: In order to get RR interval samples, training needs to be performed with Polar H6, H7, H9 or H10 heart rate sensors.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: derived_metrics
  status: stated
  value: 'AccessLink: exercises (with optional samples, zones, Training Load Pro), daily activity, 5-minute continuous
    heart rate, sleep with Sleep Plus Stages and sleep score, Nightly Recharge (HRV, breathing rate, ANS charge),
    Cardio Load, SleepWise alertness and circadian bedtime, and Elixir biosensing (body and skin temperature, wrist
    ECG test results, SpO2 test results).'
  confidence: Verified
  sources:
  - url: https://www.polar.com/accesslink-api/
    type: vendor_docs
    quote: Elixir™ Biosensing data consists of body temperature data, sleep skin temperature data, skin contacts data, wrist ECG test report data and SpO2 test report data.
    retrieved: '2026-10-11'
  - url: https://www.polar.com/accesslink-api/
    type: vendor_docs
    quote: SleepWise&trade data consists of alertness periods and circadian bedtime periods.
    retrieved: '2026-10-11'
  - url: https://www.polar.com/en/business/developers
    type: vendor_page
    quote: Polar API provides data from Polar consumer devices to compile a rich data-set, such as sleep, HRV, 24/7 heart rate, training data, daily activity, and basic user information.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: sampling_rates
  status: stated
  value: 'SDK: H10 ECG 130 Hz, heart rate and RR at 1 Hz, acceleration 25 to 200 Hz; Verity Sense PPG 55 Hz by default
    (28 to 176 Hz in SDK mode), acceleration and gyroscope 52 Hz by default; Polar 360 and Loop PPG 22 Hz and
    acceleration 50 Hz. AccessLink: continuous heart rate in 5-minute samples; sleep heart rate as 5-minute averages.'
  confidence: Verified
  sources:
  - url: https://github.com/polarofficial/polar-ble-sdk/blob/master/documentation/products/PolarH10.md
    type: vendor_docs
    quote: Accelerometer data with sample rates of 25Hz, 50Hz, 100Hz and 200Hz and range of 2G, 4G and 8G.
