# ---------------- Research access ----------------
- field: research_program
  status: stated
  value: 'Research collaboration with the in-house Polar Research Center: researchers submit a co-operation proposal
    for a study done with Polar Electro Oy and may ask for Polar support (technology, money, other). Polar also markets
    the H10, Verity Sense, the API and SDK, and Team Pro as research tools, which researchers buy and use on standard
    terms; there is no separate research data platform.'
  confidence: Verified
  sources:
  - url: https://www.polar.com/en/science/collaborate-with-us
    type: vendor_page
    quote: These guidelines apply to the scientific studies done in collaboration with Polar Electro Oy.
    retrieved: '2026-10-11'
  - url: https://www.polar.com/en/science/collaborate-with-us
    type: vendor_page
    quote: budget and proposal for Polar support (technology, money, other)
    retrieved: '2026-10-11'
  - url: https://www.polar.com/en/business/science
    type: vendor_page
    quote: The Polar Research Center consists of our in-house team of experts from technology, physiology and data science.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
  note: In Polar-run research collaborations, the privacy notice says no customer data goes to the outside partner; all
    data is processed within Polar by a Polar research team.
- field: program_eligibility
  status: stated
  value: Not restricted by a published rule; proposals come from a research unit (institute, university, department)
    with a responsible researcher, and are judged partly on their value to Polar.
  confidence: Corroborated
  sources:
  - url: https://www.polar.com/en/science/collaborate-with-us
    type: vendor_page
    quote: Presentation of the research unit (institute, university, department etc.)
    retrieved: '2026-10-11'
  - url: https://www.polar.com/en/science/collaborate-with-us
    type: vendor_page
    quote: significance and originality value for the company
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: program_application
  status: stated
  value: Email a research co-operation application (research unit description, researcher CV and publications, a
    research plan of at most 10 pages including budget and benefits to Polar). Polar evaluates it against published
    criteria and replies within two weeks; NDAs are used if needed. API access needs no approval; any Polar Flow user
    creates a client at admin.polaraccesslink.com and accepts the licence agreement.
  confidence: Verified
  sources:
  - url: https://www.polar.com/en/science/collaborate-with-us
    type: vendor_page
    quote: Proposals are evaluated and response given to applicant within two weeks. NDA procedures are used if needed.
    retrieved: '2026-10-11'
  - url: https://www.polar.com/en/science/collaborate-with-us
    type: vendor_page
    quote: Research plan (max 10 pages)
    retrieved: '2026-10-11'
  - url: https://www.polar.com/accesslink-api/
    type: vendor_docs
    quote: Any registered Polar Flow user can create API client to AccessLink by filling application details at https://admin.polaraccesslink.com
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: program_status
  status: stated
  value: Active as of 2026-10-11; the collaboration page invites proposals. No pause or closure announced.
  confidence: Corroborated
  sources:
  - url: https://www.polar.com/en/science/collaborate-with-us
    type: vendor_page
    quote: Submit your research proposal and we’ll be in touch.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: developer_program_status
  status: stated
  value: Open. AccessLink (cloud API) is self-service for any Polar Flow account holder; the BLE SDK is public on
    GitHub (release 8.4.0, 2026-10-01); the Team Pro API uses the same admin portal.
  confidence: Verified
  sources:
  - url: https://www.polar.com/accesslink-api/
    type: vendor_docs
    quote: Go to https://admin.polaraccesslink.com and log in using your Polar Flow credentials Fill your application/service information and create client
    retrieved: '2026-10-11'
  - url: https://github.com/polarofficial/polar-ble-sdk
    type: repository
    quote: Build apps that connect via Bluetooth LE and stream real-time heart rate, ECG, accelerometer, PPG, and more from Polar devices.
    fetch_url: https://raw.githubusercontent.com/polarofficial/polar-ble-sdk/master/README.md
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: user_cap
  status: not_public
  value: No participant or user cap is published for AccessLink or the SDK. AccessLink rate limits scale with the
    number of registered users (see rate_limits).
  confidence: Corroborated
  sources:
  - url: https://www.polar.com/accesslink-api/
    type: vendor_docs
    retrieved: '2026-10-11'
  - url: https://www.polar.com/en/legal/polar-api-agreement
    type: vendor_legal
    retrieved: '2026-10-11'
  - url: https://github.com/polarofficial/polar-ble-sdk
    type: repository
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: academic_vs_commercial
  status: stated
  value: No separate academic tier. The API and SDK are free on the same terms for everyone, and the SDK licence
    allows commercial use. The only research-specific route is the collaboration proposal, which is Polar's choice to
    support.
  confidence: Corroborated
  sources:
  - url: https://github.com/polarofficial/polar-ble-sdk/blob/master/Polar_SDK_License.txt
    type: vendor_legal
    quote: You are allowed to use the SDK for the development of software for your private as well as for commercial use for as long as you use the SDK in compliance with the license terms.
    fetch_url: https://raw.githubusercontent.com/polarofficial/polar-ble-sdk/master/Polar_SDK_License.txt
    retrieved: '2026-10-11'
  - url: https://www.polar.com/en/legal/polar-api-agreement
    type: vendor_legal
    quote: At the moment Polar offers the use and activation of Polar API’s free of charge.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
  note: The absence of an academic tier is inferred from the published terms and pages, not stated by Polar.
