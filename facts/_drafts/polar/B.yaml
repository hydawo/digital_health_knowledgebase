# ---------------- Data access and terms ----------------
- field: raw_streams
  status: stated
  value: 'Through the BLE SDK (live streaming, offline recording on some devices): H10 gives ECG, RR intervals and
    3-axis acceleration; Verity Sense gives PPG, PP intervals, acceleration, gyroscope and magnetometer; Polar 360 and
    Loop give PPG, PP intervals, acceleration and skin temperature.'
  confidence: Verified
  scope: BLE SDK
  sources:
  - url: https://github.com/polarofficial/polar-ble-sdk/blob/master/documentation/products/PolarH10.md
    type: vendor_docs
    quote: Electrocardiography (ECG) data in µV with sample rate 130Hz.
    fetch_url: https://raw.githubusercontent.com/polarofficial/polar-ble-sdk/master/documentation/products/PolarH10.md
    retrieved: '2026-10-11'
  - url: https://github.com/polarofficial/polar-ble-sdk/blob/master/documentation/products/PolarVeritySense.md
    type: vendor_docs
    quote: Photoplethysmograpy (PPG) values.
    fetch_url: https://raw.githubusercontent.com/polarofficial/polar-ble-sdk/master/documentation/products/PolarVeritySense.md
    retrieved: '2026-10-11'
  - url: https://github.com/polarofficial/polar-ble-sdk/blob/master/documentation/products/Polar360.md
    type: vendor_docs
    quote: 'Photoplethysmograpy (PPG): 22Hz, 24bit resolution, Green channels'
    fetch_url: https://raw.githubusercontent.com/polarofficial/polar-ble-sdk/master/documentation/products/Polar360.md
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: raw_streams
  status: stated
  value: AccessLink gives no raw optical or ECG signal. Exercise samples include RR intervals when the session was
    recorded with an H6, H7, H9 or H10 chest strap.
  confidence: Verified
