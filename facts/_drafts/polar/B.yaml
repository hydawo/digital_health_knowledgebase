- field: history_depth
  status: stated
  value: 'AccessLink returns only data uploaded after the user registered with the client. Exercises: last 30 days.
    Daily activity: up to 365 days back, 28 days per request. Sleep, Nightly Recharge, Cardio Load, SleepWise and
    biosensing: last 28 days by default. Older data needs the participant''s own export from account.polar.com.'
  confidence: Verified
  sources:
  - url: https://www.polar.com/accesslink-api/
    type: vendor_docs
    quote: Only exercises that have been uploaded to Flow after the user is registered with your client will be returned.
    retrieved: '2026-10-11'
  - url: https://www.polar.com/accesslink-api/
    type: vendor_docs
    quote: From date cannot be older than 365 days from today and the maximum range between from and to is 28 days.
    retrieved: '2026-10-11'
  - url: https://www.polar.com/accesslink-api/
    type: vendor_docs
    quote: List sleep data of user for the last 28 days.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
