facts:
- field: research_program
  status: stated
  value: No named research program. Google Health links a "Research Application" (Google Form) from its published-studies
    page, and health research through the Google Health API runs under the Google Health API User Data and Health Research
    Policy, where Fitbit-approved apps are labelled Health Research Applications or Web Services.
  confidence: Verified
  sources:
  - url: https://healthapp.google/published-studies
    type: vendor_page
    retrieved: '2026-10-10'
    quote: Want to run a research study with our devices and platform? Research Application
  - url: https://developers.google.com/health/policies/health-api-user-data-and-research-policy
    type: vendor_legal
    retrieved: '2026-10-10'
    quote: Fitbit approved applications and web services using the Google Health API for health research will be labeled
      Health Research Applications or Health Research Web Services
  recheck_by: '2026-11-09'
  note: The Research Application link (forms.gle/p3QFvjV9G1yq42jAA) requires a Google sign-in, so its questions were not
    read.
- field: program_eligibility
  status: stated
  value: Human subjects research only if submitted to, reviewed or approved by an independent review board (IRB, EC or
    equivalent); participant eligibility must be confirmed before consent
  confidence: Verified
  sources:
  - url: https://developers.google.com/health/policies/health-api-user-data-and-research-policy
    type: vendor_legal
    retrieved: '2026-10-10'
    quote: The Google Health API may only be used for human subjects research, referred to as health research in this policy,
      if the research is submitted for review, reviewed or approved by an independent board
  recheck_by: '2026-11-09'
- field: program_application
  status: stated
  value: 'Health Research Attestation: intake form, IRB/EC approval or waiver letter, IRB/EC accreditation, and the exact
    data requested with rationale. Separately, every restricted-scope app needs OAuth app verification and an annual CASA
    security assessment.'
  confidence: Verified
  sources:
  - url: https://developers.google.com/health/policies/health-api-user-data-and-research-policy
    type: vendor_legal
    retrieved: '2026-10-10'
    quote: 'Health Research Applications and Web Services must submit: A completed intake form IRB/EC (or substantially
      similar equivalent) Approval/Waiver Letter IRB/EC (or substantially similar equivalent) Accreditation Exact data requested
      and rationale for use'
  - url: https://developers.google.com/health/app-verification
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: 'The verification process has two parts: OAuth app verification'
  recheck_by: '2026-11-09'
- field: program_status
  status: stated
  value: The former Fitbit researchers pages (fitbit.google/enterprise/researchers, enterprise.fitbit.com/researchers,
    healthsolutions.fitbit.com/researchers) now redirect to the Google Health Enterprise page, which has no researcher
    section. Google Health Enterprise is the renamed Fitbit Enterprise. A research application form is still linked.
  confidence: Corroborated
  sources:
  - url: https://healthapp.google/enterprise-solutions/
    type: vendor_page
    retrieved: '2026-10-10'
    quote: Google Health Enterprise, formerly Fitbit Enterprise, is a digital health solution that helps organizations improve
      health outcomes at scale.
  - url: https://healthapp.google/published-studies
    type: vendor_page
    retrieved: '2026-10-10'
    quote: Want to run a research study with our devices and platform? Research Application
  recheck_by: '2026-11-09'
  note: Redirects observed 2026-10-10 with curl; the redirect itself is not quotable, hence Corroborated.
- field: developer_program_status
  status: stated
  value: Google Health API is not onboarding new projects; legacy Fitbit Web API support ended 2026-09-30 and it turns
    off 2026-10-30
  confidence: Verified
  sources:
  - url: https://developers.google.com/health
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: While we are not onboarding new projects at this time, we are actively working to open access to more developers
      and will share updates here as availability expands.
  recheck_by: '2026-11-09'
  note: The banner sits on every Google Health API page. Integrators (Validic, Fitabase) report migrating existing apps,
    so existing Fitbit Web API developers appear to be the ones being onboarded.
- field: user_cap
  status: stated
  value: Unverified apps are limited to 100 users; OAuth verification plus a CASA assessment lifts the cap. Per-user rate
    limit 300 requests per minute.
  confidence: Verified
  sources:
  - url: https://developers.google.com/health/app-verification
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: If your app isn't verified, it's limited to 100 users. To support more users, you must complete the verification
      process.
  - url: https://trust.validic.com/incidents/8lzmtg20hp90
    type: secondary
    retrieved: '2026-10-10'
    quote: until the CASA assessment is completed, Google will only allow 100 connected users to the Google Health API credentials
  recheck_by: '2026-11-09'
- field: academic_vs_commercial
  status: stated
  scope: Legacy Fitbit Web API intraday access
