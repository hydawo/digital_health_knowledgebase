- field: raw_streams
  status: stated
  value: No raw sensor signals (PPG, accelerometer, EDA waveforms) are listed among Google Health API data types; the finest
    stream is heart-rate samples. Devices sync only with the Google Health app, and third parties read data from the cloud
    API after sync.
  confidence: Verified
  sources:
  - url: https://developers.google.com/health/data-types
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: Fitbit devices can't communicate directly with third-party applications or services.
  - url: https://developers.google.com/health/data-types
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: 'Heart Rate dataType: heart-rate filter parameter: heart_rate Record type: Sample Storage resolution: 1 second'
  recheck_by: '2026-11-09'
  note: Absence of raw signals is read from the full data-types table, not from an explicit statement.
- field: derived_metrics
  status: stated
  value: Steps, distance, floors, altitude, active minutes, Active Zone Minutes, activity level, sedentary periods, calories,
    exercise sessions, sleep sessions, daily and intraday HRV, resting heart rate, heart rate zones, SpO2 (daily and minute),
    respiratory rate, sleep temperature derivations, VO2 max, ECG and Irregular Rhythm Notification records, weight, body
    fat, nutrition and hydration logs
  confidence: Verified
  sources:
  - url: https://developers.google.com/health/about
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: We have consolidated over 100 legacy endpoints down to a streamlined set of simplified data type bundles
