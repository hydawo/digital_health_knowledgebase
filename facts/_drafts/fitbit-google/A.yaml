- field: user_cap
  status: stated
  value: Unverified apps are limited to 100 users; OAuth verification plus a CASA security assessment removes the cap.
  confidence: Verified
  sources:
  - url: https://developers.google.com/health/app-verification
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: If your app isn't verified, it's limited to 100 users.
  - url: https://developers.google.com/health/rate-limits
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: 'Unverified applications : Max 250 QPS total (capped at 100 users @ 2.5 QPS per user)'
  recheck_by: '2026-11-09'
  scope: Google Health API
- field: academic_vs_commercial
  status: stated
  value: 'Google Health API: no academic tier or price difference is documented; research use is gated by the Health Research
    Policy rather than by organization type. Legacy Fitbit Web API: intraday access for third parties was case-by-case, with
    non-profit research favored and commercial apps given thorough review.'
  confidence: Verified
  sources:
  - url: https://developers.google.com/health/policies/health-api-developer-user-data-policy
    type: vendor_legal
    retrieved: '2026-10-10'
    quote: Do not use the Google Health API or Developer Tools for applications, services, or features designed to collect
      or combine user data for human subjects research, medical research, or any other similar research overseen by an Institutional
      Research Board or Ethics Commission unless you agree to abide by the Google Health API User Data and Health Research
      Policy in conducting such research.
  - url: https://dev.fitbit.com/build/reference/web-api/intraday/
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: Fitbit is very supportive of non-profit research and personal projects. Commercial applications require thorough
      review and are subject to additional requirements.
  recheck_by: '2026-11-09'
  note: In the Google Health API intraday data is available by default through the list endpoint, so the legacy intraday approval
    step no longer applies.
