    type: vendor_docs
    retrieved: '2026-10-10'
    quote: Single-lead ECG session results, containing a classification ( SINUS_RHYTHM , ATRIAL_FIBRILLATION , INCONCLUSIVE
      ), average heart rate, sampling frequency, and raw waveform voltage samples.
  - url: https://developers.google.com/health/scopes
    type: vendor_docs
    retrieved: '2026-10-10'
