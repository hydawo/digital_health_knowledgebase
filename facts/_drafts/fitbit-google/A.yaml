facts:
- field: research_program
  status: stated
  value: 'No standalone research program page. Health research runs through the Google Health API User Data and Health Research
    Policy: approved apps are designated Health Research Applications or Web Services. Organizational deployments are sold
    as Google Health Enterprise (formerly Fitbit Enterprise); the old Fitbit Health Solutions research page now redirects
    there.'
  confidence: Verified
  sources:
  - url: https://developers.google.com/health/policies/health-api-user-data-and-research-policy
    type: vendor_legal
    retrieved: '2026-10-10'
    quote: Fitbit approved applications and web services using the Google Health API for health research will be labeled Health
      Research Applications or Health Research Web Services
  - url: https://healthapp.google/enterprise-solutions/
    type: vendor_page
    retrieved: '2026-10-10'
    quote: Google Health Enterprise, formerly Fitbit Enterprise, is a digital health solution that helps organizations improve
      health outcomes at scale.
  recheck_by: '2026-11-09'
  note: healthsolutions.fitbit.com/research/ 301-redirects via enterprise.fitbit.com to healthapp.google/enterprise-solutions/
    (checked 2026-10-10). Google Cloud also markets Device Connect for Fitbit for clinical and population-health integrations
    (contact sales).
- field: program_eligibility
  status: stated
  value: Any developer whose human subjects research is submitted to or approved by an independent review board (IRB, EC or
    equivalent); the developer must also meet the general approved use cases and confirm each participant is eligible before
    consent.
  confidence: Verified
  sources:
  - url: https://developers.google.com/health/policies/health-api-user-data-and-research-policy
    type: vendor_legal
    retrieved: '2026-10-10'
    quote: The Google Health API may only be used for human subjects research, referred to as health research in this policy,
      if the research is submitted for review, reviewed or approved by an independent board
  - url: https://developers.google.com/health/policies/health-api-user-data-and-research-policy
    type: vendor_legal
    retrieved: '2026-10-10'
    quote: Health Research Applications and Web Services must confirm the eligibility of a participant before obtaining informed
      consent and requesting permission to access participant
  recheck_by: '2026-11-09'
- field: program_application
  status: stated
  value: Submit an intake form, IRB/EC approval or waiver letter, IRB/EC accreditation, and the exact data requested with
    rationale. Under the legacy Fitbit Web API the app was registered with category "Health Research" and Fitbit's clinical
    research team reviewed the intake form, usually within 7 business days.
  confidence: Verified
  sources:
  - url: https://developers.google.com/health/policies/health-api-user-data-and-research-policy
    type: vendor_legal
    retrieved: '2026-10-10'
    quote: 'Health Research Applications and Web Services must submit: A completed intake form IRB/EC (or substantially similar
      equivalent) Approval/Waiver Letter IRB/EC (or substantially similar equivalent) Accreditation Exact data requested and
      rationale for use'
  - url: https://dev.fitbit.com/legal/health-research-policy-faq/
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: clinical research team will review your submission and contact you, usually within 7 business days
  recheck_by: '2026-11-09'
  note: Google Health API research apps also need Restricted-scope OAuth verification and a CASA security assessment (see
    user_cap and api_platform_fees).
- field: program_status
  status: stated
  value: The research policy is in force for the Google Health API (effective March 24, 2026), but Google says it is not onboarding
    new Google Health API projects, and the legacy Fitbit Web API route turns off on October 30, 2026. In practice no open
    intake route for new studies is documented as of 2026-10-10.
  confidence: Verified
  sources:
  - url: https://developers.google.com/health/policies/health-api-user-data-and-research-policy
    type: vendor_legal
    retrieved: '2026-10-10'
    quote: Effective as of March 24, 2026
  - url: https://developers.google.com/health/about
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: While we are not onboarding new projects at this time, we are actively working to open access to more developers
      and will share updates here as availability expands.
  recheck_by: '2026-11-09'
- field: developer_program_status
  status: stated
  value: 'Closed to new projects: Google is not onboarding new Google Health API projects.'
  confidence: Verified
  sources:
