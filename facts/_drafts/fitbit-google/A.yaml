- field: raw_streams
  status: stated
  value: No raw PPG, accelerometer or other raw sensor streams are documented for either API. The closest raw signal is single-lead
    ECG waveform samples (ecg.readonly scope). Heart rate is stored at 1-second resolution; exercise GPS is available as TCX.
  confidence: Corroborated
  sources:
