- field: raw_streams
  status: stated
  value: Raw phone sensors (accelerometer, gyroscope, magnetometer, light, pressure, proximity, GPS, Wi-Fi, Bluetooth
    and beacons, battery, screen state, app usage, keyboard events) via the Avicenna app; raw watch data (25 Hz
    accelerometer, 32 Hz gyroscope, beat-to-beat intervals and more) via the Garmin Health SDK; Apple SensorKit
    (needs a custom app and a per-study Apple entitlement); cloud data from Fitbit, Garmin Health API, Oura, WHOOP,
    Polar, HealthKit, Hexoskin and Mira. All exported from the researcher dashboard.
  confidence: Verified
  sources:
  - url: https://avicennaresearch.com/features/sensor-based-data
    type: vendor_page
    quote: You can access the raw or processed data in real-time
    retrieved: '2026-10-11'
  - url: https://forum.avicennaresearch.com/t/garmin-health-sdk/1261
    type: vendor_docs
    quote: Records 25Hz accelerometer data from all three axes in milli-Gs.
    retrieved: '2026-10-11'
  - url: https://forum.avicennaresearch.com/t/sensorkit/1290
    type: vendor_docs
    quote: Access to SensorKit data is limited to research uses and requires a private entitlement, which Apple
      reviews separately for each study.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
  note: Full list of data source IDs is on the Raw Data page (RAW). iOS and Android coverage differ by sensor.
- field: derived_metrics
  status: stated
  value: OS-level processed data such as step count and activity type, plus vendor-computed wearable metrics (sleep,
    readiness, stress, SpO2, HRV and others from Fitbit, Garmin, Oura, WHOOP, Polar). Kibana and Vega charts in
    the dashboard. Avicenna says it does no further processing of study data, so no platform-native mobility or
    behavioural features are documented.
  confidence: Corroborated
  sources:
  - url: https://avicennaresearch.com/features/sensor-based-data
    type: vendor_page
    quote: from raw motion sensors like accelerometer, to processed data such as step count and activity type
    retrieved: '2026-10-11'
  - url: https://forum.avicennaresearch.com/t/security-and-compliance/1267
    type: vendor_docs
    quote: Avicenna does not perform any processing on the data collected for a given study.
    retrieved: '2026-10-11'
  - url: https://avicennaresearch.com/features/data-access-and-analytics
    type: vendor_page
    quote: integration with Kibana and VEGA visualization grammar
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: sampling_rates
  status: stated
  value: Phone sensors are polled once per data collection cycle, every 5 minutes by default and configurable (iOS
    honours the interval, Android may not). GPS cycles last 60 seconds each; continuous GPS gives about 1 s updates.
    Garmin Health SDK accelerometer 25 Hz fixed, gyroscope 32 Hz. SensorKit motion data downsampled to 32 Hz from
    100 Hz. Cloud wearable data is fetched at the end of every day.
  confidence: Verified
  sources:
  - url: https://forum.avicennaresearch.com/t/data-sources/1266
    type: vendor_docs
    quote: which is every 5 minutes by default
    retrieved: '2026-10-11'
  - url: https://forum.avicennaresearch.com/t/data-sources/1266
    type: vendor_docs
    quote: Avicenna fetches this data at the end of every day.
    retrieved: '2026-10-11'
  - url: https://forum.avicennaresearch.com/t/location/1255
    type: vendor_docs
    quote: Each collection cycle stays active for 60 seconds, and every reading received during that cycle is saved.
    retrieved: '2026-10-11'
  - url: https://forum.avicennaresearch.com/t/garmin-health-sdk/1261
    type: vendor_docs
    quote: Records 25Hz accelerometer data from all three axes in milli-Gs.
    retrieved: '2026-10-11'
  - url: https://forum.avicennaresearch.com/t/sensorkit/1290
    type: vendor_docs
    quote: Data is downsampled to 32Hz (default is 100Hz).
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: history_depth
  status: stated
  value: Data is collected from study participation onward; no backfill of pre-enrolment history is documented (Fitbit
    daily summaries dated before the study start are excluded). SensorKit data arrives after about 30 hours. Trial-study
    data is wiped monthly and the study deleted after one year; Licensed data is kept for the study (see retention_terms).
  confidence: Corroborated
  sources:
  - url: https://forum.avicennaresearch.com/t/fitbit/1259
    type: vendor_docs
    quote: If a participant joins mid-day, the summary for that first day is excluded because its timestamp precedes
      the study start.
    retrieved: '2026-10-11'
  - url: https://forum.avicennaresearch.com/t/sensorkit/1290
    type: vendor_docs
    quote: any data collected now will be available for export approximately 30 hours later
    retrieved: '2026-10-11'
  - url: https://forum.avicennaresearch.com/t/frequently-asked-questions/5
    type: vendor_docs
    quote: In the trial version, the collected study data is wiped monthly, and the study will be deleted after
      one year.
    retrieved: '2026-10-11'
