- field: retention_terms
  status: stated
  value: After contract termination Avicenna keeps data for at least two years unless immediate deletion is requested,
    then deletes it unless law requires retention. Trial data wiped monthly and trial studies deleted after one
    year. Export files deleted after 7 days. Participants can delete all or part of their data at any time. For
    DPA customers, end-of-study handling follows the DPA.
  confidence: Verified
  sources:
  - url: https://avicennaresearch.com/legal
    type: vendor_legal
    quote: Avicenna Research will retain your data for a minimum period of two (2) years following contract termination,
      in accordance with our Data Management Policy.
