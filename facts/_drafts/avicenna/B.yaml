  status: not_public
  confidence: Verified
  note: No FDA records for Avicenna Research or Ethica. openFDA 510(k) applicant searches for "avicenna research" and
    "ethica" return no matches; registration searches for "avicenna" return only unrelated firms (Avicenna AI S.A.S.,
    Avicenna Dental, Avicenna Laser Technology). The platform is a research data-collection tool, not a cleared device.
