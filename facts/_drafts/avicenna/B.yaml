# ---------------- Data access and terms ----------------
- field: raw_streams
  status: stated
  value: 'Raw phone sensors (accelerometer, gyroscope, magnetic field, light, pressure, proximity, GPS, WiFi, Bluetooth,
    battery, screen state, app usage, keyboard input, web activity), Apple SensorKit streams including ECG and PPG on
    approved studies, and Garmin Health SDK logged signals (accelerometer, BBI, heart rate). Available via dashboard
    export, Kibana and the Data Export API. Many sensors are Android-only (for example Contact Network and legacy App
    Usage).'
  confidence: Verified
  sources:
  - url: https://forum.avicennaresearch.com/t/raw-data/1241
    type: vendor_docs
    quote: 1 Accelerometer 2 Ambient Temperature 3 Gyroscope 4 Gravity 5 Light 6 Linear Acceleration 7 Magnetic Field
    retrieved: 2026-10-11
  - url: https://forum.avicennaresearch.com/t/raw-data/1241
    type: vendor_docs
    quote: 83 Garmin Health SDK Logged Accelerometer 84 Garmin Health SDK Logged Heart Rate
    retrieved: 2026-10-11
  - url: https://forum.avicennaresearch.com/t/raw-data/1241
    type: vendor_docs
    quote: 138 SensorKit ECG 139 SensorKit PPG
    retrieved: 2026-10-11
  - url: https://avicennaresearch.com/features/sensor-based-data
    type: vendor_page
    quote: You can access the raw or processed data in real-time
    retrieved: 2026-10-11
  recheck_by: 2026-11-09
- field: derived_metrics
  status: stated
  value: Phone-derived pedometer steps and activity recognition, plus vendor-computed wearable metrics pulled from
    cloud accounts (Garmin daily, sleep and stress; Fitbit activity and sleep; Oura readiness, sleep and stress; WHOOP
    recovery; Polar sleep). No built-in feature-extraction pipeline; analysis is via Kibana charts or export.
  confidence: Verified
  sources:
  - url: https://avicennaresearch.com/features/sensor-based-data
    type: vendor_page
    quote: from raw motion sensors like accelerometer, to processed data such as step count and activity type.
    retrieved: 2026-10-11
  - url: https://forum.avicennaresearch.com/t/raw-data/1241
    type: vendor_docs
    quote: 124 Oura Daily Readiness 125 Oura Daily Sleep
    retrieved: 2026-10-11
  - url: https://forum.avicennaresearch.com/t/raw-data/1241
    type: vendor_docs
    quote: 58 WHOOP Workout 59 WHOOP Sleep 60 WHOOP Recovery
    retrieved: 2026-10-11
  recheck_by: 2026-11-09
- field: sampling_rates
  status: stated
  value: Phone sensors are polled once per data-collection cycle, default every 5 minutes, configurable from 1 to 60
    minutes (iOS guarantees the interval, Android does not). Burst sources sample for a fixed window per cycle (accelerometer
    60 seconds; GPS until three accurate points within 60 seconds). Wearable cloud data is fetched daily; Fitbit intraday
    activity is 1-minute, Oura heart rate 5-minute, Garmin Health API 15-minute slices.
  confidence: Verified
  sources:
  - url: https://forum.avicennaresearch.com/t/data-sources/1266
    type: vendor_docs
    quote: Standard (Every 5 minutes) Frequent (Every 2 minutes) Custom (Between 1 and 60 minutes)
    retrieved: 2026-10-11
  - url: https://forum.avicennaresearch.com/t/data-sources/1266
    type: vendor_docs
    quote: 'Accelerometer: collects data for 60 seconds.'
    retrieved: 2026-10-11
  - url: https://forum.avicennaresearch.com/t/data-sources/1266
    type: vendor_docs
    quote: Avicenna fetches this data at the end of every day.
    retrieved: 2026-10-11
  - url: https://forum.avicennaresearch.com/t/fitbit/1259
    type: vendor_docs
    quote: Offers a snapshot of the user’s activity in 1-minute intervals.
    retrieved: 2026-10-11
  - url: https://forum.avicennaresearch.com/t/garmin-health-api/1260
    type: vendor_docs
    quote: Garmin Health records are provided in 15-minute time slices.
    retrieved: 2026-10-11
  recheck_by: 2026-11-09
- field: history_depth
