facts:
# ---------------- Research access ----------------
- field: research_program
  status: stated
  value: No separate research or academic program; the whole platform is sold to researchers. Access runs
    through a self-serve researcher account, where each study starts on a free Trial licence (full default
    features, for testing only) and must be upgraded to a paid full licence before real field research.
  confidence: Verified
  sources:
  - url: https://forum.avicennaresearch.com/t/frequently-asked-questions/5
    type: vendor_docs
    quote: The trial version is intended only for test purposes.
    retrieved: 2026-10-11
  - url: https://forum.avicennaresearch.com/t/frequently-asked-questions/5
    type: vendor_docs
    quote: If you plan to conduct actual field research with real participants, upgrading to the full license
      is necessary.
    retrieved: 2026-10-11
  recheck_by: 2026-11-09
- field: program_eligibility
  status: stated
  value: The privacy policy defines a Researcher as someone affiliated with an academic institution; the terms
    require the account holder to be at least 18. Whether non-academic (for example pharma or clinical-trial)
    customers are excluded is not stated, and the homepage markets clinical-trial use.
  confidence: Verified
  sources:
  - url: https://avicennaresearch.com/legal
    type: vendor_legal
    quote: is a researcher affiliated with an academic institution who uses Avicenna Research to design and conduct
      scientific studies
    retrieved: 2026-10-11
  - url: https://avicennaresearch.com/legal
    type: vendor_legal
    quote: declares that he or she is at least eighteen (18) years of age
    retrieved: 2026-10-11
  - url: https://avicennaresearch.com/
    type: vendor_page
    quote: Patient-centric Clinical Trial and Health Research Software Platform
    retrieved: 2026-10-11
  recheck_by: 2026-11-09
- field: program_application
  status: stated
  value: Self-serve sign-up as a researcher (name, organization, email, password) plus email verification
    unlocks study creation on a Trial licence. Upgrading a study to a full licence is done by emailing support
    with the study ID; there is no published review step.
  confidence: Verified
  sources:
  - url: https://forum.avicennaresearch.com/t/step-1-create-a-researcher-account/1160
    type: vendor_docs
    quote: select the You are a Researcher button that leads to a page in which you can enter some basic
      information including your name, organization, email address, and password.
    retrieved: 2026-10-11
  - url: https://forum.avicennaresearch.com/t/frequently-asked-questions/5
    type: vendor_docs
    quote: To upgrade your study from Trial to Licensed, you can contact us directly via email at support@avicennaresearch.com
      and send your study ID.
    retrieved: 2026-10-11
  recheck_by: 2026-11-09
- field: program_status
  status: stated
  value: Active. Weekly release notes continue (latest 2026-10-06); company renamed from Ethica Data to Avicenna
    Research in 2023-2024.
  confidence: Verified
  sources:
  - url: https://forum.avicennaresearch.com/t/weekly-release-notes-2026-10-06/2188
    type: vendor_docs
    quote: This week’s release improves participant invitations with CSV import and new options for each invitee.
    retrieved: 2026-10-11
  recheck_by: 2026-11-09
- field: developer_program_status
  status: stated
  value: No public self-serve developer program. A Data Export API exists; researchers request an API key from
    support, tied to their researcher account. No public API reference beyond how-to articles.
  confidence: Verified
  sources:
