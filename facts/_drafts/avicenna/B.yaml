- field: retention_terms
  status: stated
  value: After account or contract termination Avicenna keeps data for at least two years unless immediate deletion
    is requested, then deletes it unless legally required. Trial-licence study data is wiped monthly and the study deleted
    after a year. Participants can delete their own data from their profile; exports are auto-deleted after 7 days.
  confidence: Verified
  sources:
  - url: https://avicennaresearch.com/legal
    type: vendor_legal
    quote: Avicenna Research will retain your data for a minimum period of two (2) years following contract termination,
      in accordance with our Data Management Policy.
