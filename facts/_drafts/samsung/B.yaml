- field: program_application
  status: stated
  value: Submit a partner request on Samsung Developer (signed-in form) before distributing an app; after approval the app's
    package name and SHA-256 signature are registered. Without approval the SDKs work only with developer mode on. Writing
    to Samsung Health also needs an access code issued after partnership approval.
  confidence: Verified
  sources:
  - url: https://developer.samsung.com/health/sensor/process.html
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: Please submit partner request before your app distribution. Your app's information including the app package
      name and signature (SHA-256) can be registered in the Samsung Health's system after an approval. Otherwise, the app
      using the Samsung Health Sensor SDK works only with the developer mode turned on.
  - url: https://developer.samsung.com/health/data/process.html
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: Please submit partner request before your app distribution. Your app's information including the app package
      name and signature (SHA-256) will be registered in the Samsung Health's system after an approval. Otherwise, the app
      using the Samsung Health Data SDK works only with the developer mode turned on.
  - url: https://developer.samsung.com/health/data/process.html
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: To write health data to Samsung Health from an app, the access code is required. You can request partnership
      and receive the access code after an approval.
  - url: https://docs.junction.com/wearables/guides/samsung-health.md
    type: secondary
    retrieved: '2026-10-10'
    quote: Before shipping Samsung Health support to production, you must have obtained partnership approval
  recheck_by: '2026-11-09'
  note: Junction (an integrator) adds that the app signing key must also be allowlisted by Samsung developer support before
    the permission flow works in production. Review time is not published.
