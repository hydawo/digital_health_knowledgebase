- field: raw_streams
  status: stated
  value: Via the Samsung Health Sensor SDK in a Wear OS watch app (Galaxy Watch4 and later), raw accelerometer, raw PPG
    (green, infrared, red), raw ECG (on demand) and raw EDA (Galaxy Watch8 and later). Not available from Galaxy Ring or
    through the Data SDK.
  confidence: Verified
  sources:
  - url: https://developer.samsung.com/health/sensor/overview.html
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: The accelerometer, ECG, and PPG data are provided as raw data by Samsung Health Sensor SDK.
  - url: https://developer.samsung.com/health/sensor/guide/data-specifications.html
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: Electrodemal activity data measured at a frequency of 1 Hz.
  - url: https://developer.samsung.com/health/sensor/overview.html
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: Samsung Health Sensor SDK only works on Galaxy Watch4 series and later models running Wear OS powered by Samsung.
  recheck_by: '2026-11-09'
  note: '"Electrodemal" is Samsung''s spelling on the page.'
- field: derived_metrics
  status: stated
  value: Data SDK (Android phone, from Samsung Health, incl. Watch and Ring data) reads activity summary, exercise, heart
    rate, sleep, sleep apnea, irregular heart rhythm notifications, energy score, blood oxygen, skin temperature, body
    composition, steps (aggregate only) and more. Sensor SDK adds processed heart rate with inter-beat intervals, SpO2,
    BIA and MF-BIA, skin temperature and sweat loss.
  confidence: Verified
  sources:
  - url: https://developer.samsung.com/health/data/overview.html
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: 'Samsung Health Data SDK supports various read data types: Activity summary Active calories burned goal Active
      time goal Blood glucose Blood oxygen Blood pressure Body composition Body temperature Energy score Exercise Exercise
      location Floors climbed Heart rate Irregular heart rhythm notification Nutrition Nutrition goal Skin temperature
      Sleep Sleep apnea Sleep goal Steps Step goal Water intake Water intake goal User profile'
  - url: https://developer.samsung.com/health/sensor/faq.html
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: The Samsung Health Sensor SDK provides heart rate data tracking with IBI (inter-beat interval), which can be
      used to calculate HRV (heart rate variability).
  - url: https://developer.samsung.com/health/data/guide/features/data-types.html
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: Steps Aggregate Step goal Aggregate
  recheck_by: '2026-11-09'
  note: Steps are aggregate-only in the Data SDK (no per-sample reads). HRV itself is not exposed as a metric; it must be
    computed from IBI. Both SDKs carry Samsung's notice that data is for fitness and wellness only.
