facts:
- field: research_program
  status: stated
  value: Samsung Health Research Stack, an open-source app SDK, web portal and backend for running research studies on
    Android and Wear OS. No formal research access program with its own terms is published; the general SDK partner
    request is the route to production data access.
  confidence: Verified
  sources:
  - url: https://developer.samsung.com/health
    type: vendor_page
    retrieved: '2026-10-10'
    quote: Samsung Health Research Stack is backed by open-source tools, applications, and services for running, managing,
      and analyzing medical research studies and clinician services on Android and Wear OS devices.
  - url: https://developer.samsung.com/health/research/overview.html
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: Research Stack is an open-source technology stack offering end-to-end solutions for collecting and analyzing
      data from wearable devices in Android and Wear OS environments.
  recheck_by: '2026-11-09'
  note: The partnerships page lists named collaborations (Stanford sleep apnea, Tulane/Huma HEARTBEAT, Bayer menopause sleep
    study) but no open application program for researchers.
- field: program_eligibility
  status: not_public
  confidence: Verified
