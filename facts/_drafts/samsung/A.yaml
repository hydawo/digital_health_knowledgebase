facts:
- field: research_program
  status: stated
  value: 'Samsung Health Research Stack: an open-source toolset (App SDK, Web Portal, backend services) for building
    Android and Wear OS research apps and running studies. No formal academic access or data program was found; raw
    sensor access is through the Samsung Health Sensor SDK partnership.'
  confidence: Verified
  sources:
  - url: https://developer.samsung.com/health/research/overview.html
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: Samsung Health Research Stack is an open-source technology stack offering end-to-end solutions for collecting
      and analyzing data from wearable devices in Android and Wear OS environments.
  - url: https://developer.samsung.com/health/research
    type: vendor_page
    retrieved: '2026-10-10'
    quote: It includes the App SDK, Web Portal, and a System to support backend services through API endpoints.
  recheck_by: '2026-11-09'
  note: Research Stack is a toolkit a team installs and runs itself, not a data-access program. Samsung's partnerships
    page lists named institutional collaborations (Stanford, Tulane, UCSF and others) but no open application route.
- field: program_eligibility
  status: stated
  value: Research Stack is open source under Apache 2.0 (app-sdk, backend-system), so anyone may use it. Eligibility
    criteria for the Sensor SDK and Data SDK partnerships are not published.
  confidence: Verified
  sources:
  - url: https://github.com/S-HealthStack/app-sdk/blob/main/LICENSE
    type: repository
    retrieved: '2026-10-10'
    quote: Apache License Version 2.0, January 2004
    fetch_url: https://raw.githubusercontent.com/S-HealthStack/app-sdk/main/LICENSE
  - url: https://developer.samsung.com/health/sensor/process.html
    type: vendor_docs
    retrieved: '2026-10-10'
  recheck_by: '2026-11-09'
  note: The web-portal repository has no licence file detected by GitHub (checked via the GitHub API on 2026-10-10).
- field: program_application
  status: stated
  value: No application for Research Stack (self-install from GitHub). Distributing an app that uses the Sensor SDK or
    Data SDK requires a partner request; until approved the app works only in developer mode. The partner request
    form sits behind a Samsung account sign-in.
  confidence: Verified
  sources:
  - url: https://developer.samsung.com/health/sensor/process.html
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: Your app's information including the app package name and signature (SHA-256) can be registered in the Samsung
      Health's system after an approval. Otherwise, the app using the Samsung Health Sensor SDK works only with the developer
      mode turned on.
  - url: https://developer.samsung.com/health/data/process.html
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: To write health data to Samsung Health from an app, the access code is required. You can request partnership
      and receive the access code after an approval.
  recheck_by: '2026-11-09'
  note: Partner request link (developer.samsung.com/SHealth/business-partner/...) redirects to a Samsung account login,
    so the form and its review criteria were not read.
