- field: export_routes
  status: stated
  value: 'Four routes: Sensor SDK in a Wear OS watch app (raw and processed, live); Data SDK in an Android phone app
    (reads the Samsung Health store, including Galaxy Ring data); Health Connect sync from Samsung Health (activity,
    heart rate, sleep); participant self-download of personal data from the Samsung Health app. No cloud or web API.'
  confidence: Verified
  sources:
  - url: https://developer.samsung.com/health/data/overview.html
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: Health data in the Samsung Health app can also be collected from connected devices, like the Galaxy Watch or
      Galaxy Ring, which automatically transfers its data to a paired mobile phone’s Samsung Health app.
  - url: https://developer.samsung.com/health/overview.html
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: Activity data, such as steps and exercise, heart rate, and sleep, are synchronized between Samsung Health and
      Health Connect.
  - url: https://www.samsung.com/us/support/answer/ANS10001379/
    type: vendor_page
    retrieved: '2026-10-10'
    quote: you can download and view the data to get a better idea
  recheck_by: '2026-11-09'
  note: Research Stack's App SDK can collect from Health Connect and the watch SDK and upload to a self-hosted backend.
    Data SDK and Health Connect are Android-only; Samsung Health on iOS is not an export route here.
