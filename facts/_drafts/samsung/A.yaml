- field: raw_streams
  status: stated
  value: 'Sensor SDK (Galaxy Watch4 and later, on-watch, live only): raw accelerometer, PPG green/IR/red, ECG, EDA
    (Watch8 and later). Galaxy Ring has no raw-signal route; its data reaches researchers only as processed Samsung
    Health data via the Data SDK.'
  confidence: Verified
  sources:
  - url: https://developer.samsung.com/health/sensor/overview.html
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: The accelerometer, ECG, and PPG data are provided as raw data by Samsung Health Sensor SDK.
  - url: https://developer.samsung.com/health/sensor/guide/data-specifications.html
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: Electrodemal activity data measured at a frequency of 1 Hz.
  - url: https://developer.samsung.com/health/sensor/faq.html
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: The Samsung Health Sensor SDK supports only Galaxy Watch4 and later models running Wear OS powered by Samsung.
  recheck_by: '2026-11-09'
  note: Sensor SDK data does not pass through Samsung Health ("The Samsung Health Sensor SDK does not share data with
    Samsung Health"), so the study app must capture and upload it.
- field: derived_metrics
  status: stated
  value: 'Sensor SDK processed: heart rate with IBI, skin temperature, SpO2, BIA and MF-BIA body composition, sweat
    loss. Data SDK (from Samsung Health, including Galaxy Ring): activity summary, steps, exercise, floors, heart rate,
    sleep (incl. sleep score), sleep apnea, irregular heart rhythm notification, skin temperature, blood oxygen, body
    temperature, energy score, blood pressure, glucose, body composition, nutrition, water, goals, user profile.'
  confidence: Verified
  sources:
  - url: https://developer.samsung.com/health/data/overview.html
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: Samsung Health Data SDK supports various read data types
  - url: https://developer.samsung.com/health/sensor/guide/data-specifications.html
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: Heart rate data including inter-beat interval (IBI) measured at a frequency of 1 Hz.
  recheck_by: '2026-11-09'
  note: Both SDKs state their data is for fitness and wellness only, not diagnosis or treatment.
- field: sampling_rates
  status: stated
  value: 'Sensor SDK: accelerometer 25 Hz; continuous PPG 25 Hz; on-demand PPG 100 Hz; ECG 500 Hz (on demand, about
    30 s); heart rate/IBI 1 Hz; EDA 1 Hz. Data SDK resolution is not documented.'
  confidence: Verified
  sources:
