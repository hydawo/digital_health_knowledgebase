- field: raw_streams
  status: stated
  value: 'Android passive app (pRMT): relative location (GPS/network, offset so no absolute location reaches the server),
    accelerometer, gyroscope, magnetometer, step count, light, Bluetooth device counts, Android activity-recognition and
    sleep events, screen interaction state, app usage, call and SMS logs (numbers hashed, no content), contact count, battery,
    local weather; optional audio. Bluetooth wearables via pRMT plugins (Polar Vantage V3 and H10, Empatica E4); cloud wearables
    via REST connectors (Oura, Fitbit, Garmin); Apple Watch via the active app''s HealthKit plugin. iOS passive collection
    is sparser.'
  confidence: Verified
  sources:
  - url: https://radar-base.org/docs/4048-2/
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: No absolute location data is streamed to or stored on the server.
  - url: https://radar-base.org/about/
    type: vendor_page
    retrieved: '2026-10-10'
    quote: 'Passive App: collects data in the background from phone sensors and connected wearable devices via Bluetooth.'
  - url: https://radar-base.org/docs/supported-devices/
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: 'RADAR-base Integration: via Active App HealthKit Plugin'
  - url: https://radar-base.org/docs/4048-2/
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: these may be more sparse in iOS due to lack of background collection capabilities
  recheck_by: '2026-11-09'
- field: derived_metrics
  status: stated
  value: Platform stores aggregated data in a hot store (MongoDB) for live dashboards, and Android passes through OS-derived
    activity and sleep classifications. Feature extraction is a separate open-source Python package (radarpipeline).
    Wearable vendor metrics (for example Oura readiness, Garmin Body Battery) arrive via REST connectors.
  confidence: Verified
  sources:
  - url: https://radar-base.org/getting-started-with-radar-base/
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: a hot storage (MongoDB) for aggregated data that supports near real-time insights
  - url: https://github.com/RADAR-base/radarpipeline
    type: repository
    retrieved: '2026-10-10'
    quote: An open-source python feature generation and visualization package use with RADAR project data.
  recheck_by: '2026-11-09'
- field: sampling_rates
  status: stated
  value: 'Android defaults: accelerometer, gyroscope and magnetometer about every 200 ms (about 5 Hz); Bluetooth device
    count hourly; contact list and unread SMS daily; weather every 3 hours; light and battery on change. Configurable per
    study.'
  confidence: Verified
  sources:
  - url: https://radar-base.org/docs/4048-2/
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: By default, the values are collected in roughly 200 millisecond intervals.
  - url: https://radar-base.org/docs/4048-2/
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: By default, the data is collected every 3 hours from the OpenWeatherMap API.
  recheck_by: '2026-11-09'
- field: history_depth
  status: stated
  value: No platform limit; data is kept in the deployment the study owns. For REST wearables (Oura, Fitbit, Garmin) staff
    set a start and end date per participant and can reset to re-pull data between dates, subject to each vendor API's
    own history limits.
  confidence: Corroborated
  sources:
  - url: https://radar-base.org/docs/radar-rest-source-auth/
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: to re-pull all the data between particular dates or to change the start and end dates
  recheck_by: '2026-11-09'
- field: export_routes
  status: stated
  value: 'Raw data export in AVRO, JSON and CSV; the output-restructure tool writes files per project/user/topic/hour from
    S3, Azure Blob or local storage; live dashboards; REST APIs (Swagger-documented); direct access to the deployment''s
    own Kafka, object storage and databases since the study runs the backend.'
  confidence: Verified
  sources:
  - url: https://radar-base.org/getting-started-with-radar-base/
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: exporting raw data for analysis in multiple formats, including AVRO, JSON, and CSV
  - url: https://github.com/RADAR-base/radar-output-restructure
    type: repository
    retrieved: '2026-10-10'
    quote: Data streamed by a Kafka Connector will be converted to a RADAR-base oriented output directory, by organizing
      it by project, user and collection date.
  recheck_by: '2026-11-09'
