  note: Self-hosted, so the operator sets any limits. No platform API rate limit is documented. The Fitbit connector polls
    each user every 150 s by default and backs off for 86400 s after repeated 403s; vendor API limits apply upstream.
- field: retention_terms
  status: stated
  value: The deployment owner controls retention and deletion. The aRMT app policy says data is kept for the study's duration
    under the user's own retention policy, and on written request study data is deleted, including from backups, generally
    within 60 days. The Hyve's demo service keeps identifiable contact data up to 10 years.
  confidence: Verified
  sources:
