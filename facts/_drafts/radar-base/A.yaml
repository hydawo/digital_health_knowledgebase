- field: raw_streams
  status: stated
  value: 'Android pRMT app: phone accelerometer, gyroscope, magnetometer, relative location, light, steps, Bluetooth counts,
    calls and SMS metadata (hashed numbers), app usage, battery, and Bluetooth wearables (Empatica E4, Polar). REST connectors:
    Fitbit, Garmin, Oura cloud data. HealthKit via the aRMT app. iOS passive collection is sparser'
  confidence: Verified
  sources:
  - url: https://radar-base.org/docs/4048-2/
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: Collects the raw acceleration values from the 3-axis accelerometer with the gravitational constant
  - url: https://radar-base.org/about/
    type: vendor_page
    retrieved: '2026-10-10'
    quote: In addition, RADAR-base supports integration with third-party REST APIs (e.g. Fitbit, Garmin) and IoT sensors
  - url: https://radar-base.org/docs/supported-devices/
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: 'RADAR-base Integration: via Active App HealthKit Plugin'
  - url: https://radar-base.org/docs/4048-2/
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: these may be more sparse in iOS due to lack of background collection capabilities
  recheck_by: '2026-11-09'
  note: Location is stored only as coordinates relative to a hidden per-participant offset; no absolute location reaches
    the server.
- field: derived_metrics
  status: stated
  value: Platform computes time-windowed aggregates and data-quality and compliance monitors (Kafka Streams) for dashboards;
    vendor-derived metrics (for example sleep, readiness, stress) arrive through the REST connectors. No built-in behavioural
    feature library is documented
  confidence: Verified
  sources:
  - url: https://radar-base.org/docs/concepts-and-components-of-radar-base/
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: to compute aggregated values of published data based on various time windows and to monitor data quality and
      compliance
  - url: https://radar-base.org/docs/supported-devices/
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: Readiness Score
  recheck_by: '2026-11-09'
- field: sampling_rates
  status: stated
  value: 'Android phone defaults: accelerometer, gyroscope and magnetometer about every 200 ms; Bluetooth devices hourly;
    contact list daily; weather every 3 hours; light and battery on change. Configurable per study'
  confidence: Verified
  sources:
  - url: https://radar-base.org/docs/4048-2/
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: By default, the values are collected in roughly 200 millisecond intervals.
  - url: https://radar-base.org/docs/4048-2/
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: By default, the data is collected every hour.
  recheck_by: '2026-11-09'
- field: history_depth
  status: stated
  value: Phone data starts at enrolment. For REST wearable sources, staff set start and end dates per participant and
    can reset to re-pull data between dates; how far back each vendor API allows is not stated
  confidence: Verified
  sources:
  - url: https://radar-base.org/docs/radar-rest-source-auth/
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: to re-pull all the data between particular dates or to change the start and end dates
  recheck_by: '2026-11-09'
- field: export_routes
  status: stated
  value: Raw data exported from cold storage as Avro, JSON or CSV per project, participant, topic and hour; aggregated
    data via the REST API; manual file upload via the Upload Connector; dashboards
  confidence: Verified
  sources:
  - url: https://radar-base.org/getting-started-with-radar-base/
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: exporting raw data for analysis in multiple formats, including AVRO, JSON, and CSV
  - url: https://radar-base.org/docs/concepts-and-components-of-radar-base/
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: RADAR-REST-API component of RADAR-base, provides interfaces to access the aggregated data stored in MongoDB.
  recheck_by: '2026-11-09'
- field: rate_limits
  status: not_applicable
  recheck_by: '2026-11-09'
  note: Self-hosted software with no central RADAR-base API, so there is no platform rate limit. Upstream vendor API limits
    (Fitbit, Garmin, Oura) still apply to the REST connectors.
- field: retention_terms
  status: stated
  value: Data kept for the study's duration under the deployment owner's policies; on written request study data is deleted,
    including from backups, generally within 60 days. On a self-hosted deployment the deployment owner controls retention
    and deletion
  confidence: Verified
  sources:
