- field: research_program
  status: stated
  value: No vendor research program as such; RADAR-base is open-source research software. The commercial route is The Hyve's
    RADAR-base as a Service (installation, cloud hosting, training, maintenance and support)
  confidence: Verified
  sources:
  - url: https://www.thehyve.nl/services/radar-base-as-a-service
    type: vendor_page
    retrieved: '2026-10-10'
    quote: We offer an all-inclusive, fully managed solution to use RADAR-base in your remote patient-monitoring studies
  - url: https://radar-base.org/
    type: vendor_page
    retrieved: '2026-10-10'
    quote: All components are available as open source software under an Apache 2 license.
  recheck_by: '2026-11-09'
