# ---------------- Data access and terms ----------------
- field: raw_streams
  scope: CentrePoint API
  status: stated
  value: 'Day files by category: raw accelerometer, and (device, firmware, study configuration and contract
    permitting) temperature, green PPG at 25 Hz or 100 Hz, red/IR PPG at 50 Hz, barometer and IMU, as CSV or AVRO.'
  confidence: Verified
  sources:
  - url: https://github.com/actigraph/CentrePoint3APIDocumentation/blob/main/sections/data_access_files.md
    type: vendor_docs
    quote: raw-accelerometer, temperature, ppg-green, ppg-green-100-hz, barometer, imu, ppg-red-ir-50-hz
    retrieved: '2026-10-11'
  - url: https://github.com/actigraph/CentrePoint3APIDocumentation/blob/main/sections/data_access_files.md
    type: vendor_docs
    quote: Data category is only available for certain devices, firmware versions, and study configuration, and it is subject to contract restrictions.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: raw_streams
  scope: Devices and ActiLife
  status: stated
  value: 'LEAP sensors: accelerometer, gyroscope, PPG, skin temperature, barometer, microphone (cough). wGT3X-BT:
    raw acceleration plus ambient light and wear sensor. Raw files are downloaded to researchers and can be
    processed in ActiLife.'
  confidence: Verified
  sources:
  - url: https://academic.ametris.com/actigraph-leap
    type: vendor_page
    quote: Accelerometry Gyroscope Photoplethysmography (PPG) Skin Temperature Barometer Microphone Capabilities
    retrieved: '2026-10-11'
  - url: https://academic.ametris.com/actigraph-wgt3x-bt
    type: vendor_page
    quote: Participant raw data can be collected at sample rates ranging from 30Hz-100Hz and transferred directly to researchers for analysis.
    retrieved: '2026-10-11'
  - url: https://academic.ametris.com/actilife
    type: vendor_page
    quote: Extract time and frequency domain features directly from raw data files
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
  note: Which LEAP sensors are active depends on configuration (Core, Pro, Advanced); Core has green PPG only.
- field: derived_metrics
  status: stated
  value: 'CentrePoint API: minute summaries (axis counts, vector magnitude, steps, METs, calories, wear and sleep
    flags, Freedson, Crouter, Evenson and Staudenmayer cut points), daily statistics, Tracy sleep periods, event
    markers. LEAP configurations add sleep, gait, HR and HRV, respiratory rate, AFib and partner measures (Hyfe
    cough, PKG). ActiLife scores data with published algorithms.'
  confidence: Verified
  sources:
  - url: https://github.com/actigraph/CentrePoint3APIDocumentation
    type: vendor_docs
    quote: Retrieval of Epochs/Minute Summary Data.
    retrieved: '2026-10-11'
  - url: https://github.com/actigraph/CentrePoint3APIDocumentation
    type: vendor_docs
    quote: Retrieval of Daily Summary Data.
    retrieved: '2026-10-11'
  - url: https://github.com/actigraph/CentrePoint3APIDocumentation
    type: vendor_docs
    quote: Retrieval of (Dustin Tracy) Sleep Periods.
    retrieved: '2026-10-11'
  - url: https://academic.ametris.com/actigraph-leap
    type: vendor_page
    quote: Total Sleep Time (TST)
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
  note: Some LEAP and CPIW measures (gait, fall risk, cardinal symptoms) need scientific services or specific
    configurations, per the device pages.
