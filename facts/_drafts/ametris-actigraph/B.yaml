- field: export_routes
  status: stated
  value: 'CentrePoint: web portal, CentrePoint V3 REST API (OAuth 2.0) with day files in CSV or AVRO, raw requests
    in GT3X/CSV/AVRO, analytics endpoints, and webhooks that push daily statistics; the older V2 API is still
    supported. ActiLife: desktop processing of downloaded device files with consolidated CSV export.'
  confidence: Verified
  sources:
  - url: https://academic.ametris.com/centrepoint
    type: vendor_page
    quote: Data outcomes can be integrated directly to a third party system with the CentrePoint API.
    retrieved: '2026-10-11'
  - url: https://github.com/actigraph/CentrePoint3APIDocumentation/blob/main/sections/data_access_files.md
    type: vendor_docs
    quote: Downloaded files in CSV format will be a ZIP folder containing a GZipped CSV file.
    retrieved: '2026-10-11'
  - url: https://github.com/actigraph/CentrePointIntegrationGuide
    type: vendor_docs
    quote: Ability to PUSH day-level analytics data (or subject daily aggregates/statistics) via the Daily Statistics Complete Event
    retrieved: '2026-10-11'
  - url: https://academic.ametris.com/actilife
    type: vendor_page
    quote: Export scored daily, hourly and summary data for multiple datasets and subjects as a single consolidated CSV file.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: rate_limits
  status: stated
  value: CentrePoint API allows 500 requests per minute per IP address (sliding window, then HTTP 429 with
    Retry-After); at most 10 concurrent raw data requests.
  confidence: Verified
  sources:
  - url: https://github.com/actigraph/CentrePoint3APIDocumentation
    type: vendor_docs
    quote: If an API consumer exceeds 500 requests within a minute, then the API will block any further requests with a 429 response code.
    retrieved: '2026-10-11'
  - url: https://github.com/actigraph/CentrePoint3APIDocumentation/blob/main/sections/raw_data_request.md
    type: vendor_docs
    quote: A maximum of 10 active requests are allowed at one time.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
