# ---------------- Research access ----------------
- field: research_program
  status: stated
  value: 'No formal research program with an application. Ametris runs an academic and public health research
    channel (academic.ametris.com): an academic team to contact, an academic online store, a free grant toolkit
    and an open-source dataset library.'
  confidence: Verified
  sources:
  - url: https://academic.ametris.com/
    type: vendor_page
    quote: Connect with a member of our academic and public health research team to discuss your specific research needs.
    retrieved: '2026-10-11'
  - url: https://academic.ametris.com/grant-toolkit
    type: vendor_page
    quote: that are commonly requested in applications for grant funding from various public and private institutions
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: program_eligibility
  status: stated
  value: Online purchasing through the academic store is limited to academic institutions with existing client
    accounts (universities, research institutions, healthcare organizations, government research centers). Other
    buyers go through sales or, outside the US, international resellers.
  confidence: Verified
  sources:
  - url: https://store.ametris.com/
    type: vendor_page
    quote: Online purchasing through our store is currently available only to academic institutions with existing client accounts.
    retrieved: '2026-10-11'
  - url: https://store.ametris.com/
    type: vendor_page
    quote: This includes accredited universities, research institutions, healthcare organizations, and government research centers.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: program_application
  status: stated
  value: No application or review step is published. Researchers contact the academic team or request a quote;
    CentrePoint API access is enabled on request to the company.
