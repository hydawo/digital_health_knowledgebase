# ---------------- Research access ----------------
- field: research_program
  status: stated
  value: 'No formal named research program. The academic channel is a dedicated "Academic Research and Population
    Health" site (academic.ametris.com) with an academic research team, an academic online store, a grant toolkit, an
    open-source dataset library and pricing on request.'
  confidence: Verified
  sources:
  - url: https://academic.ametris.com
    type: vendor_page
    quote: "Connect with a member of our academic and public health research team to discuss your specific research needs."
    retrieved: 2026-10-11
  - url: https://academic.ametris.com/grant-toolkit
    type: vendor_page
    quote: "This toolkit is designed to facilitate the application submission process by gathering information in one place for quick and convenient access."
    retrieved: 2026-10-11
  recheck_by: 2026-11-09
  note: A one-off research grant was announced in August 2022 (blog.ametris.com); no current grant call found.
- field: program_eligibility
  status: stated
  value: Online purchasing in the academic store is limited to academic institutions with existing client accounts
    (accredited universities, research institutions, healthcare organizations, government research centers).
    International customers are directed to resellers.
  confidence: Verified
  sources:
  - url: https://store.ametris.com/
    type: vendor_page
    quote: "Online purchasing through our store is currently available only to academic institutions with existing client accounts. This includes accredited universities, research institutions, healthcare organizations, and government research centers."
    retrieved: 2026-10-11
  - url: https://store.ametris.com/
    type: vendor_page
    quote: "International customers are encouraged to visit our International Resellers page to find a local authorized reseller for product pricing, availability, and sales support."
    retrieved: 2026-10-11
  recheck_by: 2026-11-09
- field: program_application
  status: stated
  value: No application process; researchers contact the academic team, request a quote or a pricing list, or schedule
    a meeting. API access is enabled on request by contacting ActiGraph/Ametris.
  confidence: Verified
  sources:
  - url: https://academic.ametris.com
    type: vendor_page
    quote: "Store and Pricing Schedule a Meeting"
    retrieved: 2026-10-11
  - url: https://github.com/actigraph/CentrePoint3APIDocumentation
    type: vendor_docs
    fetch_url: https://raw.githubusercontent.com/actigraph/CentrePoint3APIDocumentation/main/README.md
    quote: "## Enabling API Access Please contact [ActiGraph]"
    retrieved: 2026-10-11
  recheck_by: 2026-11-09
- field: program_status
  status: stated
  value: Academic channel active as of 2026-10-11. Ametris (formerly ActiGraph) was acquired by Signant Health
    (announced 2026-05-14); the academic site and store remain live under the Ametris name.
  confidence: Verified
  sources:
  - url: https://signanthealth.com/company/news/signant-health-acquires-ametris
    type: vendor_page
    quote: "Signant Health , the evidence generation company, today announced its acquisition of Ametris (formerly ActiGraph)"
    retrieved: 2026-10-11
  - url: https://store.ametris.com/
    type: vendor_page
    quote: "Welcome to our Public Health and Academic Research Online Store"
    retrieved: 2026-10-11
  recheck_by: 2026-11-09
  note: Watch for academic-channel changes after the Signant integration.
- field: developer_program_status
  status: stated
  value: No self-serve developer program. The CentrePoint API (V3, OAuth 2.0; V2 still supported) is documented
    publicly on GitHub, but access is enabled per customer by contacting the company, and the API only reaches data in
    CentrePoint studies the client has access to.
  confidence: Verified
  sources:
  - url: https://github.com/actigraph/CentrePoint3APIDocumentation
    type: vendor_docs
    fetch_url: https://raw.githubusercontent.com/actigraph/CentrePoint3APIDocumentation/main/README.md
    quote: "The API provides access to the same core study and de-identified subject data that can be accessed within [CentrePoint]"
    retrieved: 2026-10-11
