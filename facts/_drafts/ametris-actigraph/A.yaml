# ---------------- Data access and terms ----------------
- field: raw_streams
  status: stated
  value: 'Raw data is the core offering. Through the CentrePoint V3 API Data Access Files: raw-accelerometer,
    temperature, ppg-green (25 Hz), ppg-green-100-hz, barometer, imu and ppg-red-ir-50-hz, the non-accelerometer
    categories only for certain devices, firmware, study configurations and contracts. Offline devices (wGT3X-BT) give
    raw .gt3x files via ActiLife. LEAP also has a microphone, disabled by default.'
  confidence: Verified
  sources:
  - url: https://github.com/actigraph/CentrePoint3APIDocumentation/blob/main/sections/data_access_files.md
    type: vendor_docs
    fetch_url: https://raw.githubusercontent.com/actigraph/CentrePoint3APIDocumentation/main/sections/data_access_files.md
    quote: "- raw-accelerometer - temperature* - ppg-green (25hz)* - ppg-green-100-hz* - barometer* - imu* - ppg-red-ir-50-hz* **Data category is only available for certain devices, firmware versions, and study configuration, and it is subject to contract restrictions.*"
    retrieved: 2026-10-11
  - url: https://academic.ametris.com/actigraph-wgt3x-bt
    type: vendor_page
    quote: "Participant raw data can be collected at sample rates ranging from 30Hz-100Hz and transferred directly to researchers for analysis."
    retrieved: 2026-10-11
  - url: https://ametris.com/actigraph-leap
    type: vendor_page
    quote: "Microphone sensor is disabled by default and would only be activated for specific use cases."
    retrieved: 2026-10-11
  recheck_by: 2026-11-09
- field: derived_metrics
  status: stated
  value: 'CentrePoint API: minute (epoch) summaries, daily statistics, sleep periods and event markers covering steps,
    wear, sleep, energy expenditure and activity intensity. ActiLife scores data with published algorithms. LEAP vital
    signs (HR, HRV, skin temperature, AF/rhythm, SpO2, respiratory rate) and gait/balance measures require Scientific
    Services.'
  confidence: Verified
  sources:
  - url: https://github.com/actigraph/CentrePointIntegrationGuide
    type: vendor_docs
    fetch_url: https://raw.githubusercontent.com/actigraph/CentrePointIntegrationGuide/master/README.md
    quote: "Retrieve subject analytics data (i.e. CPW01 event markers, sleep periods, and minute/daily summary data which encapsulates steps, wear, sleep, energy expenditure, activity intensity classifications/cut points, etc.)"
    retrieved: 2026-10-11
  - url: https://ametris.com/actigraph-leap
    type: vendor_page
    quote: "Vital sign measures are generated by the CentrePoint ® platform ."
    retrieved: 2026-10-11
  - url: https://ametris.com/actigraph-leap
    type: vendor_page
    quote: "Note: The ActiGraph LEAP is US FDA 510(k) cleared for the measurement of activity, sleep, and mobility. Additional vital signs are for investigational use only."
    retrieved: 2026-10-11
  recheck_by: 2026-11-09
- field: sampling_rates
  status: stated
  value: 'Accelerometer: LEAP and CentrePoint Insight Watch 32 to 256 Hz (battery figures quoted at the 32 Hz default);
    wGT3X-BT 30 to 100 Hz. PPG files at 25 Hz or 100 Hz (green) and 50 Hz (red/IR). API epoch summaries at 15, 30 or
    60 seconds (V3); V2 limited to 60 seconds.'
  confidence: Verified
  sources:
  - url: https://ametris.com/actigraph-leap
    type: vendor_page
    quote: "Sample Rate: 32-256 Hertz"
    retrieved: 2026-10-11
  - url: https://academic.ametris.com/actigraph-wgt3x-bt
    type: vendor_page
    quote: "Sample Rate: 30-100 Hertz"
    retrieved: 2026-10-11
  - url: https://github.com/actigraph/CentrePointIntegrationGuide
    type: vendor_docs
    fetch_url: https://raw.githubusercontent.com/actigraph/CentrePointIntegrationGuide/master/README.md
    quote: "Dynamically retrieve EPOCH summary records with a variable summary length (i.e. 15-sec, 30-sec, or 60-sec epoch length)"
    retrieved: 2026-10-11
  recheck_by: 2026-11-09
- field: history_depth
  status: stated
  value: 'On-device storage: wGT3X-BT 180 days / 4GB; CentrePoint Insight Watch 30 days / 512MB; LEAP 30 or 79 days /
    1GB (two spec tables on the same page disagree). Cloud history in CentrePoint has no published limit; raw GT3X API
    requests are capped at 15 days each and must not be used to pull a whole study history.'
  confidence: Corroborated
  sources:
  - url: https://academic.ametris.com/actigraph-wgt3x-bt
    type: vendor_page
    quote: "Data Storage: 180 Days / 4GB"
    retrieved: 2026-10-11
  - url: https://ametris.com/actigraph-leap
    type: vendor_page
    quote: "Data Storage: 79 Days / 1GB"
    retrieved: 2026-10-11
  - url: https://github.com/actigraph/CentrePoint3APIDocumentation/blob/main/sections/raw_data_request.md
    type: vendor_docs
    fetch_url: https://raw.githubusercontent.com/actigraph/CentrePoint3APIDocumentation/main/sections/raw_data_request.md
    quote: "RAW data retrieval requests SHALL NOT be performed to retrieve ALL the historic RAW data for all subjects in a given study."
    retrieved: 2026-10-11
  recheck_by: 2026-11-09
- field: export_routes
  status: stated
  value: 'CentrePoint V3 REST API (OAuth 2.0): Data Access Files as daily CSV (gzipped) or AVRO, raw requests in GT3X,
    CSV or AVRO, summaries; webhooks push daily statistics events to EDCs; CentrePoint V2 API; ActiLife desktop export
    to CSV and its Data Vault cloud storage; documented .gt3x format with open-source readers (pygt3x, agcounts).'
  confidence: Verified
  sources:
  - url: https://github.com/actigraph/CentrePoint3APIDocumentation/blob/main/sections/data_access_files.md
    type: vendor_docs
    fetch_url: https://raw.githubusercontent.com/actigraph/CentrePoint3APIDocumentation/main/sections/data_access_files.md
    quote: "Downloaded files in CSV format will be a ZIP folder containing a GZipped CSV file."
    retrieved: 2026-10-11
  - url: https://github.com/actigraph/CentrePointIntegrationGuide
    type: vendor_docs
    fetch_url: https://raw.githubusercontent.com/actigraph/CentrePointIntegrationGuide/master/README.md
    quote: "Ability to *PUSH* day-level analytics data (or subject daily aggregates/statistics) via the [Daily Statistics Complete Event]"
    retrieved: 2026-10-11
  - url: https://academic.ametris.com/actilife
    type: vendor_page
    quote: "Export scored daily, hourly and summary data for multiple datasets and subjects as a single consolidated CSV file."
    retrieved: 2026-10-11
  - url: https://github.com/actigraph/GT3X-File-Format
    type: repository
    quote: "Documentation of the ActiGraph .gt3x file format"
    retrieved: 2026-10-11
  recheck_by: 2026-11-09
- field: rate_limits
  status: stated
  value: 'CentrePoint V3 API: more than 500 requests per minute from one IP returns 429 (sliding window, Retry-After
    header). Raw data requests: at most 10 active at once, GT3X ranges limited to 15 days, cancelled after 6 hours.
    V2 API: an unpublished daily request limit.'
  confidence: Verified
  sources:
  - url: https://github.com/actigraph/CentrePoint3APIDocumentation
    type: vendor_docs
    fetch_url: https://raw.githubusercontent.com/actigraph/CentrePoint3APIDocumentation/main/README.md
    quote: "If an API consumer exceeds 500 requests within a minute, then the API will block any further requests with a 429 response code."
    retrieved: 2026-10-11
  - url: https://github.com/actigraph/CentrePoint3APIDocumentation/blob/main/sections/raw_data_request.md
    type: vendor_docs
    fetch_url: https://raw.githubusercontent.com/actigraph/CentrePoint3APIDocumentation/main/sections/raw_data_request.md
    quote: "Due to the heavy computation required to create a file in the GT3X format, the time range for GT3X format requests is limited to 15 days. A maximum of 10 active requests are allowed at one time."
    retrieved: 2026-10-11
  - url: https://github.com/actigraph/StudyAdminAPIDocumentation
    type: vendor_docs
    fetch_url: https://raw.githubusercontent.com/actigraph/StudyAdminAPIDocumentation/master/README.md
    quote: "This API is request limited. We only allow a certain number of requests per day."
    retrieved: 2026-10-11
  recheck_by: 2026-11-09
- field: retention_terms
  status: stated
  value: Ametris acts as data processor for the study sponsor (controller). Personal data is retained in identifiable
    form only as long as it serves a processing purpose; customer removal requests are answered within 30 days.
    Participants must direct access or deletion requests to the sponsor. No fixed CentrePoint retention period is
    published.
  confidence: Verified
  sources:
  - url: https://ametris.com/privacy-policy
    type: vendor_legal
    quote: "If Ametris customer requests Ametris to remove the personal data to comply with data protection regulations, Ametris will respond to such request s within 30 days ."
    retrieved: 2026-10-11
  - url: https://ametris.com/privacy-policy
    type: vendor_legal
    quote: "For Data Subject participating in clinical trials, contact the trial sponsor not Ametris with requests for access, correction, amendment, or deletion."
    retrieved: 2026-10-11
  recheck_by: 2026-11-09
- field: ai_training_terms
  status: not_public
  confidence: Verified
  sources:
