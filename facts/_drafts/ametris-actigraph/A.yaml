    type: vendor_docs
    fetch_url: https://raw.githubusercontent.com/actigraph/CentrePointIntegrationGuide/master/README.md
    quote: "ActiGraph continues to support the [CentrePoint V2 API](https://github.com/actigraph/StudyAdminAPIDocumentation). This API is based on a different authentication mechanism than the CentrePoint V3 API and therefore requires a different set of credentials."
