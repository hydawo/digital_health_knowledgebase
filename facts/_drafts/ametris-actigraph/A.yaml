- field: academic_vs_commercial
  status: stated
  value: Academic and population-health customers are served through a separate academic site and store (devices,
    ActiLife desktop software and CentrePoint); industry-sponsored clinical trials are served through ametris.com with
    full-service operational and scientific support. Pricing for both is quoted per order. No consumer product.
  confidence: Corroborated
  sources:
  - url: https://academic.ametris.com
    type: vendor_page
    quote: "We offer the flexibility of two powerful software platforms to meet the diverse needs of our academic research clients."
    retrieved: 2026-10-11
  - url: https://ametris.com
    type: vendor_page
    quote: "Ametris provides wearable digital health technology (DHT), along with integrated scientific and operational support, to help clinical teams capture real-world data that accurately reflects patient functioning."
    retrieved: 2026-10-11
  recheck_by: 2026-11-09
  note: How academic pricing or terms differ from commercial ones is not published.
