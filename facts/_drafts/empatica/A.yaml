  status: stated
  value: 'Digital biomarkers (CSV): pulse rate, pulse rate variability (RMSSD), respiratory rate, EDA skin conductance
    level, skin temperature, wearing detection, sleep detection, steps, activity counts/classification/intensity,
    actigraphy counts, METs, body position, ambient light (EmbraceMini); availability depends on device and sensor
    mode'
  confidence: Verified
