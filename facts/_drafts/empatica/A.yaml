- field: raw_streams
  status: stated
  value: 'EmbracePlus: accelerometer, gyroscope (selected modes), blood volume pulse (PPG), EDA, skin temperature,
    systolic peaks (IBI), steps, user tags. EmbraceMini: accelerometer, gyroscope, ambient light, steps, tags. Delivered
    as Avro files in an AWS S3 bucket; streams depend on the sensor mode'
  confidence: Verified
  sources:
  - url: https://academic-support.empatica.com/hc/en-us/articles/36981046788765-Raw-Data-in-the-Empatica-Cloud
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: 'Raw data streams contained within Empatica''s Avro files are the following: Accelerometer Blood Volume
      Pulse ElectroDermal Activity (EDA) Gyroscope Steps Systolic Peaks Tags'
  - url: https://www.empatica.com/platform/research-studies
    type: vendor_page
    retrieved: '2026-10-10'
    quote: Raw Data Accelerometer Supported Supported Ambient Light Not supported Supported Blood Volume Pulse Supported
      Not supported Electrodermal Activity Supported Not supported Gyroscope Supported Supported IBI (Systolic peaks)
      Supported Not supported Steps Supported Supported Skin Temperature Supported Not supported
  recheck_by: '2026-11-09'
