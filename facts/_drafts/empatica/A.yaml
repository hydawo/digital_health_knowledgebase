    100): accelerometer 64/64/32/64/100 Hz; gyroscope off/off/off/64/100 Hz; PPG 64 Hz (Pulse Rate Pro) or 4 Hz
    (Actigraphy Pro); EDA 4 Hz; skin temperature 1 Hz; ambient light 1 Hz (EmbraceMini)'
  confidence: Verified
  sources:
