  value: "Two options: self-host the open-source stack on your own AWS account (Elastic Beanstalk, EC2, RDS PostgreSQL, S3) using the cluster launch script, in any AWS region; or use the Beiwe Service Center, which runs the study on the Onnela Lab's production deployment (US or EU). AWS is the only supported cloud."
  confidence: Verified
  sources:
  - url: https://github.com/onnela-lab/beiwe-backend/wiki/Deployment-Instructions---Scalable-Deployment
    type: vendor_docs
    quote: "Choose an AWS region that offers the services you need: S3, EC2, RDS, and Elastic Beanstalk."
    retrieved: 2026-10-10
  - url: https://hsph.harvard.edu/research/onnela-lab/beiwe-service-center
    type: vendor_page
    quote: "Under this model, we create the Beiwe study on our production version of the Beiwe platform that runs on our AWS account."
    retrieved: 2026-10-10
  - url: https://hsph.harvard.edu/research-resource/beiwe/
    type: vendor_page
    quote: "EU Beiwe Service Center Login"
    retrieved: 2026-10-10
  recheck_by: 2026-11-09
  note: The FAQ also names the original developer (Zagaran) as a paid support option for self-hosters.
- field: app_availability
  status: stated
  value: "iOS: Beiwe2 on the App Store (Onnela Lab LLC, free, iPhone, iOS 15.0+, version 2.5.11 of 2026-09-30), connects to any Beiwe server. Android: APKs downloaded from each deployment's /download link (studies.beiwe.org/download serves the current build); these collect call and text stats."
  scope: iOS App Store and Android APK
  confidence: Verified
  sources:
  - url: https://apps.apple.com/us/app/beiwe2/id1312962738
    type: app_store
    quote: "Usage of this Beiwe app is open to any Beiwe server by providing a URL at participant registration."
    retrieved: 2026-10-10
  - url: https://github.com/onnela-lab/beiwe-android
    type: repository
    quote: "Download APK from studies.beiwe.org/download"
    retrieved: 2026-10-10
  recheck_by: 2026-11-09
  note: Version, seller and minimum iOS from the iTunes lookup API (itunes.apple.com/lookup?id=1312962738). studies.beiwe.org/download and eu.beiwe.org/download both redirect to Beiwe-LATEST-commStatsCustomUrl.apk on S3.
