- field: deprecations
  status: stated
  value: "Self-hosted Elastic Beanstalk environments must move from Python 3.8 (end of support October 2024) to a new Python 3.12 stack; environments deployed before 2025-09-09 need a step to enable last-leg encryption; the old Tableau endpoints (/api/v0/.../summary-statistics/daily) are deprecated and may be removed at any time; the single-server AMIs are retired. Stored data moved to per-file zstd compression."
  confidence: Verified
  sources:
