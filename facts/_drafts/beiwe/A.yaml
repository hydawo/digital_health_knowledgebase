facts:
- field: research_program
  status: stated
  value: Beiwe Service Center (BSC), Harvard T.H. Chan School of Public Health. Software as a Service on the lab's production Beiwe deployment on AWS, with study design and configuration support, IRB documentation help, training, a four-week beta test, participant troubleshooting, raw data and summary metrics, and final Forest analysis. Explicitly not a scientific collaboration with the Onnela Lab.
  confidence: Verified
  sources:
  - url: https://hsph.harvard.edu/research-resource/beiwe/use-beiwe
    type: vendor_page
    quote: "The Beiwe Service Center (BSC) allows investigators to use the Beiwe platform under a Software as a Service (SaaS) model."
    retrieved: 2026-10-10
  - url: https://hsph.harvard.edu/research-resource/beiwe/use-beiwe
    type: vendor_page
    quote: "Four-week beta testing phase to ensure setup accuracy"
    retrieved: 2026-10-10
  - url: https://hsph.harvard.edu/research/onnela-lab/beiwe-service-center
    type: vendor_page
    quote: "This model is not a scientific collaboration with the Onnela Lab, but instead makes it possible for investigators to use Beiwe without having to deploy and maintain their own version of the open source code base."
    retrieved: 2026-10-10
  recheck_by: 2026-11-09
