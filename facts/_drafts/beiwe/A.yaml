- field: raw_streams
  status: stated
  value: "Raw phone sensor data and logs, downloadable by researchers through the web download page, the Data Download API or mano. Streams: accelerometer, GPS, power state, screen use, identifiers, Wi-Fi, Bluetooth, call and text logs (Android only), proximity, magnetometer, device motion, reachability (iOS only), gyroscope, plus surveys and audio recordings. Studies set as 'production data' restrict downloads to processed output."
  confidence: Verified
  sources:
  - url: https://hsph.harvard.edu/research-resource/beiwe/technology
    type: vendor_page
    quote: "Beiwe collects raw sensor data and phone logs, which is crucial in scientific research settings."
    retrieved: 2026-10-10
  - url: https://github.com/onnela-lab/beiwe-backend/wiki/%5BResearchers%5D-Supported-Data-Streams
    type: vendor_docs
    quote: "Calls and Texts Log is an Android-only data stream."
    retrieved: 2026-10-10
  - url: https://github.com/onnela-lab/beiwe-backend/wiki/%5BResearchers%5D-Using-Beiwe-for-Open-Source-Users
    type: vendor_docs
    quote: "Production data: researchers will only be able to download processed data output from the Data Analysis Pipeline."
    retrieved: 2026-10-10
  recheck_by: 2026-11-09
  note: Phone numbers and Wi-Fi and Bluetooth MAC addresses are hashed on the phone with a per-device key that never leaves it. The Google Play build (Beiwe2) omits call and text stats; see app_availability.
- field: derived_metrics
  status: stated
  value: "Forest (open-source Python, run locally or on the Beiwe back end) produces daily or hourly summary statistics: Jasmine (GPS imputation and mobility, e.g. home time, distance travelled, radius of gyration), Willow (call and text log stats, Android only), Oak (gait, cadence, step count from accelerometer), Sycamore (survey summaries). Summary statistics are also served through the Tableau API."
  confidence: Verified
  sources:
  - url: https://forest.beiwe.org/en/latest/
    type: vendor_docs
    quote: "Jasmine : Location data imputation and mobility summary statistics"
    retrieved: 2026-10-10
  - url: https://forest.beiwe.org/en/latest/
    type: vendor_docs
    quote: "Oak : Gait time, cadence, and step count statistics"
    retrieved: 2026-10-10
  - url: https://forest.beiwe.org/en/latest/
    type: vendor_docs
    quote: "Willow : Call log and text log summary statistics"
    retrieved: 2026-10-10
  - url: https://forest.beiwe.org/en/latest/
    type: vendor_docs
    quote: "Sycamore : Survey data summary statistics and preprocessed data"
    retrieved: 2026-10-10
  - url: https://hsph.harvard.edu/research-resource/beiwe/technology
    type: vendor_page
    quote: "Integrated with Beiwe, Forest can be used to generate on-demand analytics, most importantly daily or hourly summary statistics of collected data, which are stored in a relational database on AWS."
    retrieved: 2026-10-10
  recheck_by: 2026-11-09
- field: sampling_rates
  status: stated
  value: Configurable per study in seconds (sensor on and off durations, data rate, upload frequency); for example a default Wi-Fi scan every 900 seconds. No fixed rates are guaranteed; on Android the requested accelerometer and gyroscope rates are unreliable and snap to device-specific brackets, so the docs advise testing devices first.
