- field: hipaa_statement
  status: stated
  value: No claim of HIPAA compliance for Beiwe itself. The docs say Beiwe often handles data potentially covered by HIPAA (so SSL is mandatory), that data is encrypted in transit and at rest, and point to an AWS whitepaper on how EC2 and S3 meet HIPAA standards.
  confidence: Corroborated
  sources:
  - url: https://github.com/onnela-lab/beiwe-backend/wiki/Deployment-Instructions---Scalable-Deployment
    type: vendor_docs
    quote: "Because Beiwe often deals with sensitive data potentially covered under HIPAA regulations it is important to add an SSL certificate so that web traffic is encrypted with HTTPS."
    retrieved: 2026-10-10
  - url: https://github.com/onnela-lab/beiwe-backend/wiki/%5BResearchers%5D-Beiwe-Data-Privacy-and-Security
    type: vendor_docs
    quote: "describing how EC2 and S3, the two Amazon services Beiwe uses, meet HIPAA compliance standards."
    retrieved: 2026-10-10
  - url: https://github.com/onnela-lab/beiwe-backend/wiki/%5BResearchers%5D-Beiwe-Data-Privacy-and-Security
    type: vendor_docs
    quote: "All data is encrypted in transit and at rest."
    retrieved: 2026-10-10
  recheck_by: 2027-01-08
