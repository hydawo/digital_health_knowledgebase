- field: deprecations
  status: stated
  value: 'Rolling-release backend with no versioned legacy support; features are not expected to be removed. Self-hosted
    deployments needed admin action for: the Python 3.8 to 3.12 Elastic Beanstalk platform swap (environments existing
    in or before January 2025), last-leg encryption for environments deployed before 2025-09-09, and historical
    data compression. The old Tableau summary-statistics endpoints are deprecated and may be removed at any time.
    The single-server AMI is retired.'
  confidence: Verified
