  status: stated
  value: No HIPAA compliance claim. The backend README notes Beiwe data may fall under laws such as HIPAA and therefore
    makes SSL/TLS mandatory; documented safeguards are encryption on device, in transit and at rest (RSA-2048 wrapped
    AES) and hashing of phone numbers and MAC addresses.
  confidence: Corroborated
  sources:
