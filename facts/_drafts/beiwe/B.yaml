- field: hosting_options
  status: stated
  value: 'Two routes. (1) Managed: the Beiwe Service Center runs studies on the Onnela Lab production AWS deployment,
    with US and EU servers. (2) Self-hosted: deploy the open-source backend on your own AWS account (Elastic Beanstalk,
    EC2, S3, RDS PostgreSQL) using the launch script; AWS is the only supported cloud. Self-hosting needs basic-to-moderate
    Python, AWS and CLI skill and gets no Onnela Lab support; Zagaran offers paid help.'
  confidence: Verified
