- field: raw_streams
  status: stated
  value: 'Raw sensor data and phone logs, downloadable as CSV via the web page, the Data Download API or Mano. Both
    OSes: accelerometer, gyroscope (iOS and select Android), GPS (with optional fuzzing), screen or power state,
    identifiers, surveys and audio recordings. Android only: Wi-Fi, Bluetooth, call and text logs (hashed numbers),
    power state. iOS only: proximity, magnetometer, DeviceMotion, reachability. A study set to "production data"
    restricts download to processed pipeline output.'
  confidence: Verified
  sources:
  - url: https://hsph.harvard.edu/research-resource/beiwe/technology/
    type: vendor_page
    quote: Beiwe collects raw sensor data and phone logs, which is crucial in scientific research settings.
    retrieved: '2026-10-10'
  - url: https://hsph.harvard.edu/research-resource/beiwe/technology/
    type: vendor_page
    quote: Wi-Fi Router Data (Android Only) Bluetooth Data (Android Only) Phone Call Log Data (Android Only) Text
      Message Log Data (Android Only) Proximity (Apple iOS Only)
    retrieved: '2026-10-10'
  - url: https://github.com/onnela-lab/beiwe-backend/wiki/%5BResearchers%5D-Supported-Data-Streams
    type: vendor_docs
    quote: Calls and Texts Log is an Android-only data stream.
    retrieved: '2026-10-10'
  - url: https://github.com/onnela-lab/beiwe-backend/wiki/%5BResearchers%5D-Supported-Data-Streams
    type: vendor_docs
    quote: GPS has an extra "fuzzing" parameter that serves to obscure the exact location of the user.
    retrieved: '2026-10-10'
  - url: https://github.com/onnela-lab/beiwe-backend/wiki/%5BResearchers%5D-Using-Beiwe-for-Open-Source-Users
    type: vendor_docs
    quote: 'Production data: researchers will only be able to download processed data output from the Data Analysis
      Pipeline.'
    retrieved: '2026-10-10'
  recheck_by: '2026-11-09'
- field: derived_metrics
  status: stated
  value: 'Forest (open-source Python, integrated into the backend and runnable locally) produces daily or hourly
    summaries: Jasmine (GPS imputation and mobility: home time, distance, radius of gyration, significant places,
    flights and pauses), Willow (Android call and text summaries), Sycamore (survey adherence and answers), Oak
    (walking time, steps, cadence from accelerometer), plus data quantity stats; exposed in the dashboard and via
    the Tableau API.'
  confidence: Verified
  sources:
  - url: https://forest.beiwe.org/
    type: vendor_docs
    quote: 'Jasmine : Location data imputation and mobility summary statistics'
    retrieved: '2026-10-10'
  - url: https://forest.beiwe.org/
    type: vendor_docs
    quote: 'Willow : Call log and text log summary statistics'
    retrieved: '2026-10-10'
  - url: https://forest.beiwe.org/
    type: vendor_docs
    quote: 'Oak : Gait time, cadence, and step count statistics'
    retrieved: '2026-10-10'
  - url: https://hsph.harvard.edu/research-resource/beiwe/technology/
    type: vendor_page
    quote: Integrated with Beiwe, Forest can be used to generate on-demand analytics, most importantly daily or
      hourly summary statistics of collected data, which are stored in a relational database on AWS.
    retrieved: '2026-10-10'
  - url: https://github.com/onnela-lab/beiwe-backend/wiki/Tableau-API
    type: vendor_docs
    quote: Summary Statistics includes the data quantity stats visible to you on the Study Dashboard, plus extra
      statistics generated by Forest statistical analyses.
    retrieved: '2026-10-10'
  recheck_by: '2026-11-09'
- field: sampling_rates
  status: stated
  value: Configured per study in seconds as sensor on/off duty cycles and, for accelerometer and gyroscope, a sampling
    frequency. Accelerometer records about 5 to 100 samples per second. Android delivers only discrete real intervals
    (1-2 ms up to ~288 ms) regardless of the value requested, so devices should be tested before launch.
  confidence: Verified
  sources:
  - url: https://github.com/onnela-lab/beiwe-backend/wiki/%5BResearchers%5D-Using-Beiwe-for-Open-Source-Users
    type: vendor_docs
    quote: Study settings are configured in seconds. For example, sensors are configured for on/off intervals in
      seconds.
    retrieved: '2026-10-10'
  - url: https://github.com/onnela-lab/beiwe-backend/wiki/%5BResearchers%5D-Beiwe-Research-Administration-Manual
    type: vendor_docs
    quote: the accelerometer records about 5 to 100 datapoints per second.
    retrieved: '2026-10-10'
  - url: https://github.com/onnela-lab/beiwe-backend/wiki/%5BResearchers%5D-Supported-Data-Streams
    type: vendor_docs
    quote: 'Only a handful of "real frequencies" exist: 1-2ms, 2-3ms, 4-5ms, 8-9ms, 18-19ms, 36-37ms, ~72ms, ~144ms,
      and ~288ms.'
    retrieved: '2026-10-10'
  recheck_by: '2026-11-09'
  note: Under the BSC, passive data settings are edited by Onnela Lab staff, not the study team.
