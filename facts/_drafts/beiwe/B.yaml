facts:
- field: research_program
  status: stated
  value: 'Beiwe Service Center (BSC), Harvard T.H. Chan School of Public Health (Onnela Lab): Beiwe run as a SaaS
    on the lab''s production AWS deployment. Includes study design and configuration support, IRB documentation
    help, team training, a four-week beta test, participant troubleshooting and technical support, raw data and
    summary metrics, and final analysis with production Forest packages. Separately, the full platform is open source
    for self-hosting.'
  confidence: Verified
  sources:
  - url: https://hsph.harvard.edu/research-resource/beiwe/use-beiwe/
    type: vendor_page
    quote: The Beiwe Service Center (BSC) allows investigators to use the Beiwe platform under a Software as a Service
      (SaaS) model.
    retrieved: '2026-10-10'
  - url: https://hsph.harvard.edu/research-resource/beiwe/use-beiwe/
    type: vendor_page
    quote: 'Service through the BSC includes: Comprehensive study design and configuration support Assistance with
      IRB documentation of Beiwe platform In-depth platform training for your team Four-week beta testing phase
      to ensure setup accuracy'
    retrieved: '2026-10-10'
  - url: https://hsph.harvard.edu/research-resource/beiwe/use-beiwe/
    type: vendor_page
    quote: Access to both raw data and summary metrics for in-depth insights Final data analysis at study completion
      using production Forest packages
    retrieved: '2026-10-10'
  recheck_by: '2026-11-09'
