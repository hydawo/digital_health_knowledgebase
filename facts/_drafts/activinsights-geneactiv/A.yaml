- field: history_depth
  status: stated
  value: GENEActiv stores up to about 60 days on-device (14 days at 100 Hz); once extracted, files are held in the
    study's own data store with no vendor-imposed limit. Band data are uploaded at least weekly and held in the
    vendor cloud under a 10-year review retention period.
  confidence: Verified
  sources:
  - url: https://activinsights.com/wp-content/uploads/2026/02/Product-Information-Sheet-Rev.002.pdf
    type: vendor_docs
    quote: "Maximum Logging Periods 60 days @20hz, 14 days @100hz"
    retrieved: '2026-10-11'
