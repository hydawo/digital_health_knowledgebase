- field: research_program
  status: stated
  value: No named academic or research program. Research is Activinsights' core market; it sells devices on
    quotation and offers paid study services (study design, logistics and deployment, GENEActiv and R Markdown
    training, data acquisition and analysis, algorithm development).
  confidence: Verified
  sources:
  - url: https://activinsights.com/research-study-services/
    type: vendor_page
    quote: "We offer a full-scale service for clinical trials and academic research projects."
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
