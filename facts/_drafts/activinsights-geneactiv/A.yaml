- field: raw_streams
  status: stated
  value: Raw, unfiltered tri-axial acceleration in SI units (+/- 8g, 12 bit), ambient light and near-body
    temperature, plus event-button presses, stored on the device and extracted to an open-format .bin file via
    the USB cradle and GENEActiv software. GENEActiv 1.3 also sends adherence data over Bluetooth.
  confidence: Verified
  scope: GENEActiv
  sources:
  - url: https://activinsights.com/digital-health-technologies/professional-wearables/geneactiv/
    type: vendor_page
    quote: "It produces raw, unfiltered tri-axial acceleration data in SI units in an open data format."
    retrieved: '2026-10-11'
  - url: https://activinsights.com/wp-content/uploads/2026/02/IFU-GENEActiv-Rev.010.pdf
    type: vendor_docs
    quote: "Data extraction is the process of reading recorded data from a device at the end of a recording and saving it to a GENEActiv .bin file."
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: raw_streams
  status: stated
  value: No raw sensor data. The Band outputs behavioural events (open COEL atom format) inferred from
    acceleration, uploaded wirelessly through the companion app.
  confidence: Verified
  scope: Activinsights Band
  sources:
  - url: https://activinsights.com/privacy-policies/privacy-policy-for-activinsights-band/
    type: vendor_legal
    quote: "The Activinsights Band is designed to collect only basic behavioural information and associated metrics."
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
  note: The product comparison sheet (GENEActiv-Product-Comparison-Sheet-Jan-2025.pdf) lists the Band's output as
    behavioural events in open COEL atom format, against high-resolution raw SI data for GENEActiv; its PDF text
    is column-interleaved, so it is not quoted.
- field: derived_metrics
  status: stated
  value: 'Band: activity events (sleep, sedentary, sitting, standing, walking, running, cycling, swimming,
    exercise, non-wear), steps, energy expenditure, sleep/wake patterns and event markers in lifestyle reports.
    GENEActiv: no on-device metrics; the vendor offers 150+ digital measures as a service, epoch summaries in its
    software, sleep metrics in its Sleep Toolkits, and open R packages.'
  confidence: Verified
  sources:
  - url: https://activinsights.com/resources/activinsights-band-support/
    type: vendor_page
    quote: "The ActivInsights Band detects up to 12 basic activities with estimates of steps, movement and energy expenditure."
    retrieved: '2026-10-11'
  - url: https://activinsights.com/digital-health-technologies/professional-wearables/geneactiv/
    type: vendor_page
    quote: "Our 150+ digital measures include:"
    retrieved: '2026-10-11'
  - url: https://activinsights.com/digital-health-technologies/advance_sleeptoolkit/
    type: vendor_page
    quote: "Total Sleep Duration Sleep Onset Latency Sleep Efficiency WASO (Wake After Sleep Onset) Naps"
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: sampling_rates
  status: stated
  value: Acceleration logging selectable 10 to 100 Hz; temperature at least every 30 s. Up to 60 days at 20 Hz
    and 14 days at 100 Hz per the product sheet.
  confidence: Verified
  scope: GENEActiv
  sources:
  - url: https://activinsights.com/wp-content/uploads/2026/02/Product-Information-Sheet-Rev.002.pdf
    type: vendor_docs
    quote: "Logging Frequencies Selectable 10-100Hz Maximum Logging Periods 60 days @20hz, 14 days @100hz"
    retrieved: '2026-10-11'
  - url: https://activinsights.com/resources/faqs/
    type: vendor_page
    quote: "recording at 100Hz lasts for 7 days and 20Hz records for 30 days"
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
  note: Sampling range is consistent, but recording duration is not. The FAQ and GENEActiv support page give 7
    days at 100 Hz and 30 days at 20 Hz; the product sheet and IFU Rev.010 give 14 and 60 days (memory 2.0 GB on
    versions 1.2 and 1.3, 1.0 GB on 1.1). The FAQs page also says to charge every 6 months in one place and every
    2 months in another.
