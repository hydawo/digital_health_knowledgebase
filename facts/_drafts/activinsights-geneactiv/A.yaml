  - url: https://activinsights.com/resources/activinsights-band-support/
    type: vendor_page
    quote: "The data collected should be uploaded via the app at least once a week."
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
  note: Plugging a recording GENEActiv back into the cradle stops the recording and loses its data (FAQ).
- field: export_routes
  status: stated
  value: 'GENEActiv: USB cradle and GENEActiv software (Windows, macOS) extract .bin files, convertible to raw CSV,
    epoch CSV (1 to 60 s) or epoch AWD for Actiware or the Sleep Toolkit; open R packages read .bin. GENEActiv 1.3
    adds Bluetooth adherence extraction. Band: wireless upload through the ActivInsights Companion app (iOS,
    Android, Windows), Band Clinic App reports, and vendor APIs for raw, event and summary data. SDKs under licence.'
  confidence: Verified
