- field: raw_streams
  status: stated
  value: Raw phone sensor data (e.g. accelerometer x/y/z, GPS/network locations, gyroscope, magnetometer, barometer, light,
    battery, Bluetooth, WiFi, screen, calls/messages metadata, keyboard, touch, screen text, applications, ESM answers) written
    to tables in the researcher’s own MySQL database. iOS client adds HealthKit heart rate, sleep and workout data and Fitbit
    via web API; plugins add e.g. ambient noise and conversations.
  confidence: Verified
  sources:
  - url: https://awareframework.com/sensors/
    type: vendor_docs
    quote: Accelerometer Applications Aware Barometer Battery Bluetooth Communication ESM/EMA
    retrieved: '2026-10-11'
  - url: https://awareframework.com/accelerometer/
    type: vendor_docs
    quote: Contains the raw sensor data.
    retrieved: '2026-10-11'
  - url: https://awareframework.com/use-aware/
    type: vendor_page
    quote: AWARE runs on Android devices, and those devices directly upload data to your MySQL server, without any intermediate
      servers or cloud services.
    retrieved: '2026-10-11'
  - url: https://apps.apple.com/us/app/aware-client-v2/id1455986181
    type: app_store
    quote: this app collects heart-rate, sleep, and workout data via HealthKit API if the user allows the app to access HealthKit
      API.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
  note: Sensor availability differs between Android and iOS; check per-sensor docs.
- field: derived_metrics
  status: stated
  value: Behavioural features are not computed by AWARE itself; the companion RAPIDS pipeline (CMU, AGPL-3.0) generates features
    from AWARE data. Some plugins infer context such as activity recognition and conversations; AWARE Narrator converts records
    to text statements.
  confidence: Verified
  sources:
  - url: https://awareframework.com/rapids/
    type: vendor_page
    quote: RAPIDS can generates various behavioral features from AWARE sensor data.
    retrieved: '2026-10-11'
  - url: https://awareframework.com/plugins/
    type: vendor_page
    quote: 'AWARE: Conversations'
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: sampling_rates
  status: stated
  value: 'Researcher-configurable per sensor. Example: accelerometer delay in microseconds, e.g. 200000 (normal), 60000 (UI),
    20000 (game), 0 (fastest), hardware dependent and non-deterministic; GPS checked every 180 s by default (0 = always on).'
  confidence: Verified
  sources:
  - url: https://awareframework.com/accelerometer/
    type: vendor_docs
    quote: non-deterministic frequency in microseconds (dependent of the hardware sensor capabilities and resources), e.g.,
      200000 (normal), 60000 (UI), 20000 (game), 0 (fastest).
    retrieved: '2026-10-11'
  - url: https://awareframework.com/locations/
