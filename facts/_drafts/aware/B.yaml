- field: retention_terms
  status: stated
  value: By default data stays on the phone; when in a study it is replicated to the study server. A participant can withdraw
    and remove their data from the server and phone at any time from the phone. Retention on the researcher’s server is the
    researcher’s responsibility.
  confidence: Verified
  sources:
  - url: https://awareframework.com/privacy/
    type: vendor_legal
    quote: By default, the mobile client only stores data locally on the users’ phones .
    retrieved: '2026-10-11'
  - url: https://awareframework.com/privacy/
    type: vendor_legal
    quote: During a study deployment, a user can withdraw and remove the collected data from the server and the mobile phone
      at any time, directly from his phone .
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
  note: Privacy policy last modified 24 January 2019 and describes a keep-alive ping every 15 minutes to the AWARE team; it
