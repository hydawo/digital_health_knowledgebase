- field: export_routes
  status: stated
  value: Phones upload directly to the researcher’s MySQL database (Android) or AWARE Micro server (iOS, Legacy) at a configurable
    offload frequency; data can also be pulled from the device’s local SQLite store. No vendor API.
  confidence: Verified
  sources:
  - url: https://awareframework.com/use-aware/
    type: vendor_page
    quote: “Offload frequency” determines the frequency at which the mobile app will try to send the collected data to the
      database.
    retrieved: '2026-10-11'
