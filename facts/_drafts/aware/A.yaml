facts:
- field: research_program
  status: not_applicable
  note: AWARE is itself an academic open-source research tool; there is no access program to join. Anyone
    can download the clients and server code. Paid study support and a hosted-study service are
    recorded under quote_required and hosting_options.
- field: program_eligibility
  status: not_applicable
  note: No access program. The Apache 2.0 licence lets anyone use it for research or commercial purposes
    (see academic_vs_commercial).
- field: program_application
  status: not_applicable
  note: No application or approval step. A study is set up by building a JSON configuration file in the
    public configurator (configurator.awareframework.com) and pointing participants' apps at its URL.
- field: program_status
  status: stated
  value: Project is active and maintained by a team at the University of Melbourne School of Computing and
    Information Systems (Simon D'Alfonso, Vassilis Kostakos). It originated with Denzil Ferreira's PhD
    (Oulu, co-supervised by Kostakos and Anind Dey at Carnegie Mellon). Latest Android releases are
    stable 4.2.1 and beta 4.7.3 (GitHub release 2026-08-07). The iOS client is maintained separately by
    Yuuki Nishiyama.
  confidence: Verified
  scope: AWARE project as a whole
  sources:
