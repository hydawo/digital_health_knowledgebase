- field: hosting_options
  status: stated
  value: Self-hosted. Android needs a researcher-run MySQL server (own, AWS, Azure or Docker). iOS and AWARE
    Legacy need a self-run AWARE Micro server (JVM, Docker on AWS, GCP or Azure). A managed hosted-study
    service run by the University of Melbourne is available on request.
  confidence: Verified
