- field: deprecations
  status: stated
  value: The original AWARE client is archived as AWARE Legacy (Jan 2025); AWARE-Light became the main
    Android line. The denzilferreira/aware-client repository was archived on 2023-06-18. The old hosted
    dashboard at api.awareframework.com is not compatible with AWARE Micro and no longer resolves. The
    Google Fit add-on depends on Google Fit APIs that Google is deprecating in 2026.
  confidence: Verified
  sources:
  - url: https://awareframework.com/changes-to-the-aware-ecosystem/
