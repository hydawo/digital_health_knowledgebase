- field: raw_streams
  status: stated
  scope: Android (AWARE, formerly AWARE-Light)
  value: Raw phone sensor and event streams written to the researcher's own database, including
    accelerometer, gyroscope, magnetometer, gravity, linear accelerometer, rotation, barometer, light,
    proximity, temperature, locations (GPS and network), battery, Bluetooth, WiFi, network, telephony,
    calls and messages (hashed), applications, installations, keyboard, touch, notifications, screen,
    screenshot, screentext (on-screen text) and ESM/EMA answers. Applications, touch, notifications,
    keyboard and screentext need Android Accessibility access.
  confidence: Verified
  sources:
  - url: https://awareframework.com/sensors/
    type: vendor_docs
    quote: "Accelerometer Applications Aware Barometer Battery Bluetooth Communication ESM/EMA Gravity Gyroscope Installations Light Linear Accelerometer Locations Magnetometer MQTT Network Keyboard Processor Proximity Rotation Scheduler Screen Screenshot Screentext Telephony Touch Temperature Timezone WiFi"
    retrieved: 2026-10-11
  - url: https://awareframework.com/screentext/
    type: vendor_docs
    quote: "Application passwords may be captured by screen readers if the show-password functionality is enabled by the smartphone user"
    retrieved: 2026-10-11
  recheck_by: 2026-11-09
  note: Screentext captures the text a participant reads on screen and the site's own test list shows some
    apps expose passwords when show-password is on; a study team should weigh this for ethics review.
- field: raw_streams
  status: stated
  scope: iOS (AWAREFramework-iOS, AWARE Client V2)
  value: Default sensors include accelerometer, gyroscope, magnetometer, gravity, rotation, location,
    barometer, battery, network, calls, processor, proximity, timezone, WiFi, screen events, Fitbit,
    memory, NTP time, OpenWeatherMap and headphone motion. Motion activity, pedometer, Bluetooth, BLE heart
    rate, ambient noise, calendar, contacts and HealthKit are extensions needing extra Info.plist
    permissions and App Store review.
  confidence: Verified
  sources:
  - url: https://github.com/tetujin/AWAREFramework-iOS
    type: repository
    quote: "The following sensors can be used under extension(s)because these sensors need additional permission(s) into Info.plist and take a review by apple."
    retrieved: 2026-10-11
  recheck_by: 2026-11-09
- field: derived_metrics
  status: stated
  value: The clients mostly store raw records. Some sensors add higher-level context (for example call
    availability in Communication). Behavioural features come from the separate RAPIDS pipeline, and the
    AWARE Narrator tool turns records into English statements for LLM use.
  confidence: Verified
  sources:
  - url: https://awareframework.com/rapids/
    type: vendor_page
    quote: "RAPIDS can generates various behavioral features from AWARE sensor data"
    retrieved: 2026-10-11
  - url: https://awareframework.com/aware-narrator/
    type: vendor_page
    quote: "The AWARE Narrator tool converts AWARE data records into English statements that describe the records"
    retrieved: 2026-10-11
  - url: https://awareframework.com/communication/
    type: vendor_docs
    quote: "It also provides higher level context on the users’ calling availability and actions"
    retrieved: 2026-10-11
  recheck_by: 2026-11-09
- field: sampling_rates
  status: stated
  value: Configurable per sensor. Accelerometer is set as a sampling delay in microseconds (200000 normal,
    60000 UI, 20000 game, 0 fastest) and is hardware-dependent. GPS location is checked every 180 seconds
    by default (0 keeps it always on).
  confidence: Verified
  scope: Android
  sources:
  - url: https://awareframework.com/accelerometer/
    type: vendor_docs
    quote: "non-deterministic frequency in microseconds (dependent of the hardware sensor capabilities and resources), e.g., 200000 (normal), 60000 (UI), 20000 (game), 0 (fastest)"
    retrieved: 2026-10-11
  - url: https://awareframework.com/locations/
    type: vendor_docs
    quote: "how frequent to check the GPS location, in seconds. By default, every 180 seconds"
    retrieved: 2026-10-11
  recheck_by: 2026-11-09
- field: history_depth
  status: stated
  value: No vendor-held copy or limit. Data is uploaded straight from phones to the researcher's own MySQL
    server, so history is whatever the study retains; data not yet uploaded also sits in the phone's local
    database.
  confidence: Corroborated
  sources:
  - url: https://awareframework.com/use-aware/
    type: vendor_docs
    quote: "AWARE runs on Android devices, and those devices directly upload data to your MySQL server, without any intermediate servers or cloud services"
    retrieved: 2026-10-11
  recheck_by: 2026-11-09
  note: The "no limit" reading is an inference from the self-hosted architecture; no explicit statement on
    history depth exists.
- field: export_routes
  status: stated
  value: Phones upload to the researcher's MySQL database at a configured offload frequency (Android). iOS
    and AWARE Legacy upload to a self-run AWARE Micro server. Local data can also be copied off the phone
    and opened with an SQLite client. MQTT and JSON integration are documented for the original platform.
  confidence: Verified
  sources:
  - url: https://awareframework.com/use-aware/
    type: vendor_docs
    quote: "“Offload frequency” determines the frequency at which the mobile app will try to send the collected data to the database"
    retrieved: 2026-10-11
  - url: https://awareframework.com/downloads/
    type: vendor_page
    quote: "To operate the iPhone AWARE setup, you will also need to run the AWARE server"
    retrieved: 2026-10-11
  - url: https://awareframework.com/privacy/
    type: vendor_legal
    quote: "it can be backed up and opened by connecting the device to your computer and using an SQLite client"
    retrieved: 2026-10-11
  recheck_by: 2026-11-09
  note: The downloads page warns some phones produce duplicate rows with the same device_id and timestamp,
    so deduplicate during cleaning.
- field: rate_limits
  status: not_applicable
  note: No hosted API. Throughput is bounded by the researcher's own server; AWARE Micro is documented as
    handling thousands of requests per second on one machine.
- field: retention_terms
  status: stated
  value: By default data stays only on the phone. In a study, participants can withdraw and remove their data
    from the server and phone from the app. Retention on the server is otherwise the researcher's own
    decision, since the database is theirs.
  confidence: Corroborated
  sources:
  - url: https://awareframework.com/privacy/
    type: vendor_legal
    quote: "During a study deployment, a user can withdraw and remove the collected data from the server and the mobile phone at any time, directly from his phone"
    retrieved: 2026-10-11
  - url: https://awareframework.com/privacy/
    type: vendor_legal
    quote: "Last modified 24.January 2019"
    retrieved: 2026-10-11
  recheck_by: 2026-11-09
  note: The privacy policy dates from 2019 and says it covers clients "offered by AWARE Framework in the Play
