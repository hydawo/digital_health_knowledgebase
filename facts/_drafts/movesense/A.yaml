# ---------------- Data access and terms ----------------
- field: raw_streams
  status: stated
  value: 'Raw single-channel ECG, accelerometer, gyroscope and magnetometer (9-axis IMU), plus temperature, all models,
    through the sensor''s REST-style API (Whiteboard): streamed over Bluetooth LE to the iOS/Android mobile library or
    the GATT SensorData Protocol (Python client), or logged on the sensor and downloaded later. Custom firmware can
    process data on the sensor. The MD sensor ECG front end is modified for IEC 60601-2-47 (0.5 Hz high-pass instead
    of 7 Hz on sport models).'
  confidence: Verified
  sources:
  - url: https://www.movesense.com/about-us/
    type: vendor_page
    quote: The standard firmware provides access to raw unprocessed ECG, HR, HRV (RR intervals), acceleration, angular
      velocity and magnetic field data with configurable sample rates and dynamic ranges.
    retrieved: '2026-10-11'
  - url: https://bitbucket.org/movesense/movesense-device-lib/raw/master/README.md
    type: repository
    quote: Movesense APIs follow well-known REST principle and can be used both internally by the sensor app or externally
      via the iOS/Android libraries.
    retrieved: '2026-10-11'
  - url: https://www.movesense.com/docs/medical/medical_sensor/
    type: vendor_docs
    quote: The biggest effect of this is the change of ECG input high pass filtering from 7 Hz to 0.5 Hz.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
  note: Temperature is described as a non-medical sensor on the specifications page. The HR+ also has a 1-wire
    extension bus; the MD sensor has the 1-wire master removed.
- field: derived_metrics
  status: stated
  value: 'On-sensor heart rate (average) and R-R intervals (/Meas/HR), with R-R intervals at 1 ms resolution. No other
    derived metrics in the standard firmware; researchers can run their own algorithms on the sensor. The ECG Recorder
    app (v2.1 and later) adds ECG and HRV visualizations and two ECG analysis reports.'
  confidence: Verified
  sources:
  - url: https://www.movesense.com/docs/esw/api_reference/
    type: vendor_docs
    quote: '"average": 50.890586853027344, "rrData": [ 1179 ]'
    retrieved: '2026-10-11'
  - url: https://www.movesense.com/specifications/
    type: vendor_page
    quote: R-R intervals with 1ms accuracy and resolution
    retrieved: '2026-10-11'
  - url: https://www.movesense.com/about-us/
    type: vendor_page
    quote: You can build your own services on top of the API to process the measured data on the sensor, and set the
      sensor to send calculated results instead of streaming raw data.
    retrieved: '2026-10-11'
  - url: https://apps.apple.com/us/app/movesense-ecg-recorder/id6443902831
    type: app_store
    quote: The version 2.1 adds two new ECG analysis reports
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: sampling_rates
  status: stated
  value: 'ECG: 125, 128, 200, 250, 256, 500 or 512 Hz (bandwidth up to 40 Hz on MD, 34 Hz on sport models; 125 to 200
    Hz recommended; above 256 Hz should not be streamed over BLE). Accelerometer, gyroscope, magnetometer and combined
    IMU: 13, 26, 52, 104, 208, 416, 833 or 1666 Hz, with high rates limited by BLE bandwidth. R-R intervals at 1 ms
    resolution.'
  confidence: Verified
  sources:
  - url: https://www.movesense.com/faq/
    type: vendor_page
    quote: Available ECG sample rates are 125 / 128 / 200 / 250 / 256 / 500 / 512 Hz
    retrieved: '2026-10-11'
  - url: https://www.movesense.com/docs/esw/api_reference/
    type: vendor_docs
    quote: '"SampleRates": [ 13, 26, 52, 104, 208, 416, 833, 1666 ], "AccRanges": [ 2, 4, 8, 16 ]'
    retrieved: '2026-10-11'
  - url: https://www.movesense.com/docs/esw/api_reference/
    type: vendor_docs
    quote: ECG subscriptions with high sample frequency (>256 Hz) over BLE should be avoided.
    retrieved: '2026-10-11'
  - url: https://www.movesense.com/docs/esw/api_reference/
    type: vendor_docs
    quote: Please note that using highest sample rates may be limited by the BLE bandwidth.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: history_depth
  status: stated
  value: 'No cloud history: data exists only where the researcher streams or downloads it. On-sensor logging is limited
    by memory: HR2, HR+ and MD have 384 kB EEPROM used as a ring buffer that overwrites the oldest data; Flash has
    128 MB flash that stops writing when full. Battery life with live streaming is about 7 days at ECG 256 Hz, about
    400 h for heart rate and R-R.'
  confidence: Verified
  sources:
  - url: https://www.movesense.com/docs/system/hw_variants/
    type: vendor_docs
    quote: Movesense HR2 SS2 384 kB EEPROM NO Movesense HR+ SS2 384 kB EEPROM YES Movesense MD SS2 384 kB EEPROM NO
    retrieved: '2026-10-11'
  - url: https://www.movesense.com/docs/system/hw_variants/
    type: vendor_docs
    quote: When the filesystem is full, data can no longer be written (vs the EEPROM where it overwrites the old data)
    retrieved: '2026-10-11'
  - url: https://www.movesense.com/faq/
    type: vendor_page
    quote: ECG @ 256 Hz with live data streaming = 7 days Heart rate & R-R intervals with live data streaming = 400h
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
  note: The data storage doc says 386 kB while the hardware variants table says 384 kB.
