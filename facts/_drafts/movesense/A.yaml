# ---------------- Research access ----------------
- field: research_program
  status: stated
  value: Movesense Academic Program. Selected research teams receive a limited number of Movesense sensors and
    accessories (such as heart rate straps) free of charge, plus technical support from the Movesense team, in
    exchange for crediting Movesense in publications and sharing project material for Movesense news and social
    media.
  confidence: Verified
  sources:
  - url: https://www.movesense.com/movesense-academic-program/
    type: vendor_page
    quote: Movesense Academic Program equips scientists and researchers with sensor hardware and tools for efficiently
      measuring and collecting motion and physiology data.
    retrieved: '2026-10-11'
  - url: https://www.movesense.com/movesense-academic-program/
    type: vendor_page
    quote: Movesense supplies the selected research teams with a limited number of Movesense sensors and associated
      accessories such as heart rate straps.
    retrieved: '2026-10-11'
  - url: https://www.movesense.com/movesense-academic-program/
    type: vendor_page
    quote: Researchers agree to mention Movesense in scientific articles and other publications related to the project
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
  note: The program is an equipment-and-support grant, not a data or platform program; Movesense has no cloud data
    platform for researchers. Outside the program, research teams buy sensors in the shop and use the free developer
    tools like any other customer.
- field: program_eligibility
  status: stated
  value: Academic teams, researchers and students may apply. Selection weighs innovativeness and usefulness, the
    commercial potential of the results, how useful Movesense sensors are to the project, the project's potential to
    build awareness for Movesense, and additional non-published criteria.
  confidence: Verified
  sources:
  - url: https://www.movesense.com/movesense-academic-program/
    type: vendor_page
    quote: Movesense team warmly welcome academic teams, researchers and students to apply for the Movesense Academic
      Program!
    retrieved: '2026-10-11'
  - url: https://www.movesense.com/movesense-academic-program/
    type: vendor_page
    quote: Potential of commercial applications of the project results Utility value of Movesense sensors for completing
      the project Potential of the project to build awareness for Movesense Additional non-published criteria of Movesense
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
  note: Past participants include non-university organizations (for example Neurobit Technologies and Universal
    Diagnostics Pvt. Ltd), so the program is not strictly limited to universities.
- field: program_application
  status: stated
  value: Apply through an online form with a short project description, timeline and planned use of the sensors.
    Movesense reviews applications monthly and invites up to three projects per quarter, at its own discretion and
    without explaining decisions.
  confidence: Verified
  sources:
  - url: https://www.movesense.com/movesense-academic-program/
    type: vendor_page
    quote: Interested researchers send an application to the Movesense team via an online form. The application includes
      a short description of the project, project timeline, and a description of how the Movesense sensors would be
      used.
    retrieved: '2026-10-11'
  - url: https://www.movesense.com/movesense-academic-program/
    type: vendor_page
    quote: Movesense team reviews the applications on a monthly basis and invites up to three projects per quarter to
      the program.
    retrieved: '2026-10-11'
  - url: https://www.movesense.com/movesense-academic-program/
    type: vendor_page
    quote: Movesense team has the right to select applications at its own consideration and is not obliged to explain
      why a project was selected or not selected to the program.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: program_status
  status: stated
  value: Active. The program page says it started in November 2019 and is open until further notice, and a December
    2025 news post announced a new project (Ca' Foscari University of Venice) joining it.
  confidence: Verified
  sources:
  - url: https://www.movesense.com/movesense-academic-program/
    type: vendor_page
    quote: The program started on November, 2019 and is open until further notice.
    retrieved: '2026-10-11'
  - url: https://www.movesense.com/news/2025/12/university-of-venice-studies-seismocardiography-with-movesense-md-sensors/
    type: vendor_page
    quote: join the Movesense Academic Program. The project related to seismocardiography (SCG)
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
  note: The program page's list of participating projects stops at Q1 2023 and its Google Scholar count is dated
    January 20, 2023, so the page itself is stale even though the program is still taking projects.
- field: developer_program_status
  status: stated
  value: Open, with no application step. The sensor library, mobile library, API specification, sample code and tools
    are published on public Bitbucket repositories and can be used without buying anything. Use is governed by the
    Movesense SDK License and Evaluation Agreement (LICENSE.pdf in the device library), which grants an evaluation
    licence; commercialization needs a separate agreement.
  confidence: Verified
  sources:
  - url: https://www.movesense.com/oem-services/
    type: vendor_page
    quote: They can be accessed even without a purchase via movesesense.com/resources
    retrieved: '2026-10-11'
  - url: https://bitbucket.org/movesense/movesense-device-lib/raw/master/README.md
    type: repository
    quote: See [LICENSE.pdf](LICENSE.pdf) for details on Movesense license.
    retrieved: '2026-10-11'
  - url: https://bitbucket.org/movesense/movesense-device-lib/raw/master/LICENSE.pdf
    type: repository
    quote: The possible commercialization of the Application, in connection with the sales and distribution of Movesense
      products, is subject to a separate agreement.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
  note: Repositories checked through the Bitbucket API on 2026-10-11 (all public) were movesense-device-lib (updated
    2025-11-20), movesense-mobile-lib (2026-06-01), python-datalogger-tool (2026-10-08) and sbem-tools (2026-09-14).
- field: user_cap
  status: stated
  value: No participant or user cap applies to the developer tools; data flows directly from the sensor to the
    researcher's own app or computer. The Academic Program caps intake at up to three projects per quarter and supplies
    a limited number of sensors sized to the project.
  confidence: Verified
  sources:
  - url: https://www.movesense.com/movesense-academic-program/
    type: vendor_page
    quote: The exact amount of supplied equipment depends on the project scope.
    retrieved: '2026-10-11'
  - url: https://www.movesense.com/movesense-academic-program/
    type: vendor_page
    quote: invites up to three projects per quarter to the program
    retrieved: '2026-10-11'
  - url: https://www.movesense.com/faq/
    type: vendor_page
    quote: If you integrate the sensors into your own application, you can decide where the data is stored. It does
      not go to Movesense servers.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
  note: The Python datalogger tool supports multiple sensors at once, which bears on multi-participant field logging.
- field: academic_vs_commercial
  status: stated
  value: There is no general academic pricing; universities pay the same shop prices and can request an official
    quote for procurement. The difference that matters is the licence. The website and SDK licence are evaluation
    licences, and incorporating the technology into products or services, or commercializing an application, needs a
    separate Commercial License agreement from Movesense. The online store sells to business users only.
  confidence: Verified
  sources:
  - url: https://www.movesense.com/faq/
    type: vendor_page
    quote: There is no general academic pricing. We are happy to provide an official quote if needed for university
      procurement.
    retrieved: '2026-10-11'
  - url: https://www.movesense.com/terms/
    type: vendor_legal
    quote: A separate Commercial License agreement, with straightforward terms, is available for commercial use.
    retrieved: '2026-10-11'
  - url: https://www.movesense.com/terms/
    type: vendor_legal
    quote: In particular, the Licensee shall not incorporate or integrate the Licensed Technology or any part thereof
      in any products or services.
    retrieved: '2026-10-11'
  - url: https://www.movesense.com/terms/
    type: vendor_legal
    quote: At this point the Movesense Online Store is available for business users only.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
  note: The evaluation licence on the Terms page runs twelve months from signature and limits Movesense's liability to
    50 euros. The FAQ and OEM page describe the tools as free and open, which sits awkwardly with the evaluation-only
    licence text; the Showcase app and sample code are Apache 2.0 per the mobile library README. Commercial License
    terms are not published.
