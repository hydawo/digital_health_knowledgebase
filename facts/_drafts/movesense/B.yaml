facts:
- field: research_program
  status: stated
  value: Movesense Academic Program supplies selected research projects with a limited number of sensors and accessories plus technical support, in exchange for acknowledgement and publicity material
  confidence: Verified
  scope: Movesense Academic Program
  sources:
  - url: https://www.movesense.com/movesense-academic-program/
    type: vendor_page
    quote: "Movesense supplies the selected research teams with a limited number of Movesense sensors and associated accessories such as heart rate straps."
    retrieved: '2026-10-11'
  - url: https://www.movesense.com/movesense-academic-program/
    type: vendor_page
    quote: "Researchers agree to mention Movesense in scientific articles and other publications related to the project"
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
  note: Outside the program there is no research tier; researchers buy sensors from the business-only web shop. Third parties (for example Fibion Flash) resell Movesense hardware as packaged research kits.
- field: program_eligibility
  status: stated
  value: Academic teams, researchers and students may apply; selection weighs innovativeness, commercial potential and awareness value for Movesense, plus unpublished criteria
  confidence: Verified
  scope: Movesense Academic Program
  sources:
