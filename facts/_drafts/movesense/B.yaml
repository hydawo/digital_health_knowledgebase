- field: raw_streams
  status: stated
  value: Raw unfiltered single-channel ECG, accelerometer, gyroscope and magnetometer, plus internal temperature, via BLE streaming to the researcher's own app (mobile libraries, Python GSP client) or via on-sensor logging (Flash)
  confidence: Verified
  sources:
  - url: https://www.movesense.com/faq/
    type: vendor_page
    quote: "You have full access to raw, unfiltered 1‑channel ECG as well as raw acceleration, gyroscope, and magnetometer data with different sample rates and measurement ranges."
    retrieved: '2026-10-11'
  - url: https://www.movesense.com/docs/esw/api_reference/
    type: vendor_docs
    quote: "Movesense sensor is equipped with temperature sensor, which can be used to measure device's internal temperature."
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
  note: The FAQ's "1‑channel" uses a non-breaking hyphen. Temperature is the device's internal temperature, labelled non-medical on the specifications page.
- field: derived_metrics
  status: stated
  value: On-sensor heart rate (average) and R-R intervals at 1 ms resolution from the ECG front end, plus the standard Bluetooth Heart Rate Service; any other metric needs custom firmware or host-side analysis
  confidence: Verified
  sources:
  - url: https://www.movesense.com/docs/esw/api_reference/
    type: vendor_docs
    quote: "Movesense sensor is equipped with analog front-end capable of capturing ECG signals and calculating user's heart rate."
    retrieved: '2026-10-11'
  - url: https://www.movesense.com/product/movesense-flash-developer-kit/
    type: vendor_page
    quote: "Heart rate, beats/minute, RR intervals (1ms resolution)"
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
  note: The ECG Recorder app (from version 2.1) adds ECG and HRV visualisations and reports for MD users.
- field: sampling_rates
  status: stated
  value: ECG 125, 128, 200, 250, 256, 500 or 512 Hz; accelerometer and gyroscope 12.5 to 416 Hz (spec sheet; the API reference lists accelerometer rates up to 1666 Hz); RR intervals at 1 ms resolution
  confidence: Verified
  sources:
  - url: https://www.movesense.com/faq/
    type: vendor_page
    quote: "Available ECG sample rates are 125 / 128 / 200 / 250 / 256 / 500 / 512 Hz"
    retrieved: '2026-10-11'
  - url: https://www.movesense.com/product/movesense-flash-developer-kit/
    type: vendor_page
    quote: "Accelerometer, range :±2/±4/±8/±16 g full scale, sampling frequency: 12.5/26/52/104/208/416 Hz"
    retrieved: '2026-10-11'
  - url: https://www.movesense.com/docs/esw/api_reference/
    type: vendor_docs
    quote: "\"SampleRates\": [ 13, 26, 52, 104, 208, 416, 833, 1666 ]"
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
  note: ECG bandwidth is up to 40 Hz (medical) or 34 Hz (non-medical), so Movesense recommends 125 to 200 Hz. The 833 and 1666 Hz accelerometer rates appear only in an API example, not on product spec sheets.
- field: history_depth
  status: stated
  value: Limited by on-sensor memory, no cloud history. Flash (128 MB) holds about five days of ECG, over four months of HR intervals, four days of 26 Hz acceleration or about 19 hours of 52 Hz 9-axis motion. Other models log to a small EEPROM circular buffer that overwrites old data
  confidence: Verified
  sources:
  - url: https://www.movesense.com/news/2026/03/improved-ecg-imu-data-logger-for-movesense-flash-now-available/
    type: vendor_page
    quote: "The Movesense Flash’s memory can store up to five days of single-channel ECG or heart rate intervals for over four months"
    retrieved: '2026-10-11'
  - url: https://www.movesense.com/news/2026/03/improved-ecg-imu-data-logger-for-movesense-flash-now-available/
    type: vendor_page
    quote: "For 9-axis motion data (acceleration, gyro, magnetometer) at 52 Hz, the capacity is enough for almost 19 hours."
    retrieved: '2026-10-11'
  - url: https://www.movesense.com/docs/esw/data_storage/
    type: vendor_docs
    quote: "This means that as the memory gets full, the old data gets overwritten."
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
  note: For HR-interval logging on Flash the battery needs replacing about once a month.
