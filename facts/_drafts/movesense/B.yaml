- field: retention_terms
  status: stated
  value: Data from researcher-integrated sensors never reaches Movesense. The ECG Recorder app keeps data locally and makes an anonymised backup to Movesense servers; personal data is kept as long as the account exists or as Movesense deems necessary, with an erasure right
  confidence: Verified
  sources:
  - url: https://www.movesense.com/faq/
    type: vendor_page
    quote: "The Movesense ECG recorder stores data locally and makes an anonymized backup to Movesense servers."
    retrieved: '2026-10-11'
  - url: https://www.movesense.com/movesense-ecg-recorder-app-data-protection-statement/
    type: vendor_legal
    quote: "If you have registered with Movesense’s services, we will retain your personal data for as long as you have a username for the application or as long after the customer relationship as we deem necessary to retain the data."
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
  note: The Limited Evaluation Licence requires returning or destroying licensed software within five days of termination (not the sensor itself).
- field: ai_training_terms
  status: unclear
  value: No term mentions AI or ML training. The ECG Recorder statement lets Movesense reuse anonymised ECG data for its own commercial and non-commercial purposes such as product development and research, which could include model training. Data from researchers' own integrations does not reach Movesense
  confidence: Unclear
  sources:
  - url: https://www.movesense.com/movesense-ecg-recorder-app-data-protection-statement/
    type: vendor_legal
    quote: "After anonymization we may also use this special category of data for our further commercial and non-commercial purposes, such as product development, research etc."
