      raw PPG, signal-to-noise ratio, and motion.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
  scope: Sensor Bio V2
  note: 'Gyroscope: the V2 spec lists three sensors (PPG, accelerometer, skin temperature) and no gyroscope, while
    sensorbio.com/science still says raw "PPG, gyroscope, and accelerometer data" are available via the RPM dashboard.
    The science text is carried over from Biostrap and likely describes EVO hardware.'
