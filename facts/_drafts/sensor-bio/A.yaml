- field: derived_metrics
  status: stated
  value: Heart rate, HRV (rMSSD, HRV-CV, LF/HF, SD1/SD2 on spot checks), respiratory rate, skin temperature, resting
    HR and HRV, steps, calories, activity score, recovery score, sleep score and stages (REM, deep, light, awake),
    circadian score and sleep debt, workouts with HR zones, stress index and ANS balance, VO2 max, and AI-generated
    daily insights. Available through the SDK, the REST API and the RPM dashboard.
  confidence: Verified
  sources:
  - url: https://sensorbio.com/product/sensor-bio-v2/
    type: vendor_page
    quote: Eight categories of physiological data, fetchable per day or across a range, with the raw datapoint series
      underneath every summary.
    retrieved: '2026-10-11'
  - url: https://sensorbio.com/product/sensor-bio-v2/
    type: vendor_page
    quote: 'Stages: REM, deep, light, and awake, derived from HR, HRV, respiratory rate, and movement'
