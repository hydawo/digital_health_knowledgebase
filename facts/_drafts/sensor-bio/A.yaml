- field: raw_streams
  status: stated
  value: Raw three-wavelength PPG (green, red, infrared), inter-beat intervals and three-axis accelerometer, export
    up to 100 Hz, plus skin temperature. Raw export is gated to enterprise-tier partner accounts, via the RPM dashboard
    export; the mobile SDK live stream carries raw PPG and motion during active recording sessions. The REST API
    raw-download endpoint does not support V2.
  confidence: Verified
  sources:
  - url: https://sensorbio.com/product/sensor-bio-v2/
    type: vendor_page
    quote: Raw PPG, IBI, and accelerometer export up to 100 Hz
    retrieved: '2026-10-11'
