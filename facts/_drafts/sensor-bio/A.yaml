- field: research_program
  status: stated
  value: 'No named academic program. Research is one of three marketed segments of the Sensor Bio B2B platform (raw
    data access, IRB-friendly workflows). The legacy Biostrap research page describes a "Research Mode" in the RPM
    dashboard: data access hierarchies, de-identified user IDs, de-identified downloads and compliance management.'
  confidence: Verified
  sources:
  - url: https://sensorbio.com/
    type: vendor_page
    quote: Raw data access, IRB-friendly workflows, and reproducible signal quality for academic and research studies.
    retrieved: '2026-10-11'
  - url: https://biostrap.com/research/
