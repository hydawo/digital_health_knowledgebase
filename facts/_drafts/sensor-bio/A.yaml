- field: sampling_rates
  status: stated
  value: PPG and accelerometer at 50 Hz by default, configurable per organisation to 25 or 100 Hz, with configurable
    duty cycle. HR at 1-second resolution during active captures and 1-minute averages otherwise. HRV sampled every
    2 minutes overnight; HRV and respiratory rate need at least 50 Hz.
  confidence: Verified
  sources:
