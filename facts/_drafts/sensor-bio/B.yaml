# ---------------- Data access and terms ----------------
- field: raw_streams
  status: stated
  value: 'Raw three-wavelength PPG (green, red, infrared), inter-beat intervals and three-axis accelerometer, exported
    at up to 100 Hz, gated to enterprise-tier accounts; also available in the RPM dashboard. A live stream during
    active recordings carries raw PPG, IBI, HR, HRV, respiratory rate, SNR and motion. Skin temperature is captured.'
  confidence: Verified
  sources:
  - url: https://sensorbio.com/product/sensor-bio-v2/
    type: vendor_page
    quote: Raw PPG, IBI, and accelerometer export up to 100 Hz
    retrieved: '2026-10-21'
  - url: https://sensorbio.com/product/sensor-bio-v2/
    type: vendor_page
    quote: During an active recording session the band streams HR, HRV, respiratory rate, beat-to-beat intervals, raw
      PPG, signal-to-noise ratio, and motion.
    retrieved: '2026-10-21'
  - url: https://sensorbio.com/science/
    type: vendor_page
    quote: Sensor Bio provides access to raw and/or processed PPG, gyroscope, and accelerometer data to researchers via
      the RPM dashboard.
    retrieved: '2026-10-21'
  recheck_by: '2026-11-20'
  note: The Science page lists gyroscope data, but the V2 hardware specification lists only PPG, a three-axis
    accelerometer and a skin-temperature sensor. Gyroscope may apply to older Biostrap devices only. Ask Sensor Bio.
- field: derived_metrics
  status: stated
  value: 'HR, HRV (rMSSD, HRV-CV, LF/HF; SDNN, SD1/SD2 in spot checks), respiratory rate, skin temperature deviation,
    steps, activity score, calories, sleep stages and sleep, recovery and circadian scores, stress index and ANS
    balance. HRV and respiratory rate need at least 50 Hz sampling. SpO2 is announced but not yet live.'
  confidence: Verified
  sources:
  - url: https://sensorbio.com/product/sensor-bio-v2/
    type: vendor_page
    quote: Reports rMSSD, HRV-CV, and sympathetic-shifted LF/HF
    retrieved: '2026-10-21'
  - url: https://sensorbio.com/product/sensor-bio-v2/
    type: vendor_page
    quote: 'Stages: REM, deep, light, and awake, derived from HR, HRV, respiratory rate, and movement'
    retrieved: '2026-10-21'
  - url: https://sensorbio.com/product/sensor-bio-v2/
    type: vendor_page
    quote: Like HRV, requires at least 50 Hz PPG sampling. Not available at 25 Hz.
    retrieved: '2026-10-21'
  - url: https://sensorbio.com/product/sensor-bio-v2/
    type: vendor_page
    quote: Coming soon. Wellness-level SpO
    retrieved: '2026-10-21'
  recheck_by: '2026-11-20'
- field: sampling_rates
  status: conflict
  value: The V2 specification gives PPG sampling of 50 Hz by default, configurable to 25 or 100 Hz per organization,
    with HR at 1-second resolution during active captures and 1-minute averages otherwise, and HRV every 2 minutes
    overnight. A May 2026 press release claims raw signals at 15,000 samples per second.
  confidence: Unclear
  sources:
  - url: https://sensorbio.com/product/sensor-bio-v2/
    type: vendor_page
    quote: 50 Hz by default, configurable to 25 or 100 Hz per organization
    retrieved: '2026-10-21'
  - url: https://sensorbio.com/product/sensor-bio-v2/
    type: vendor_page
    quote: 1-second sampling during active captures, 1-minute averages otherwise
    retrieved: '2026-10-21'
  - url: https://sensorbio.com/press/sensor-bio-joins-innovators-network-at-american-heart-association-center-for-hea/
    type: vendor_page
    quote: captures raw physiological signals at 15,000 samples per second
    retrieved: '2026-10-21'
  recheck_by: '2026-11-20'
  note: The 15,000 figure may describe an internal sensor rate or an aggregate across channels; exported raw data
    is documented at up to 100 Hz. Treat 100 Hz as the researcher-facing ceiling until Sensor Bio explains.
- field: history_depth
  status: stated
  value: Cloud history is retained per deployment as configured with the partner. Each export covers a 1 to 7 day
    window for raw sensor data and 1 to 30 days for computed metrics. The band buffers about 14 days at default
    sampling, overwriting the oldest data.
  confidence: Verified
  sources:
  - url: https://sensorbio.com/product/sensor-bio-v2/
    type: vendor_page
    quote: Configured per deployment to retain the history the partner actually needs
    retrieved: '2026-10-21'
  - url: https://sensorbio.com/product/sensor-bio-v2/
    type: vendor_page
    quote: Raw sensor metrics export across a 1 to 7 day window Computed metrics export across a 1 to 30 day window
    retrieved: '2026-10-21'
  - url: https://sensorbio.com/product/sensor-bio-v2/
    type: vendor_page
    quote: Approximately 14 days of data at default duty-cycled sampling, overwriting oldest data when full
    retrieved: '2026-10-21'
  recheck_by: '2026-11-20'
- field: export_routes
  status: stated
  value: RPM web dashboard with raw and derived export (CSV or JSON, up to 2 GB per file); cloud API; mobile SDK
    over BLE with eight data categories, a bulk date-range pull and a live stream; EMR/EHR integration; participant
    self-download via the Privacy Center. Third-party aggregators (Terra, Spike) list a Biostrap web API connection
    for derived metrics.
  confidence: Verified
  sources:
  - url: https://sensorbio.com/product/sensor-bio-v2/
    type: vendor_page
    quote: CSV or JSON, up to 2 GB per file
    retrieved: '2026-10-21'
  - url: https://sensorbio.com/product/sensor-bio-v2/
    type: vendor_page
    quote: Customizable RPM, remote patient monitoring, dashboard with raw and derived export
    retrieved: '2026-10-21'
  - url: https://sensorbio.com/science/
    type: vendor_page
    quote: Processed biosignal data is accessible to external applications, EMR/EHR systems, wellness platforms, and
      hospital networks via standardized API interfaces.
    retrieved: '2026-10-21'
  - url: https://sensorbio.com/privacy-policy/
    type: vendor_legal
    quote: you can acquire a download of your information in a commonly used file format
    retrieved: '2026-10-21'
  - url: https://tryterra.co/integrations/biostrap
    type: secondary
    quote: Terra manages the Biostrap API credentials, so there is nothing to register
