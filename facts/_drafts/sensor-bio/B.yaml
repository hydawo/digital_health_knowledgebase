    type: vendor_page
    quote: Data model, retention, and reporting shaped to the environment
    retrieved: '2026-10-21'
  - url: https://sensorbio.com/privacy-policy/
    type: vendor_legal
    quote: while most of your information will be deleted within 30 days, it may take up to 90 days to delete all of
      your information
    retrieved: '2026-10-21'
  recheck_by: '2026-11-20'
- field: ai_training_terms
  status: not_public
