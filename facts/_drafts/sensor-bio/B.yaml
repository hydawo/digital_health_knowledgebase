- field: deprecations
  status: stated
  value: The Biostrap brand has been retired in favor of Sensor Bio; Biostrap and Biostrap Kairos users are routed
    to Sensor Bio support, and the iOS app was renamed from MySensr. No dated shutdown of legacy Biostrap devices,
    apps or integrations is published. SpO2 on V2 is announced as coming soon.
  confidence: Verified
  sources:
