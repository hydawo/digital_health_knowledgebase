facts:
# ---------------- Research access ----------------
- field: research_program
  status: stated
  value: No named academic program. Sensor Bio sells a research offering (raw PPG and derived data, IRB-friendly
    workflows, RPM dashboard) through its partnership sales route. The legacy Biostrap research page, still live,
    describes a HIPAA-compliant Research Mode in the RPM dashboard with de-identified user IDs and de-identified
    downloads, plus custom algorithm development.
  confidence: Verified
  sources:
  - url: https://sensorbio.com/
    type: vendor_page
    quote: Raw data access, IRB-friendly workflows, and reproducible signal quality for academic and research studies.
    retrieved: '2026-10-21'
  - url: https://biostrap.com/research/
    type: vendor_page
    quote: assign de-identified Unique User ID's or download de-identified data, and efficiently manage participant
      compliance via the Biostrap User Management dashboard
    retrieved: '2026-10-21'
  - url: https://biostrap.com/
    type: vendor_page
    quote: Biostrap provides full support including custom algorithm development, streamlined access to high-fidelity
      raw or derived longitudinal data, integrated surveys and more.
    retrieved: '2026-10-21'
  recheck_by: '2026-11-20'
  note: The biostrap.com pages carry a "Biostrap is now Sensor Bio" banner and are the only place the Research Mode
    features are described; sensorbio.com does not yet describe them. Ask Sensor Bio whether Research Mode carried over.
- field: program_eligibility
  status: stated
  value: Aimed at IRB-approved and funded studies, institutions and research teams. No eligibility criteria are
    published.
  confidence: Verified
  sources:
