    2025-10-01 (see deprecations).
- field: rate_limits
  status: not_applicable
  note: No API is offered.
- field: retention_terms
  status: stated
  value: 'Personal data kept only as long as necessary for the policy purposes or as required by law; data in backup
    archives that cannot be deleted at once is isolated until deletion is possible; anonymised data may be used
    indefinitely. Blood Pressure Trends (Beta) raw PPG cannot be physically deleted per user during the Beta and is
    anonymised within 90 days after the Beta ends.'
  confidence: Verified
  sources:
  - url: https://ringconn.com/pages/ringconn-app-privacy-policy
    type: vendor_legal
    quote: We will only store your personal information for as long as necessary for the purposes described in this Policy
      and for as long as required by law, regulation and supervision
    retrieved: '2026-10-21'
  - url: https://ringconn.com/pages/ringconn-app-privacy-policy
    type: vendor_legal
    quote: Where the immediate deletion is not possible, for example, because your Personal Information has been stored
      in backup archives, then we will securely store your Personal Information and isolate it from any further processing
      until deletion is possible.
    retrieved: '2026-10-21'
  - url: https://ringconn.com/pages/ringconn-app-privacy-policy
    type: vendor_legal
    quote: If we anonymize your personal information (so that it can no longer be associated with you), we may use this
      information indefinitely without further notice to you.
    retrieved: '2026-10-21'
  - url: https://ringconn.com/pages/ringconn-app-privacy-policy
    type: vendor_legal
    quote: PPG Raw Signal Data Due to technical architecture limitations, physical deletion for individual users is not
      possible during the Beta period.
    retrieved: '2026-10-21'
  recheck_by: '2026-11-20'
  note: App privacy policy dated April 8, 2026. Until 2026-10-17 a RingConn blog article claimed "We don't keep hidden
    copies or backup versions of deleted data"; the rewrite now defers to the policy's backup-isolation wording.
- field: ai_training_terms
  status: stated
  value: 'Only the Blood Pressure Trends (Beta) policy addresses training: that data is used only to train RingConn''s own
    algorithm models, not for other health products or any third party''s training. The general policy allows use of
    personal data to improve products and indefinite use of anonymised data, and sharing of aggregated non-personal data
    with partners, without an explicit AI-training clause.'
  confidence: Verified
  sources:
  - url: https://ringconn.com/pages/ringconn-app-privacy-policy
    type: vendor_legal
    quote: The above data will only be used for training and optimizing RingConn‘s own algorithm models. It will not be
      used to develop other products related to your health, nor will it be provided to any third party for their algorithm
      training or product development.
    retrieved: '2026-10-21'
  - url: https://ringconn.com/pages/ringconn-app-privacy-policy
    type: vendor_legal
    quote: We may share non-personal data that is aggregated so that it cannot reasonably be used to identify an individual
      with or without combining additional information.
    retrieved: '2026-10-21'
  recheck_by: '2026-11-20'
  scope: App privacy policy (all users), with the training restriction specific to Blood Pressure Trends (Beta)
- field: deprecations
  status: stated
  value: Google Fit sync ended 2025-10-01 23:00 UTC, replaced by Android Health Connect. HRV is not yet synced to Health
