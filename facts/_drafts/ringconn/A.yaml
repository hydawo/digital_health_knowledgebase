- field: history_depth
  status: stated
  value: 'On the ring: offline storage of up to 10 days (Gen 3) or 7 days (Gen 2, Gen 2 Air) before data is lost if not
    synced. In the account: history is kept while the account is active (no cap published); no API exists for
    retrieval.'
  confidence: Verified
  sources:
  - url: https://ringconn.com/pages/product-compare
    type: vendor_page
    quote: Offline Data Storage Duration Offline Data Storage Duration 10 days 7 days 7 days
    retrieved: '2026-10-21'
  - url: https://cdn.shopify.com/s/files/1/0850/1769/0420/files/RingConn_Gen_3_Manual_Instruction_English.pdf?v=1779691635
    type: vendor_docs
    quote: The RingConn Ring can store data for up to 10 days, though the actual storage duration may vary depending on
      the ring model and usage frequency.
    retrieved: '2026-10-21'
  recheck_by: '2026-11-20'
  note: The account-history clause ("as long as your account is active") was quoted on 2026-10-11 from the data-security
    article, which was rewritten on 2026-10-17 and no longer says it; the app policy's general "as long as necessary"
    retention clause applies.
- field: export_routes
  status: stated
  value: 'Apple Health (iOS) and Android Health Connect (Android 9 or later), both user-authorised per data type.
    Portability on request under the app privacy policy (structured, machine-readable format) via account settings or
    data_protect@ringconn.com. An in-app CSV export was reported in a December 2023 app update. No API, SDK, web
    dashboard or bulk researcher export.'
  confidence: Corroborated
  sources:
  - url: https://ringconn.com/blogs/news/ringconn-will-migrate-from-google-fit-to-health-connect
    type: vendor_page
    quote: There is currently an algorithm compatibility issue, so we do not support syncing your HRV data at this time.
    retrieved: '2026-10-21'
  - url: https://ringconn.com/pages/ringconn-app-privacy-policy
    type: vendor_legal
    quote: When you authorize third-party applications (such as Apple Health) to access your data, we may share relevant
      health data with them based on your instructions.
    retrieved: '2026-10-21'
  - url: https://ringconn.com/pages/ringconn-app-privacy-policy
    type: vendor_legal
    quote: You have the right to data portability in circumstances where we rely on contractual necessity and consent
      as our legal basis. This means that you have the right to receive your data in a structured, commonly used, and
      machine-readable format and to share it with a third party.
    retrieved: '2026-10-21'
  - url: https://ringconn.com/blogs/news/smart-ring-health-data-security
    type: vendor_page
    quote: The policy describes access and portability rights subject to applicable law. Use account settings or contact
