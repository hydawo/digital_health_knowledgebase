# ---------------- Data access and terms ----------------
- field: raw_streams
  status: not_public
  confidence: Corroborated
  sources:
  - url: https://ringconn.com/pages/ringconn-app-privacy-policy
    type: vendor_legal
    quote: The RingConn smart ring uses built-in sensors (such as PPG(a light-based sensor), accelerometers, temperature
      sensors, and SpO₂ sensors) to collect raw measurement data.
    retrieved: '2026-10-21'
  - url: https://ringconn.com/blogs/news/ringconn-will-migrate-from-google-fit-to-health-connect
    type: vendor_page
    retrieved: '2026-10-21'
  recheck_by: '2026-11-20'
  note: The ring collects raw PPG, accelerometer, temperature and SpO2 measurements, but no route gives researchers the
    raw signals. Published export routes carry processed records only.
- field: derived_metrics
  status: stated
  value: 'Via Health Connect (Android): resting energy, steps, exercise calories; time in bed, awake duration, sleep
    stages; resting and average heart rate; height; weight; oxygen saturation. HRV is not synced to Health Connect
    ("algorithm compatibility issue"). Apple Health sync shares "relevant health data" per user permissions, with the
    category list not published. Blood Pressure Trends (Beta) results are never shared with third-party platforms.
    In-app only: sleep/stress/recovery scores, respiratory rate, skin temperature trends and other proprietary metrics.'
  confidence: Verified
  sources:
  - url: https://ringconn.com/blogs/news/ringconn-will-migrate-from-google-fit-to-health-connect
    type: vendor_page
    quote: Activity Data Resting energy, steps, calories burned during exercise Sleep Time in bed, awake duration, sleep
      stages Heart Rate Resting heart rate, average heart rate
    retrieved: '2026-10-21'
  - url: https://ringconn.com/blogs/news/ringconn-will-migrate-from-google-fit-to-health-connect
    type: vendor_page
    quote: Blood Oxygen Oxygen saturation
    retrieved: '2026-10-21'
  - url: https://ringconn.com/blogs/news/ringconn-will-migrate-from-google-fit-to-health-connect
    type: vendor_page
    quote: There is currently an algorithm compatibility issue, so we do not support syncing your HRV data at this time.
    retrieved: '2026-10-21'
  - url: https://ringconn.com/pages/ringconn-app-privacy-policy
    type: vendor_legal
    quote: When you authorize third-party applications (such as Apple Health) to access your data, we may share relevant
