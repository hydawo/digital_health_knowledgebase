  confidence: Verified
  sources:
  - url: https://ringconn.com/blogs/news/ringconn-will-migrate-from-google-fit-to-health-connect
    type: vendor_page
    quote: RingConn will officially cease synchronizing your health data with Google Fit as of October 1, 2025, 23:00 (UTC+0)
    retrieved: '2026-10-21'
  recheck_by: '2026-11-20'
