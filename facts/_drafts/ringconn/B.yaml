- field: derived_metrics
  status: stated
  value: 'Via Health Connect (Android): resting energy, steps, exercise calories, time in bed, awake duration, sleep
    stages, resting and average heart rate, height, weight, SpO2. HRV is not exported to Health Connect. Apple Health
    sync covers "certain health metrics"; the list is not published.'
