- field: export_routes
  status: stated
  value: Participant-side only. Sync to Apple Health (iOS) and Health Connect (Android; Google Fit ended 2025-10-01);
    data portability request through account settings or data_protect@ringconn.com; an in-app CSV export was
    reported in 2023 by a third party. No Strava sync, no web dashboard, no API.
  confidence: Corroborated
  sources:
  - url: https://ringconn.com/pages/ringconn-app-privacy-policy
    type: vendor_legal
    quote: "You may choose to sync your RingConn data with third-party health platforms (e.g., Apple Health), in which case, we may receive or share certain health metrics according to your permissions and settings in those platforms."
    retrieved: '2026-10-21'
  - url: https://ringconn.com/pages/ringconn-app-privacy-policy
    type: vendor_legal
    quote: "You are entitled to obtain a copy of your personal data in structured, commonly used and machine-readable formats to the extent permitted by laws and regulations."
    retrieved: '2026-10-21'
  - url: https://ringconn.com/blogs/news/smart-ring-health-data-security
    type: vendor_page
