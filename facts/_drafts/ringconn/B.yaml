  note: The 2026-10-17 rewrite of the data-security article dropped its earlier claim that account settings let users
    download all data in standard formats. Sahha lists RingConn among sources read on-device through Apple Health or
    Health Connect, without its cloud-API marker; Terra, Thryve, Spike, ROOK and Open Wearables pages did not mention
    RingConn on 2026-10-11. So for studies, data reaches a researcher only via the participant's phone health store
    or a manual export.
- field: rate_limits
  status: not_applicable
  recheck_by: '2026-11-20'
  note: No API.
- field: retention_terms
  status: stated
  value: Kept as long as necessary for the stated purposes and as required by law; backups that cannot be deleted
    at once are isolated until deletion; anonymised data may be used indefinitely. Blood Pressure Trends beta raw
    signals cannot be physically deleted per user during the beta and are anonymised within 90 days after it ends.
  confidence: Verified
  sources:
  - url: https://ringconn.com/pages/ringconn-app-privacy-policy
    type: vendor_legal
    quote: "We will only store your personal information for as long as necessary for the purposes described in this Policy and for as long as required by law, regulation and supervision"
    retrieved: '2026-10-21'
  - url: https://ringconn.com/pages/ringconn-app-privacy-policy
    type: vendor_legal
    quote: "If we anonymize your personal information (so that it can no longer be associated with you), we may use this information indefinitely without further notice to you."
    retrieved: '2026-10-21'
  - url: https://ringconn.com/pages/ringconn-app-privacy-policy
    type: vendor_legal
    quote: "Due to technical architecture limitations, physical deletion for individual users is not possible during the Beta period."
    retrieved: '2026-10-21'
  recheck_by: '2026-11-20'
  note: App Privacy Policy last updated April 8, 2026.
- field: ai_training_terms
  status: stated
  value: Data from the Blood Pressure Trends beta (questionnaires, tags, entered BP values, ring PPG data) is used for
    algorithm optimisation and only for RingConn's own models, never given to third parties for their training.
    General data may be used in pseudonymised or aggregated form to improve products; no wider AI-training clause.
  confidence: Verified
  sources:
  - url: https://ringconn.com/pages/ringconn-app-privacy-policy
    type: vendor_legal
    quote: "will be used for algorithm optimization, feature iteration, and product improvement."
    retrieved: '2026-10-21'
  - url: https://ringconn.com/pages/ringconn-app-privacy-policy
    type: vendor_legal
    quote: "It will not be used to develop other products related to your health, nor will it be provided to any third party for their algorithm training or product development."
    retrieved: '2026-10-21'
  recheck_by: '2026-11-20'
- field: deprecations
  status: stated
  value: Google Fit sync ended 2025-10-01 23:00 UTC; Android sync moved to Health Connect. Separately, after a 2025 US
    ITC ruling for Oura, Oura granted RingConn a multi-year patent licence (royalty-bearing) so US sales and the app
    continue.
  confidence: Verified
  sources:
  - url: https://ringconn.com/blogs/news/ringconn-will-migrate-from-google-fit-to-health-connect
    type: vendor_docs
    quote: "RingConn will officially cease synchronizing your health data with Google Fit as of October 1, 2025, 23:00 (UTC+0)"
