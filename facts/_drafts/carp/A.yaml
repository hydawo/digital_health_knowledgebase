# ---------------- Data access and terms ----------------
- field: raw_streams
  status: stated
  value: 'Via CAMS sampling packages (own app) or the CARP Studies app: accelerometer (with and without gravity),
    gyroscope, magnetometer, step events, ambient light (Android), battery, screen events (Android), location,
    activity recognition, Bluetooth and Wi-Fi scans, connectivity, audio and noise, installed apps and app usage
    (Android), call and SMS logs (Android), calendar, surveys and cognitive tests, Apple Health and Health Connect
    data, Polar (ACC, gyro, magnetometer, ECG, PPI, PPG, HR), Movesense (HR, ECG, IMU, temperature, tap state),
    Movisens (Android), eSense, and Apple Watch via the AWARE watchOS framework. The Studies app uses a subset.'
  confidence: Verified
  sources:
  - url: https://docs.carp.dk/carp-mobile-sensing/sampling-packages/available-packages/
    type: vendor_docs
    quote: Inertial measurement (accelerometer, gyroscope, magnetometer) and heart rate (ECG, PPI, PPG, HR) data from
      the Polar devices
    retrieved: '2026-10-11'
  - url: https://docs.carp.dk/carp-mobile-sensing/sampling-packages/available-packages/
    type: vendor_docs
    quote: Rate of change in velocity in x, y, z - including gravity
    retrieved: '2026-10-11'
  - url: https://carp.dk/new-carp-studies-app/
    type: vendor_page
    quote: Heart rate and ECG from Polar and Movesense sensors.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
  note: Platform split per measure is in the available-packages table (for example screenevent, wifi, apps, phonelog
    are Android only; watch.aware is iOS only).
- field: derived_metrics
  status: stated
  value: Mobility features (from the mobility_features plugin), acceleration features, OS activity recognition
    (confidence below 50% discarded), geofence events, app heartbeat; the Studies app shows participants weekly
    cards for steps, heart rate, sleep and mobility. Server-side analysis is via a Python data processing pipeline in
    CAWS.
  confidence: Verified
  sources:
  - url: https://docs.carp.dk/carp-mobile-sensing/sampling-packages/available-packages/
    type: vendor_docs
    quote: Track location and calculates mobility features based on the mobility_features plugin
    retrieved: '2026-10-11'
  - url: https://docs.carp.dk/carp-mobile-sensing/sampling-packages/available-packages/
    type: vendor_docs
    quote: Acceleration events over a specific sampling period and calculates higher-order features
    retrieved: '2026-10-11'
  - url: https://carp.dk/caws/
    type: vendor_page
    quote: A Python-based library allows researchers to program analysis scripts in Python and deploy these to the
      data processing pipeline.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: sampling_rates
  status: stated
  value: Configurable per measure in the protocol. Documented defaults include ambient light 10 seconds every 5
    minutes, an app heartbeat every 15 minutes, and upload to CAWS every 10 minutes. Wearable sampling rates (Polar,
    Movesense) are not documented on the CARP pages.
  confidence: Verified
  sources:
  - url: https://docs.carp.dk/carp-mobile-sensing/domain/measures-and-data/
    type: vendor_docs
    quote: the default configuration of the light measure is 10 seconds sampling every 5 minutes
    retrieved: '2026-10-11'
  - url: https://docs.carp.dk/carp-mobile-sensing/sampling-packages/available-packages/
    type: vendor_docs
    quote: A heartbeat measurement every 15 minutes (default) telling if the app is running
    retrieved: '2026-10-11'
  - url: https://docs.carp.dk/backends/where-data-goes/caws/
    type: vendor_docs
    quote: uploads it automatically, every 10 minutes by default
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: history_depth
  status: stated
  value: Phone sensing is prospective from enrolment. Health data (Apple Health, Health Connect) is sampled back to
    the last sampling time; no documented limit on how far back the first read goes. Health data only collects while
    the app is in the foreground and the phone unlocked.
  confidence: Corroborated
  sources:
  - url: https://docs.carp.dk/sampling-packages/health/configure/
    type: vendor_docs
    quote: which samples data back in time until last time, data was sampled
    retrieved: '2026-10-11'
  - url: https://docs.carp.dk/sampling-packages/health/configure/
    type: vendor_docs
    quote: Health data can only be collected when the app is in the foreground and the phone is unlocked.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: export_routes
  status: stated
