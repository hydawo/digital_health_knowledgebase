# ---------------- Pricing ----------------
- field: device_price
  status: not_applicable
  note: Software platform. Supported wearables (Polar, Movesense, Movisens, eSense, Apple Watch) are bought from their
    makers.
- field: subscription_price
  status: not_applicable
  note: No consumer subscription. The CARP Studies app is free on the App Store and Google Play.
- field: academic_pricing
  status: stated
  value: 'DTU-hosted service: normally budgeted inside the joint project. Smaller projects may pay as they go under the
    DTU research price model (actual cost plus 44% overhead, staff time billed monthly), plus a monthly Computerome-based
    operations fee; invoiced about yearly. Staff rates 2024, DKK per month: student assistant 16,700, research assistant
    68,100, researcher 78,000, senior researcher 105,000.'
  confidence: Verified
  sources:
  - url: https://carp.dk/hosting/
    type: vendor_legal
    quote: This entails that we invoice for the actual cost plus a 44% overhead and include time spent monthly.
    retrieved: '2026-10-11'
  - url: https://carp.dk/hosting/
    type: vendor_legal
    quote: The table below shows these prices (2024 prices in DKK).
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: api_platform_fees
