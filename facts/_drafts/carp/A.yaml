# ---------------- Research access ----------------
- field: research_program
  status: stated
  value: 'No formal research program as such. DTU Health Tech runs a hosted CARP instance (CAWS, the CARP Study
    Portal and the CARP Studies app) on Computerome for research projects in which DTU Health Tech is an active
    research partner. Outside that, the components are open source for self-hosting or custom apps.'
  confidence: Verified
  sources:
  - url: https://carp.dk/hosting/
    type: vendor_legal
    quote: hosts and operates an instance of CARP, including an instance of CARP Web Services (CAWS), the CARP Study
      Portal, and the CARP Study App
    retrieved: '2026-10-11'
  - url: https://carp.dk/hosting/
    type: vendor_legal
    quote: this DTU hosting service is only provided for projects where we (DTU Health Tech) are an active research
      partner
    retrieved: '2026-10-11'
  - url: https://carp.dk/about/
    type: vendor_page
    quote: 'There are basically three ways to use CARP : (i) use our open-source components in creating your own mobile
      health technology; (ii) install your own version of CARP on your own servers; or (iii) use our hosted services
      at DTU'
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: program_eligibility
  status: conflict
  value: 'The hosting terms limit the DTU-hosted service to projects where DTU Health Tech is an active research
    partner (helped initiate, fund and define the protocol, and takes part in publication). The newer documentation
    site is looser: DTU researchers can use it, and anyone planning a good study is invited to get in touch.'
  confidence: Unclear
