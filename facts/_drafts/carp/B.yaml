- field: history_depth
  status: stated
  value: >-
    Prospective collection from enrolment. Probes that read stored data (app usage, calls and texts)
    look back one day by default, configurable. Health Connect / Apple Health measures read back to
    the last successful sample. On the hosted server, data is kept for the study and at least five
    years.
  confidence: Verified
  sources:
  - url: https://docs.carp.dk/api/carp_mobile_sensing/domain/historicsamplingconfiguration/
    type: vendor_docs
    quote: "How far back in time to collect data. Default is one day."
