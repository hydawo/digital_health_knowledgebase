  recheck_by: 2026-11-09
- field: sampling_rates
  status: stated
  value: >-
    Configurable per measure in the study protocol. Defaults: accelerometer, gyroscope and
    magnetometer every 200 ms (5 Hz); ambient light 10 s every 5 min; accelerometer features 3 s
    every minute; app heartbeat every 15 min. Timestamps are in microseconds. Data uploads to CAWS
    every 10 minutes by default.
  confidence: Verified
  sources:
  - url: https://github.com/carp-dk/carp.sensing-flutter/blob/main/carp_mobile_sensing/lib/infrastructure/sampling_packages/sensors/sensor_package.dart
    fetch_url: https://raw.githubusercontent.com/carp-dk/carp.sensing-flutter/main/carp_mobile_sensing/lib/infrastructure/sampling_packages/sensors/sensor_package.dart
    type: repository
    quote: "IntervalSamplingConfiguration(interval: const Duration(milliseconds: 200)),"
    retrieved: 2026-10-11
  - url: https://docs.carp.dk/carp-mobile-sensing/domain/measures-and-data/
    type: vendor_docs
    quote: "the default configuration of the light measure is 10 seconds sampling every 5 minutes"
    retrieved: 2026-10-11
  - url: https://docs.carp.dk/carp-mobile-sensing/sampling-packages/available-packages/
    type: vendor_docs
    quote: "A heartbeat measurement every 15 minutes (default) telling if the app is running"
    retrieved: 2026-10-11
  - url: https://docs.carp.dk/backends/where-data-goes/caws/
    type: vendor_docs
