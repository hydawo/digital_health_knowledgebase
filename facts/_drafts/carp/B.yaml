- field: raw_streams
  status: stated
  value: >-
    Raw phone sensors via CARP Mobile Sensing: accelerometer (with and without gravity), gyroscope,
    magnetometer, step events, ambient light (Android), location, activity recognition events,
    Bluetooth and Wi-Fi scans, microphone audio and noise, battery, screen events (Android), and
    on Android only call and SMS logs and app usage. Wearables: Polar accelerometer, gyroscope,
    magnetometer, ECG, PPI, PPG and HR; Movesense HR, ECG and IMU; Movisens; eSense; Apple Watch via
    AWARE. Health Connect and Apple Health records. All land on the CAWS server or a researcher's
    own endpoint. The ready-made CARP Studies app collects a subset.
  confidence: Verified
  sources:
  - url: https://docs.carp.dk/carp-mobile-sensing/sampling-packages/available-packages/
    type: vendor_docs
    quote: "Rate of change in velocity in x, y, z - including gravity"
    retrieved: 2026-10-11
  - url: https://docs.carp.dk/carp-mobile-sensing/sampling-packages/available-packages/
    type: vendor_docs
    quote: "Inertial measurement (accelerometer, gyroscope, magnetometer) and heart rate (ECG, PPI, PPG, HR) data from the Polar devices"
    retrieved: 2026-10-11
  - url: https://docs.carp.dk/carp-mobile-sensing/sampling-packages/available-packages/
    type: vendor_docs
    quote: "Log of text messages (sms) in/out"
    retrieved: 2026-10-11
  - url: https://carp.dk/new-carp-studies-app/
    type: vendor_page
    quote: "Heart rate and ECG from Polar and Movesense sensors."
    retrieved: 2026-10-11
  recheck_by: 2026-11-09
  note: The docs table marks ambient light, screen events, Wi-Fi, app lists, app usage, call logs and SMS as Android only.
- field: derived_metrics
  status: stated
  value: >-
    On-phone features: mobility features from location (places, home stay, distance), accelerometer
    higher-order features over a window, ambient light summaries (mean, std, min, max lux), noise
    level. The CARP Studies app shows weekly cards for steps, heart rate, sleep (stages from
    Health Connect / Apple Health), mobility and task progress. No server-side analytics pipeline
    is documented.
  confidence: Verified
  sources:
  - url: https://docs.carp.dk/carp-mobile-sensing/sampling-packages/available-packages/
    type: vendor_docs
    quote: "Track location and calculates mobility features based on the mobility_features plugin"
