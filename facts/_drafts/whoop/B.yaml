- field: derived_metrics
  status: stated
  value: 'Per cycle: strain, kilojoules, average and max HR, step count. Recovery: score, RHR, HRV (RMSSD), SpO2
    and skin temperature (4.0 and later). Sleep: stage durations, sleep need, respiratory rate, performance,
    consistency, efficiency. Workouts: strain, HR zones, distance. Body measurements and max HR'
  confidence: Verified
  sources:
  - url: https://developer.whoop.com/docs/developing/user-data/recovery
    type: vendor_docs
    quote: the Recovery object has objective measurements that factored into the score such as the resting heart
      rate (RHR), heart rate variability (HRV), and for 4.0 members, blood oxygen (SpO2) and skin temperature.
    retrieved: 2026-10-10
  - url: https://developer.whoop.com/docs/api-changelog
    type: vendor_docs
    quote: Cycles now include the total number of steps taken during the cycle.
    retrieved: 2026-10-10
  - url: https://developer.whoop.com/api
    type: vendor_docs
    quote: read:recovery - Read Recovery data, including score, heart rate variability, and resting heart rate.
    retrieved: 2026-10-10
  recheck_by: 2026-11-09
  note: Step count was added on 2026-09-23. Features sold in Peak and Life (Healthspan, Stress Monitor, ECG, Blood
    Pressure Insights) have no documented API scope.
