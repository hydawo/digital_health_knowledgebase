# ---------------- Data access and terms ----------------
- field: raw_streams
  status: stated
  value: 'Raw sensor events (timestamp, sensor id, payload) for every enabled sensor, via REST API, Python/JS SDKs,
    Cortex raw features or the dashboard Data Portal. Phone sensors on iOS and Android: GPS (raw, unhashed lat/long),
    accelerometer, device motion, device state (screen, battery), steps, nearby devices (Bluetooth/WiFi), telephony
    (call metadata with hashed contact), activity recognition. Health data from Apple HealthKit and Google Health
    Connect (heart rate, HRV, sleep, SpO2, respiratory rate, blood pressure, workouts and more), which is how
    wearables (Apple Watch, WearOS, Fitbit, Oura) are reached; no direct wearable connections. Apple SensorKit
    streams (app usage, message metadata, visits) only on enrolled research devices. Active data: surveys, 30+
    cognitive games with tap-level timing, voice recordings. Web app collects no passive data.'
  confidence: Verified
  sources:
  - url: https://docs.lamp.digital/sensors-data/data
    type: vendor_docs
    quote: Query sensor events for specific participants, time ranges, and types.
    retrieved: '2026-10-11'
  - url: https://docs.lamp.digital/sensors-data/reference/gps
    type: vendor_docs
    quote: GPS data is recorded as raw latitude/longitude coordinates. Coordinates are not hashed or anonymized in the
      raw data.
    retrieved: '2026-10-11'
  - url: https://docs.lamp.digital/sensors-data/configuration
    type: vendor_docs
    quote: mindLAMP does not connect directly to wearable devices.
    retrieved: '2026-10-11'
  - url: https://docs.lamp.digital/capabilities/collect
    type: vendor_page
    quote: On enrolled research devices, SensorKit adds app usage categories, text message metadata, and location visit
      types.
    retrieved: '2026-10-11'
  - url: https://docs.lamp.digital/sensors-data/configuration
    type: vendor_docs
    quote: The web version supports active data collection (surveys, games) and dashboard access but does not support
      passive sensor data.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: derived_metrics
  status: stated
  value: Cortex, an open-source Python package (lamp-cortex), computes raw (32 modules), primary (6) and secondary
    (23) features, for example significant locations, trips, home time, location entropy, trip distance, screen
    duration, step count, call and text frequency, HealthKit sleep duration and a data quality score, one row per
    participant per day. Researchers run it themselves against a LAMP server, or the Core runs default or custom
    analysis.
  confidence: Verified
  sources:
  - url: https://docs.lamp.digital/capabilities/analyze
    type: vendor_page
    quote: Cortex is mindLAMP's open-source Python library for turning raw sensor and activity data into research-ready
      behavioral features.
    retrieved: '2026-10-11'
  - url: https://docs.lamp.digital/sensors-data/data
    type: vendor_docs
    quote: Aggregate into behavioral measures (e.g., hometime , entropy , screen_duration , step_count ).
    retrieved: '2026-10-11'
  - url: https://research.bidmc.org/mindlamp/about
    type: vendor_page
    quote: The CORE can run default or custom analysis on your data.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: sampling_rates
  status: stated
  value: Accelerometer discrete sampling, default 5 Hz, maximum 5 Hz. GPS discrete, default 1 Hz, maximum 5 Hz, but
    mobile OS throttling means background GPS arrives at roughly 0.1 Hz or less. Rates are set through the API
    (sensor spec), not the dashboard Sensors tab. Telephony is continuous (one event per call).
  confidence: Verified
  sources:
  - url: https://docs.lamp.digital/sensors-data/configuration
    type: vendor_docs
    quote: Both rates can be adjusted at the sensor spec level through the API.
    retrieved: '2026-10-11'
  - url: https://docs.lamp.digital/sensors-data/configuration
    type: vendor_docs
