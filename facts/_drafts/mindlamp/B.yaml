# ---------------- Research access ----------------
- field: research_program
  status: stated
  value: 'mindLAMP Core, run by the Division of Digital Psychiatry at BIDMC: the supported deployment pathway for
    mindLAMP. It covers study design consultation, protocol optimization, privacy-aware configuration, hosting
    (shared BIDMC instance, dedicated BIDMC instance, or support for self-hosting), onboarding and training, data
    monitoring and Cortex analytics support, troubleshooting and optional custom development. There is no separate
    free research access program; the platform code itself is open source.'
  confidence: Verified
  sources:
  - url: https://www.digitalpsych.org/mindlamp-core
    type: vendor_page
    quote: mindLAMP Core is the supported deployment pathway for the mindLAMP platform, offered directly by the team
      at Beth Israel Deaconess Medical Center.
    retrieved: '2026-10-11'
  - url: https://research.bidmc.org/mindlamp/services
    type: vendor_page
    quote: The mindLAMP Core is a centralized service that supports research teams and clinical programs in using
      mindLAMP correctly, consistently, and responsibly.
