    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: program_eligibility
  status: stated
  value: Research groups and clinical programs. Individuals cannot sign up on their own; they use mindLAMP only by
    enrolling in a project or clinic that runs it (or a limited Self Help option). The app store listings say the
    app cannot be accessed by people outside a partner study or clinic. No other eligibility criteria are published.
