- field: hipaa_statement
  status: stated
  value: BIDMC says LAMP offers physical and technical safeguards in line with the HIPAA Security Rule (TLS 1.3 in
    transit, AES-256 at rest with per-site keys, access controls, audit logs) and supports HIPAA-compliant workflows.
    It also supplies suggested IRB language. A July 2025 penetration test by Echelon Risk + Cyber covered BIDMC
    infrastructure, and BIDMC recommends a separate pen test for other environments.
  confidence: Corroborated
