- field: deprecations
  status: stated
  value: 'Sensor identifiers superseded (data under old ids stays in historical records; Cortex handles both): gyroscope
    and magnetometer into device_motion, screen_state into device_state, calls and sms into telephony, bluetooth
    and wifi into nearby_device; distance, flights, weight and height removed. The v1 app (LAMP-app) and v1 backend
    (LAMP-portal) are deprecated (repositories archived). Cortex sms_number, bluetooth_device_count and accelerometer
    sleep_duration features replaced. The Data Portal UI is no longer actively updated. No dates are given for
    these changes.'
  confidence: Verified
  sources:
  - url: https://docs.lamp.digital/sensors-data/data
    type: vendor_docs
    quote: The following sensor identifiers have been superseded. Data collected under these identifiers may still appear
      in historical records.
    retrieved: '2026-10-11'
  - url: https://docs.lamp.digital/developer/architecture/components
    type: vendor_docs
    quote: 'Deprecated: LAMP-app : The mindLAMP v1 native app for iOS and Android. DO NOT USE.'
    retrieved: '2026-10-11'
