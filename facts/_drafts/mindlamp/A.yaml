  - url: https://docs.lamp.digital/get-started
    type: vendor_page
    retrieved: '2026-10-11'
  - url: https://digitalpsych.org/mindlamp-core
    type: vendor_page
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
  note: Nothing addresses AI or model training. The closest terms are in the privacy page, which says data used for
