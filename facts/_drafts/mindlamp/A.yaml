    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: rate_limits
  status: stated
  value: No request rate limit is documented. The documented constraint is page size (1,000 events per request by
    default). In the server source merged on 2026-09-30, new API keys are created with a cap of 1,000 requests per key
    per rate-limit window; the window is not set in mindLAMP's code (the auth library's default applies).
  confidence: Reported
  sources:
  - url: https://docs.lamp.digital/developer/api-sdks/python-sdk
    type: vendor_docs
    quote: Results are limited to 1000 entries per request.
    retrieved: '2026-10-11'
  - url: https://github.com/BIDMCDigitalPsychiatry/LAMP-server/blob/master/src/service/ApiKeyService.ts
    fetch_url: https://raw.githubusercontent.com/BIDMCDigitalPsychiatry/LAMP-server/master/src/service/ApiKeyService.ts
    type: repository
    quote: 'rateLimitMax: 1000,'
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
  note: Reported because the API-key limit comes from source code (the better-auth library, whose documented default
    window is one day) and it is not known whether that code is live on the BIDMC server; the authentication upgrade
    that introduces API keys had no release date as of the last blog post (July 2026).
- field: retention_terms
  status: stated
  value: Deleted content has a 90-day soft-deletion period (restorable on request), then is permanently deleted.
    Participants can delete their account in the app or by a Google form. Aggregated usage statistics may be kept
    indefinitely. Self-hosters control their own data and retention.
  confidence: Verified
  sources:
  - url: https://docs.lamp.digital/privacy
    type: vendor_legal
    quote: There is a soft-deletion period of 90 days during which the data is unavailable but may be restored by request.
      Once the 90 day period ends, the data is deleted permanently, after which it may no longer be recovered.
    retrieved: '2026-10-11'
  - url: https://docs.lamp.digital/privacy
    type: vendor_legal
    quote: This data may be kept for an indefinite amount of time
    retrieved: '2026-10-11'
  - url: https://docs.lamp.digital/privacy
    type: vendor_legal
    quote: If self-deploying the LAMP Platform, you will be in sole control and ownership of all data consumed or produced
      by the LAMP platform.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
  note: The Google Play data-safety panel says "Data can't be deleted", which sits awkwardly with the in-app delete
    button described on the privacy page. No default retention period for active studies on the BIDMC server is
    published; it is presumably set in the Core agreement.
