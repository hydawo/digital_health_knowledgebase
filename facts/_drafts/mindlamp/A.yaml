# ---------------- Research access ----------------
- field: research_program
  status: stated
  value: 'mindLAMP Core (also called Core Services), run by the BIDMC Division of Digital Psychiatry: the supported
    deployment pathway, giving research and clinical teams the full toolkit plus consultation, configuration, training
    and ongoing support. It is a paid service, not a free or grant-style program; the platform is described as
    compatible with grant funding and the team offers letters of support.'
  confidence: Verified
  sources:
  - url: https://digitalpsych.org/mindlamp-core
    type: vendor_page
    quote: mindLAMP Core is the supported deployment pathway for the mindLAMP platform, offered directly by the team
      at Beth Israel Deaconess Medical Center.
    retrieved: '2026-10-11'
  - url: https://digitalpsych.org/mindlamp-core
    type: vendor_page
    quote: The platform is compatible with grant funding and currently supports 50+ active sites worldwide.
    retrieved: '2026-10-11'
  - url: https://docs.lamp.digital/get-started
    fetch_url: https://docs.lamp.digital/assets/js/bf7df328.1cccf923.js
    type: vendor_page
    quote: We are happy to provide our services and support for grant purposes, including letters of support.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
  note: The FAQ answers on the Get Started page are rendered by JavaScript; the fetch_url is the page's Docusaurus
    chunk, whose hashed file name changes on every site rebuild, so re-find it if the quote goes missing. The older
    "LAMP Consortium" (the App Store listing still says the app "is used by members of the mindLAMP consortium")
    survives only in archived legacy docs in the LAMP-platform repo; current pages present mindLAMP Core instead.
    Self-hosting the open-source code needs no program at all.
- field: program_eligibility
  status: stated
  value: Research groups and clinical programs; the Core page lists clinical research studies, grant-funded projects,
    clinical care programs, international and multi-site deployments, and first-time users. Individuals cannot start
    their own project; they use mindLAMP by enrolling in a project or clinic that runs it (or the limited Self Help
    mode).
  confidence: Verified
  sources:
