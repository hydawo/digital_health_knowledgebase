- field: hipaa_statement
  status: stated
  value: 'BIDMC states that LAMP offers safeguards in line with the HIPAA Security Rule (access control, audit logs,
    integrity controls, encrypted transmission; AES-256 at rest with a per-site key, TLS 1.3 in transit) and that the
    platform supports HIPAA-compliant workflows. It is a self-description, not a certification. A third-party
    penetration test (Echelon Risk + Cyber) was run in July 2025 on a BIDMC test environment.'
  confidence: Corroborated
  sources:
  - url: https://docs.lamp.digital/privacy
    type: vendor_legal
    quote: LAMP offers physical and technical safeguards that are in line with the HIPAA Security Privacy Rule.
    retrieved: '2026-10-11'
  - url: https://docs.lamp.digital/privacy
    type: vendor_legal
    quote: As data is accepted by the server, it is stored in the data lake encrypted at rest using AES-256 encryption
      through a secret key unique to each site.
    retrieved: '2026-10-11'
  - url: https://docs.lamp.digital/get-started
    fetch_url: https://docs.lamp.digital/assets/js/bf7df328.1cccf923.js
    type: vendor_page
    quote: The platform supports HIPAA-compliant workflows, and deployment options can be tailored to meet your institutional
      data and privacy requirements.
    retrieved: '2026-10-11'
  - url: https://docs.lamp.digital/privacy
    type: vendor_legal
    quote: 'July 2025: Echelon Risk + Cyber previously performed penetration testing against both the Mobile and Web Application
      for mindLAMP in a test environment located on BIDMC infrastructure.'
    retrieved: '2026-10-11'
  recheck_by: '2027-01-08'
- field: gdpr_statement
  status: stated
  value: The architecture docs say AES-256 and TLS 1.3 enable storage and transmission "in a HIPAA, COPPA, and
    GDPR-compliant manner". No GDPR-specific policy (lawful basis, controller and processor roles, transfers) is
    published; the privacy page is US-oriented.
  confidence: Corroborated
  sources:
  - url: https://docs.lamp.digital/developer/architecture/data-flow
    type: vendor_docs
    quote: The industry encryption standards AES-256 and TLSv1.3 facilitate secure storage and transmission of data in
      a HIPAA, COPPA, and GDPR-compliant manner.
    retrieved: '2026-10-11'
  recheck_by: '2027-01-08'
  note: The AWS blog (2026-09-29) names GDPR and data sovereignty as reasons each site runs its own instance.
