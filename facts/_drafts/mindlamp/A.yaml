- field: hosting_options
  status: stated
  value: 'Three options: shared Core-hosted (BIDMC runs it; most projects), a dedicated isolated instance on Core
    infrastructure (Core maintains it), or self-hosted on the institution''s own infrastructure using containers
    (Docker Swarm per the draft deployment docs). BIDMC''s own hosting runs on AWS (ECS Fargate, DocumentDB) and is
    defined in Terraform; per the AWS blog, each of 65 sites stands up its own instance.'
  confidence: Verified
  sources:
