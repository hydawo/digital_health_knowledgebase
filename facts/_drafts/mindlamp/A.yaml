- field: deprecations
  status: stated
  value: '(1) Authentication upgrade: phase 1 (dashboard sign-in by server button) went live 2026-07-29; the later
    phase replaces basic auth with server sessions, mandatory 2FA or OAuth for staff, and API keys for LAMP-py, which
    will break scripts that connect with a username and password. No firm date was given; the server code was merged
    on 2026-09-30. Self-hosted servers are unaffected. (2) Sensor identifiers superseded: gyroscope and magnetometer
    into device_motion, screen_state into device_state, calls and sms into telephony, bluetooth and wifi into
    nearby_device; distance, flights, weight and height removed. (3) mindLAMP v1 app and LAMP-portal backend
    deprecated ("DO NOT USE"). (4) The dashboard was relicensed from BSD-3-Clause to AGPL-3.0 on 2026-08-05.'
  confidence: Verified
  sources:
  - url: https://docs.lamp.digital/blog/authentication-upgrade
    type: vendor_page
    quote: 'A developer or data scientist using LAMP-py (Python SDK) High : LAMP-py will require an API key instead of
      a username and password.'
    retrieved: '2026-10-11'
  - url: https://docs.lamp.digital/blog/authentication-upgrade
    type: vendor_page
