  - url: https://aws.amazon.com/blogs/industries/from-cloud-to-clinic-how-aws-powers-digital-psychiatry-at-scale/
    type: secondary
    quote: Each site stands up their own instance and retains their own data, satisfying data residency and sovereignty
      requirements without the BIDMC team needing to build each deployment individually.
