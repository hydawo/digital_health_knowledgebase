- field: data_residency
  status: stated
  value: Core-hosted data sits on BIDMC's AWS deployment (region not published). Teams with residency needs are steered
    to self-hosting, and the AWS blog says each site runs its own instance and keeps its own data. Institutions own
    their data.
  confidence: Corroborated
  sources:
  - url: https://docs.lamp.digital/capabilities/configure
    type: vendor_docs
    quote: Self-Hosted Best for institutions with data residency requirements Deploy on your own infrastructure using
      standard container technology.
