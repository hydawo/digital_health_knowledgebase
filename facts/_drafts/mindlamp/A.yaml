# ---------------- Data access and terms ----------------
- field: raw_streams
  status: stated
  value: 'Raw sensor events (timestamped JSON) from 9 phone sensors (GPS, accelerometer, device motion, device state,
    steps, nearby devices, telephony, analytics, activity recognition) and 10 HealthKit or Health Connect types (sleep,
    heart rate, HRV, respiratory rate, blood pressure, blood glucose, oxygen saturation, body temperature, workouts,
    nutrition), plus SensorKit streams on approved iOS research studies, and active data (surveys, cognitive games,
    voice recordings). Retrieved by REST API, Python, JavaScript and R SDKs, Cortex, or the dashboard Data Portal.
    Passive sensing works only in the mobile apps, not the web version.'
  confidence: Verified
  sources:
  - url: https://docs.lamp.digital/sensors-data/
    type: vendor_docs
    quote: mindLAMP supports 9 device sensors (GPS, accelerometer, device motion, device state, steps, nearby devices,
      telephony, analytics, activity recognition) and 10 health platform sensors that read from Apple HealthKit or Google
      Health Connect (sleep, heart rate, HRV, respiratory rate, blood pressure, blood glucose, oxygen saturation, body
      temperature, workouts, nutrition).
    retrieved: '2026-10-11'
  - url: https://docs.lamp.digital/sensors-data/data
    type: vendor_docs
    quote: Sensor event data — sometimes referred to as raw data — is what the Cortex pipeline uses to calculate higher-level
      behavioral metrics.
    retrieved: '2026-10-11'
  - url: https://docs.lamp.digital/sensors-data/configuration
    type: vendor_docs
    quote: The web version supports active data collection (surveys, games) and dashboard access but does not support
      passive sensor data.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
  note: Wearable data arrives only through HealthKit or Health Connect; the docs say mindLAMP does not connect
    directly to wearable devices. Watch companion apps (Apple Watch, WearOS) add wrist sensing.
- field: derived_metrics
  status: stated
  value: Cortex, the open-source Python package (pip install lamp-cortex), turns raw events into primary features
    (significant locations, trips, screen-on bouts, accelerometer jerk) and daily secondary features (home time,
    location entropy, trip distance and duration, screen duration, step count, call counts and degree, sleep duration,
    data quality, and more). Some features (unlocks, app time, texts, visits) need iOS SensorKit, which requires an
    Apple-approved research study.
  confidence: Verified
  sources:
  - url: https://docs.lamp.digital/capabilities/analyze
    type: vendor_docs
    quote: Cortex is mindLAMP's open-source Python library for turning raw sensor and activity data into research-ready
      behavioral features.
    retrieved: '2026-10-11'
  - url: https://docs.lamp.digital/developer/cortex/features/secondary-features/
    type: vendor_docs
    quote: These features require enrollment in an Apple-approved research study.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: sampling_rates
  status: stated
  value: Default accelerometer 5 Hz and GPS 1 Hz, both configurable at the sensor-spec level through the API (the
    dashboard Sensors tab only turns sensors on or off). The OS throttles background GPS, so the effective rate is often
    lower. Other sensors are continuous (event-driven) or interval-reported.
  confidence: Verified
  sources:
  - url: https://docs.lamp.digital/sensors-data/configuration
    type: vendor_docs
    quote: Accelerometer — 5 Hz (5 samples per second). Configurable via the frequency setting.
    retrieved: '2026-10-11'
  - url: https://docs.lamp.digital/sensors-data/configuration
    type: vendor_docs
    quote: GPS — 1 Hz (1 sample per second). Configurable via the frequency setting. In practice, mobile operating systems
      throttle background GPS delivery, so the effective rate is often lower than the configured rate
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: history_depth
  status: stated
  value: The query API takes from/to timestamps (Unix milliseconds) with no documented lookback limit; all data stored
    on the server for a participant can be retrieved. Requests return up to 1,000 events by default, so long ranges
    are paged by time window.
  confidence: Corroborated
  sources:
  - url: https://docs.lamp.digital/api/query-sensor-events-for-a-participant
    type: vendor_docs
    quote: The maximum number of events to return in the query. Positive values like +1000 return latest events first,
      while negative values like -1000 return earliest events first.
    retrieved: '2026-10-11'
  - url: https://docs.lamp.digital/developer/api-sdks/python-sdk
    type: vendor_docs
    quote: Results are limited to 1000 entries per request.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
  note: '"No lookback limit" is inferred from the API design and the absence of any stated limit; retention depends on
    the deployment (see retention_terms).'
- field: export_routes
  status: stated
  value: REST API (OpenAPI, documented at docs.lamp.digital/api); official Python (LAMP-core) and JavaScript (lamp-core)
    SDKs, R via reticulate; Cortex for features; JSONata queries run on the server; and the dashboard Data Portal (older,
    not actively updated) for ad-hoc queries and CSV export.
  confidence: Verified
  sources:
  - url: https://docs.lamp.digital/capabilities/configure
    type: vendor_docs
    quote: REST API Full programmatic access. Create participants, push activities, pull sensor readings, query results.
    retrieved: '2026-10-11'
  - url: https://docs.lamp.digital/capabilities/configure
    type: vendor_docs
    quote: Transform and filter data directly on the platform using JSONata without downloading raw files.
    retrieved: '2026-10-11'
  - url: https://docs.lamp.digital/dashboard/data-portal
