- field: api_platform_fees
  status: stated
  value: 'Quick Start from $499/month billed monthly or $399/month billed annually, including 100,000 credits a
    month (no rollover). An active authentication (one connected source for one user) costs 200 credits a month;
    the first 400 events per active authentication are free, then 0.5 credits each. Credits beyond 100,000 cost
    $0.005 (100,001 to 1,000,000) and $0.003 (above 1,000,000). Add-ons: Streaming API $99/month with 20,000
    credits (1,000 credits per active streaming user), Planned Workouts $99/month plus usage, Graph API from
    $50/2 graphs/month, Health Scores, Health Rewards and Lab Reports API from $499/month each. Enterprise is
    custom.'
