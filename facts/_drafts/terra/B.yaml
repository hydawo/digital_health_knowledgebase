- field: rate_limits
  status: conflict
  value: The Rate Limits reference sets two per-user rules on data-read endpoints (each request at most 1,825 days;
    at most 6,000 requested days per user per UTC hour, raisable per dev_id), but the environments page still says
    Terra imposes no rate limits on the REST API. Webhook delivery is not rate-limited; upstream providers impose
    their own limits during backfills.
  confidence: Verified
  sources:
  - url: https://docs.tryterra.co/reference/health-and-fitness-api/rate-limits.md
    type: vendor_docs
    quote: '| **Cumulative requested days** | 6,000 days | rolling 1-hour bucket per `(user_id)` |'
    retrieved: '2026-10-11'
  - url: https://docs.tryterra.co/reference/health-and-fitness-api/rate-limits.md
    type: vendor_docs
    quote: limits can be raised per `dev_id` for legitimate use cases.
    retrieved: '2026-10-11'
  - url: https://docs.tryterra.co/unified-api/integration-setup/understanding-terra-environments.md
    type: vendor_docs
    quote: Terra ***does not impose any rate limits*** on the REST API.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: retention_terms
  status: stated
  value: 'End User Privacy Policy: data is usually kept two days after collection then deleted automatically,
    occasionally up to six months where wearable partners require it, and never longer than six months unless an
    exception applies (an active connection, legal obligation, separate user permission, misuse investigation).
    Aggregated or de-identified derivatives may be kept longer for research, analytics and service improvement.
    DPA: personal data deleted or returned within 90 days of termination. Enterprise plans can add data storage.'
  confidence: Verified
  sources:
  - url: https://tryterra.co/end-user-privacy
    type: vendor_legal
    quote: Usually, your data is retained for two days after the point of collection and then automatically deleted.
    retrieved: '2026-10-11'
  - url: https://tryterra.co/end-user-privacy
    type: vendor_legal
    quote: None of your data will be stored in our databases for longer than six months from the point of collection.
    retrieved: '2026-10-11'
  - url: https://tryterra.co/end-user-privacy
    type: vendor_legal
    quote: we may retain aggregated and/or de-identified information derived from your data for longer periods for
      research, analytics, and service improvement
    retrieved: '2026-10-11'
  - url: https://tryterra.co/dpa
    type: vendor_legal
    quote: Within ninety (90) days following termination or expiration of this DPA
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
  note: The "six months" ceiling sits beside an exception list that includes "a functioning connection", so the
    effective cap for an active study connection is unclear.
