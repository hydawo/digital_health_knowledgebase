    retrieved: '2026-10-11'
  - url: https://docs.tryterra.co/reference/health-and-fitness-api/rate-limits.md
    type: vendor_docs
    quote: '| **Per-request window size** | 1,825 days (5 years) | per request |'
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: export_routes
  status: stated
  value: Event-based delivery to a configured destination (webhook, Postgres/MySQL, Supabase, S3/GCS/Azure Blob,
    SQS/Kafka, MongoDB, Firestore), REST historical endpoints, mobile SDKs (Swift, Kotlin, React Native, Flutter)
    for Apple Health, Health Connect and Samsung, the Terra Avengers companion iOS app for teams without their own
    app, and a websocket for the Streaming API. Output formats include Terra standard format, FIT and FHIR.
  confidence: Verified
