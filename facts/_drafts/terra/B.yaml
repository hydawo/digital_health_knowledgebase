# ---------------- Data access and terms ----------------
- field: raw_streams
  status: stated
  value: 'Terra relays what each source exposes, normalized to its own schema. Unified API payloads (webhook or
    REST with with_samples=true) carry timestamped samples such as heart rate, HRV (RMSSD, SDNN), SpO2, breathing
    rate, temperature, glucose, steps, position, power and raw ECG voltage where the source provides them. The
    Streaming API add-on carries roughly per-second signals over BLE/ANT+/Wear OS: heart rate, HRV, RR interval,
    ECG, acceleration, gyroscope, steps, speed, power, location. What arrives depends on what the device and
    provider expose (for example, no raw uncalibrated CGM values; Huawei HR only about once a minute).'
  confidence: Verified
  sources:
  - url: https://docs.tryterra.co/reference/health-and-fitness-api/samples.md
    type: vendor_docs
    quote: '### RawECGSample ```json { "potential_uV": Number, "timestamp: String } ```'
    retrieved: '2026-10-11'
  - url: https://docs.tryterra.co/unified-api/managing-user-health-data/requesting-historical-data.md
    type: vendor_docs
    quote: '`with_samples` must be set to `true` to receive granular data'
    retrieved: '2026-10-11'
  - url: https://docs.tryterra.co/streaming-api/data-types.md
    type: vendor_docs
    quote: '| **Cardiac** | `HEART_RATE`, `HRV`, `RR_INTERVAL`, `ECG` |'
    retrieved: '2026-10-11'
  - url: https://docs.tryterra.co/streaming-api/data-types.md
    type: vendor_docs
    quote: '| **Motion sensors** | `ACCELERATION`, `GYROSCOPE` |'
    retrieved: '2026-10-11'
  - url: https://docs.tryterra.co/streaming-api/data-types.md
    type: vendor_docs
    quote: A device that does not broadcast a signal cannot stream it, no matter what you request.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: derived_metrics
  status: stated
  value: Provider summaries (daily, activity, sleep, body, nutrition, menstruation) normalized to Terra's schema,
    plus Terra's own derived products sold separately or metered by credits; Health Scores (recovery, strain,
    stress, immunity and others), Models (Sleep Window, Health Terrain, Smart Fill, which reconstructs metrics a
    device did not record, with a confidence level per value).
  confidence: Verified
  sources:
  - url: https://tryterra.co
    type: vendor_page
    quote: We transform raw health metrics such as HRV, respiratory rate, sleep and activity into validated scores
      including recovery, strain, stress, and immunity.
    retrieved: '2026-10-11'
  - url: https://docs.tryterra.co/changelog/2026/august-update-2026.md
    type: vendor_docs
    quote: 'it reconstructs the metrics a device didn''t record from the channels it did, with a confidence level on
      every reconstructed value'
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
  note: Terra calls its scores "validated"; no validation evidence was examined here. Smart Fill output is imputed
    data and should be flagged as such in any analysis.
- field: sampling_rates
  status: stated
  value: Set by each source, not by Terra. Streaming API events arrive roughly once per second per active stream.
    Cloud integrations are either event-driven or polled by Terra every 5 to 10 minutes. The Android SDK scheduler
    fetches activity every 20 minutes and daily/body/sleep/nutrition every 8 hours by default. Example upstream
    limit; Huawei heart rate about once per minute.
  confidence: Verified
  sources:
  - url: https://docs.tryterra.co/streaming-api/pricing.md
    type: vendor_docs
    quote: typically about one per second per active stream
    retrieved: '2026-10-11'
  - url: https://docs.tryterra.co/reference/health-and-fitness-api/supported-integrations.md
    type: vendor_docs
    quote: '**Periodically** fetched integrations are polled by Terra every 5-10 minutes for new data'
    retrieved: '2026-10-11'
  - url: https://docs.tryterra.co/help-center/help-topics/data-api-sdk/historical-data-and-backfill/sdk-backfill-historical-retrieval.md
    type: vendor_docs
    quote: 'default intervals: activity every 20 minutes, daily/body/sleep/nutrition every 8 hours; configurable
      server-side'
    retrieved: '2026-10-11'
  - url: https://docs.tryterra.co/help-center/help-topics/data-api-sdk/provider-coverage-and-per-provider-data-availability/huawei-hr-downsampled-upstream.md
    type: vendor_docs
    quote: The sparse cadence is upstream, not Terra downsampling
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
