    End User Privacy Policy lets Terra use collected data for product development and for its own statistical and
    scientific research and publications, and to keep de-identified derivatives longer; it does not mention AI training
    explicitly. No clause found limiting customers' own use of data for model training.
  confidence: Corroborated
  sources:
