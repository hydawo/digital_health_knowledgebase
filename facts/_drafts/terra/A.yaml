- field: retention_terms
  status: stated
  value: End-user data is usually kept two days after collection and then deleted, and never more than six months
    in Terra databases; aggregated or de-identified derivatives may be kept longer for research, analytics and service
    improvement. Under the DPA, Terra deletes or returns personal data within 90 days of termination. Dashboard
    payload history is short; customers must store payloads themselves.
  confidence: Verified
  sources:
  - url: https://tryterra.co/end-user-privacy
    type: vendor_legal
    quote: Usually, your data is retained for two days after the point of collection and then automatically deleted.
    retrieved: '2026-10-11'
  - url: https://tryterra.co/end-user-privacy
    type: vendor_legal
    quote: None of your data will be stored in our databases for longer than six months from the point of collection.
    retrieved: '2026-10-11'
  - url: https://tryterra.co/end-user-privacy
    type: vendor_legal
    quote: we may retain aggregated and/or de-identified information derived from your data for longer periods for
      research, analytics, and service improvement
    retrieved: '2026-10-11'
  - url: https://tryterra.co/dpa
    type: vendor_legal
    quote: Vendor shall (at Customer's election) delete or return to Customer all existing copies of Personal Data
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: ai_training_terms
