- field: raw_streams
  status: stated
  value: 'Unified API passes through whatever each provider exposes (no smoothing): sample arrays such as heart
    rate, RR interval, HRV, SpO2, glucose, position and raw ECG voltage where the provider supplies them. No raw
    PPG. Streaming API (paid add-on) delivers roughly per-second heart rate, HRV, RR interval, ECG, accelerometer
    and gyroscope from BLE/ANT+ devices, Wear OS, Apple Watch and phone sensors, via the Terra RT SDKs and a websocket.
    Raw uncalibrated CGM values are not available.'
  confidence: Verified
  sources:
  - url: https://docs.tryterra.co/help-center/help-topics/something-else/provider-data-fields-and-coverage/no-derived-metrics-from-samples
    type: vendor_docs
    quote: Payloads reflect the raw data each provider supplies
    retrieved: '2026-10-11'
  - url: https://docs.tryterra.co/help-center/help-topics/data-api-sdk/data-model-fields-and-units/no-smoothing-sample-array-length-mismatch
    type: vendor_docs
    quote: Terra applies no smoothing or post-processing to sample data; values are piped through as the provider
      supplies them
    retrieved: '2026-10-11'
  - url: https://docs.tryterra.co/streaming-api/data-types
    type: vendor_docs
    quote: Cardiac HEART_RATE , HRV , RR_INTERVAL , ECG
    retrieved: '2026-10-11'
  - url: https://docs.tryterra.co/streaming-api/data-types
    type: vendor_docs
    quote: Motion sensors ACCELERATION , GYROSCOPE
    retrieved: '2026-10-11'
  - url: https://docs.tryterra.co/help-center/help-topics/data-api-sdk/provider-coverage-and-per-provider-data-availability/raw-uncalibrated-cgm-not-available
    type: vendor_docs
    quote: Terra does not provide access to raw or uncalibrated CGM sensor data.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
  note: Raw ECG (RawECGSample, potential_uV) and RRInterval appear in the samples reference at https://docs.tryterra.co/reference/health-and-fitness-api/samples.
    Availability per provider varies.
- field: derived_metrics
  status: stated
  value: Provider-computed metrics are passed through in a normalised schema (sleep stages and scores, daily scores,
    Body Battery, stress and similar). Terra adds its own Health Scores (recovery, strain, stress, immunity) and
    Models such as Smart Fill, which reconstructs metrics a device did not record, with a confidence level. Terra
    does not compute derived metrics such as speed from position samples in the core payloads.
  confidence: Verified
  sources:
  - url: https://tryterra.co
    type: vendor_page
    quote: We transform raw health metrics such as HRV, respiratory rate, sleep and activity into validated scores
      including recovery, strain, stress, and immunity.
    retrieved: '2026-10-11'
  - url: https://docs.tryterra.co/changelog/2026/august-update-2026
    type: vendor_docs
    quote: it reconstructs the metrics a device didn't record from the channels it did, with a confidence level
      on every reconstructed value
    retrieved: '2026-10-11'
  - url: https://docs.tryterra.co/help-center/help-topics/something-else/provider-data-fields-and-coverage/no-derived-metrics-from-samples
    type: vendor_docs
    quote: Terra does not compute non-trivial derived metrics like speed from position samples
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
  note: Smart Fill output is modelled, not measured; a study should keep it separate from device-recorded values.
- field: sampling_rates
  status: stated
  value: Set by the device and provider, passed through unchanged (for example Huawei heart rate about once a minute;
    Apple Watch SpO2 and HRV at device-chosen intervals). Streaming API is roughly per second.
  confidence: Verified
  sources:
  - url: https://docs.tryterra.co/help-center/help-topics/data-api-sdk/provider-coverage-and-per-provider-data-availability/cgm-spo2-hrv-sample-regularity
    type: vendor_docs
    quote: Sample regularity is determined by the device.
