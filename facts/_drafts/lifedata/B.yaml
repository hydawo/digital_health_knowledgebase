# ---------------- Data access and terms ----------------
- field: raw_streams
  status: stated
  value: Active responses only (13 question types including scales, free text and media uploads), each timestamped,
    plus GPS coordinates captured with each response when enabled. No continuous passive sensing or wearable streams
    are documented.
  confidence: Verified
  sources:
  - url: https://www.lifedatacorp.com/solutions-research/
    type: vendor_page
    quote: All responses are timestamped and geolocation reporting is standard.
    retrieved: '2026-10-11'
  - url: https://www.lifedatacorp.com/solutions-research/
    type: vendor_page
    quote: Gather GPS coordinates with each user response.
    retrieved: '2026-10-11'
  - url: https://www.lifedatacorp.com/features/
    type: vendor_page
    quote: Choose from 13 question types, including multiple choice, scales, free text, media uploads, and web.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
  note: Searches of the site for wearable, Fitbit, sensor and passive returned only blog literature lists, not product
    features.
- field: derived_metrics
  status: stated
  value: Scores computed from responses, response-rate and engagement monitoring, and real-time dashboards for
    individuals and groups. No sensor-derived features.
  confidence: Verified
  sources:
  - url: https://www.lifedatacorp.com/features/
    type: vendor_page
    quote: Use display logic, piped text, and scores to create adaptive study experiences.
    retrieved: '2026-10-11'
  - url: https://www.lifedatacorp.com/features/
    type: vendor_page
    quote: Track participant engagement, response rates, and study activity in real time.
    retrieved: '2026-10-11'
  - url: https://www.lifedatacorp.com/features/
    type: vendor_page
    quote: Visualize participant data in real time with customizable dashboards for individuals and groups.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: sampling_rates
  status: stated
  value: Event-based, not continuous. Data points are tied to prompts and responses; GPS is captured per response, not
    on a fixed rate. Timestamps for notification delivery and responses are recorded with millisecond precision.
  confidence: Verified
  sources:
  - url: https://www.lifedatacorp.com/features/
    type: vendor_page
    quote: Track notification delivery, response timing, and participant engagement with millisecond precision.
    retrieved: '2026-10-11'
  - url: https://www.lifedatacorp.com/solutions-research/
    type: vendor_page
    quote: Gather GPS coordinates with each user response.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: history_depth
  status: stated
  value: Data stays available for the life of the subscription. After cancellation or lapse it is permanently deleted
    in 180 days (retrievable on request until then). Accounts inactive over 12 months may be terminated and deleted.
  confidence: Verified
  sources:
  - url: https://www.lifedatacorp.com/lifedata-privacy-policy/
