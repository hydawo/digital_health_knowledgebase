# ---------------- Research access ----------------
- field: research_program
  status: stated
  value: No separate research program. LifeData is itself a research-focused subscription platform (EMA, experience
    sampling, eDiary, eCOA, ePRO) sold as Individual, Team, Enterprise, Clinical and Monitoring products, with optional
    paid services such as protocol consultation, protocol building, user acceptance testing and data analysis
    consultation.
  confidence: Verified
  sources:
  - url: https://www.lifedatacorp.com/products-2/
    type: vendor_page
    quote: Individual State of the science mobile data collection Academic and commercial pricing Half-year and annual
      subscriptions All features included
    retrieved: '2026-10-11'
  - url: https://www.lifedatacorp.com/products-2/
    type: vendor_page
    quote: With a wide range of additional paid services, we’re here to help with the challenges you face
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: program_eligibility
  status: stated
  value: Sold to academic and commercial customers; Team product is for teams and labs up to 9 users, Enterprise for 10+
    users. A discount exists for qualifying graduate students; the qualifying criteria are not published.
  confidence: Verified
  sources:
  - url: https://www.lifedatacorp.com/products-2/
    type: vendor_page
    quote: Yes, LifeData offers a discount to qualifying graduate students that are interested in using the platform.
    retrieved: '2026-10-11'
  - url: https://www.lifedatacorp.com/products-2/
    type: vendor_page
    quote: Teams and labs up to 9 users
    retrieved: '2026-10-11'
