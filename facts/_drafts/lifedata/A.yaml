# ---------------- Data access and terms ----------------
- field: raw_streams
  status: stated
  value: 'Active data only: timestamped EMA/ESM and eDiary responses across 13 question types (including media uploads),
    with GPS coordinates captured alongside each response if the participant allows location. No passive smartphone
    sensing and no wearable integration is documented. Route: the web study builder and data download.'
  confidence: Corroborated
  sources:
  - url: https://www.lifedatacorp.com/solutions-research/
    type: vendor_page
    quote: All responses are timestamped and geolocation reporting is standard.
    retrieved: '2026-10-11'
  - url: https://www.lifedatacorp.com/features/
    type: vendor_page
    quote: Choose from 13 question types, including multiple choice, scales, free text, media uploads, and web.
    retrieved: '2026-10-11'
  - url: https://www.lifedatacorp.com/features/
    type: vendor_page
    quote: Capture location data with participant responses for deeper insights.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
  note: Absence of passive sensing and wearables is from searching all 167 sitemap pages (no HealthKit, Health
    Connect, Fitbit, accelerometer or wearable feature mentioned outside literature roundups). Corroborated rather than
    Verified because an absence cannot be quoted.
- field: derived_metrics
  status: stated
  value: Study-defined scores (computed from responses and usable in display logic), response and compliance rates,
    engagement metrics, and session metadata in the export; dashboards for individuals and groups. No sensor-derived
    or behavioural features.
  confidence: Verified
  sources:
  - url: https://www.lifedatacorp.com/
    type: vendor_page
    quote: Well-labeled datasets in multiple formats with timestamps, scores, and session metadata; ready for immediate
      analysis.
    retrieved: '2026-10-11'
  - url: https://www.lifedatacorp.com/features/
    type: vendor_page
    quote: Track participant engagement, response rates, and study activity in real time.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: sampling_rates
  status: stated
  value: Event-based, not continuous. Prompts follow fixed, random, triggered or event-based schedules set by the
    researcher; GPS is captured once per response; timestamps for notification delivery and response are recorded to
    the millisecond.
  confidence: Verified
  sources:
  - url: https://www.lifedatacorp.com/features/
    type: vendor_page
    quote: Track notification delivery, response timing, and participant engagement with millisecond precision.
    retrieved: '2026-10-11'
  - url: https://www.lifedatacorp.com/solutions-research/
    type: vendor_page
    quote: Gather GPS coordinates with each user response.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: history_depth
  status: stated
  value: All study data stays downloadable for the life of the subscription. After cancellation or lapse it can be
    retrieved on request to support for 180 days, then it is permanently deleted.
  confidence: Corroborated
  sources:
  - url: https://www.lifedatacorp.com/products-2/
    type: vendor_page
    quote: Easy and unlimited data access
    retrieved: '2026-10-11'
  - url: https://www.lifedatacorp.com/lifedata-terms-of-use/
    type: vendor_legal
    quote: Any data collected prior to account cancellation or subscription end date will be permanently deleted in
      180 days.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: export_routes
  status: stated
