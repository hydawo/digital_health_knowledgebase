- field: retention_terms
  status: stated
  value: Data is permanently deleted 180 days after account cancellation or subscription end. Studies deleted by the
    researcher in the web app are kept for no more than 30 days. Accounts with no activity for over 12 months may be
    terminated and deleted after an email warning. Participants deleting a study on the phone does not delete server
    data; that request goes to the study creator.
  confidence: Verified
  sources:
  - url: https://www.lifedatacorp.com/lifedata-terms-of-use/
    type: vendor_legal
    quote: Any data collected prior to account cancellation or subscription end date will be permanently deleted in
      180 days.
    retrieved: '2026-10-11'
  - url: https://www.lifedatacorp.com/lifedata-privacy-policy/
    type: vendor_legal
    quote: LifeData retains a copy for no longer than 30 days after which it will be permanently deleted
    retrieved: '2026-10-11'
  - url: https://www.lifedatacorp.com/lifedata-terms-of-use/
    type: vendor_legal
    quote: LifeData may terminate your account and delete any content contained in it if there is no account activity
      (such as a log in event or payment) for over 12 months.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: ai_training_terms
  status: stated
  value: No AI- or ML-specific term. The terms say non-public study content (prompts and responses) is not used for
    internal analysis to improve the services, while public study data and anonymized study metadata may be used to
    create new services, features or content.
  confidence: Verified
  sources:
