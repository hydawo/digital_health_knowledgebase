# ---------------- Data access and terms ----------------
- field: raw_streams
  status: stated
  scope: Zepp OS on-watch apps
  value: A custom Zepp OS Mini Program can read accelerometer (x, y, z in cm/s^2), gyroscope (deg/s), barometer, compass
    and GPS on the watch, each behind a permission; heart rate is exposed as computed BPM values, and no raw PPG or
    ECG waveform API is documented.
  confidence: Verified
  sources:
  - url: https://docs.zepp.com/docs/reference/device-app-api/newAPI/sensor/Accelerometer/
    type: vendor_docs
    quote: Measure the acceleration of the device along three orthogonal axes (x, y, z)
    retrieved: '2026-10-22'
  - url: https://docs.zepp.com/docs/reference/device-app-api/newAPI/sensor/Gyroscope/
    type: vendor_docs
    quote: Measuring the angular velocity of the device rotating along three orthogonal axes (x, y, z)
    retrieved: '2026-10-22'
  - url: https://docs.zepp.com/docs/reference/device-app-api/newAPI/sensor/Accelerometer/
    type: vendor_docs
    quote: 'permission code: device:os.accelerometer'
    retrieved: '2026-10-22'
  recheck_by: '2026-11-21'
  note: Absence of a PPG API is judged from the full @zos/sensor module listing (docs.zepp.com/llms-full.txt), which
    has no PPG class. Sensor APIs need API_LEVEL 3.0, so older watches are excluded.
- field: raw_streams
  status: stated
  scope: Legacy Open Platform Web API
  value: The legacy Web API documents raw ECG (250 samples per second, from ECG-capable devices), per-minute raw motion
    data, and user-tagged sensor files (example shows a PPG CSV). Whether these endpoints still serve current devices is
    not stated.
  confidence: Reported
  sources:
  - url: https://zepp-health.github.io/rest-api/api-ecg-doc.html
    type: vendor_docs
    quote: standard ecg data, every point stand for 1/250 mv
    retrieved: '2026-10-22'
  - url: https://github.com/zepp-health/rest-api/wiki
    type: vendor_docs
    quote: The motion scope includes raw motion sensor data per minute of a day, consists of 1440(total minutes of one
      day)*3 bytes
    retrieved: '2026-10-22'
  - url: https://zepp-health.github.io/rest-api/api-sensor-doc.html
    type: vendor_docs
    quote: The name of the pre-defined behavior, like sleep
    retrieved: '2026-10-22'
  recheck_by: '2026-11-21'
  note: ECG doc page footer says last updated 2018-03-08. Reported because the docs are years old and current
    availability is unconfirmed.
- field: derived_metrics
  status: stated
  value: 'On watch (Zepp OS): heart rate, resting HR, daily HR summary, AFib records, SpO2, stress, sleep (score, stages,
    times), steps, calories, distance, PAI, stand, fat burning, body temperature, workouts. Legacy Web API scopes:
    profile, activity (steps, distance, calories), sleep, heart rate, motion, sport summary and detail, PAI. Integrators
    (Terra, Thryve) expose activity, daily and sleep data.'
  confidence: Verified
  sources:
  - url: https://docs.zepp.com/docs/reference/device-app-api/newAPI/sensor/HeartRate/
    type: vendor_docs
    quote: Atrial fibrillation test results, 0 - normal, 1 - high alert, 2 - low alert, 3 - atrial fibrillation
