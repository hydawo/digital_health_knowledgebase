- field: export_routes
  status: stated
  value: '(1) Zepp OS Mini Program reading sensors on the watch, with a phone-side companion service that can send data
    to a server by HTTP fetch; (2) legacy Open Platform OAuth 2.0 Web API (partners); (3) third-party aggregators (Terra,
    which holds its own Zepp API credentials and polls every 5 to 10 minutes; Thryve); (4) one-way write from the Zepp
    app to Android Health Connect (26 data types since January 2025), plus Apple Health, Google Fit and Strava linking;
    (5) participant self-export of personal data from the app (Profile, Settings, Exercising user rights).'
  confidence: Corroborated
  sources:
  - url: https://docs.zepp.com/docs/guides/framework/side-service/intro/
    type: vendor_docs
    quote: The "companion service" runs in the Zepp App, has no UI interface
    retrieved: '2026-10-22'
  - url: https://docs.zepp.com/docs/reference/side-service-api/fetch/
    type: vendor_docs
    quote: The Fetch API can be used to send HTTP requests in JS.
    retrieved: '2026-10-22'
  - url: https://tryterra.co/integrations/zepp
    type: secondary
    quote: Terra manages the Zepp API credentials, so there is nothing to register
    retrieved: '2026-10-22'
  - url: https://tryterra.co/integrations/zepp
    type: secondary
    quote: Zepp does not notify Terra when data changes, so Terra polls it every 5–10 minutes for each connected user
    retrieved: '2026-10-22'
  - url: https://gadgetsandwearables.com/2025/01/24/zepp-health-connect/
    type: secondary
    quote: You can now sync way more health and fitness data than before—26 types, to be exact
    retrieved: '2026-10-22'
  - url: https://www.zepp.com/privacy-support
    type: vendor_page
    quote: 'Zepp: App→ Profile → Setting→Exercising user rights'
    retrieved: '2026-10-22'
  - url: https://www.zepp.com/privacy-support
    type: vendor_page
    quote: Export data Export personal data
    retrieved: '2026-10-22'
  recheck_by: '2026-11-21'
  note: A "continuous running" App Service (API_LEVEL 3.0+) can keep a Mini Program collecting in the background after
    the user leaves it, which matters for passive collection. Format and completeness of the self-export are not
    documented on fetchable pages.
