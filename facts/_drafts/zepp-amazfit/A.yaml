    type: vendor_docs
    quote: Subscription notification is available to invited partners only.
    retrieved: '2026-10-22'
  - url: https://www.zepp.com/technology-2
    type: vendor_page
    quote: The Zepp ecosystem is supported by a growing global Zepp developer community who are encouraged to develop
      new apps and watch faces using Zepp OS Software Development Kit (SDK).
    retrieved: '2026-10-22'
  recheck_by: '2026-11-21'
  note: The Android OAuth consent SDK repo (github.com/zepp-health/oauth-Android-sdk) had a release "hmauth/0.0.6" on
