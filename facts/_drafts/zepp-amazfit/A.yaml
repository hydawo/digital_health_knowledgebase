# ---------------- Research access ----------------
- field: research_program
  status: stated
  value: No named, open research or academic access program. Zepp describes bespoke research collaborations
    (Stanford sleep study, UCSD Center for Wearable Sensors membership, NTNU on PAI, Peking University First Hospital
    AF study, Chinese universities) and a "data analytics services" offer aimed at researchers, providers, insurers and
    employers, with partnerships at 20 research labs, hospitals, pharma companies and universities as of end 2020.
    The only documented data route for third parties is the legacy Huami/Zepp Open Platform "data cooperation" OAuth
    Web API (see developer_program_status).
  confidence: Corroborated
  sources:
  - url: https://www.zepp.com/technology-2
    type: vendor_page
    quote: Zepp Health has collaborated with universities around the world for research and development, operations,
      and education
    retrieved: '2026-10-22'
  - url: https://www.zepp.com/technology-2
    type: vendor_page
    quote: Joint Study of the Effects of Sleep on Physical Recovery With the Stanford University Center for Sleep Sciences
      and Medicine.
    retrieved: '2026-10-22'
  - url: https://www.zepp.com/data-analytics
    type: vendor_page
    quote: At the end of 2020, Zepp Health had partnerships with 20 independent research laboratories, hospitals, pharmaceutical
      companies and universities
    retrieved: '2026-10-22'
  recheck_by: '2026-11-21'
  note: The data-analytics page is dated in its own content ("42 million active users by the first half of 2021") and
    has no application route. The 2025 Form 20-F (filed 2026-04-24) still lists "data analytics capabilities" as a
    software and data service; sec.gov refuses the project fetcher, so that wording was read by hand and is not quoted.
- field: program_eligibility
  status: stated
  value: 'No eligibility rules for a research program are published. For the legacy Open Platform data API: corporate
    applicants only, not individuals; a PhD researcher must apply in the name of the institution.'
  confidence: Corroborated
  sources:
  - url: https://github.com/zepp-health/rest-api/wiki
    type: vendor_docs
    quote: Data cooperation currently only supports corporate users, not individual users; if you are a PhD for scientific
      research purposes, you need to apply in the name of the school.
    retrieved: '2026-10-22'
  recheck_by: '2026-11-21'
  note: The wiki was last edited on 2020-11-27 and names old devices (Mi Band, Amazfit ARC/PACE), so current rules may
    differ. Corroborated, not Verified, for that reason.
- field: program_application
  status: stated
  value: 'Research and developer enquiries go to developer@zepp.com (contact page). Legacy data API: register and apply
    on the Zepp Open Platform (dev.huami.com), 3 to 7 day review, then submit the cooperation details (country, platform,
    business, user numbers, needs); escalation to datapartner@huami.com. A 2021 applicant reports being told a Zepp
    business representative would contact them and sign an agreement, and later that they would need to pay for the
    API and buy equipment.'
  confidence: Corroborated
  sources:
  - url: https://www.zepp.com/contact-us
    type: vendor_page
    quote: For Researchers & Developers developer@zepp.com
    retrieved: '2026-10-22'
  - url: https://github.com/zepp-health/rest-api/wiki
    type: vendor_docs
    quote: The review period is 3-7 days, please wait patiently.
    retrieved: '2026-10-22'
  - url: https://github.com/zepp-health/rest-api/issues/25
    type: secondary
    quote: A Zepp business representative will contact you to learn more about your needs, and then sign an agreement
      with you.
    retrieved: '2026-10-22'
  recheck_by: '2026-11-21'
  note: dev.huami.com is a JavaScript app whose registration flow includes an "enterpriseFastTrack" sign-up route; it
    was not logged into.
- field: program_status
  status: unclear
  value: 'No research program page exists to have a status. The legacy Open Platform is still online (dev.huami.com
    serves "Zepp Open Platform"; api-open.huami.com and auth.huami.com answer requests) and Zepp staff fixed a doc link
    on the rest-api repo in June 2026, but a 2022 applicant reported the old platform was deprecated and the new Zepp
    Console only accepts Zepp OS app packages. Whether new data partners are accepted today is not stated.'
  confidence: Unclear
  sources:
  - url: https://dev.huami.com/
    type: vendor_page
    quote: Zepp Open Platform
    retrieved: '2026-10-22'
  - url: https://github.com/zepp-health/rest-api/issues/26
