- field: raw_streams
  status: stated
  value: 'Phone, via the m-Path Sense app (Sensing full add-on; CARP-based): location, device, weather, pedometer,
    activity, screen (Android), battery, app usage (Android), connectivity, Wi-Fi, accelerometer features, light
    (Android), memory (Android), Bluetooth; JSON files uploaded straight to the researcher''s cloud. In-survey (Sensing
    lite): location, noise level, step count, app usage (Android; iOS only via a study-specific SensorKit app),
    nearby Bluetooth, audio, photo, video. Wearables: direct Garmin integration gives heart rate down to 1 s, all
    beat-to-beat intervals, raw accelerometer 25 Hz and gyroscope 32 Hz; Fitbit, Apple Health, Garmin and Polar
    via Thryve at lower resolution. Empatica, movisens and ActiGraph are not integrated.'
  confidence: Verified
  sources:
  - url: https://m-path.io/manual/knowledge-base/mobile-sensing-full/
    type: vendor_docs
    quote: Location GPS coordinates every minute.
    retrieved: '2026-10-11'
  - url: https://m-path.io/manual/knowledge-base/mobile-sensing-full/
    type: vendor_docs
    quote: All sensor data is immediately uploaded to the cloud provider of the researcher.
    retrieved: '2026-10-11'
  - url: https://m-path.io/manual/knowledge-base/mobile-sensing-lite-version/
    type: vendor_docs
    quote: By default, app usage only works on Android. It is possible to collect app usage on iOS, but this requires
      a new, study-specific app that includes Apple’s SensorKit features.
    retrieved: '2026-10-11'
  - url: https://m-path.io/manual/knowledge-base/which-wearable-integration-is-right-for-my-project/
    type: vendor_docs
    quote: This includes heart rate at up to 1-second intervals and raw beat-to-beat intervals (BBI) for HRV computation.
    retrieved: '2026-10-11'
  - url: https://m-path.io/manual/knowledge-base/wearables-garmin-direct-integration/
    type: vendor_docs
    quote: Raw accelerometer at 25Hz. Not configurable.
    retrieved: '2026-10-11'
  - url: https://m-path.io/manual/knowledge-base/wearables/
