- field: derived_metrics
  status: stated
  value: Phone accelerometer is delivered as window summary features (means, SDs, medians, energy etc.), not raw
    samples; ambient light as lux summaries. Wearables via Thryve include computed measures such as sleep and daily
    summaries. The m-Path keyboard derives sentiment and typing behaviour without storing raw text. In-dashboard
    compliance monitor and basic visualisations; R packages mpathr and mpathsenser for analysis.
  confidence: Verified
  sources:
  - url: https://m-path.io/manual/knowledge-base/mobile-sensing-full/
    type: vendor_docs
    quote: This is a summary of all accelerometer data collected from sensorStartTime to sensorEndTime.
    retrieved: '2026-10-11'
  - url: https://m-path.io/manual/knowledge-base/which-wearable-integration-is-right-for-my-project/
    type: vendor_docs
    quote: Lower resolution but includes computed measures (e.g. sleep, daily summaries)
    retrieved: '2026-10-11'
  - url: https://m-path.io/mobile-sensing/
    type: vendor_page
    quote: Securely derive momentary sentiment from phone-based communication and assess typing behavior (speed,
      errors, emoji use, etc.) without the need to access or store raw text data.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: sampling_rates
  status: stated
  value: 'Phone sensing: periodic sensors use a researcher-set interval in seconds, others are event-based; location
    every minute (event every 10 m on iOS). OS app-killing makes real rates lower, especially at night. Direct Garmin:
    heart rate, SpO2, stress, respiration 1 s to 3600 s; steps fixed at 60 s; all BBI; raw accelerometer 25 Hz and
    gyroscope 32 Hz. Thryve wearables: lower resolution; Fitbit syncs about every 15 minutes.'
  confidence: Verified
  sources:
  - url: https://m-path.io/manual/knowledge-base/mobile-sensing-full/
    type: vendor_docs
    quote: Some sensors are periodic (researcher can choose the period), while others are event based (new data
      entry is created in case of a specific event).
