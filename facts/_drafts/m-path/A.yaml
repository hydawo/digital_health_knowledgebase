# ---------------- Data access and terms ----------------
- field: raw_streams
  status: stated
  value: 'Sensing full (m-Path Sense app, CARP-based) - location, device, weather, pedometer, activity, screen (Android), battery, app usage (Android), connectivity, Wi-Fi, periodic accelerometer features, light (Android), memory (Android); uploaded as JSON to researcher cloud. Sensing lite (in-survey) - location, noise level, step count, app usage, Bluetooth, audio/picture/video. Garmin direct/Lite - heart rate to 1 s, all beat-to-beat intervals, raw accelerometer 25 Hz, gyroscope 32 Hz, SpO2, respiration, stress, skin temperature. Keyboard typing dynamics. Thryve wearable route gives lower-resolution data.'
  confidence: Verified
  sources:
  - url: https://m-path.io/manual/knowledge-base/mobile-sensing-full/
    type: vendor_docs
    quote: "All sensor data is immediately uploaded to the cloud provider of the researcher."
    retrieved: 2026-10-11
  - url: https://m-path.io/manual/knowledge-base/mobile-sensing-full/
    type: vendor_docs
    quote: "m-Path uses the CARP open source package to gather sense data."
    retrieved: 2026-10-11
  - url: https://m-path.io/manual/knowledge-base/full-sensing-vs-sensing-lite-which-do-you-need/
    type: vendor_docs
    quote: "GPS location (at this moment) App usage data (of the last day) Step count data (since last boot) Noise level (at this moment) Nearby bluetooth devices (at this moment) Audio/Picture/Video recording (as an answer to a question)"
    retrieved: 2026-10-11
  - url: https://m-path.io/manual/knowledge-base/which-wearable-integration-is-right-for-my-project/
    type: vendor_docs
    quote: "This includes heart rate at up to 1-second intervals and raw beat-to-beat intervals (BBI) for HRV computation."
    retrieved: 2026-10-11
  - url: https://m-path.io/manual/knowledge-base/wearables-garmin-direct-integration/
    type: vendor_docs
    quote: "Raw accelerometer at 25Hz. Not configurable."
    retrieved: 2026-10-11
  - url: https://m-path.io/mobile-sensing/
    type: vendor_page
    quote: "assess typing behavior (speed, errors, emoji use, etc.) without the need to access or store raw text data"
    retrieved: 2026-10-11
  recheck_by: 2026-11-09
  note: The sensing-full manual table lists screen, app usage, light and memory as Android only. A separate manual page lists gyroscope and anonymised call/text data under full sensing, which the sensor table does not list. iOS app usage needs a study-specific SensorKit app.
- field: derived_metrics
  status: stated
  value: Accelerometer summary features (mean, SD, energy etc. per window) and light summaries from m-Path Sense; activity type with confidence; Thryve-computed wearable measures (sleep scores, sleep stages, daily summaries); keyboard-derived sentiment; dashboard visualisations and basic case analyses. R packages mpathr and mpathsenser for processing.
  confidence: Verified
  sources:
  - url: https://m-path.io/manual/knowledge-base/mobile-sensing-full/
    type: vendor_docs
    quote: "This is a summary of all accelerometer data collected from sensorStartTime to sensorEndTime."
    retrieved: 2026-10-11
  - url: https://m-path.io/manual/knowledge-base/which-wearable-integration-is-right-for-my-project/
    type: vendor_docs
    quote: "Thryve provides higher-level computed measures such as sleep scores, sleep stages, and daily activity summaries that are derived from raw sensor data."
    retrieved: 2026-10-11
  - url: https://m-path.io/mobile-sensing/
    type: vendor_page
    quote: "Securely derive momentary sentiment from phone-based communication"
    retrieved: 2026-10-11
  recheck_by: 2026-11-09
- field: sampling_rates
  status: stated
  value: 'm-Path Sense - researcher-set interval in seconds for periodic sensors; location every minute on Android and every 10 m moved on iOS; event sensors on change; actual intervals longer because the OS pauses the app (example - 30 accelerometer windows per hour configured, about 20 achieved). Garmin direct - heart rate default 30 s (1 to 3600 s), stress and respiration default 10 s, SpO2 default 30 s, steps fixed 60 s, all BBI, accelerometer 25 Hz, gyroscope 32 Hz. Fitbit via Thryve syncs about every 15 minutes.'
  confidence: Verified
  sources:
  - url: https://m-path.io/manual/knowledge-base/mobile-sensing-full/
    type: vendor_docs
    quote: "GPS coordinates every minute. ✔ ✔ Event for iOS (every 10 meter moved), periodic for Android"
    retrieved: 2026-10-11
  - url: https://m-path.io/manual/knowledge-base/mobile-sensing-full/
    type: vendor_docs
    quote: "This means that the actual sensing frequency only approximates the theoretical sensing frequency."
    retrieved: 2026-10-11
  - url: https://m-path.io/manual/knowledge-base/wearables-garmin-direct-integration/
    type: vendor_docs
    quote: "Heart Rate 30s 1s 3600s"
    retrieved: 2026-10-11
  - url: https://m-path.io/manual/knowledge-base/wearables/
    type: vendor_docs
    quote: "Fitbit devices sync approximately every 15 minutes when connected, Garmin and Apple Health devices sync less frequently."
    retrieved: 2026-10-11
  recheck_by: 2026-11-09
