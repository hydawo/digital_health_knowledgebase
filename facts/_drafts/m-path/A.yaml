# ---------------- Research access ----------------
- field: research_program
  status: stated
  value: No separate research program; the platform itself is sold as research licences (Free, Essential, Standard, Comfort) with paid add-ons, plus consulting and a first-ESM-study support package.
  confidence: Verified
  sources:
  - url: https://m-path.io/manual/knowledge-base/subscriptions-and-billing/
    type: vendor_docs
    quote: "m-Path offers four subscription plans designed to support different types of research projects."
    retrieved: 2026-10-11
  - url: https://m-path.io/pricing/
    type: vendor_page
    quote: "Is this your first ESM study? We are happy to support you in setting up a methodologically sound ESM protocol that is tailored to your specific research question."
    retrieved: 2026-10-11
  recheck_by: 2026-11-09
- field: program_eligibility
  status: stated
  value: Any researcher or practitioner can open a free dashboard account; no stated institutional restriction. Participants under 16 need parental consent.
  confidence: Verified
  sources:
  - url: https://m-path.io/manual/knowledge-base/create-an-online-dashboard-account/
    type: vendor_docs
    quote: "A researcher or practitioner can always create an account for free."
