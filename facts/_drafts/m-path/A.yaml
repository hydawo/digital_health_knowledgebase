- field: retention_terms
  status: stated
  value: DPA - m-Path deletes controller data immediately when services end unless the controller objects or asks (5 days ahead) for return as csv. Lapsed subscriptions keep data viewable; paid researchers can request deletion. Participants can delete all their online data in the app, which deletes it immediately and permanently. Backups daily, kept up to one month. Opt-in crash analytics deleted after 2 months (Firebase) or 90 days (Sentry).
  confidence: Verified
  sources:
  - url: https://m-path.io/data-processing/
    fetch_url: https://m-path.io/LegalPage/dpa.html
    type: vendor_legal
    quote: "The Processor will delete the above personal data immediately as soon as the provision of services to the Controller has ended. The Controller will have the right to object to such deletion."
    retrieved: 2026-10-11
  - url: https://m-path.io/faq/
    type: vendor_page
    quote: "researchers using a paid license can request data deletion by contacting the m-Path team"
    retrieved: 2026-10-11
  - url: https://m-path.io/manual/knowledge-base/delete-online-data/
    type: vendor_docs
    quote: "All data gathered on this participant will immediately be permanently deleted from our databases."
    retrieved: 2026-10-11
  - url: https://m-path.io/manual/knowledge-base/storage/
    type: vendor_docs
    quote: "Our databases are backed up daily (maximum retainment of one month)."
    retrieved: 2026-10-11
  recheck_by: 2026-11-09
  note: The DPA's delete-on-end clause and the manual's "data is not deleted" after a lapsed subscription refer to different events (end of all services versus downgrade to Free).
