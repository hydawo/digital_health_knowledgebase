# ---------------- Data access and terms ----------------
- field: raw_streams
  status: stated
  value: 'Device data reaches Evidation only through members'' connected third-party apps (Apple Health, Dexcom,
    Fitbit, Garmin, Google Fit, MyFitnessPal, Oura, Qardio, RunKeeper, Samsung Health, Strava, Withings), not from the
    wearables directly, plus surveys and EHR records linked through 1upHealth''s Patient Connect. Sponsors receive it
    in licensed de-identified individual-level datasets (PROs and surveys, behavioural and functional measures,
    connected device and wearable data, clinical data, molecular data where available). Whether wearable data is
    delivered at raw, intraday or daily-summary level is not documented.'
  confidence: Verified
  sources:
  - url: https://help.evidation.com/hc/en-us/articles/360008060493-Currently-available-apps
    type: vendor_docs
    quote: 'Health and Fitness Apps: Apple Health Dexcom Fitbit Garmin Google Fit MyFitnessPal Oura Qardio RunKeeper Samsung Health Strava Withings'
    retrieved: '2026-10-11'
  - url: https://help.evidation.com/hc/en-us/articles/360012493253-Data-syncing-101
    type: vendor_docs
    quote: If you are using a wearable, such as a Fitbit , data will not sync from your wearable directly into Evidation.
    retrieved: '2026-10-11'
  - url: https://evidation.com/for-customers/datasets
    type: vendor_page
    quote: 'Data includes: Patient-reported outcomes and survey data Behavioral and functional measures Connected device and wearable data Clinical data Molecular data, where available'
    retrieved: '2026-10-11'
  - url: https://evidation.com/resources/evidation-partners-with-1uphealth-to-integrate-diverse-sources-of-permissioned-real-world-health-data-for-research
    type: vendor_page
    quote: Evidation will integrate 1up Patient Connect into its enterprise offering to allow individuals to permission their health record data for Evidation research
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
  note: Google Fit is still in the help list but withdrawn on iOS and the website (see deprecations). The profile's
    "intraday minute-level" resolution comes from published papers and the ALiR study, not from vendor documentation.
