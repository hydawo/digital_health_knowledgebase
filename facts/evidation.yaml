facts:
# ---------------- Research access ----------------
- field: research_program
  status: stated
  value: 'No academic or self-serve research program and no data API. Evidation sells sponsor services built on its
    US member community: data offerings (licensed real-world datasets, patient insights, prospective studies) and
    activation offerings (recruitment, activation), as one-time engagements or ongoing subscriptions, plus a licensable
    Research & Engagement Platform that Evidation runs for the sponsor.'
  confidence: Verified
  scope: Sponsors
  sources:
  - url: https://evidation.com/for-customers/our-solutions
    type: vendor_page
    quote: Combine data and activation offerings to support research, evidence generation, and commercialization.
    retrieved: '2026-10-11'
  - url: https://evidation.com/for-customers/our-solutions
    type: vendor_page
    quote: Access deeply characterized populations through one-time engagements or ongoing subscriptions
    retrieved: '2026-10-11'
  - url: https://evidation.com/for-customers/non-profit
    type: vendor_page
    quote: Collect longitudinal, prospective data directly from participants by licensing our Research & Engagement Platform
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
- field: research_program
  status: stated
  value: 'No open-access route to existing Evidation data. Three published routes each stop short of one: (1) the
    Evidation Everyone Research Registry codes member data before sharing it with "research partners", with no
    criteria or terms for who counts as a partner; (2) the WAVE study (NCT06207929, sponsor Evidation Health,
    collaborator BARDA, 18,157 enrolled, 2024-01-21 to 2024-08-07) plans to share coded data with approved external
    research partners, but its individual-data sharing is marked undecided and the process not finalized; (3) a July
    2026 release offers data, on-demand analyses and population-level insights from a GLP-1 cohort of more than
    165,000 people through partner@evidation.com, which is a commercial route.'
  confidence: Verified
  scope: Outside researchers seeking existing Evidation data
  sources:
  - url: https://evidation.com/blog/shape-the-future-of-health-research
    type: vendor_page
    quote: The data you share is coded before it’s shared with research partners
    retrieved: '2026-10-11'
  - url: https://clinicaltrials.gov/study/NCT06207929
    fetch_url: https://clinicaltrials.gov/api/v2/studies/NCT06207929
    type: regulator_db
    quote: We have provisions in our study protocol and consent to share Coded Study Data with approved external research partners. The sharing process is not yet finalized.
    retrieved: '2026-10-11'
  - url: https://evidation.com/resources/growth-potential-and-uneven-adoption-in-the-glp-1-market
    type: vendor_page
    quote: can contact partner@evidation.com to discuss available data, on-demand analyses, and population-level insights
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
  note: The registry page is dated 2025-12-18. The WAVE record (last updated 2024-09-05) gives ipdSharing UNDECIDED,
    enrollment 18,157 ACTUAL and collaborator Biomedical Advanced Research and Development Authority. The profile's
    separate ALiR route (USC Understanding America Study Data Use Agreement) was not re-checked in this run; it is not
    an Evidation program.
