    quote: 'FDA/CE cleared biomarkers : ECG, AFib, SpO₂, vascular age, AHI'
    retrieved: '2026-10-10'
  recheck_by: '2026-11-25'
  note: Some metrics are region-specific (EU or US devices only), per the all-available-health-data page.
