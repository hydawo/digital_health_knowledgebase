    Health Data API. Core biomarkers (activity, sleep, body, heart) on every plan; FDA/CE cleared biomarkers
    (ECG, AFib, SpO2, vascular age, AHI) and risk scores only on Advanced Biomarkers.
  confidence: Verified
  sources:
  - url: https://developer.withings.com/developer-guide/v3/data-api/all-available-health-data
    type: vendor_docs
    quote: 96 biomarkers across 9 device families
    retrieved: '2026-10-21'
  - url: https://static.withings.com/content/api/plans/plans.html
    type: vendor_page
    quote: 'Core biomarkers : Activity, Sleep, Body, Heart'
