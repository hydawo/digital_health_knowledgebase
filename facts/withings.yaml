- field: raw_streams
  status: stated
  scope: Advanced Research API (ScanWatch, contracted partners)
  value: >-
    Raw 3-axis accelerometer and PPG (three wavelengths, green, red and infrared, or green only depending on
    device) via the Rawdata v2 Activate, Deactivate and Get services. Raw mode disables every other watch
    feature and cuts ScanWatch battery life to 3 to 4 days on continuous capture.
  confidence: Verified
  sources:
  - url: https://developer.withings.com/openapi.yaml
    type: vendor_docs
    quote: Raw Data webservices are part of the Advanced research API that allows to collect high frequency PPG
      and accelerometer data (around 25Hz).
    retrieved: '2026-10-10'
  - url: https://developer.withings.com/developer-guide/v3/integration-guide/public-health-data-api/data-api/raw-data
    type: vendor_docs
    quote: Raw data activation will put the Withings device in a specific mode that will disable all features except
      raw data capture.
    retrieved: '2026-10-10'
  - url: https://developer.withings.com/developer-guide/v3/integration-guide/public-health-data-api/data-api/raw-data
    type: vendor_docs
    quote: For Withings ScanWatch, continuous collection of raw data would reduce battery life to 3-4 days.
    retrieved: '2026-10-10'
  recheck_by: '2026-11-09'
- field: raw_streams
  status: stated
  scope: ECG waveform (Heart v2, Health Data API)
  value: >-
    Full single-lead ECG waveform in microvolts through Heart v2 - Get: ScanWatch and Move ECG 30-second
    recordings, BPM Core 20-second recordings. Not part of the Raw Data API, so it does not need raw mode.
  confidence: Verified
  sources:
  - url: https://developer.withings.com/openapi.yaml
    type: vendor_docs
    quote: Provides the high frequency data of an ECG recording in micro-volt
    retrieved: '2026-10-10'
  - url: https://developer.withings.com/openapi.yaml
    type: vendor_docs
    quote: Returns ECG (EKG) signal points in micro-volt
    retrieved: '2026-10-10'
  - url: https://developer.withings.com/developer-guide/v3/data-api/all-available-health-data
    type: vendor_docs
    quote: ECG Signal
    retrieved: '2026-10-10'
  recheck_by: '2026-11-25'
  note: >-
    Gap finding, confirmed in the OpenAPI spec. The plans page lists ECG among "FDA/CE cleared biomarkers"
    available only on Advanced Biomarkers, so whether a Start for Free or Enterprise app can call Heart v2 is
    not stated; ask Withings.
