facts:
- field: research_program
  status: stated
  value: >-
    Two research routes. (1) Advanced Research API: raw ScanWatch accelerometer and PPG for research
    institutions, under contract. (2) The Advanced Biomarkers API plan, marketed for clinical studies and
    AI research (cleared biomarkers, custom device provisioning, anonymization, AI training rights).
    Withings Health Solutions also offers study partnerships and a study request form.
  confidence: Verified
  sources:
  - url: https://developer.withings.com/developer-guide/v3/withings-solutions/research-apis
    type: vendor_docs
    quote: The Advanced Research API provides research institutions, universities, and healthcare innovators with
      direct access to raw sensor data from Withings devices
    retrieved: '2026-10-10'
  - url: https://static.withings.com/content/api/plans/plans.html
    type: vendor_page
    quote: Cleared biomarkers, custom device provisioning, anonymization and explicit AI training rights, all part
      of Advanced Biomarkers.
    retrieved: '2026-10-10'
  - url: https://www.withings.com/en-us/pages/research-clinical-trials
    type: vendor_page
    quote: We can help you find the best way to retrieve and adapt the data to suit your project, through cellular
      connectivity, mobile app, an RPM platform, API or other ways.
    retrieved: '2026-10-10'
  recheck_by: '2026-11-09'
  note: The plans page is shown on the developer portal (developer-guide/v3/withings-solutions/withings-api-plans)
    as an iframe of the static page cited here.
- field: research_program
  status: stated
  scope: Withings' own in-app research programs (consumer)
  value: >-
    Withings runs its own research programs inside the Withings app, joined by consent and left by unchecking
    "Research Center" in the app's notification center.
  confidence: Verified
  sources:
  - url: https://www.withings.com/us/en/legal/privacy-policy
    type: vendor_legal
    quote: Participating in our research programs
    retrieved: '2026-10-10'
  - url: https://www.withings.com/us/en/legal/privacy-policy
    type: vendor_legal
    quote: Uncheck "Research Center" in your notification center
    retrieved: '2026-10-10'
  recheck_by: '2026-11-25'
  note: Gap finding. This is Withings' own research use of consumer data, not a route for outside study teams.
- field: program_eligibility
  status: stated
  value: >-
    Aimed at research groups, universities and advanced health studies. Raw data access is limited to
    contracted partners. No further eligibility criteria are published.
  confidence: Verified
  sources:
  - url: https://developer.withings.com/developer-guide/v3/withings-solutions/research-apis
    type: vendor_docs
    quote: Designed for research groups, universities, and advanced health studies.
    retrieved: '2026-10-10'
  - url: https://developer.withings.com/developer-guide/v3/integration-guide/public-health-data-api/data-api/raw-data
    type: vendor_docs
    quote: Access to raw data is a special feature available only for contracted partners.
    retrieved: '2026-10-10'
  recheck_by: '2026-11-09'
- field: program_application
  status: stated
  value: >-
    Contact Withings (Advanced Research API contact link, raw-data page contact, or the Health Solutions
    study request form) and sign a contract. No review criteria or turnaround time is published.
  confidence: Verified
  sources:
  - url: https://developer.withings.com/developer-guide/v3/withings-solutions/research-apis
    type: vendor_docs
    quote: Interested in using our Advanced Research API? Click here.
    retrieved: '2026-10-10'
  - url: https://developer.withings.com/developer-guide/v3/integration-guide/public-health-data-api/data-api/raw-data
    type: vendor_docs
    quote: If you are interested in using this feature, please contact us
    retrieved: '2026-10-10'
  - url: https://www.withings.com/en-us/pages/research-request
    type: vendor_page
    quote: You want to conduct a new study with us? Fill this form right now and we will contact you to work with
      you.
    retrieved: '2026-10-10'
  recheck_by: '2026-11-09'
  note: The Advanced Research API "Click here" link goes to a Withings Health Solutions partner contact form. No form
    was submitted.
- field: program_status
  status: stated
  value: >-
    Active as of 2026-10-10: the Advanced Research API overview and the raw-data page are live and current,
    ScanWatch only. No pause or closure notice found.
  confidence: Corroborated
  sources:
  - url: https://developer.withings.com/developer-guide/v3/withings-solutions/research-apis
    type: vendor_docs
    quote: Currently, the Advanced Research API is compatible exclusively with the Withings ScanWatch.
    retrieved: '2026-10-10'
  - url: https://static.withings.com/content/api/plans/plans.html
    type: vendor_page
    quote: Trusted by 100+ research labs.
    retrieved: '2026-10-10'
  recheck_by: '2026-11-09'
  note: >-
    Corroborated rather than Verified because no page states the program is active; it is inferred from live
    documentation. The separate "Advanced Research API Integration Guide"
    (developer-guide/v3/integration-guide/advanced-research-api/advanced-research-api-overview) answered with
    a 302 redirect on 2026-10-10 and is not in the sitemap; it may have moved behind the Partner Hub login.
    Which ScanWatch generations (2, Light, Nova) are covered is not stated.
- field: developer_program_status
  status: stated
  value: >-
    Open and self-serve. The Public API needs no contract and apps are created in the developer dashboard.
    From 2026-10-12, Withings accounts created after that date need a Withings+ membership to share data
    with Start for Free apps, unless the app is on Enterprise or Advanced Biomarkers.
  confidence: Verified
  sources:
  - url: https://developer.withings.com/llms.md
    type: vendor_docs
    quote: No contract required
    retrieved: '2026-10-10'
  - url: https://developer.withings.com/llms.md
    type: vendor_docs
    quote: create app at https://developer.withings.com/dashboard/
    retrieved: '2026-10-10'
  - url: https://static.withings.com/content/api/plans/plans.html
    type: vendor_page
    quote: Withings+ becomes required on the Start for Free API plan from October 12, 2026
    retrieved: '2026-10-10'
  recheck_by: '2026-11-25'
- field: user_cap
  status: stated
  scope: Start for Free plan
  value: >-
    10 active users, raised to a use-case level once Withings reviews the app (an app review form of about
    10 questions). An active user is one whose account is connected with a valid authorization.
  confidence: Verified
  sources:
  - url: https://www.withings.com/pages/withings-api-plans-form
    type: vendor_page
    quote: Every app on the Free API plan starts capped at 10 users so you can build, test, and validate.
    retrieved: '2026-10-10'
  - url: https://static.withings.com/content/api/plans/plans.html
    type: vendor_page
    quote: Once approved, your cap is raised to a level that fits your use case
    retrieved: '2026-10-10'
  recheck_by: '2026-11-25'
  note: Search-engine snippets of an older developer-guide version cite larger free-plan caps (5,000 or 1,000
    active users). They are not on any live page; 10 is current.
- field: user_cap
  status: stated
  scope: Enterprise and Advanced Biomarkers plans
  value: Unlimited active users.
  confidence: Verified
  sources:
  - url: https://static.withings.com/content/api/plans/plans.html
    type: vendor_page
    quote: Custom Based on number of active users Users Unlimited
    retrieved: '2026-10-10'
  recheck_by: '2026-11-25'
- field: academic_vs_commercial
  status: stated
  value: >-
    No separate academic tier or academic price. Plans are organised by scale and biomarkers. Research use runs
    through the contracted Advanced Research API or the Advanced Biomarkers plan, and research partners are
    one of the use cases for which the end-user Withings+ requirement can be removed.
  confidence: Corroborated
  sources:
  - url: https://static.withings.com/content/api/plans/plans.html
    type: vendor_page
    quote: 'The Withings+ requirement can be removed for specific use cases: Cellular Solutions, SDK and Research
      partners.'
    retrieved: '2026-10-10'
  recheck_by: '2026-11-25'
  note: Corroborated because "no academic tier" is an absence across pages, not a statement. Terms of the research
    partner exemption are not published.
