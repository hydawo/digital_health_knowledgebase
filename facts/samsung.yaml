# ---------------- Data access and terms ----------------
- field: raw_streams
  status: stated
  value: 'Sensor SDK only (Galaxy Watch4 and later, on-watch, live): raw accelerometer, raw PPG green, infrared and red,
    raw ECG (on demand) and raw EDA (Galaxy Watch8 and later). No raw route from Galaxy Ring or through the Data SDK.
    For apps targeting Android 16, ECG, EDA, PPG and BIA trackers need the Samsung READ_ADDITIONAL_HEALTH_DATA
    permission.'
  confidence: Verified
  sources:
  - url: https://developer.samsung.com/health/sensor/overview.html
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: The accelerometer, ECG, and PPG data are provided as raw data by Samsung Health Sensor SDK.
  - url: https://developer.samsung.com/health/sensor/guide/data-specifications.html
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: EDA measurement is available with Galaxy Watch8 series and later models
  - url: https://developer.samsung.com/health/sensor/faq.html
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: The Samsung Health Sensor SDK supports only Galaxy Watch4 and later models running Wear OS powered by Samsung.
  - url: https://developer.samsung.com/health/sensor/release-note.html
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: Required permissions to use each HealthTrackerType have been changed for targeting Android 16
  - url: https://developer.samsung.com/health/sensor/release-note.html
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: com.samsung.android.hardware.sensormanager.permission.READ_ADDITIONAL_HEALTH_DATA
  recheck_by: '2026-11-09'
  note: 'The Android 16 change came in v1.4.0 (31 July 2025). The release-note table lists BIA_ON_DEMAND, ECG_ON_DEMAND,
    EDA_CONTINUOUS, MF_BIA_ON_DEMAND, PPG_CONTINUOUS and PPG_ON_DEMAND under the Samsung permission, with heart rate
    and SpO2 under standard Android HealthPermissions; it adds a permission prompt for participants. Sensor SDK data
    does not pass through Samsung Health, so the study app must capture and upload it.'
- field: derived_metrics
  status: stated
  value: 'Data SDK (Android phone, reading Samsung Health, including Galaxy Watch and Galaxy Ring data): activity summary,
    exercise, floors, heart rate, sleep, sleep apnea, irregular heart rhythm notification, energy score, blood oxygen,
    skin and body temperature, blood pressure, blood glucose, body composition, nutrition, water, steps (aggregate only),
    goals and user profile. Sensor SDK (on-watch): heart rate with inter-beat intervals, SpO2, BIA and MF-BIA, skin
    temperature and sweat loss. HRV is not exposed; it must be computed from IBI.'
  confidence: Verified
  sources:
  - url: https://developer.samsung.com/health/data/overview.html
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: 'Samsung Health Data SDK supports various read data types: Activity summary Active calories burned goal Active
      time goal Blood glucose Blood oxygen Blood pressure Body composition Body temperature Energy score Exercise Exercise
      location Floors climbed Heart rate Irregular heart rhythm notification Nutrition Nutrition goal Skin temperature
      Sleep Sleep apnea Sleep goal Steps Step goal Water intake Water intake goal User profile'
  - url: https://developer.samsung.com/health/data/guide/features/data-types.html
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: Steps Aggregate Step goal Aggregate
  - url: https://developer.samsung.com/health/sensor/faq.html
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: The Samsung Health Sensor SDK provides heart rate data tracking with IBI (inter-beat interval), which can be
      used to calculate HRV (heart rate variability).
  - url: https://developer.samsung.com/health/data/overview.html
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: Data measured using Samsung Health Data SDK is intended for fitness and wellness purposes only and is not for
