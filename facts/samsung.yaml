- field: program_application
  status: stated
  value: Submit a partner request on Samsung Developer (signed-in form) before distributing an app; after approval the
    app's package name and SHA-256 signature are registered. Until then the Sensor SDK and Data SDK work only in
    developer mode, which is for testing only. Writing to Samsung Health also needs an access code issued after
    approval. Approvals under the deprecated Samsung Health SDK for Android do not carry over to the Data SDK.
  confidence: Verified
  sources:
  - url: https://developer.samsung.com/health/sensor/process.html
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: Please submit partner request before your app distribution. Your app's information including the app package
      name and signature (SHA-256) can be registered in the Samsung Health's system after an approval. Otherwise, the
      app using the Samsung Health Sensor SDK works only with the developer mode turned on.
  - url: https://developer.samsung.com/health/sensor/process.html
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: The developer mode is intended only for testing or debugging your app. It is not intended for app users.
  - url: https://developer.samsung.com/health/data/process.html
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: Please submit partner request before your app distribution. Your app's information including the app package
