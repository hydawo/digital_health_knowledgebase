# ---------------- Research access ----------------
- field: research_program
  status: stated
  scope: Samsung Health Research Stack
  value: 'Samsung Health Research Stack: an open-source toolset (App SDK, Web Portal, backend services) that a study
    team installs and runs itself to collect and analyse wearable data on Android and Wear OS. It is software, not a
    data-access or academic program; production use of the Sensor or Data SDK inside it still needs partner approval.'
  confidence: Verified
  sources:
  - url: https://developer.samsung.com/health/research/overview.html
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: Samsung Health Research Stack is an open-source technology stack offering end-to-end solutions for collecting
      and analyzing data from wearable devices in Android and Wear OS environments.
  - url: https://developer.samsung.com/health/research
    type: vendor_page
    retrieved: '2026-10-10'
    quote: It includes the App SDK, Web Portal, and a System to support backend services through API endpoints.
  - url: https://developer.samsung.com/health
    type: vendor_page
    retrieved: '2026-10-10'
    quote: Samsung Health Research Stack is backed by open-source tools, applications, and services for running, managing,
      and analyzing medical research studies and clinician services on Android and Wear OS devices.
  recheck_by: '2026-11-09'
- field: research_program
  status: stated
  scope: Institutional collaborations and the Samsung research platform (via Alcedis)
  value: 'Samsung also runs direct research collaborations with chosen institutions, with no published application
    route: the Open Innovation Initiative (announced October 2023 at SDC23) and named studies with Stanford (sleep
    apnoea), Tulane and Huma (HEARTBEAT), UCSF Neuroscape (cognition, announced July 2026) and MGH (GLP-1 and body
    composition, May 2026). In June 2026 Samsung announced a partnership with Alcedis, a CRO owned by Huma, offering
    "Samsung''s research platform" (study setup, biosensor control, participant- and device-level biosensor data)
    with Alcedis running study execution. No sign-up, eligibility or pricing for it is published.'
  confidence: Corroborated
