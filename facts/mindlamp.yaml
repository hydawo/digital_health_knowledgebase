# ---------------- Research access ----------------
- field: research_program
  status: stated
  value: 'mindLAMP Core (also called Core Services), run by the BIDMC Division of Digital Psychiatry: the supported
    deployment pathway for mindLAMP. It covers study design consultation, protocol optimisation, privacy-aware
    configuration, hosting (shared or dedicated BIDMC instance, or support for self-hosting), onboarding and training,
    data monitoring, Cortex analytics support, troubleshooting and optional custom development. It is a paid service
    under a business agreement, not a free access program; the team offers letters of support for grants. The code
    itself is public, and self-hosting outside the Core needs no program (but see licence).'
  confidence: Verified
