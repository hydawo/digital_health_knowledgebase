- field: retention_terms
  status: conflict
  value: 'Three sources disagree. (1) The live privacy page: deleted content has a 90-day soft-deletion period
    (restorable on request) and is then deleted permanently; participants can delete their account in the app;
    aggregated usage statistics may be kept indefinitely. (2) The Google Play data-safety label: "Data can''t be
    deleted". (3) The maintainers'' own correction, open as LAMP-platform PR 939 since 2026-03-16 (lead engineer, not
    merged): it rewrites the page to fix "inaccurate data deletion claims", saying deleted data stays in the database
    until a site administrator removes it by hand, and event data (survey responses, sensor readings) cannot be
    deleted through the API. Self-hosters control their own data.'
  confidence: Unclear
