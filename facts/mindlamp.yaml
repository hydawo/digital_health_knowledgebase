# ---------------- Data access and terms ----------------
- field: raw_streams
  status: stated
  value: 'Raw, timestamped sensor events from 9 phone sensors (GPS as raw unhashed coordinates, accelerometer, device
    motion, device state, steps, nearby devices, telephony, analytics, activity recognition) and 10 HealthKit or Health
    Connect types (sleep, heart rate, HRV, respiratory rate, blood pressure, blood glucose, oxygen saturation, body
    temperature, workouts, nutrition); wearables are reached only through HealthKit or Health Connect. Apple SensorKit
    adds app usage, text message metadata and visit types on enrolled iOS research devices. Text-message features come
    only from iOS SensorKit; the Android app requests no call-log or SMS permission. Active data: surveys, cognitive
    games, voice recordings. The web version collects no passive data. Retrieved by REST API, SDKs, Cortex or the
    dashboard Data Portal.'
  confidence: Verified
  sources:
  - url: https://docs.lamp.digital/sensors-data/
    type: vendor_docs
    quote: mindLAMP supports 9 device sensors (GPS, accelerometer, device motion, device state, steps, nearby devices,
      telephony, analytics, activity recognition) and 10 health platform sensors that read from Apple HealthKit or Google
      Health Connect (sleep, heart rate, HRV, respiratory rate, blood pressure, blood glucose, oxygen saturation, body
      temperature, workouts, nutrition).
    retrieved: '2026-10-11'
  - url: https://docs.lamp.digital/sensors-data/reference/gps
    type: vendor_docs
    quote: GPS data is recorded as raw latitude/longitude coordinates. Coordinates are not hashed or anonymized in the
      raw data.
    retrieved: '2026-10-11'
  - url: https://docs.lamp.digital/sensors-data/configuration
    type: vendor_docs
    quote: mindLAMP does not connect directly to wearable devices.
    retrieved: '2026-10-11'
  - url: https://docs.lamp.digital/capabilities/collect
    type: vendor_page
    quote: On enrolled research devices, SensorKit adds app usage categories, text message metadata, and location visit
      types.
    retrieved: '2026-10-11'
  - url: https://docs.lamp.digital/sensors-data/reference/telephony
    type: vendor_docs
    quote: Text message features ( text_number , text_degree ) depend on the messages_usage raw feature from iOS SensorKit
    retrieved: '2026-10-11'
  - url: https://github.com/BIDMCDigitalPsychiatry/LAMP-core-android/blob/master/app/src/main/AndroidManifest.xml
    fetch_url: https://raw.githubusercontent.com/BIDMCDigitalPsychiatry/LAMP-core-android/master/app/src/main/AndroidManifest.xml
    type: repository
    retrieved: '2026-10-11'
  - url: https://docs.lamp.digital/sensors-data/configuration
    type: vendor_docs
    quote: The web version supports active data collection (surveys, games) and dashboard access but does not support
      passive sensor data.
    retrieved: '2026-10-11'
  - url: https://github.com/BIDMCDigitalPsychiatry/LAMP-dashboard/releases/tag/2026.08.05.3
    type: repository
    quote: Survey branching settings remain configurable but inert at runtime
    retrieved: '2026-10-11'
  recheck_by: '2026-11-30'
  note: The Android manifest on master (read 2026-10-11) requests READ_PHONE_STATE but neither READ_CALL_LOG nor
    READ_SMS, so Android telephony is call-state events, not a call log; no quote because this is an absence. The AWS
    blog (2026-09-29) says call and text logs sync from the phone, which overstates this. Survey branching can be
    configured in the dashboard but does nothing when participants take a survey (known issue in the dashboard
    release notes, 2026.08.05.3, 2026-09-21); no schema field fits, so it is recorded here.
- field: derived_metrics
  status: stated
  value: Cortex, the open-source Python package (lamp-cortex, BSD-3-Clause, still maintained), turns raw events into
    primary features (significant locations, trips, screen-on bouts) and daily secondary features (home time, location
    entropy, trip distance, screen duration, step count, call counts, HealthKit sleep duration, data quality and more).
    Text, unlock, app-time and visit features need iOS SensorKit, which requires an Apple-approved research study.
    Researchers run Cortex themselves against a LAMP server, or the Core runs default or custom analysis.
  confidence: Verified
  sources:
  - url: https://docs.lamp.digital/capabilities/analyze
    type: vendor_docs
    quote: Cortex is mindLAMP's open-source Python library for turning raw sensor and activity data into research-ready
      behavioral features.
    retrieved: '2026-10-11'
  - url: https://docs.lamp.digital/developer/cortex/features/secondary-features/
    type: vendor_docs
    quote: These features require enrollment in an Apple-approved research study.
    retrieved: '2026-10-11'
  - url: https://research.bidmc.org/mindlamp/about
    type: vendor_page
    quote: The CORE can run default or custom analysis on your data.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-30'
  note: The profile calls Cortex legacy and LAMP-toolkit its successor; the current docs, Core page and AWS blog all
    present Cortex as the analytics layer, and the repository was pushed 2026-05-18. A new repository, LAMP-raphe
    (created 2026-09-29, no licence file), describes a phenotyping framework that can run Cortex as one feature engine;
    not otherwise checked.
- field: sampling_rates
  status: stated
  value: Accelerometer default 5 Hz (maximum 5 Hz); GPS default 1 Hz (maximum 5 Hz), but OS throttling means background
    GPS often arrives at roughly 0.1 Hz or less. Rates are set at the sensor-spec level through the API; the dashboard
    Sensors tab only turns sensors on or off. Other sensors are event-driven or interval-reported.
  confidence: Verified
  sources:
  - url: https://docs.lamp.digital/sensors-data/configuration
    type: vendor_docs
    quote: Accelerometer — 5 Hz (5 samples per second). Configurable via the frequency setting.
    retrieved: '2026-10-11'
  - url: https://docs.lamp.digital/sensors-data/configuration
    type: vendor_docs
    quote: Both rates can be adjusted at the sensor spec level through the API.
    retrieved: '2026-10-11'
  - url: https://docs.lamp.digital/sensors-data/configuration
    type: vendor_docs
    quote: The Sensors tab enables or disables sensors but does not expose rate configuration.
    retrieved: '2026-10-11'
  - url: https://docs.lamp.digital/sensors-data/reference/gps
    type: vendor_docs
    quote: Sampling Rate frequency number (Hz) 1 5
    retrieved: '2026-10-11'
  - url: https://docs.lamp.digital/developer/cortex/features/secondary-features/
    type: vendor_docs
    quote: actual data arrives at roughly 0.1 Hz or less.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-30'
- field: history_depth
  status: stated
  value: No look-back limit is documented. Queries take arbitrary from/to timestamps (Unix milliseconds) and return up
    to 1,000 events per request by default, so long ranges are paged by time window. How long a hosted project's data
    is kept, and how far back HealthKit or Health Connect history is read at first sync, are not documented.
  confidence: Corroborated
  sources:
  - url: https://docs.lamp.digital/api/query-sensor-events-for-a-participant
    type: vendor_docs
    quote: 'from int64 The UNIX Epoch date-time representation: number of milliseconds since 1/1/1970 12:00 AM.'
    retrieved: '2026-10-11'
  - url: https://docs.lamp.digital/developer/api-sdks/python-sdk
    type: vendor_docs
    quote: Results are limited to 1000 entries per request.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-30'
  note: Corroborated because "all stored data is retrievable" follows from the API design and the absence of a stated
    limit, not from a statement. Retention depends on the deployment (see retention_terms).
- field: export_routes
  status: stated
