- field: hipaa_statement
  status: stated
  value: 'BIDMC states that LAMP offers safeguards in line with the HIPAA Security Rule (access control, audit logs,
    integrity controls, encrypted transmission; AES-256 at rest with a per-site key, TLS 1.3 in transit) and supports
    HIPAA-compliant workflows. It is a self-description, not a certification. A penetration test by Echelon Risk +
    Cyber was run in July 2025 on a BIDMC test environment. The audit-logging claim is not borne out by the code
    record: request-level audit logging is an open work item (LAMP-platform issue 910, open since 2025-06-09) and its
    pull request (LAMP-server PR 264) is unmerged.'
  confidence: Corroborated
