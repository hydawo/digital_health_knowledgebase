    server-side sessions, makes 2FA or OAuth mandatory for all staff, and replaces username and password in LAMP-py
    with API keys; scripts that sign in with a password will stop working after the release. The server code was
    merged on 2026-09-30 (LAMP-server PR 284) but is not released: the newest LAMP-server release is 2023.7.27. No
    release date has been announced. Self-hosted servers are unaffected until upgraded, and the upgrade is offered
    through the Core services process.'
