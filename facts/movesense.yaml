# ---------------- Research access ----------------
- field: research_program
  status: stated
  scope: Movesense Academic Program
  value: Movesense Academic Program. Selected research teams receive a limited number of Movesense sensors and
    accessories (such as heart rate straps) plus technical support, in exchange for crediting Movesense in
    publications and providing project material for Movesense news and social media.
  confidence: Verified
  sources:
  - url: https://www.movesense.com/movesense-academic-program/
    type: vendor_page
    quote: Movesense supplies the selected research teams with a limited number of Movesense sensors and associated
      accessories such as heart rate straps.
    retrieved: '2026-10-11'
  - url: https://www.movesense.com/movesense-academic-program/
    type: vendor_page
    quote: Researchers agree to mention Movesense in scientific articles and other publications related to the project
    retrieved: '2026-10-11'
  - url: https://www.movesense.com/movesense-academic-program/
    type: vendor_page
    quote: Research projects agree to provide the Movesense team with material related to the research project that
      can be used in news articles on www.movesense.com and shared in Movesense social media.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-25'
  note: An equipment-and-support grant, not a data or platform program; Movesense has no cloud data platform for
    researchers. Outside the program there is no research tier, and teams buy sensors in the business-only web shop.
    Third parties (for example Fibion Flash) resell Movesense hardware as research kits.
- field: program_eligibility
  status: stated
  scope: Movesense Academic Program
  value: Academic teams, researchers and students may apply. Selection weighs innovativeness and usefulness, the
    commercial potential of the results, how useful Movesense sensors are to the project, the project's potential to
    build awareness for Movesense, and additional non-published criteria.
  confidence: Verified
  sources:
  - url: https://www.movesense.com/movesense-academic-program/
    type: vendor_page
    quote: Movesense team warmly welcome academic teams, researchers and students to apply for the Movesense Academic
      Program!
    retrieved: '2026-10-11'
  - url: https://www.movesense.com/movesense-academic-program/
    type: vendor_page
    quote: Potential of commercial applications of the project results Utility value of Movesense sensors for completing
      the project Potential of the project to build awareness for Movesense Additional non-published criteria of Movesense
    retrieved: '2026-10-11'
  recheck_by: '2026-11-25'
  note: Past participants include non-university organizations (for example Neurobit Technologies, Singapore), so
    the program is not limited to universities. Selection explicitly weighs commercial potential and publicity value
    for Movesense, which teams should expect when framing an application.
- field: program_application
  status: conflict
  scope: Movesense Academic Program
  value: Apply through an online form (Google Form) with a short project description, timeline and planned use of
    the sensors; up to three projects are invited per quarter, at Movesense's discretion and without explanation.
    The review cadence conflicts between the program page (monthly) and the application form (weekly).
  confidence: Verified
  sources:
  - url: https://www.movesense.com/movesense-academic-program/
    type: vendor_page
    quote: Interested researchers send an application to the Movesense team via an online form. The application includes
      a short description of the project, project timeline, and a description of how the Movesense sensors would be
      used.
