# ---------------- Data access and terms ----------------
- field: raw_streams
  status: stated
  value: 'Raw, unfiltered single-channel ECG, accelerometer, gyroscope and magnetometer (9-axis IMU), plus internal
    temperature, on all models, through the sensor''s REST-style API: streamed over Bluetooth LE to the iOS/Android
    mobile library or the GATT SensorData Protocol (Python client), or logged on the sensor and downloaded later.
    Custom firmware can process data on the sensor. The MD ECG front end uses a 0.5 Hz high-pass filter instead of
    7 Hz on the sport models.'
  confidence: Verified
  sources:
  - url: https://www.movesense.com/faq/
    type: vendor_page
    quote: You have full access to raw, unfiltered 1‑channel ECG as well as raw acceleration, gyroscope, and magnetometer
      data with different sample rates and measurement ranges.
    retrieved: '2026-10-11'
  - url: https://bitbucket.org/movesense/movesense-device-lib/raw/master/README.md
    type: repository
    quote: Movesense APIs follow well-known REST principle and can be used both internally by the sensor app or externally
      via the iOS/Android libraries.
    retrieved: '2026-10-11'
  - url: https://www.movesense.com/docs/esw/api_reference/
    type: vendor_docs
    quote: Movesense sensor is equipped with temperature sensor, which can be used to measure device's internal temperature.
    retrieved: '2026-10-11'
