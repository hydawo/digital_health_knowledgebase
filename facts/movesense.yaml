- field: developer_program_status
  status: stated
  scope: Medical firmware for Movesense MD
  value: Firmware a team writes itself is not covered by Movesense MD's MDR registration; the team must validate and
    certify its own solution. Certified medical firmware is distributed through a separate Movesense Medical software
    repository, with access granted on request by email. The MD meets the medical device standards only when paired
    with certified Movesense firmware.
  confidence: Verified
  sources:
  - url: https://www.movesense.com/news/2023/02/movesense-medicals-mdr-registration-approaches-what-does-it-mean-for-movesense-md-customers/
    type: vendor_page
    quote: If you are developing your own sensor firmware, it is not covered with the MDR registration of Movesense MD.
    retrieved: '2026-10-11'
  - url: https://www.movesense.com/news/2023/02/movesense-medicals-mdr-registration-approaches-what-does-it-mean-for-movesense-md-customers/
    type: vendor_page
    quote: You must validate the possible clinical benefit and certify the solution separately.
    retrieved: '2026-10-11'
  - url: https://movesense.com/docs/medical/medical_sw/
    type: vendor_docs
    quote: The Movesense Medical sensor only fulfills the requirements of the medical device standards if it has been
      paired with the certified Movesense firmware.
    retrieved: '2026-10-11'
  - url: https://www.movesense.com/product/movesense-medical-mdr/
    type: vendor_page
    quote: If starting to develop a commercial medical firmware, please send an email to info@movesense.com to receive
      access to the medical firmware development repository.
    retrieved: '2026-10-11'
  - url: https://www.movesense.com/news/2025/06/movesense-sensor-firmware-2-3-1-released-a-major-upgrade-for-medical-use/
    type: vendor_page
    quote: The previous firmware version certified for medical use is 2.1.5, and subsequent updates have been intended
      for non-medical use only.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-25'
  note: Custom on-sensor firmware and Class IIa status are therefore alternatives on the MD, not a combination. A study
    relying on the MD's medical-device status must run certified Movesense firmware (2.3.1 brought later features to
    medical use in June 2025).
