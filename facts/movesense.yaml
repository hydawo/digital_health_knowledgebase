- field: developer_program_status
  status: stated
  value: Open, with no application step or account. The device library, mobile library, API documentation, sample code
    and tools are on public Bitbucket repositories and can be used without buying anything. Use of the device
    library is governed by the Movesense SDK License and Evaluation Agreement (LICENSE.pdf), an evaluation licence
    under which commercialization needs a separate agreement. The FAQ calls the SDKs, tools and sample code open and
    free to use.
  confidence: Verified
  sources:
