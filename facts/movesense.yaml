- field: history_depth
  status: stated
  value: 'No cloud history; data exists only where the researcher streams or downloads it. On-sensor logging is bounded
    by memory. HR2, HR+ and MD have 384 kB EEPROM used as a ring buffer that overwrites the oldest data. Flash has
    128 MB flash that stops writing when full; Movesense says it holds up to five days of single-channel ECG, over four
    months of heart rate intervals, four days of 26 Hz acceleration or almost 19 hours of 52 Hz 9-axis motion.'
  confidence: Verified
  sources:
