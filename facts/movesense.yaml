- field: academic_vs_commercial
  status: stated
  value: 'No academic pricing; universities pay shop prices and can request a formal quote. The licensing documents
    say different things. The FAQ calls the SDKs, developer tools and sample code open and free to use. The Terms page
    carries a Limited Evaluation Licence Agreement with Movesense Ltd that runs twelve months, bars incorporating or
    integrating the Licensed Technology in any products or services, and points to a separate Commercial License for
    commercial use. The device library LICENSE.pdf (SDK License and Evaluation Agreement) limits use to evaluation,
    testing and potential development, with the same bar on incorporation, and makes commercialization subject to a
    separate agreement. Only the Showcase app and sample source in the mobile library are Apache 2.0, and sbem-tools
    is MIT.'
  confidence: Verified
  sources:
  - url: https://www.movesense.com/faq/
    type: vendor_page
    quote: There is no general academic pricing. We are happy to provide an official quote if needed for university
      procurement.
    retrieved: '2026-10-11'
  - url: https://www.movesense.com/faq/
    type: vendor_page
    quote: All our SDK’s, developer tools, and sample code are open and free to use.
    retrieved: '2026-10-11'
  - url: https://www.movesense.com/terms/
    type: vendor_legal
    quote: stay in force for a period of twelve (12) months from the Effective Date
    retrieved: '2026-10-11'
  - url: https://www.movesense.com/terms/
    type: vendor_legal
    quote: In particular, the Licensee shall not incorporate or integrate the Licensed Technology or any part thereof
      in any products or services.
    retrieved: '2026-10-11'
  - url: https://www.movesense.com/terms/
    type: vendor_legal
    quote: A separate Commercial License agreement, with straightforward terms, is available for commercial use.
    retrieved: '2026-10-11'
  - url: https://bitbucket.org/movesense/movesense-device-lib/raw/master/LICENSE.pdf
    type: repository
    quote: “Purpose” means the Licensees’ evaluation, testing and potential development of a software application
    retrieved: '2026-10-11'
  - url: https://bitbucket.org/movesense/movesense-device-lib/raw/master/LICENSE.pdf
    type: repository
    quote: In particular, the Licensee shall not incorporate or integrate the Licensed Technology or any part thereof
      in any products or services.
    retrieved: '2026-10-11'
  - url: https://bitbucket.org/movesense/movesense-mobile-lib/raw/master/README.md
    type: repository
    quote: ShowcaseApp and sample source code is published under Apache 2.0 license.
    retrieved: '2026-10-11'
  - url: https://bitbucket.org/movesense/sbem-tools/raw/master/README.md
    type: repository
    quote: This project is licensed under the MIT License.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-25'
  note: The FAQ's "open" describes access and cost, not an open-source licence; the device library itself is
    proprietary. Both evaluation texts are twelve-month agreements (Terms section 11 and LICENSE.pdf section 11). The
    Terms version also caps Movesense's liability at fifty euros. Commercial License terms are not published. The
    Python datalogger tool is described as open source but its README licence section is an unfilled placeholder.
    Whether a deployed research app counts as evaluation and development is not stated; institutional legal review
    should decide.
