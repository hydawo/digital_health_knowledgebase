# ---------------- Data access and terms ----------------
- field: raw_streams
  status: not_public
  scope: Consumer and public routes
  confidence: Verified
  sources:
  - url: https://ringconn.com/pages/ringconn-app-privacy-policy
    type: vendor_legal
    quote: The RingConn smart ring uses built-in sensors (such as PPG(a light-based sensor), accelerometers, temperature
      sensors, and SpO₂ sensors) to collect raw measurement data.
    retrieved: '2026-10-21'
  - url: https://ringconn.com/blogs/news/ringconn-will-migrate-from-google-fit-to-health-connect
    type: vendor_page
    retrieved: '2026-10-21'
  - url: https://ringconn.com/blogs/guides/wearable-data-sync
    type: vendor_page
    retrieved: '2026-10-21'
  recheck_by: '2026-11-20'
  note: The ring collects raw PPG, accelerometer, temperature and SpO2 measurements, but no published route gives
    anyone the raw signals; Health Connect, Apple Health and portability requests carry processed records only. The
    Blood Pressure Trends (Beta) policy says raw PPG, accelerometer and skin temperature are collected for that beta
    and used only for RingConn's own models (see retention_terms and ai_training_terms). OpenCircuit, a community
    reverse-engineered BLE client, is not a vendor route (see export_routes).
- field: raw_streams
  status: stated
  scope: Company research collaboration
  value: 'One documented case, not a general offering: a 2026 method-comparison study in shooting athletes (preprint
    2026-06-11; version of record in BMC Sports Science, Medicine and Rehabilitation, 2026-08-18, DOI
    10.1186/s13102-026-01960-x) used raw finger PPG from a RingConn Gen 2 at 100 Hz (green channel only; the ring has
    green, red and infrared sensors) to derive inter-beat intervals. The firmware and app build were customised for
    research data export. Three authors are Shenzhen Ninenovo and/or RingConn LLC staff, and the companies supplied
    the equipment and technical support.'
  confidence: Reported
  sources:
  - url: https://doi.org/10.21203/rs.3.rs-9564367/v1
    fetch_url: https://assets-eu.researchsquare.com/files/rs-9564367/v1_covered_1d7f615a-644b-4b19-8b6f-9f1d301ef27f.pdf
    type: paper
    quote: The firmware and app build used for research data export were customized
    retrieved: '2026-10-21'
  - url: https://doi.org/10.21203/rs.3.rs-9564367/v1
    fetch_url: https://assets-eu.researchsquare.com/files/rs-9564367/v1_covered_1d7f615a-644b-4b19-8b6f-9f1d301ef27f.pdf
    type: paper
    quote: only the green channel was used in the
    retrieved: '2026-10-21'
  - url: https://doi.org/10.21203/rs.3.rs-9564367/v1
    fetch_url: https://assets-eu.researchsquare.com/files/rs-9564367/v1_covered_1d7f615a-644b-4b19-8b6f-9f1d301ef27f.pdf
    type: paper
    quote: 100 Hz, and ring sizes 6–14 were available
    retrieved: '2026-10-21'
  - url: https://doi.org/10.21203/rs.3.rs-9564367/v1
    fetch_url: https://assets-eu.researchsquare.com/files/rs-9564367/v1_covered_1d7f615a-644b-4b19-8b6f-9f1d301ef27f.pdf
    type: paper
    quote: These organizations provided the study equipment and technical support.
    retrieved: '2026-10-21'
  recheck_by: '2026-11-20'
  note: Reported because a single company-involved paper describes it and RingConn publishes nothing about such a
    route; the paper itself says the research build "may differ from the current consumer-facing workflow". Quotes
    are from the Research Square preprint PDF; the journal page (biomedcentral.com, link.springer.com) served a bot
    challenge to scripted requests on 2026-10-21 and was not read. Crossref confirms the journal title, date and DOI.
    It shows that a raw route has been opened through the company, not that one is available on request.
- field: derived_metrics
  status: stated
  value: 'Via Health Connect (Android): resting energy, steps, exercise calories; time in bed, awake duration, sleep
    stages; resting and average heart rate; height; weight; oxygen saturation. HRV is not synced to Health Connect
    ("algorithm compatibility issue"). Apple Health sync is confirmed on RingConn pages but the HealthKit types are not
    listed. Blood Pressure Trends (Beta) results are never shared with any third-party health platform. In-app only:
    sleep, stress and recovery scores, respiratory rate, skin temperature trends and other proprietary metrics.'
  confidence: Verified
