  note: 'No research, academic or enterprise data program is published, and the sitemap lists no research, developer
    or organisations page. The only institutional route today is a generic business enquiry address. History: the
    business article carried an "Educational and Government Partnerships" paragraph inviting schools, government
    agencies and institutions to partner for "health monitoring, data analytics" (Wayback capture 2025-11-25, quoted
