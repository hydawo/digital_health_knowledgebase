# ---------------- Research access ----------------
- field: research_program
  status: stated
  value: No named, open research or academic access program. Zepp describes bespoke research collaborations
    (Stanford sleep study, UCSD Center for Wearable Sensors membership, NTNU on PAI, Peking University First Hospital
    AF study, Chinese universities) and a "data analytics services" offer aimed at researchers, providers, insurers and
    employers, with partnerships at 20 research labs, hospitals, pharma companies and universities as of end 2020.
    The only documented data route for third parties is the legacy Huami/Zepp Open Platform "data cooperation" OAuth
    Web API (see developer_program_status).
  confidence: Corroborated
  sources:
  - url: https://www.zepp.com/technology-2
    type: vendor_page
    quote: Zepp Health has collaborated with universities around the world for research and development, operations,
      and education
    retrieved: '2026-10-22'
  - url: https://www.zepp.com/technology-2
    type: vendor_page
    quote: Joint Study of the Effects of Sleep on Physical Recovery With the Stanford University Center for Sleep Sciences
      and Medicine.
    retrieved: '2026-10-22'
  - url: https://www.zepp.com/data-analytics
    type: vendor_page
    quote: At the end of 2020, Zepp Health had partnerships with 20 independent research laboratories, hospitals, pharmaceutical
      companies and universities
    retrieved: '2026-10-22'
  - url: https://apps.apple.com/us/app/stf-sleep-research/id1345157553
    type: app_store
    quote: The app will help Stanford University researchers to study Sleep Sciences.
    retrieved: '2026-10-22'
  recheck_by: '2026-11-21'
  note: The Stanford collaboration ran through a dedicated Zepp-built iOS app, "STF Sleep Research" (developer Zepp
    Inc., version 3.3.4, last updated 2021-03-05 per the iTunes lookup API), which syncs steps, sleep and heart rate to
    Apple Health. It shows study-specific apps are one collaboration route, not a public offer. The zepp.com footer's
    "Academics" link points to the technology page's academic section, not to a program page.
    The data-analytics page is dated in its own content ("42 million active users by the first half of 2021") and
    has no application route. The 2025 Form 20-F (filed 2026-04-24) still lists "data analytics capabilities" as a
    software and data service; sec.gov refuses the project fetcher, so that wording was read by hand and is not quoted.
- field: program_eligibility
  status: stated
  value: 'No eligibility rules for a research program are published. For the legacy Open Platform data API: corporate
    applicants only, not individuals; a PhD researcher must apply in the name of the institution.'
  confidence: Corroborated
  sources:
  - url: https://github.com/zepp-health/rest-api/wiki
    type: vendor_docs
    quote: Data cooperation currently only supports corporate users, not individual users; if you are a PhD for scientific
      research purposes, you need to apply in the name of the school.
    retrieved: '2026-10-22'
  recheck_by: '2026-11-21'
  note: The wiki was last edited on 2020-11-27 and names old devices (Mi Band, Amazfit ARC/PACE), so current rules may
    differ. Corroborated, not Verified, for that reason.
- field: program_application
  status: stated
  value: 'Research and developer enquiries go to developer@zepp.com (contact page). Legacy data API: register and apply
    on the Zepp Open Platform (dev.huami.com), 3 to 7 day review, then submit the cooperation details (country, platform,
    business, user numbers, needs); escalation to datapartner@huami.com. A December 2021 applicant quotes the Open
    Platform''s own application docs (item 4) as saying a Zepp business representative will make contact and sign an
    agreement, and reports that Zepp then replied that the API must be paid for and equipment bought.'
  confidence: Corroborated
  sources:
  - url: https://www.zepp.com/contact-us
    type: vendor_page
    quote: For Researchers & Developers developer@zepp.com
    retrieved: '2026-10-22'
  - url: https://github.com/zepp-health/rest-api/wiki
    type: vendor_docs
    quote: The review period is 3-7 days, please wait patiently.
    retrieved: '2026-10-22'
  - url: https://github.com/zepp-health/rest-api/issues/25
    type: secondary
    quote: A Zepp business representative will contact you to learn more about your needs, and then sign an agreement
      with you.
    retrieved: '2026-10-22'
  recheck_by: '2026-11-21'
  note: dev.huami.com is a JavaScript app whose registration flow includes an "enterpriseFastTrack" sign-up route; it
    was not logged into. The issue-25 "business representative" sentence is the applicant quoting the dev.huami.com
    docs (page data-applyfor), which are script-rendered and could not be quoted directly; hence type secondary.
- field: program_status
  status: unclear
  value: 'No research program page exists to have a status. The legacy Open Platform is still online on 2026-10-22
    (dev.huami.com serves "Zepp Open Platform"; api-open.huami.com and auth.huami.com return JSON API errors, not
    dead hosts), but its wiki was last edited 2020-11-27, the repo''s last commit is 2020-12-29, and a 2022 applicant
    reported that after business approval the old platform was deprecated and the new Zepp Console only accepts Zepp
    OS app packages. That issue has no answer from Zepp. Whether new data partners are accepted today is not stated.'
  confidence: Unclear
  sources:
  - url: https://dev.huami.com/
    type: vendor_page
    quote: Zepp Open Platform
    retrieved: '2026-10-22'
  - url: https://github.com/zepp-health/rest-api/issues/26
    type: secondary
    quote: because old platform was deprecated
    retrieved: '2026-10-22'
  - url: https://github.com/zepp-health/rest-api/issues/28
    type: secondary
    quote: https://zepp-health.github.io/rest-api/api-doc.html
    retrieved: '2026-10-22'
  recheck_by: '2026-11-21'
  note: 'Corrected from draft A, which said Zepp staff fixed a doc link in June 2026. Issue 28 (opened 2026-04-28)
    reports the wiki''s api-doc link to huamitech.github.io is broken (it returns 404); the only reply, on 2026-06-24,
    is a bare working URL from an account with no stated affiliation and GitHub author_association NONE, and the wiki
    itself was not edited. It shows the docs are still hosted, not that Zepp is maintaining them. Probes on
    2026-10-22: api-open.huami.com/users/-/profile answered HTTP 400 "Missing required parameter ''Authorization''";
    auth.huami.com/oauth2/authorize answered HTTP 405. Only Zepp (developer@zepp.com or datapartner@huami.com) can
    say whether applications are still reviewed.'
- field: developer_program_status
  status: stated
  value: 'Two programs. (1) Zepp OS developer program, open: free SDK, Zeus CLI, simulator and Zepp Console for watch
    Mini Programs and watch faces, published through a store review. (2) Legacy Huami/Zepp Open Platform OAuth 2.0 Web
    API (api-open.huami.com) for cloud data, by application and review for corporate partners; subscriptions (webhooks)
    for invited partners only; docs last updated 2020; open-to-new-applicants status unclear.'
  confidence: Corroborated
  sources:
  - url: https://developer.zepp.com/os/home
    type: vendor_docs
    quote: Tools and resources to help you build Zepp App faster and easier, across every Zepp OS device.
    retrieved: '2026-10-22'
  - url: https://docs.zepp.com/docs/distribute/
    type: vendor_docs
    quote: you can select the application you want to publish and Submit it for review
    retrieved: '2026-10-22'
  - url: https://github.com/zepp-health/rest-api/wiki
    type: vendor_docs
    quote: Subscription notification is available to invited partners only.
    retrieved: '2026-10-22'
  - url: https://www.zepp.com/technology-2
    type: vendor_page
    quote: The Zepp ecosystem is supported by a growing global Zepp developer community who are encouraged to develop
      new apps and watch faces using Zepp OS Software Development Kit (SDK).
    retrieved: '2026-10-22'
  recheck_by: '2026-11-21'
  note: The Android OAuth consent SDK repo (github.com/zepp-health/oauth-Android-sdk) has a commit titled "release |>
    hmauth/0.0.6" dated 2025-11-28, the first since 2022 (no GitHub release object; the only tag is v0.0.5). That is
