- field: academic_vs_commercial
  status: stated
  value: No separate academic track. The legacy data API treats academics as institutional (corporate) applicants; individuals
    cannot apply. Commercial data-analytics customers (insurers, employers, wellness programs) are served by contract.
  confidence: Corroborated
  sources:
  - url: https://github.com/zepp-health/rest-api/wiki
    type: vendor_docs
    quote: Data cooperation currently only supports corporate users, not individual users; if you are a PhD for scientific
      research purposes, you need to apply in the name of the school.
    retrieved: '2026-10-22'
  - url: https://www.zepp.com/data-analytics
    type: vendor_page
    quote: The data collected from users can have tremendous value for medical researchers and healthcare providers, as
      well as for population health managers such as insurers, employers and wellness program providers.
    retrieved: '2026-10-22'
  recheck_by: '2026-11-21'
