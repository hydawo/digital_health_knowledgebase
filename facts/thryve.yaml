# ---------------- Data access and terms ----------------
- field: raw_streams
  status: stated
  value: 'No sensor-level raw signals (accelerometer, PPG) from web sources: Thryve passes on the manufacturer-processed
    values each source exposes, at the source''s finest granularity, without pre-aggregating. Through the Apple Health SDK
    module it reads heartbeat series and ECG; ThryveBLE (beta) connects Bluetooth heart rate and glucose monitors directly.'
  confidence: Verified
  sources:
  - url: https://docs.thryve.health/thryve-product-overview/access/data-model
    type: vendor_docs
    quote: Sensors in wearables typically record data at high sampling rates (50Hz and higher), which manufacturers transform
      into digestible values.
    retrieved: '2026-10-21'
  - url: https://docs.thryve.health/thryve-product-overview/access/data-model
    type: vendor_docs
    quote: Thryve always stores data at the highest possible granularity and does not pre-aggregate epoch data.
    retrieved: '2026-10-21'
  - url: https://docs.thryve.health/thryve-data-sources/apple-health
    type: vendor_docs
    quote: The ThryveAppleHealth module supports over 90 HealthKit data types, including quantity types (e.g. steps, heart
      rate, body mass), category types (e.g. sleep analysis, mindful sessions), workouts, heartbeat series, ECG and characteristics
    retrieved: '2026-10-21'
  - url: https://docs.thryve.health/integrate-your-mobile-app/direct-bluetooth-device-connection
    type: vendor_docs
    quote: Please note that **ThryveBLE** module is in beta; Flutter support will follow.
    retrieved: '2026-10-21'
    fetch_url: https://docs.thryve.health/integrate-your-mobile-app/direct-bluetooth-device-connection.md
  recheck_by: '2026-11-20'
- field: raw_streams
  status: stated
  scope: Garmin Companion module (SDK 5.3.0)
  value: 'Real-time Bluetooth streaming from paired Garmin devices into the app and Thryve''s warehouse: heart rate, beat-to-beat
    intervals (BBI), SpO2, respiration, stress, steps, calories, floors, Body Battery and intensity minutes. Needs Garmin
    Connect on the phone and a Garmin Companion licence string, which Garmin issues per application ID on request through
    Thryve support.'
  confidence: Verified
  sources:
  - url: https://docs.thryve.health/thryve-data-sources/garmin-health-companion
    type: vendor_docs
    quote: Thryve SDK 5.3.0 provides real-time bluetooth device data integration through the
    retrieved: '2026-10-21'
    fetch_url: https://docs.thryve.health/thryve-data-sources/garmin-health-companion.md
  - url: https://docs.thryve.health/thryve-data-sources/garmin-health-companion
    type: vendor_docs
    quote: Heart-rate variability (R-R / beat-to-beat intervals)
    retrieved: '2026-10-21'
    fetch_url: https://docs.thryve.health/thryve-data-sources/garmin-health-companion.md
  - url: https://docs.thryve.health/thryve-data-sources/garmin-health-companion
    type: vendor_docs
    quote: Before you can use the Garmin Companion SDK in your app, request a development license from Garmin via Thryve
      customer support.
    retrieved: '2026-10-21'
    fetch_url: https://docs.thryve.health/thryve-data-sources/garmin-health-companion.md
  - url: https://docs.thryve.health/thryve-data-sources/garmin-health-companion
    type: vendor_docs
    quote: Without a valid Garmin Companion license, the Thryve Garmin Companion module cannot initialize.
    retrieved: '2026-10-21'
    fetch_url: https://docs.thryve.health/thryve-data-sources/garmin-health-companion.md
  recheck_by: '2026-11-20'
  note: The docs describe a development licence requested via Thryve; whether a production or commercial Garmin licence,
    or any Garmin fee, is also needed is not stated. Whether this route is open during Garmin's developer-program pause
    is not stated either.
- field: raw_streams
  status: stated
  scope: Google Health on-device route
  value: 'The Google Health app writes Fitbit and Pixel data into Apple Health or Health Connect and Thryve reads it with
    its SDK, with no Google OAuth client, verification or CASA. On Health Connect this includes heart rate, resting heart
    rate, HRV, skin temperature, respiratory rate and blood glucose.'
  confidence: Corroborated
  sources:
  - url: https://www.thryve.health/blog/fitbit-shutdown-september-2026-migration-options
    type: vendor_page
    quote: Google Health writes the user's data into the platform health store, and Thryve reads it from there via our SDK.
    retrieved: '2026-10-21'
  - url: https://www.thryve.health/blog/fitbit-shutdown-september-2026-migration-options
    type: vendor_page
    quote: Heart rate, Resting heart rate, Heart rate variability, Skin temperature, Respiratory rate, Blood glucose
    retrieved: '2026-10-21'
  recheck_by: '2026-11-20'
  note: Data arrives tagged as Apple Health or Health Connect, not Google Health. Google's own Apple Health write list
    omits HRV and skin temperature (facts/fitbit-google.yaml).
