- field: user_cap
  status: stated
  scope: Google Health API route (own OAuth client)
  value: A study connecting Google Health through Thryve uses its own Google OAuth client and is capped by Google at 100
    users until OAuth verification and the CASA assessment are complete. The on-device route (Apple Health or Health
    Connect) has no such cap.
  confidence: Verified
  sources:
  - url: https://www.thryve.health/blog/fitbit-shutdown-september-2026-migration-options
    type: vendor_page
    quote: Until both are complete, you are capped at 100 users on an unverified configuration.
    retrieved: '2026-10-21'
  - url: https://developers.google.com/health/app-verification
    type: secondary
    quote: If your app isn't verified, it's limited to 100 users. To support more users, you must complete the verification
      process.
    retrieved: '2026-10-21'
  recheck_by: '2026-11-20'
  note: The cap is Google's, applied to the customer's own client (see facts/fitbit-google.yaml).
