    retrieved: '2026-10-21'
  recheck_by: '2026-11-20'
  note: Polar aggregates hourly per the data-model page.
- field: history_depth
  status: stated
  value: 'Default backfill of 14 days before user creation (configurable down to 0); Start Up and Scale Up up to 14 days,
    Enterprise flexible. Per source: Polar none; Health Connect beyond 30 days needs an extra user permission; Google Health
