- field: export_routes
  status: stated
  scope: Google Health
  value: 'Two routes. (A) Direct: the customer brings its own OAuth client tied to its own Google Cloud project and verified
    app, passes Google OAuth verification and an annual CASA assessment, and is capped at 100 users until both are done;
    Thryve then retrieves data as a web bulk source with no shared client. (B) On-device: Thryve''s SDK reads what the
    Google Health app writes into Apple Health or Health Connect, avoiding Google credentials, verification and CASA.'
  confidence: Verified
  sources:
  - url: https://www.thryve.health/blog/fitbit-shutdown-september-2026-migration-options
    type: vendor_page
    quote: Google Health requires each partner to bring their own OAuth credentials, tied to their own Google Cloud project
