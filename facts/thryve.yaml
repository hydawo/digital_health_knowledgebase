- field: deprecations
  status: conflict
  scope: Fitbit Web API source
  value: 'Thryve''s Fitbit source ends with Google''s Fitbit Web API shutdown. Dates disagree: Thryve''s docs table says 29
    October 2026; Thryve''s blog (updated 29 September 2026) says Google extended the cut-off to 30 October, while older
    paragraphs of the same post still say 30 September and that no extension was communicated; Google''s own docs say 30
    October 2026. Within 24 hours of the shutdown Thryve disconnects all Fitbit connections; already-ingested data stays.
    Every user must re-authorize through Google Health (route A or B, see export_routes).'
  confidence: Corroborated
  sources:
  - url: https://docs.thryve.health/thryve-data-sources/overview
