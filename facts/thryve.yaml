# ---------------- Research access ----------------
- field: research_program
  status: stated
  scope: Thryve Research Partners
  value: 'Research Partners route ("Become a Partner"): describe the study, then get Thryve''s research infrastructure,
    documentation and compliance materials and study setup support. Sold alongside a Multimodal Clinical Trial Platform
    built on the white-label Pulsatio participant app. It is the commercial platform with onboarding support, not a
    separate academic data-access program.'
  confidence: Verified
  sources:
  - url: https://www.thryve.health/research-partners
    type: vendor_page
    quote: Tell us about your research first. Get access to Thryve's research infrastructure, documentation, and compliance
      materials.
    retrieved: '2026-10-21'
  - url: https://www.thryve.health/multimodal-clinical-trial-platform
    type: vendor_page
    quote: Through the Pulsatio app (iOS and Android), participants can easily enroll, complete surveys, and connect wearables
    retrieved: '2026-10-21'
  recheck_by: '2026-11-20'
  note: No research-specific API, data terms or price is published. The public Pulsatio iOS listing (seller mHealth Pioneers
    GmbH) was last updated 24 March 2023 (version 3.9.8, iTunes Search API, DE storefront, 2026-10-21); customer builds
    may be white-labelled instead.
- field: research_program
  status: stated
  scope: Terve Research
  value: 'Terve Research: a European research platform for academic and medical institutions, announced 31 August 2026,
    funded by Huawei and run by Thryve (mHealth Pioneers GmbH) on its white-label platform. Closed studies recruit their
    own participants; open studies can enrol Huawei wearable users across Europe. Researchers get joint-controllership
    and ethics-committee templates; selected studies may receive sponsored devices and implementation support.'
  confidence: Corroborated
  sources:
  - url: https://www.thryve.health/news/thryve-huawei-terve-research-partnership
    type: vendor_page
    quote: Terve Research is independently managed and operated by Thryve, who also collaborates with researchers to set
      up and run studies in full compliance with European data protection laws.
    retrieved: '2026-10-21'
  - url: https://www.thryve.health/news/thryve-huawei-terve-research-partnership
    type: vendor_page
    quote: The role of Huawei is limited to the contribution of funding, with no involvement in the actual operations.
    retrieved: '2026-10-21'
  - url: https://www.thryve.health/news/thryve-huawei-terve-research-partnership
    type: vendor_page
    quote: Research teams can also open studies to users of compatible Huawei wearables across Europe.
    retrieved: '2026-10-21'
  - url: https://terveresearch.com
    type: vendor_page
    quote: Selected studies may receive sponsored devices and support for implementation and runtime once Terve launches.
    retrieved: '2026-10-21'
  - url: https://www.mynewsdesk.com/dk/huawei-dk/pressreleases/huawei-launches-european-health-platform-terve-research-and-unveils-huawei-watch-d3-3463233
    type: secondary
    quote: Terve Research is a dedicated digital research platform for European academic and medical institutions.
    retrieved: '2026-10-21'
  recheck_by: '2026-11-20'
  note: Corroborated rather than Verified because the platform is not yet live (see program_status, Terve Research). Huawei
    funding is a disclosure point for ethics review.
