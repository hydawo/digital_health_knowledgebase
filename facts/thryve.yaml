    quote: Analytics Capabilities Upon Request Upon Request
    retrieved: '2026-10-21'
  recheck_by: '2026-11-20'
  note: Source scores such as readiness are often not exposed by vendor APIs.
- field: sampling_rates
  status: stated
  value: 'Set by each source: epoch values to second precision where provided, but Polar hourly and Fitbit intraday mostly
    only during recorded activities and sleep. Retrieval latency: bulk sources polled at most every 15 minutes, including
    Google Health direct (scheduled, up to 15 minutes delay). Garmin Companion streams in real time over Bluetooth.'
  confidence: Verified
  sources:
  - url: https://docs.thryve.health/access-data-via-wearable-api/get-epoch-data
    type: vendor_docs
    quote: This data type is available up to second precision.
    retrieved: '2026-10-21'
    fetch_url: https://docs.thryve.health/access-data-via-wearable-api/get-epoch-data.md
  - url: https://docs.thryve.health/thryve-product-overview/access/data-model
    type: vendor_docs
    quote: 'Fitbit : Only provides intraday data for sleep periods and workout recordings without special access'
    retrieved: '2026-10-21'
  - url: https://docs.thryve.health/thryve-data-sources/overview/data-source-types-and-retrieval-methods
    type: vendor_docs
