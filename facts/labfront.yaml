  - url: https://help.labfront.com/terms-of-service
    type: vendor_legal
    quote: You agree that your Account will be subject to this automatic renewal feature unless you cancel your
      subscription at least thirty (30) days prior to the Renewal Commencement Date
    retrieved: '2026-10-11'
  - url: https://help.labfront.com/terms-of-service
    type: vendor_legal
    quote: You will have thirty (30) days from the Service Commencement Date, or any Renewal Commencement Date, for any
      Services hereunder, to cancel such Service, in which case Labfront will refund your Service Subscription Fee
    retrieved: '2026-10-11'
  - url: https://help.labfront.com/terms-of-service
    type: vendor_legal
    quote: Except as set forth above, the Service Subscription Fee for any Service shall be non-refundable.
    retrieved: '2026-10-11'
  - url: https://help.labfront.com/terms-of-service
    type: vendor_legal
    quote: you will not be eligible for a prorated refund of any portion of the subscription fee paid for the
      then-current subscription period
    retrieved: '2026-10-11'
  recheck_by: '2026-11-30'
