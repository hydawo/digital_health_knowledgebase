- field: history_depth
  status: stated
  value: Tester downloads are limited to the last 30 days (older data is kept and unlocked on upgrade); paid plans
    have unlimited history for project data and list "Retroactive Garmin Data Access". A separately quoted service
    (announced 2022) extracts participants' existing Garmin Connect data up to two years back and requires their
    Garmin Connect login details.
  confidence: Verified
  sources:
  - url: https://www.labfront.com/pricing
    type: vendor_page
    quote: Access Data History Last 30 days Unlimited Unlimited
    retrieved: '2026-10-11'
  - url: https://help.labfront.com/pricing-plans-and-payment-1
    type: vendor_docs
    quote: Upgrading to Basic or Advanced removes this restriction and unlocks your full historical data.
    retrieved: '2026-10-11'
  - url: https://www.labfront.com/blog/retroactively-collect-garmin-data
    type: vendor_page
    quote: We can collect data that's up to two years old. All that’s required from you is the Garmin Connect login
