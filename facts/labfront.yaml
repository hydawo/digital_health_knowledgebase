# ---------------- Research access ----------------
- field: research_program
  status: stated
  value: 'Two programs. (1) Labfront Grants: subsidised or free platform access (typically one year of the Advanced
    plan with 20 participants), an analytics package and devices, run with partners including Garmin Health. (2) The
    Research Collaborator Program, free to academic institutions: collaborator-only grants, product discounts,
    analytics guidance, a device loaner program and a dedicated liaison.'
  confidence: Verified
  sources:
  - url: https://www.labfront.com/pricing
    type: vendor_page
    quote: Our Grants Program provides subsidized access to the Labfront platform, analytics packages, and devices
      for researchers with limited budgets.
    retrieved: '2026-10-11'
  - url: https://www.labfront.com/grant
    type: vendor_page
    quote: 5 x Garmin CIRQA Smart Bands from Garmin 1-year access to a Labfront Advanced account (incl. 20 participants)
    retrieved: '2026-10-11'
  - url: https://www.labfront.com/collaborator
    type: vendor_page
    quote: Our program is offered at no cost to you
    retrieved: '2026-10-11'
  - url: https://www.labfront.com/collaborator
    type: vendor_page
    quote: Test wearable devices firsthand before making a commitment
    retrieved: '2026-10-11'
  recheck_by: '2026-11-30'
- field: program_eligibility
  status: stated
  value: 'Collaborator Program: any academic institution. Grants are set per call: the 2026 Labfront x Garmin Health
    grant is open worldwide (EMEA, APAC, Americas) but not to previous recipients of that grant; the 2026 Aging Science
    grant requires affiliation with an accredited academic, research or professional institution; Garmin-sponsored
    grants are for academic or healthcare institutions, not private companies.'
  confidence: Verified
