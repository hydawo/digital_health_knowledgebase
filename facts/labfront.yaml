- field: program_application
  status: stated
  value: 'Collaborator Program: an online form, then selection; selected institutions get a dedicated liaison.
    Grants: a study summary or abstract (about 200 words), a personal statement (200 words max) and a CV, by the
    call''s deadline. The grants FAQ says applications are reviewed roughly every 2 to 3 months and a winner can take
    up to a month after the deadline to be announced.'
