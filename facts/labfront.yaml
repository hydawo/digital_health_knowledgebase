- field: minimum_commitment
  status: stated
  value: Annual subscription paid in advance; no monthly billing (short studies negotiable by email). Subscriptions
    renew automatically unless cancelled at least 30 days before renewal. Fees are refundable only if the service is
    cancelled within 30 days of the start or renewal date; otherwise non-refundable, with no prorated refund on
    cancellation.
  confidence: Verified
  sources:
