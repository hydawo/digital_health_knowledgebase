# ---------------- Pricing ----------------
- field: device_price
  status: stated
  value: Labfront sells no hardware and no plan includes devices. Customers get a Garmin discount the FAQ gives as
    typically around 20% (elsewhere 20 to 25%), and a Movesense discount, by quote.
  confidence: Verified
  sources:
  - url: https://www.labfront.com/pricing
    type: vendor_page
    quote: No, hardware is not included in any plan.
    retrieved: '2026-10-11'
  - url: https://help.labfront.com/pricing-plans-and-payment-1
    type: vendor_docs
    quote: The discount varies by device model and quantity, but is typically around 20%
    retrieved: '2026-10-11'
  - url: https://help.labfront.com/pricing-plans-and-payment-1
    type: vendor_docs
    quote: Labfront customers are eligible for a 20~25 % hardware discount through our partnership with Garmin.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-30'
- field: subscription_price
  status: stated
  value: 'Researcher plans (there is no consumer subscription; the participant app is free): Tester free (5
    participants, downloads limited to the last 30 days). Basic $500/yr with 20 participants, then $10 per extra
    participant, one integration (Garmin Connect or Dexcom), no beat-to-beat, actigraphy or accelerometer data.
    Advanced $1,250/yr with 20 participants, then $25 per extra participant, all integrations and high-resolution
    data. USD, billed annually in advance.'
