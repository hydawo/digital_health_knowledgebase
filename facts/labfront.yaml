# ---------------- Data access and terms ----------------
- field: raw_streams
  status: stated
  scope: Advanced plan
  value: 'Garmin device-direct data through the Labfront Companion app: beat-to-beat intervals, actigraphy and 3-axis
    accelerometer (25 to 100 Hz). Movesense Medical, HR2 or Flash (recordings started by the participant in a task,
    not continuous in the background): ECG waveform, 9-axis IMU, RR interval. Dexcom CGM after Dexcom approves the
    study (about 2 months, including a data use agreement). Current pages list Garmin, Movesense and Dexcom only.'
  confidence: Verified
  sources:
  - url: https://help.labfront.com/download-your-data
    type: vendor_docs
    quote: Yes, the device-direct raw data can be downloaded if you have an Advanced Plan.
    retrieved: '2026-10-11'
  - url: https://www.labfront.com/pricing
    type: vendor_page
    quote: IMU (9-axis) 12.5Hz - 208Hz ECG Waveform 125Hz, 250Hz, 500Hz RR Interval Each beat
    retrieved: '2026-10-11'
  - url: https://help.labfront.com/movesense-overview
    type: vendor_docs
    quote: 'Labfront is compatible with the following Movesense devices: Movesense Medical Movesense HR2 Movesense Flash'
    retrieved: '2026-10-11'
  - url: https://help.labfront.com/movesense-overview
    type: vendor_docs
    quote: The data cannot be captured continuously in the background.
    retrieved: '2026-10-11'
  - url: https://help.labfront.com/dexcom-overview
    type: vendor_docs
    quote: Obtaining Dexcom's permission for Labfront integration takes about 2 months and involves two steps
    retrieved: '2026-10-11'
  - url: https://www.labfront.com/compatible-devices
    type: vendor_page
    quote: Labfront is currently compatible with select Garmin, Movesense and Dexcom devices
    retrieved: '2026-10-11'
  recheck_by: '2026-11-30'
  note: 'Movesense models: the compatible-devices page shows only HR2 among its recommended devices, but the help
    centre lists Medical, HR2 and Flash as compatible; the help centre is the specific statement. Polar: a 2022
    founder interview (Fitt Insider, 2022-11-16) described the engine as working "with consumer wearables like Garmin
    and Polar"; no current Labfront page mentions Polar, so it is treated as a superseded mention, not a current
    integration.'
- field: raw_streams
  status: stated
  scope: Basic plan
  value: No raw sensor streams. Standard Garmin Connect data only, from one device integration (Garmin Connect or
    Dexcom); no beat-to-beat interval, actigraphy, accelerometer or Movesense data. The free Tester plan, by contrast,
    gets beat-to-beat intervals and 25 Hz accelerometry.
  confidence: Verified
  sources:
  - url: https://help.labfront.com/download-your-data
    type: vendor_docs
    quote: On Basic plans, only the standard Garmin Connect data will be available to download.
    retrieved: '2026-10-11'
  - url: https://www.labfront.com/pricing
    type: vendor_page
    quote: Heart Rate Interval (BBl) Each beat N/A Each beat
    retrieved: '2026-10-11'
  - url: https://www.labfront.com/pricing
    type: vendor_page
    quote: 3-Axis Accelerometer (Streaming) 25Hz N/A 25Hz , 50Hz, 100Hz
    retrieved: '2026-10-11'
  recheck_by: '2026-11-30'
- field: derived_metrics
  status: stated
  value: 'Garmin Connect post-processed metrics (daily and activity summaries, sleep, stress, respiration, SpO2, heart
    rate, steps); sleep requires the Garmin Connect source. Paid Labfront Analytics reports add HRV time and frequency
    domain, non-linear HRV (DFA, MSE), actigraphy sleep, and sleep regularity and timing indices.'
  confidence: Verified
  sources:
  - url: https://help.labfront.com/choosing-your-garmin-data
    type: vendor_docs
    quote: The Garmin Connect app captures the standard default data that can be collected by individual consumers
      using Garmin wearables (e.g. sleep, stress, HR at every minute, steps at every minute, etc.).
    retrieved: '2026-10-11'
  - url: https://help.labfront.com/choosing-your-garmin-data
    type: vendor_docs
    quote: Without Garmin Connect, you will not be able to able to collect Garmin sleep data, as that is a
      post-processed metric derived by the Garmin Health team.
    retrieved: '2026-10-11'
  - url: https://www.labfront.com/pricing
    type: vendor_page
    quote: Measures time-domain (HR, pRR50, SDRR, RMSSD) and frequency-domain (TP, VLF, LF, HF, LF/HF ratio) markers
      of autonomic nervous system activity
    retrieved: '2026-10-11'
  recheck_by: '2026-11-30'
- field: sampling_rates
  status: stated
  value: 'Advanced: heart rate 1 s to 60 min; respiration, SpO2 and stress 10 s to 60 min; steps 1 or 15 min; BBI
    every beat; actigraphy 10 s to 1 min; accelerometer 25, 50 or 100 Hz; Movesense IMU 12.5 to 208 Hz, ECG 125, 250
    or 500 Hz, recordings up to 12 h. Basic: heart rate 1 min; respiration, SpO2 and stress 3 min; steps 15 min; no
    BBI, actigraphy or accelerometer. Tester: accelerometer 25 Hz, Movesense IMU 12.5 Hz and ECG 125 Hz, recordings
    up to 15 min.'
