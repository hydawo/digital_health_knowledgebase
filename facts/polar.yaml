- field: developer_program_status
  status: stated
  value: Open. Any Polar Flow user can self-register an AccessLink API client at admin.polaraccesslink.com after
    accepting the API Limited License Agreement; no review step is documented, but EU Digital Markets Act gatekeepers are
    excluded. The Team Pro API uses the same admin portal. The BLE SDK is public on GitHub (release 8.4.0, 2026-10-01)
    under Polar's own limited licence. Polar 360 is also sold B2B as a band to build apps on through the SDK or API.
  confidence: Verified
  sources:
  - url: https://www.polar.com/accesslink-api/
    type: vendor_docs
    quote: Any registered Polar Flow user can create API client to AccessLink by filling application details at
    retrieved: '2026-10-11'
  - url: https://www.polar.com/en/legal/polar-api-agreement
    type: vendor_legal
    quote: Gatekeepers shall not be eligible to enter into this Agreement.
    retrieved: '2026-10-11'
  - url: https://github.com/polarofficial/polar-ble-sdk
    type: repository
    fetch_url: https://raw.githubusercontent.com/polarofficial/polar-ble-sdk/master/README.md
    quote: Build apps that connect via Bluetooth LE and stream real-time heart rate, ECG, accelerometer, PPG, and more
      from Polar devices.
    retrieved: '2026-10-11'
  - url: https://www.polar.com/en/business/polar-360
    type: vendor_page
    quote: Build your own app from scratch, or integrate Polar 360's powerful data into existing ecosystems seamlessly
      with Polar SDK; or plug ‘n’ play with Polar API.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
