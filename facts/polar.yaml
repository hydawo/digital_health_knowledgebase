# ---------------- Research access ----------------
- field: research_program
  status: stated
  value: 'Polar Research Center collaboration ("Collaborate with us"): a research unit sends a research co-operation
    proposal for a study done jointly with Polar Electro Oy, and may ask for Polar support in technology, money or other
    forms. Polar also markets the H10, Verity Sense, the AccessLink API, the BLE SDK and Team Pro as research tools, but
    researchers buy and use these on standard terms; that is product information, not a program with its own terms.'
  confidence: Verified
  sources:
  - url: https://www.polar.com/en/science/collaborate-with-us
    type: vendor_page
    quote: These guidelines apply to the scientific studies done in collaboration with Polar Electro Oy.
    retrieved: '2026-10-11'
  - url: https://www.polar.com/en/science/collaborate-with-us
    type: vendor_page
    quote: budget and proposal for Polar support (technology, money, other)
    retrieved: '2026-10-11'
  - url: https://www.polar.com/en/business/science
    type: vendor_page
    quote: The Polar Research Center consists of our in-house team of experts from technology, physiology and data science.
    retrieved: '2026-10-11'
  - url: https://www.polar.com/en/science/research-tools
    type: vendor_page
    quote: Find out how Polar technology and services can be used for research and science.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
  note: In Polar-run research collaborations the privacy notice says customer data stays inside Polar. A separate
    Polar-linked grant, the Seppo Saynajakangas Science Foundation, is open only to Finnish citizens studying in northern
    Finland, so it is not an access route for most study teams.
- field: program_eligibility
  status: stated
  value: No published eligibility rule. The proposal is expected from a research unit (institute, university,
    department or similar) with a responsible researcher, and proposals are rated partly on their value to Polar, so
    studies outside Polar's interests are rejected or wait-listed.
  confidence: Corroborated
  sources:
  - url: https://www.polar.com/en/science/collaborate-with-us
    type: vendor_page
    quote: Presentation of the research unit (institute, university, department etc.)
    retrieved: '2026-10-11'
  - url: https://www.polar.com/en/science/collaborate-with-us
    type: vendor_page
    quote: significance and originality value for the company
    retrieved: '2026-10-11'
  - url: https://www.polar.com/en/science/collaborate-with-us
    type: vendor_page
    quote: Not interesting and not in relation to Company actions to be rejected
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
  note: '"No published eligibility rule" is an inference from the page, which lists documents and review criteria but no
    eligibility conditions.'
- field: program_application
  status: stated
  value: 'Email a research co-operation application to research@polar.com with a presentation of the research unit, the
    responsible researcher''s CV and recent publications, and a research plan of at most 10 pages that includes benefits
    to Polar, a budget and a proposal for Polar support (technology, money, other). Proposals are reviewed on criteria
    including "value for the company", and Polar replies within two weeks; NDAs are used if needed. An accepted study
    gets a signed research agreement, and the research partner handles ethical approvals.'
  confidence: Verified
  sources:
  - url: https://www.polar.com/en/science/collaborate-with-us
    type: vendor_page
    quote: Please send your research co-operation application to the email address below.
    retrieved: '2026-10-11'
  - url: https://www.polar.com/en/science/collaborate-with-us
    type: vendor_page
    quote: Research plan (max 10 pages)
    retrieved: '2026-10-11'
  - url: https://www.polar.com/en/science/collaborate-with-us
    type: vendor_page
    quote: Proposals are evaluated and response given to applicant within two weeks. NDA procedures are used if needed.
    retrieved: '2026-10-11'
  - url: https://www.polar.com/en/science/collaborate-with-us
    type: vendor_page
    quote: After study proposal and a study plan are accepted a research agreement is signed.
    retrieved: '2026-10-11'
  - url: https://www.polar.com/en/science/collaborate-with-us
    type: vendor_page
    quote: Research partner takes care of ethical approvals needed.
    retrieved: '2026-10-11'
  - url: https://www.polar.com/en/science/collaborate-with-us
    type: vendor_page
