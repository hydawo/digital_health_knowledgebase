- field: academic_vs_commercial
  status: stated
  value: No separate academic tier. AccessLink and the BLE SDK are free on the same terms for everyone, and the SDK
    licence allows private and commercial use. The only research-specific route is the collaboration proposal, which
    Polar chooses whether to support; B2B partnerships go through a contact form.
  confidence: Corroborated
  sources:
  - url: https://github.com/polarofficial/polar-ble-sdk/blob/master/Polar_SDK_License.txt
    fetch_url: https://raw.githubusercontent.com/polarofficial/polar-ble-sdk/master/Polar_SDK_License.txt
    type: vendor_legal
    quote: You are allowed to use the SDK for the development of software for your private as well as for commercial
      use for as long as you use the SDK in compliance with the license terms.
    retrieved: '2026-10-11'
  - url: https://www.polar.com/en/legal/polar-api-agreement
    type: vendor_legal
    quote: At the moment Polar offers the use and activation of Polar API’s free of charge.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-09'
  note: '"No separate academic tier" is inferred from the absence of academic terms on the API, SDK and science pages.
    The SDK licence is a proprietary limited licence, not an open-source one (see api_platform_fees and retention_terms,
    scope BLE SDK); Polar approved one research project''s GPLv3-with-linking-exception licence case by case in SDK issue
    #835 (closed 2026-06-18), which shows the two need separate checking.'
