- field: raw_streams
  status: stated
  value: Study Watch recorded PPG and accelerometry at 30 Hz, ECG, heart rate and electrodermal activity, plus environmental sensors, and was reported at launch to hold up to a week of raw data on the device. Researchers outside Verily get its data only as de-identified Project Baseline data on approved request.
  confidence: Corroborated
  scope: Verily Study Watch (historical data)
  sources:
  - url: https://pmc.ncbi.nlm.nih.gov/articles/PMC11699500/
    type: paper
    quote: "The VSW captures biological signals through several sensors, including photoplethysmography (PPG) at 30 Hz and accelerometry at 30 Hz."
    retrieved: 2026-10-22
  - url: https://verily.com/stories/verily-study-watch-receives-fda-510-k-clearance-for-ecg
    type: vendor_page
    quote: "With built-in biometric, environmental and movement sensors, Study Watch can contribute to research efforts broadly."
    retrieved: 2026-10-22
