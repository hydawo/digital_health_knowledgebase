facts:
- field: research_program
  status: stated
  value: Verily no longer markets a Study Watch research program. What it offers researchers now is Verily Pre (Exchange data catalogue plus Workbench trusted research environment), with a free self-serve Standard tier for individual researchers, and, for study sponsors, Viewpoint Evidence, which since March 2026 bundles Samsung Galaxy Watch 8 sensor data with Verily's registry cohorts.
  confidence: Verified
  sources:
  - url: https://verily.com/newsroom/verily-launches-free-version-of-its-pre-exchange-and-workbench-solutions-powering-precision-health-ai-and-discovery
    type: vendor_page
    quote: "This launch introduces a free Standard tier account for individual researchers to access the Exchange and Workbench solutions"
    retrieved: 2026-10-22
  - url: https://verily.com/newsroom/verily-and-samsung-collaborate-to-accelerate-clinical-research-with-the-galaxy-watch-and-pre-platform
    type: vendor_page
    quote: "Through this collaboration, Verily will fully integrate sensor data from Samsung Galaxy Watch and make it accessible in its Viewpoint Evidence solution, which is built on the Verily Pre platform and enables research sponsors to run real-world studies with re-contactable participant cohorts."
    retrieved: 2026-10-22
  recheck_by: 2026-11-21
  note: No Study Watch product page survives in the verily.com sitemap (checked 2026-10-22); /solutions/verily-study-watch, /study-watch and /products return 404. Older Study Watch stories (FDA clearance posts, validation papers) are still listed under /stories.
