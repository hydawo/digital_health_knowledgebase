- field: deprecations
  status: stated
  value: Verily fully wound down its medical device program and stopped manufacturing and supporting devices (internal memo of August 2025, reported by press). Its other devices are marked "Not in Commercial Distribution" in GUDID (retinal cameras ended 2026-04-27; Onduo December 2025). Study Watch has no GUDID record and its product pages are gone. Platform renames since then include Data Discovery becoming Data Exchange (30 Sep 2025) and Workbench moving into Verily Pre (11 Nov 2025).
  confidence: Corroborated
  sources:
