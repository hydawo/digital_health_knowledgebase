  note: The memo (dated 2025-08-25 by MD+DI) names "Study Devices" but not Study Watch; the HIT Consultant item names neither. The Quipment listing (establishment type Repack or Relabel Medical Device, initial-importer flag Y, product code DXH, created 2026-05-12) is the only registration listing openFDA returns for any Study Watch 510(k); none exists under Verily. It suggests units still move through third-party logistics, not that Verily supplies new studies. Changed 2026-10-31 from conflict (Reported) to stated (Corroborated). The Security and Trust page, which on 2026-10-22 still listed "Study Watch & Hub" in its audit scope (quote "Retinal Service, Study Watch & Hub, and"), was rewritten and no longer names it, which removed the vendor-side half of the conflict. Ask Verily directly whether Study Watch can be supplied to new studies. The security-trust fetch_url carries a Next.js build ID (1y9FmmHH1nlmtBVxwLMlY) that changes on every Verily redeploy; update it when the quote goes missing.
