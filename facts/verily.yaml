- field: program_status
  status: stated
  value: Discontinued, by press reports. Press quoting an August 2025 internal memo and a spokesperson reports that Verily fully wound down its devices program, including "Study Devices", stopped manufacturing medical devices and will no longer support them. Verily has not announced it on its own pages, but every Study Watch product page is gone, and by 2026-10-31 its Security and Trust page no longer lists "Study Watch & Hub" in its SOC 2 or ISO 27001 scope. The only contrary sign is a third party, Quipment Inc. (Kennesaw, GA), registered as a repack or relabel establishment, which added an FDA device listing for Study Watch (K182456) on 2026-05-12.
  confidence: Corroborated
  scope: Verily Study Watch
  sources:
  - url: https://hitconsultant.net/2025/08/29/alphabets-verily-shuts-down-medical-device-division-shifts-focus-to-ai/
    type: secondary
    quote: "difficult decision to discontinue manufacturing medical devices” and will no longer support them moving forward"
    retrieved: 2026-10-31
  - url: https://www.mddionline.com/business/verily-permanently-ceases-medical-device-manufacturing
    type: secondary
    quote: "we cannot support the investment of the resources necessary for the long-term growth and scaling of our Devices programs, and have therefore made the difficult decision to fully wind down the program."
    retrieved: 2026-10-31
  - url: https://www.mddionline.com/business/verily-permanently-ceases-medical-device-manufacturing
