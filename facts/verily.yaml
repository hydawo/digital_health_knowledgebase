    type: secondary
    quote: "is equipped with multiple sensors, including an electrocardiogram, and can monitor heart rate, electrodermal activity and inertial movements, with a battery life of up to 1 week."
    retrieved: 2026-10-22
  - url: https://www.massdevice.com/verily-launches-biosensor-equipped-study-watch-clinical-study-patient-monitoring/
    type: secondary
    quote: "to allow it to store up to a week’s worth of raw data and lower the need for frequent syncs."
    retrieved: 2026-10-22
