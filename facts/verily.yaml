  note: Verily's 2017 launch post (verily.com/blog/introducing-verily-study-watch, now redirecting to a 404 under /perspectives/) was the primary source for EDA and storage; only 2017 press coverage survives. MassDevice says "up to a week's worth" of raw data; the profile says "weeks".
