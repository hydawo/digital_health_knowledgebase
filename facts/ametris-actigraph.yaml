- field: academic_vs_commercial
  status: stated
  value: Academic and population-health customers have a separate site, academic store and academic team, and can
    choose cloud CentrePoint or desktop ActiLife; LEAP is offered to academics in Core, Pro and Advanced
    configurations. Industry trials are served through ametris.com with operational and scientific support. Both
    are priced by quote; how academic prices or terms differ is not published.
  confidence: Verified
  sources:
  - url: https://academic.ametris.com/
    type: vendor_page
    quote: "We offer the flexibility of two powerful software platforms to meet the diverse needs of our academic research clients."
    retrieved: 2026-10-11
  - url: https://academic.ametris.com/actigraph-leap
    type: vendor_page
    quote: "LEAP is available in multiple configurations to help academic teams choose the sensor capabilities, digital measures, and study workflows"
    retrieved: 2026-10-11
  - url: https://ametris.com/
    type: vendor_page
    quote: "Ametris provides wearable digital health technology (DHT), along with integrated scientific and operational support, to help clinical teams capture real-world data that accurately reflects patient functioning."
    retrieved: 2026-10-11
  recheck_by: '2026-11-25'
  note: For sponsors, a combined Ametris DHT plus Signant eCOA offering for CNS trials was announced on 2026-03-10,
    before the acquisition; AliveCor ECG and Kayentis eCOA integrations were announced in early 2026.
