# ---------------- Research access ----------------
- field: research_program
  scope: Academic channel
  status: stated
  value: 'No formal named research program with an application. Ametris runs an academic and public health research
    channel (academic.ametris.com): an academic team to contact, an academic online store, a pricing list on
    request, a grant toolkit and an open-source dataset library.'
  confidence: Verified
  sources:
  - url: https://academic.ametris.com/
    type: vendor_page
    quote: "Connect with a member of our academic and public health research team to discuss your specific research needs."
    retrieved: 2026-10-11
  - url: https://academic.ametris.com/grant-toolkit
    type: vendor_page
    quote: "This toolkit is designed to facilitate the application submission process by gathering information in one place for quick and convenient access."
    retrieved: 2026-10-11
  recheck_by: '2026-11-25'
  note: A one-off research grant was announced in August 2022; no current grant call found. Ametris says NHANES
    selected the LEAP for its 2027-2030 cohort (blog.ametris.com/blog/actigraph-wearables-support-nhanes-2027,
    2025-02-26; not confirmed on a CDC page). Ametris also runs pharma-member DECODE working groups on digital
    endpoints, with no academic membership route described.
- field: research_program
  scope: Accelerant Partnership Program (CROs and technology partners)
  status: stated
  value: A three-tier partner program for CROs and technology vendors that resell or deliver Ametris technology to
    trial sponsors. The middle tier (Accelerant API) includes API integration and access to raw study data. Not
    aimed at academic investigators.
  confidence: Verified
  sources:
  - url: https://ametris.com/partnerships
    type: vendor_page
    quote: "The Ametris Accelerant ™ Partnership Program was developed to better enable our CRO and technology partners to sell and deliver our digital health technology (DHT) solutions to clinical trial sponsors."
    retrieved: 2026-10-11
  - url: https://ametris.com/partnerships
    type: vendor_page
    quote: "Comprehensive technology partnership to help trials run smoothly with full support, API integration, and access to raw study data."
    retrieved: 2026-10-11
  recheck_by: '2026-11-25'
- field: program_eligibility
  status: stated
  value: Online purchasing in the academic store is limited to academic institutions with existing client accounts
    (accredited universities, research institutions, healthcare organizations, government research centers).
    International buyers go through authorized resellers. The LEAP is sold for clinical research as a prescription
    device.
  confidence: Verified
  sources:
  - url: https://store.ametris.com/
    type: vendor_page
    quote: "Online purchasing through our store is currently available only to academic institutions with existing client accounts."
    retrieved: 2026-10-11
  - url: https://store.ametris.com/
    type: vendor_page
    quote: "This includes accredited universities, research institutions, healthcare organizations, and government research centers."
    retrieved: 2026-10-11
  - url: https://store.ametris.com/
    type: vendor_page
    quote: "International customers are encouraged to visit our International Resellers page to find a local authorized reseller for product pricing, availability, and sales support."
    retrieved: 2026-10-11
  - url: https://blog.ametris.com/blog/leap-faq
    type: vendor_page
    quote: "The ActiGraph LEAP is available globally for use in clinical research as prescription use only."
    retrieved: 2026-10-11
  recheck_by: '2026-11-25'
- field: program_application
  status: stated
  value: No application or review step is published. Researchers contact the academic team, request a quote or the
    pricing list, or schedule a meeting. CentrePoint API access is enabled per customer on request.
  confidence: Verified
  sources:
  - url: https://academic.ametris.com/
    type: vendor_page
    quote: "Store and Pricing Schedule a Meeting"
    retrieved: 2026-10-11
  - url: https://github.com/actigraph/CentrePoint3APIDocumentation
    type: vendor_docs
    quote: "Enabling API Access Please contact ActiGraph for more information."
    retrieved: 2026-10-11
  recheck_by: '2026-11-25'
- field: program_status
  status: stated
  value: Academic channel and store live under the Ametris name as of 2026-10-11. Signant Health announced a
    definitive agreement to acquire Ametris on 2026-04-16 and announced the acquisition on 2026-05-14. Signant says
    the combined company will keep Ametris' roadmap.
  confidence: Verified
  sources:
  - url: https://store.ametris.com/
    type: vendor_page
    quote: "Welcome to our Public Health and Academic Research Online Store"
    retrieved: 2026-10-11
  - url: https://signanthealth.com/company/news/signant-health-enters-definitive-agreement-to-acquire-ametris
    type: vendor_page
    quote: "today announced that it has entered into a definitive agreement to acquire Ametris (formerly ActiGraph)"
    retrieved: 2026-10-11
  - url: https://signanthealth.com/company/news/signant-health-acquires-ametris
    type: vendor_page
    quote: "Signant Health , the evidence generation company, today announced its acquisition of Ametris (formerly ActiGraph)"
    retrieved: 2026-10-11
  - url: https://blog.ametris.com/news/signant-health-acquires-ametris-to-create-an-end-to-end-ecoa-and-wearables-platform
    type: vendor_page
    quote: "The combined company will maintain Ametris' innovation roadmap while investing significantly in platform integration capabilities."
    retrieved: 2026-10-11
  recheck_by: '2026-11-25'
  note: The 14 May 2026 release says "announced its acquisition"; it does not use the word "completed" and gives no
    closing date. Treating May 2026 as the completion month is an inference from the April agreement plus the May
    announcement. ActiGraph rebranded as Ametris in June 2025.
- field: developer_program_status
  status: stated
  value: No self-serve developer program. The CentrePoint V3 API (OAuth 2.0) is documented publicly on GitHub, but
    access is enabled per customer by contacting the company, and it reaches only CentrePoint study data the client
    can already see. The V2 (Study Admin) API is still supported with separate credentials. CROs and technology
    vendors can get API and raw-data access through the Accelerant partner program.
  confidence: Verified
  sources:
  - url: https://github.com/actigraph/CentrePoint3APIDocumentation
    type: vendor_docs
    quote: "Enabling API Access Please contact ActiGraph for more information."
    retrieved: 2026-10-11
  - url: https://github.com/actigraph/CentrePoint3APIDocumentation
    type: vendor_docs
    quote: "The CentrePoint API uses OAuth 2.0 for its authorization flow."
    retrieved: 2026-10-11
  - url: https://github.com/actigraph/CentrePointIntegrationGuide
    type: vendor_docs
    quote: "ActiGraph continues to support the CentrePoint V2 API"
    retrieved: 2026-10-11
  recheck_by: '2026-11-25'
  note: RADAR-base has an open roadmap issue (RADAR-REST-Connector issue 153, opened 2024-12-16) for a LEAP connector via
    the CentrePoint API; no shipped third-party connector was found.
