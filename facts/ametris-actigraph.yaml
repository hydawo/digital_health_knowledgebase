# ---------------- Data access and terms ----------------
- field: raw_streams
  scope: CentrePoint API
  status: stated
  value: 'Data Access Files by category: raw accelerometer for all devices, plus temperature, green PPG at 25 Hz or
    100 Hz, red/IR PPG at 50 Hz, barometer and IMU only for certain devices, firmware, study configurations and
    contracts. Delivered as day files in CSV or AVRO.'
  confidence: Verified
  sources:
  - url: https://github.com/actigraph/CentrePoint3APIDocumentation/blob/main/sections/data_access_files.md
    type: vendor_docs
    fetch_url: https://raw.githubusercontent.com/actigraph/CentrePoint3APIDocumentation/main/sections/data_access_files.md
    quote: "Data category is only available for certain devices, firmware versions, and study configuration, and it is subject to contract restrictions."
    retrieved: 2026-10-11
  - url: https://github.com/actigraph/CentrePoint3APIDocumentation/blob/main/sections/data_access_files.md
    type: vendor_docs
    fetch_url: https://raw.githubusercontent.com/actigraph/CentrePoint3APIDocumentation/main/sections/data_access_files.md
    quote: "ppg-red-ir-50-hz"
    retrieved: 2026-10-11
  recheck_by: '2026-11-25'
- field: raw_streams
  scope: Devices and ActiLife
  status: stated
  value: 'LEAP sensors: accelerometer, gyroscope, PPG (green, red, IR), skin temperature, barometer and a microphone
    that is off by default. wGT3X-BT: raw acceleration collected at 30 to 100 Hz and transferred to researchers.
    Raw device files can be processed locally in ActiLife; ActiLife 7 also processes LEAP PPG, which ActiLife 6
    cannot.'
  confidence: Verified
  sources:
  - url: https://academic.ametris.com/actigraph-leap
    type: vendor_page
    quote: "Accelerometry Gyroscope Photoplethysmography (PPG) Skin Temperature Barometer Microphone Capabilities"
    retrieved: 2026-10-11
  - url: https://ametris.com/actigraph-leap
    type: vendor_page
    quote: "Microphone sensor is disabled by default and would only be activated for specific use cases."
    retrieved: 2026-10-11
  - url: https://academic.ametris.com/actigraph-wgt3x-bt
    type: vendor_page
    quote: "Participant raw data can be collected at sample rates ranging from 30Hz-100Hz and transferred directly to researchers for analysis."
    retrieved: 2026-10-11
  - url: https://blog.theactigraph.com/blog/faq-actilife7-upgrade
    type: vendor_page
    quote: "No, PPG sensor data from the ActiGraph LEAP can only be processed in ActiLife 7."
    retrieved: 2026-10-11
  recheck_by: '2026-11-25'
  note: Which LEAP sensors are active depends on the configuration (Core, Pro, Advanced); per the academic LEAP page,
    Pro has green PPG only and Advanced has multiwave (red and green) PPG.
- field: derived_metrics
  status: stated
  value: 'CentrePoint: minute (epoch) summaries, daily statistics, sleep periods and event markers covering steps,
    wear, sleep, energy expenditure and activity-intensity cut points. ActiLife scores data with published
    algorithms. LEAP vital signs (HR, HRV, skin temperature, AF/cardiac rhythm, SpO2, respiratory rate) and gait and
    balance measures need Scientific Services and are investigational; the LEAP 510(k) covers activity, sleep and
    mobility only. Partner algorithms (Hyfe cough, PKG by Empatica, Mobilise-D, CSEM vital signs) run in the Ametris
    platform.'
  confidence: Verified
  sources:
  - url: https://github.com/actigraph/CentrePointIntegrationGuide
    type: vendor_docs
    fetch_url: https://raw.githubusercontent.com/actigraph/CentrePointIntegrationGuide/master/README.md
    quote: "Retrieve subject analytics data (i.e. CPW01 event markers, sleep periods, and minute/daily summary data which encapsulates steps, wear, sleep, energy expenditure, activity intensity classifications/cut points, etc.)"
    retrieved: 2026-10-11
  - url: https://ametris.com/actigraph-leap
    type: vendor_page
    quote: "Oxygen Saturation (SpO2)"
    retrieved: 2026-10-11
  - url: https://ametris.com/actigraph-leap
    type: vendor_page
    quote: "The ActiGraph LEAP is US FDA 510(k) cleared for the measurement of activity, sleep, and mobility. Additional vital signs are for investigational use only."
    retrieved: 2026-10-11
  - url: https://ametris.com/algorithm-marketplace
    type: vendor_page
    quote: "Capture clinically validated digital mobility outcomes using the latest Mobilise-D algorithms"
    retrieved: 2026-10-11
  recheck_by: '2026-11-25'
