    retrieved: '2026-10-10'
    note: Developer forum, post of 2026-06-30. WHOOP staff replies in the same thread (2026-07-04 to 07-08) escalated
      cases, and at least two posters reported approval afterwards.
  - url: https://www.community.whoop.com/t/production-api-access-submitted-jun-26-no-decision-after-60-days-playerslab-integration-already-built/15628
