    quote: No decision, no denial, and no stated reason in ~60 days
    retrieved: '2026-10-10'
    note: Post of 2026-07-26.
  - url: https://www.community.whoop.com/t/app-approval-to-raise-the-10-user-limit-3-submissions-since-april-still-no-response-today-ai/15779
