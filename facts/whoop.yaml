  status: stated
  scope: Tier upgrade turnaround (developer forum reports)
  value: Developers reported waits of two to more than three months for tier upgrades above the 10-member Sandbox
    in June to August 2026; in one thread WHOOP staff escalated and some apps were then approved within days
  confidence: Reported
  sources:
