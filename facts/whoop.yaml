facts:
- field: research_program
  status: stated
  value: No named, self-serve program for outside researchers. WHOOP runs research through partnerships it
    approves; it runs a research request intake form, says it uses de-identified member data with research
    partners, and academic papers have analysed WHOOP-held member data with WHOOP's permission. Digital WHOOP
    Labs is an in-app feature for members to join WHOOP's own studies. The WHOOP Unite enterprise route offered
    study-site support in 2022 to 2023
  confidence: Corroborated
  sources:
  - url: https://whoopinc.typeform.com/whoop-research
    type: vendor_page
    quote: Research Request Intake
    retrieved: '2026-10-10'
    note: WHOOP's own form on Typeform, linked from the research page (researcher B, browser read). Form title
      only; the questions are built by JavaScript and were not read. Nothing was submitted.
  - url: https://www.whoop.com/privacy/full-privacy-policy/
    fetch_url: https://web.archive.org/web/20260806173749/https://www.whoop.com/privacy/full-privacy-policy/
    type: vendor_legal
    quote: We also use de-identified wellness data for research purposes to help us and our research partners
      answer important questions about human performance
    retrieved: '2026-10-10'
    note: Internet Archive capture of 2026-08-06 (policy Last Updated August 3, 2026). Live page is 403 to scripts.
  - url: https://doi.org/10.1038/s41746-026-02799-9
    fetch_url: https://www.ebi.ac.uk/europepmc/webservices/rest/PMC13482339/fullTextXML
    type: paper
    quote: Data are however available from the authors upon reasonable request and with permission of WHOOP, Inc.
    retrieved: '2026-10-10'
    note: npj Digital Medicine 2026, Stanford Wu Tsai Human Performance Alliance with WHOOP; members had
      consented to a WHOOP women's health research study.
  - url: https://www.whoop.com/us/en/digital-whoop-labs/
    fetch_url: https://web.archive.org/web/20260727062958/https://www.whoop.com/us/en/digital-whoop-labs/
    type: vendor_page
    quote: Digital WHOOP Labs is an in-app feature that lets you participate in research studies remotely.
    retrieved: '2026-10-10'
    note: Internet Archive capture of 2026-07-27. Internal research, not a route for outside teams.
  - url: https://www.mubadala.com/en/news/mubadala-partners-with-whoop-to-strengthen-preventative-health-and-research-capabilities-in-the-uae
    type: secondary
    quote: The WHOOP–Mubadala Health Research Initiative will support structured collaboration with leading UAE
      institutions to conduct longitudinal studies in cardiovascular health, sleep science, recovery, and behavioral
      performance.
    retrieved: '2026-10-10'
    note: Partner press release, 2026-05-07. Regional, institution-level.
  - url: https://sensorlab.arizona.edu/sites/default/files/2023-05/Study%20Site%20Onboarding.pdf
    type: secondary
    quote: Understand WHOOP for clinical study applications
    retrieved: '2026-10-10'
    note: WHOOP-authored WHOOP Unite study-site deck (copyright 2022), hosted by the University of Arizona sensor lab.
  - url: https://www.whoop.com/us/en/research/
    type: vendor_page
    quote: we work with academic and industry partners to design studies, validate findings, and expand the
      scientific understanding of human physiology.
    retrieved: '2026-10-10'
    note: Read in a browser on 2026-10-10 by the coordinator, confirming researcher B. HTTP 403 to scripts and no
      Internet Archive capture since 2025, so the weekly check lists it under check by hand. The page's CONTACT US
      button links to the intake form; it names no eligibility criteria, fees or data terms.
  recheck_by: '2026-10-24'
  note: Also a 2025 Invest Qatar partnership for a WHOOP performance lab in Doha with local research partnerships
    (einpresswire, 2025-10-28).
