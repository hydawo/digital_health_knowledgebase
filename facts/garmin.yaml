- field: academic_vs_commercial
  status: stated
  value: No separate academic tier. Access is business-only; fees attach to commercial use (a licence fee for Enhanced Beat-To-Beat
    Interval on the Health API; a licence fee or minimum device order for the Health SDKs). Whether a non-commercial academic
    study counts as commercial use is not stated
  confidence: Verified
  sources:
