    No separate academic tier. Connect Developer Program access is by business tier: Starter for organisations building
    apps, and Enterprise with commercial terms tailored to each company; the Personal API is not for applications serving
    multiple users. Health SDKs are free to evaluate and need a licence fee or minimum device order for commercial use.
    Whether a non-commercial academic study counts as commercial use is not stated
