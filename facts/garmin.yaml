facts:
- field: research_program
  status: stated
  value: No academic programme with its own terms. Garmin Health sells research access as an enterprise offering (launched
    2022 as Garmin Health Research Solutions) with high-resolution data by definable interval logging, independent hosting
    and device control; runs periodic research grants with Fitrockr (Asia Research Grant 2026, launched by Garmin Health);
    and strikes direct institutional deals (King's College London EMBRACE programme, Garmin as exclusive smartwatch provider,
    up to 40,000 participants, announced 17 September 2025)
  confidence: Verified
  sources:
  - url: https://www.garmin.com/en-US/newsroom/?p=3942
    type: vendor_page
    retrieved: '2026-10-10'
    quote: Whether it is access to high-resolution raw data, independent data hosting or full wearable device control, the
      Garmin Health ecosystem offers researchers everything they need to conduct best-in-class studies across a wide range
      of topics.
  - url: https://www.garmin.com/en-US/newsroom/?p=3942
    type: vendor_page
    retrieved: '2026-10-10'
    quote: Raw, high-resolution data is accessible through definable interval logging with the option to adjust granularity
      and frequency.
  - url: https://www.garmin.com/en-PH/newsroom/press-release/news-2026-mar-fitrockr/
    type: vendor_page
    retrieved: '2026-10-10'
    quote: Garmin Health officially launched its first research grant specific to Asia on February 2, in collaboration with
      Fitrockr.
  - url: https://www.garmin.com/en-US/newsroom/?p=5892
    type: vendor_page
    retrieved: '2026-10-10'
    quote: This is the largest collaboration to-date between Garmin and a research institution.
  - url: https://www.garmin.com/en-US/newsroom/?p=5892
    type: vendor_page
    retrieved: '2026-10-10'
    quote: up to 40,000 adult participants
  recheck_by: '2026-11-25'
  note: Garmin's current research page (garmin.com/en-US/health/solutions/research-and-clinical-trials/) renders its text
    from embedded script data that the quote checker cannot read; read by hand on 2026-10-10 it also mentions a Research
    Participation Program for recruitment, which is not quoted here. The profile says grants run "through partners, not
    Garmin directly"; Garmin's own release presents the Asia 2026 grant as a Garmin Health launch with Fitrockr.
