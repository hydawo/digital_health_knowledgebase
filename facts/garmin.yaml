  value: Paused to new applicants. Garmin stopped reviewing and approving new Connect Developer Program requests in spring
    2026 while it redesigns the programme; requests already in the queue are also on hold; no reopening date. Existing approved
    integrations are reported to keep working
  confidence: Corroborated
