- field: developer_program_status
  status: stated
  value: >-
    Open again. Garmin relaunched the Connect Developer Program with two business tiers: Starter Access (immediate access
    to the Activity, Courses, Health, Training and Women's Health APIs; push delivery only; no historical data; limited
    user capacity) and Enterprise Access (adds the Golf API, ping/pull delivery, one month or more of history, unlimited
    users, technical support and tailored commercial terms). A separate Personal API gives an individual pull access to
    their own data. Integrators and press date the reopening to 21 October 2026, ending a pause on new applications that
    began in spring 2026.
  confidence: Verified
  scope: Garmin Connect Developer Program
  sources:
  - url: https://developer.garmin.com/gc-developer-program/overview/
