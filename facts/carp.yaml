- field: history_depth
  status: stated
  value: >-
    Prospective collection from enrolment. Probes that read stored phone data (app usage, calls and
    texts) look back one day by default, configurable. Apple Health and Health Connect measures read
    back to the last successful sample, and only while the app is in the foreground with the phone
    unlocked.
  confidence: Verified
  sources:
