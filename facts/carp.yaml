facts:
# ---------------- Research access ----------------
- field: research_program
  status: stated
  value: >-
    No grant or membership program. DTU Health Tech runs a hosted CARP instance (CARP Web Services,
    the CARP Study Portal and the CARP Studies app) on Computerome for research projects in which
    DTU Health Tech is an active research partner. The service is funded in part by a DKK 5 million
    Novo Nordisk Foundation infrastructure grant (2023). Outside the hosted service, all components
    are open source for self-hosting or building a custom app.
  confidence: Verified
  sources:
  - url: https://carp.dk/hosting/
    type: vendor_legal
    quote: "hosts and operates an instance of CARP, including an instance of CARP Web Services (CAWS), the CARP Study Portal, and the CARP Study App"
    retrieved: 2026-10-11
  - url: https://carp.dk/hosting/
    type: vendor_legal
    quote: "Researchers affiliated with DTU or cooperating with us can use this service for creating CARP-based research projects"
    retrieved: 2026-10-11
  - url: https://carp.dk/funding-from-the-novo-nordisk-foundation/
    type: vendor_page
    quote: "The Novo Nordisk Foundation (NNF) has recently decided to fund CARP with a DKK 5 million grant (EUR 700 000)"
    retrieved: 2026-10-11
  recheck_by: 2026-11-09
  note: The 2023 grant post states a goal of serving researchers, companies and students; the current hosting terms restrict the hosted service to research with DTU as a partner.
- field: program_eligibility
  status: stated
  value: >-
    The DTU-hosted service is only for research projects where DTU Health Tech is an active research
    partner, meaning DTU helped initiate the study, secure funding and define the protocol, and takes
    part in publication. Non-DTU researchers can use it only through such a partnership. Teams that
    cannot accept this are pointed to self-hosting.
  confidence: Verified
  sources:
