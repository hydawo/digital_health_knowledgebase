# ---------------- Data access and terms ----------------
- field: raw_streams
  status: stated
  value: >-
    Via CARP Mobile Sensing sampling packages (own app) or the CARP Studies app: accelerometer (with
    and without gravity), gyroscope, magnetometer, step events, ambient light (Android), location,
    activity recognition, Bluetooth and Wi-Fi scans, connectivity, microphone audio and noise,
    battery, screen events (Android), and on Android only call and SMS logs, installed apps and app
    usage; calendar; surveys and cognitive tests; Apple Health and Health Connect records.
    Wearables: Polar accelerometer, gyroscope, magnetometer, ECG, PPI, PPG and HR; Movesense HR, ECG
    and IMU; Movisens (Android); eSense; Apple Watch via the AWARE watchOS framework. The CARP
    Studies app collects a subset. CARP Gardener (server side) pulls Fitbit, Garmin, Withings and
    Dexcom cloud data, which CARP describes as for future studies.
  confidence: Verified
  sources:
  - url: https://docs.carp.dk/carp-mobile-sensing/sampling-packages/available-packages/
    type: vendor_docs
    quote: "Rate of change in velocity in x, y, z - including gravity"
    retrieved: 2026-10-11
  - url: https://docs.carp.dk/carp-mobile-sensing/sampling-packages/available-packages/
    type: vendor_docs
    quote: "Inertial measurement (accelerometer, gyroscope, magnetometer) and heart rate (ECG, PPI, PPG, HR) data from the Polar devices"
    retrieved: 2026-10-11
