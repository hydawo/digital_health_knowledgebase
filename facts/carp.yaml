- field: hosting_options
  status: stated
  value: >-
    Three routes: (1) the DTU-hosted service on Computerome (research partner projects only, DTU as
    data controller, no SLA, best effort); (2) self-host CARP Web Services, the portal and the
    Studies app on your own Docker or Kubernetes infrastructure with PostgreSQL; (3) build a custom
    Flutter app with CAMS and send data to any backend. No commercial managed hosting is offered.
