- field: deprecations
  status: stated
  value: >-
    CAMS API level 2.0 released 2026-04-14 with a redesigned architecture and restructured
    packages. The CAWS legacy DataPoint upload endpoint and the old informed-consent endpoint are
    deprecated but still supported. The Firebase data manager has not been updated to API 2.x. The
    dk.cachet.carp data namespace is to change to carp.dk at an unannounced date. The CARP health
    plugin dropped Google Fit in version 11.0.0, but the 2026-07-14 "Three Ways" post still lists
    the health package as a Google Fit integration. CARP Studies app version 5 (2026-09-28) replaced
    the earlier app.
