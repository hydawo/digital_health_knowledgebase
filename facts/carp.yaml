- field: retention_terms
  status: conflict
  value: >-
    DTU's study-app privacy policy keeps data as long as relevant to the study and for at least five
    years, and lets participants request erasure; on the phone data is kept only until upload. The
    CARP Studies Google Play data safety section declares that data can't be deleted and that the
    developer gives no way to request deletion. Self-hosted CAWS keeps export files 7 days by
    default.
