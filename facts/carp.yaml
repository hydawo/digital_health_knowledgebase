- field: derived_metrics
  status: stated
  value: >-
    On the phone: mobility features from location, accelerometer higher-order features over a
    window, OS activity recognition, noise level and light summaries. The CARP Studies app shows
    participants weekly cards for steps, heart rate, sleep, mobility and task progress. Server side,
    CAWS lets researchers deploy Python analysis scripts to a data processing pipeline, and the
    carp-dsp repository provides a data-science pipeline framework. No ready-made catalogue of
    clinical digital biomarkers is published.
  confidence: Verified
  sources:
  - url: https://docs.carp.dk/carp-mobile-sensing/sampling-packages/available-packages/
    type: vendor_docs
    quote: "Track location and calculates mobility features based on the mobility_features plugin"
    retrieved: 2026-10-11
