# ---------------- Pricing ----------------
- field: device_price
  status: not_applicable
  note: Software platform; CARP sells no hardware. Supported wearables (Polar, Movesense, Movisens, eSense, Apple Watch) are bought from their makers.
- field: subscription_price
  status: not_applicable
  note: No consumer subscription. The CARP Studies participant app is free on the App Store and Google Play.
- field: academic_pricing
  status: stated
  value: >-
    The hosted service follows DTU's co-financed research price model. Normally its cost is a budget
    line inside the joint project budget; smaller projects may pay as they go at actual cost plus 44%
    overhead, with staff time billed monthly, plus a monthly Computerome operations fee. Invoicing is
    typically yearly. Staff rates (2024, DKK per month): student assistant 16,700, research assistant
    68,100, researcher 78,000, senior researcher 105,000. Self-hosting and the software are free.
  confidence: Verified
  sources:
