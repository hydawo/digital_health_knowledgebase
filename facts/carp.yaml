- field: sampling_rates
  status: stated
  value: >-
    Configurable per measure in the study protocol. Defaults: accelerometer, gyroscope and
    magnetometer every 200 ms (5 Hz); ambient light 10 s every 5 min; app heartbeat every 15 min.
    Data uploads to CAWS every 10 minutes by default. Wearable sampling rates are set by the device
    SDKs and are not tabulated in the CARP docs.
  confidence: Verified
  sources:
