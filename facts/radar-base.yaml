- field: history_depth
  status: stated
  value: No platform limit; phone data starts at enrolment and is kept in the deployment the study owns. For REST
    wearables staff set start and end dates per participant and can reset to re-pull data between dates, subject
    to each vendor API's own history limits, which are not stated.
  confidence: Corroborated
  sources:
  - url: https://radar-base.org/docs/radar-rest-source-auth/
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: to re-pull all the data between particular dates or to change the start and end dates
  recheck_by: '2026-11-09'
  note: '"No platform limit" follows from self-hosting rather than a statement.'
- field: export_routes
  status: stated
  value: Raw data exported from cold storage as AVRO, JSON or CSV; radar-output-restructure writes files by project,
    participant, topic and hour from S3, Azure Blob or local storage; aggregated data via the REST API (Swagger-documented);
    live dashboards; manual file upload via the Upload Connector; direct access to the deployment's own Kafka, object
    storage and databases.
  confidence: Verified
  sources:
  - url: https://radar-base.org/getting-started-with-radar-base/
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: exporting raw data for analysis in multiple formats, including AVRO, JSON, and CSV
