    user route every 150 s by default (fitbit.user.poll.interval).
- field: retention_terms
  status: stated
  value: The deployment owner controls retention and deletion. The active-app policy says data is kept for the study's
    duration, deletion requests go from the project owner to the deployment owner, and study data is deleted including
    from backups generally within 60 days; the developers (KCL, The Hyve) cannot delete project data. Both Play
    listings declare that the developer gives no way to request deletion. The Hyve's demo service keeps identifiable
    contact data up to 10 years.
  confidence: Verified
  sources:
  - url: https://radar-base.org/active-app-armt-privacy-policy/
    type: vendor_legal
    retrieved: '2026-10-10'
    quote: RADAR-base data is retained for the duration of the research study
  - url: https://radar-base.org/active-app-armt-privacy-policy/
    type: vendor_legal
    retrieved: '2026-10-10'
    quote: securely delete study data and remove it from system backups, generally within 60 days unless otherwise
      legally required to retain it
  - url: https://radar-base.org/active-app-armt-privacy-policy/
    type: vendor_legal
    retrieved: '2026-10-10'
    quote: Requests to delete data should be made by the PROJECT OWNER and carried out by the DEPLOYMENT OWNER.
  - url: https://radar-base.org/active-app-armt-privacy-policy/
    type: vendor_legal
    retrieved: '2026-10-10'
    quote: RADAR-base and the DEVELOPERS have no part, access to, or ability to act in this capacity or to delete
      PROJECT data.
  - url: https://play.google.com/store/apps/datasafety?id=org.radarcns.detail&hl=en_US
    type: app_store
    retrieved: '2026-10-10'
    quote: The developer doesn’t provide a way for you to request that your data be deleted
  - url: https://www.thehyve.nl/radar-base-demo-privacy-policy
    type: vendor_legal
    retrieved: '2026-10-10'
    quote: upto 10 years for identifiable contact data
  recheck_by: '2026-11-09'
  note: The Play "Data can't be deleted" declaration (made on both the passive and active listings) fits the policy's
    model, where the developers cannot delete and the deployment owner must; it does not mean study data is undeletable.
    Participants should be told to ask their study team.
