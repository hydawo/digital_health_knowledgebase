- field: raw_streams
  status: stated
  value: 'Android passive app (pRMT): relative location (no absolute location reaches the server), accelerometer,
    gyroscope, magnetometer, steps, light, Bluetooth device counts, Android activity-recognition and sleep events,
    screen state, app usage, call and SMS metadata (hashed numbers), battery, weather; audio features via an openSMILE
    plugin, and a camera-PPG plugin. Bluetooth wearables via pRMT (Polar Vantage V3 and H10, Empatica E4); cloud
    wearables via REST connectors (Fitbit, Garmin, Oura); Apple Watch and other HealthKit data via the active app.
    iOS passive collection is sparser. No Android Health Connect route.'
  confidence: Verified
  sources:
  - url: https://radar-base.org/docs/4048-2/
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: Collects the raw acceleration values from the 3-axis accelerometer with the gravitational constant
  - url: https://radar-base.org/docs/4048-2/
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: No absolute location data is streamed to or stored on the server.
  - url: https://radar-base.org/docs/4048-2/
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: these may be more sparse in iOS due to lack of background collection capabilities
  - url: https://radar-base.org/getting-started-with-radar-base/
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: Passive data collection (via the pRMT app) enables real-time monitoring of movement, location, audio,
      calls and texts, and app usage.
  - url: https://github.com/RADAR-base/radar-commons-android/tree/master/plugins/radar-android-audio
    type: repository
    retrieved: '2026-10-10'
    quote: It uses openSMILE to process audio from the phone's microphone, extracts features from it, and sends
      those features.
  - url: https://github.com/RADAR-base/radar-commons-android/tree/master/plugins/radar-android-ppg
    type: repository
    retrieved: '2026-10-10'
    quote: Plugin to measure PPG using the camera of a phone.
  - url: https://radar-base.org/docs/supported-devices/
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: Polar Vantage V3 Wrist worn Raw acceleration Steps Heart rate (PPG) PP-interval in ms Wrist ECG
  - url: https://radar-base.org/docs/supported-devices/
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: 'RADAR-base Integration: via REST-API Connector RADAR-base Oura Schemas'
  - url: https://radar-base.org/docs/supported-devices/
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: 'RADAR-base Integration: via Active App HealthKit Plugin'
  - url: https://github.com/RADAR-base/radar-commons-android/issues/488
    type: repository
    retrieved: '2026-10-10'
    quote: Add Support for Reading Data from Google Health Connect
  recheck_by: '2026-11-09'
  note: 'Fitbit through RADAR-base depends on the legacy Fitbit Web API, which turns off 2026-10-30; see deprecations
    (Fitbit route). A Huawei Health Kit connector is in progress (schemas released, connector PR #204 open), so
    Huawei is not a shipped integration. A Dexcom CGM connector built in a 2026 internship is reported on radar-base.org
    (2026-10-05 post), not yet in the Supported Devices list. Health Connect support is an open feature request
    (issue #488, opened 2025-10-06).'
- field: derived_metrics
  status: stated
  value: The platform computes time-windowed aggregates and data-quality and compliance monitors for live dashboards
    (MongoDB hot store), and Android passes through OS activity and sleep classifications. Behavioural feature extraction
    is a separate open-source Python package, radarpipeline. Wearable vendor metrics (for example Oura readiness)
    arrive through REST connectors.
  confidence: Verified
  sources:
  - url: https://radar-base.org/docs/concepts-and-components-of-radar-base/
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: to compute aggregated values of published data based on various time windows and to monitor data quality
      and compliance
  - url: https://radar-base.org/getting-started-with-radar-base/
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: a hot storage (MongoDB) for aggregated data that supports near real-time insights
  - url: https://github.com/RADAR-base/radarpipeline
    type: repository
    retrieved: '2026-10-10'
    quote: An open-source python feature generation and visualization package use with RADAR project data.
  - url: https://radar-base.org/docs/supported-devices/
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: Readiness Score
  recheck_by: '2026-11-09'
  note: radarpipeline is a companion tool, not built into the platform, much as Forest is for Beiwe.
