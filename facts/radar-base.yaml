- field: deprecations
  status: stated
  scope: Fitbit route (legacy Fitbit Web API to Google Health API)
  value: 'The released Fitbit connector (RADAR-REST-Connector, latest release v0.7.5, 2026-03-25) pulls from the
    legacy Fitbit Web API, which Google turns off on 2026-10-30. Migration to the Google Health API is under way:
    authorization is released (RADAR-Rest-Source-Auth v4.4.16, 2026-07-03) and schemas are merged and released (RADAR-Schemas,
    push/googlehealth), but the data-ingest code is not. RADAR-PushEndpoint PR #92 "Add Google Health API push integration"
    is open (last updated 2026-06-05; newest release v0.4.0, 2025-06-19), and the REST-Connector Google Health converter
    PRs are open. As of 2026-10-10 no released RADAR-base component ingests Google Health API data.'
  confidence: Verified
  sources:
  - url: https://github.com/RADAR-base/RADAR-PushEndpoint/issues/91
    type: repository
    retrieved: '2026-10-10'
    quote: All integrations must be migrated by September 2026 when the legacy APIs will be decommissioned and data
      will stop syncing.
