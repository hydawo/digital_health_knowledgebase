- field: research_program
  status: stated
  value: 'Beiwe Service Center (BSC), Harvard T.H. Chan School of Public Health (Onnela Lab): Beiwe run as Software
    as a Service on the lab''s production AWS deployment. Includes study design and configuration support, IRB documentation
    help, team training, a four-week beta test, participant troubleshooting and technical support, raw data and
    summary metrics, and final analysis with production Forest packages. Explicitly not a scientific collaboration
    with the Onnela Lab. Separately, the whole platform is open source for self-hosting.'
  confidence: Verified
