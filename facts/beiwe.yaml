- field: deprecations
  status: stated
  value: 'Rolling-release backend; features are not expected to be removed. Self-hosted deployments need admin action
    for: the Elastic Beanstalk move from Python 3.8 on Amazon Linux 2 to Python 3.12 on Amazon Linux 2023; last-leg
    encryption on environments deployed before 2025-09-09; and (announcement #471, 2026-03-06) a data processing
    bug, earliest affected data about March 2024, that could leave downloaded hourly files incomplete until servers
    are updated and old data reprocessed (raw uploads were kept). The old Tableau summary-statistics endpoints are
    deprecated and may be removed at any time. The single-server AMI is retired.'
  confidence: Verified
  sources:
