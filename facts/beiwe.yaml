- field: sampling_rates
  status: stated
  value: Configured per study in seconds as sensor on/off duty cycles plus, for accelerometer and gyroscope, a sampling
    frequency; for example a default Wi-Fi scan every 900 seconds. The accelerometer records about 5 to 100 samples
    per second. On Android the requested accelerometer and gyroscope rates snap to a few device-specific real intervals,
    so devices should be tested before launch.
