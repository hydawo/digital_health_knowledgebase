- field: raw_streams
  status: stated
  value: 'Raw phone sensor data and logs, downloadable by researchers through the web download page, the Data Download
    API or Mano. Streams: accelerometer, gyroscope, GPS (optional fuzzing), screen and power state, identifiers,
    Wi-Fi, Bluetooth, call and text logs (Android only), proximity, magnetometer, device motion and reachability
    (iOS only), plus surveys and audio-survey recordings. The optional Android ambient (continuous) audio stream
    has been removed from the backend (commit "removes ambient audio", 2026-07-31, on main by 2026-10-19). Call and text logs come only from the lab-distributed Android builds
    (onnelaLabServer, commStatsCustomUrl); the Google Play build (Beiwe2) has not asked for SMS/MMS or call-log
    permissions since 2.5.0. Studies set to "production data" restrict downloads to processed output.'
  confidence: Verified
  sources:
  - url: https://hsph.harvard.edu/research-resource/beiwe/technology/
    type: vendor_page
