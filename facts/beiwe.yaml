  note: 'Portal security in current code (backend main, read 2026-10-10): 10 failed logins lock an account for 10
    minutes (endpoints/login_endpoints.py); accounts idle longer than INACTIVITY_LOCKOUT_DAYS, default 730, cannot
    log in (config/settings.py, added 2025-11); site-admin MFA is an opt-in deployment setting. The old wiki IRB
    FAQ saying lockout "is not currently implemented" is superseded. Older self-hosted deployments terminated TLS
    at the load balancer until "last-leg encryption" was enabled (see deprecations).'
