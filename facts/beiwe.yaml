  note: 'Phone numbers and Wi-Fi and Bluetooth MAC addresses are hashed on the phone with a per-device key. Power
    state on iOS is documented inconsistently (profile holds that conflict). Ambient audio: Android 3.1.0 added
    it (backend defaults were 10 minutes on, 10 minutes off, 44.1 kHz); migration 0150 (generated 2026-07-31) removes
    the ambient_audio study settings, so the stream is gone from current backends. The Android build.gradle note
    describing it has not been updated.
    The Play build also does not prompt for background location (Android 3.1.2). The build split dates from Google''s
    March 2019 policy change.'
- field: derived_metrics
  status: stated
  value: 'Forest (open-source Python, integrated into the backend and runnable locally) produces daily or hourly
    summary statistics: Jasmine (GPS imputation and mobility, such as home time, distance travelled, radius of gyration),
    Willow (call and text log summaries, Android only), Oak (gait time, cadence, step count from accelerometer),
    Sycamore (survey summaries). Summary statistics and data-quantity stats are served through the dashboard and
    the Tableau API.'
  confidence: Verified
