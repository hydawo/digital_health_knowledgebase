- field: deprecations
  status: stated
  value: 'Fitbit connection runs on the legacy Fitbit Web API (Google sunset September 2026); move users to the Google
    Health connection, which needs every user to sign in again and gets a new user_id. July 2026: provider fitbit_v2
    renamed google_health, old name rejected; Biostrap deprecated. Web Google connection (Google Fit REST) must move
    to Google Health before Google ends Fit API support at the end of 2026; the Health Connect SDK route is unaffected.
    Peloton and Technogym removed. Legacy JavaScript SDK no longer updated. Phased move to the access.tryterra.co/api/v2
    base URL.'
  confidence: Verified
  sources:
  - url: https://docs.tryterra.co/help-center/help-topics/data-api-sdk/account-config-environments-and-going-live/fitbit-to-google-migration
