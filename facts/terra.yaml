- field: retention_terms
  status: stated
  value: 'End User Privacy Policy (updated 2026-09-24): end-user data is usually kept two days after collection, in rare
    cases up to six months, and never more than six months, with exceptions (an active connection, legal duty, separate
    user permission, misuse investigation). Aggregated or de-identified derivatives may be kept longer for research,
    analytics and service improvement. DPA: personal data deleted or returned within 90 days of termination. Storage
    is an Enterprise feature.'
  confidence: Verified
  sources:
  - url: https://tryterra.co/end-user-privacy
    type: vendor_legal
