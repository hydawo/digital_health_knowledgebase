# ---------------- Data access and terms ----------------
- field: raw_streams
  status: stated
  value: 'Unified API passes through what each provider exposes, unsmoothed: sample arrays such as heart rate, RR
    interval, HRV, SpO2, glucose, position and raw ECG voltage where the provider supplies them; no raw PPG, no raw
    uncalibrated CGM. The Streaming API add-on carries roughly per-second heart rate, HRV, RR interval, ECG,
    acceleration and gyroscope from BLE/ANT+ devices, Wear OS, Apple Watch and phone sensors.'
  confidence: Verified
  sources:
  - url: https://docs.tryterra.co/help-center/help-topics/data-api-sdk/data-model-fields-and-units/no-smoothing-sample-array-length-mismatch
    type: vendor_docs
    quote: Terra applies no smoothing or post-processing to sample data; values are piped through as the provider
      supplies them
    retrieved: '2026-10-21'
  - url: https://docs.tryterra.co/streaming-api/data-types
    type: vendor_docs
    quote: Cardiac HEART_RATE , HRV , RR_INTERVAL , ECG
    retrieved: '2026-10-21'
  - url: https://docs.tryterra.co/streaming-api/data-types
    type: vendor_docs
    quote: Motion sensors ACCELERATION , GYROSCOPE
    retrieved: '2026-10-21'
  - url: https://docs.tryterra.co/help-center/help-topics/data-api-sdk/provider-coverage-and-per-provider-data-availability/raw-uncalibrated-cgm-not-available
    type: vendor_docs
    quote: Terra does not provide access to raw or uncalibrated CGM sensor data.
    retrieved: '2026-10-21'
  recheck_by: '2026-11-20'
  note: Raw ECG (RawECGSample, potential_uV) is in the samples reference (https://docs.tryterra.co/reference/health-and-fitness-api/samples).
    Availability varies by provider; Fitbit does not expose RR intervals through its HRV endpoint.
- field: derived_metrics
  status: stated
  value: Provider summaries (daily, activity, sleep, body, nutrition, menstruation) normalised to Terra's schema, plus
    Terra's own Health Scores (recovery, strain, stress, immunity and others) and Models. Smart Fill (August 2026,
    called "health context" in the product blog) imputes missing sleep, daily and activity values, with a confidence
    value on every estimated cell. Terra does not compute derived metrics such as speed from position samples.
  confidence: Verified
  sources:
  - url: https://tryterra.co
    type: vendor_page
    quote: We transform raw health metrics such as HRV, respiratory rate, sleep and activity into validated scores
      including recovery, strain, stress, and immunity.
    retrieved: '2026-10-21'
  - url: https://docs.tryterra.co/changelog/2026/august-update-2026
    type: vendor_docs
    quote: it reconstructs the metrics a device didn't record from the channels it did, with a confidence level
      on every reconstructed value
    retrieved: '2026-10-21'
  - url: https://tryterra.co/blog/august-2026-product-update
    type: vendor_page
    quote: every estimated cell carries its own confidence value
    retrieved: '2026-10-21'
  - url: https://docs.tryterra.co/help-center/help-topics/something-else/provider-data-fields-and-coverage/no-derived-metrics-from-samples
    type: vendor_docs
    quote: Terra does not compute non-trivial derived metrics like speed from position samples
    retrieved: '2026-10-21'
  recheck_by: '2026-11-20'
  note: Terra calls its scores "validated"; no validation evidence was examined. Smart Fill output is imputed, not
    measured; a study must flag or exclude estimated values. Whether it is on by default is not stated.
- field: sampling_rates
  status: stated
  value: Set by each device and provider, passed through unchanged (for example Huawei heart rate about once a
    minute). Cloud integrations are event-driven or polled by Terra every 5 to 10 minutes. Streaming API events
    arrive roughly once per second per stream.
  confidence: Verified
  sources:
  - url: https://docs.tryterra.co/help-center/help-topics/data-api-sdk/provider-coverage-and-per-provider-data-availability/cgm-spo2-hrv-sample-regularity
    type: vendor_docs
    quote: Sample regularity is determined by the device.
    retrieved: '2026-10-21'
  - url: https://docs.tryterra.co/help-center/help-topics/data-api-sdk/provider-coverage-and-per-provider-data-availability/huawei-hr-downsampled-upstream
    type: vendor_docs
    quote: Huawei's public Health Kit only exposes the com.huawei.instantaneous.heart_rate stream, stored at roughly
      one sample per minute
    retrieved: '2026-10-21'
  - url: https://docs.tryterra.co/reference/health-and-fitness-api/supported-integrations
    type: vendor_docs
    quote: fetched integrations are polled by Terra every 5-10 minutes for new data
    retrieved: '2026-10-21'
  - url: https://docs.tryterra.co/streaming-api/data-types
    type: vendor_docs
    quote: Streaming carries realtime, roughly per-second signals only .
    retrieved: '2026-10-21'
  recheck_by: '2026-11-20'
- field: history_depth
  status: stated
  value: 'By default data flows only from connection onward. Historical pulls depend on the provider: Garmin up to 5
    years, Google Health up to the last 12 months on connect (returned by REST, not pushed), Polar and Health Connect
    30 days and never before the user granted permission. A single request may span at most 1,825 days.'
  confidence: Verified
  sources:
  - url: https://docs.tryterra.co/unified-api/managing-user-health-data/requesting-historical-data
    type: vendor_docs
    quote: When an end user first connects an account (e.g. wearable, device, health app), you will by default only
      receive data from that point onwards.
    retrieved: '2026-10-21'
  - url: https://docs.tryterra.co/unified-api/managing-user-health-data/requesting-historical-data
    type: vendor_docs
    quote: 'Garmin : 5 years into the past, from the current point in time.'
    retrieved: '2026-10-21'
  - url: https://docs.tryterra.co/unified-api/managing-user-health-data/requesting-historical-data
    type: vendor_docs
    quote: 'Health Connect : 30 days into the past, but not prior to the moment the user granted permission.'
    retrieved: '2026-10-21'
  - url: https://docs.tryterra.co/help-center/help-topics/data-api-sdk/provider-coverage-and-per-provider-data-availability/google-health-data-coverage
    type: vendor_docs
    quote: On connect, Terra fetches up to the last 12 months, depending on what Google holds for the account.
    retrieved: '2026-10-21'
  - url: https://docs.tryterra.co/reference/health-and-fitness-api/rate-limits
    type: vendor_docs
    quote: Per-request window size 1,825 days (5 years) per request
    retrieved: '2026-10-21'
  recheck_by: '2026-11-20'
- field: export_routes
  status: stated
  value: 'Event-based push to a configured destination: webhooks, Postgres/MySQL, Supabase, S3, GCS, Azure Blob, SQS,
    Kafka, MongoDB, Firestore. REST endpoints for historical backfill. Mobile SDKs for Apple Health, Samsung Health
    and Health Connect (on-device sources have no cloud route). Output in Terra format, FIT or FHIR. Streaming
    websocket as an add-on.'
  confidence: Verified
  sources:
  - url: https://tryterra.co
    type: vendor_page
    quote: Terra delivers to webhooks, SQL databases (Postgres and MySQL), Supabase, cloud storage (S3, GCS and
      Azure Blob), queueing services (SQS and Kafka), MongoDB and Firestore.
