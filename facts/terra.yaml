    retrieved: '2026-10-21'
  recheck_by: '2026-11-20'
  note: Relevant to the WHOOP profile's warning that WHOOP's terms bar licensing API data to third parties; with
    Terra the study is itself the WHOOP developer.
- field: user_cap
  status: stated
  value: Testing and staging environments are capped at 50 connected users each; production has no user cap and is
    billed per active authentication. The Streaming add-on's included credits cover 20 active streaming users a month.
  confidence: Verified
  sources:
  - url: https://docs.tryterra.co/unified-api/integration-setup/understanding-terra-environments
    type: vendor_docs
    quote: Note that for testing & staging, there is a user limit of 50 users on each environment.
    retrieved: '2026-10-30'
  - url: https://docs.tryterra.co/help-center/help-topics/data-api-sdk/account-config-environments-and-going-live/test-staging-user-limit
    type: vendor_docs
    quote: Production credentials are event-based and have no user cap (billed per user).
    retrieved: '2026-10-30'
  - url: https://docs.tryterra.co/streaming-api/pricing
    type: vendor_docs
    quote: The included 20,000 Streaming credits cover 20 active streaming users per month
    retrieved: '2026-10-30'
  recheck_by: '2026-11-29'
- field: academic_vs_commercial
  status: stated
  value: 'No academic tier or academic terms; universities buy the same plans. Three terms matter for research use:
    free development accounts are for internal evaluation only (no pilot study on a sandbox); the customer Terms bar
    publicly disseminating information on the performance of the Services or Output (clause 1.2(v)), which reaches
    methods papers that report on Terra data quality or delivery; and accelerator credits require crediting Terra in
    publications and datasets.'
  confidence: Verified
  sources:
  - url: https://tryterra.co/terms-of-service
    type: vendor_legal
    quote: (v) publicly disseminate information from any source regarding the performance of the Services or Output
    retrieved: '2026-10-21'
  - url: https://tryterra.co/terms-of-service
    type: vendor_legal
    quote: Customer may use Development Accounts solely for internal evaluation of the Services to determine whether
      to place a paid Order, and not for Production Access or any other purpose.
    retrieved: '2026-10-21'
  - url: https://tryterra.co/startup-accelerator
    type: vendor_page
    quote: Are research projects eligible? Yes, if health data is central to the work and you credit Terra in any
      resulting publications and datasets.
    retrieved: '2026-10-21'
  - url: https://tryterra.co/community/non-profit-pricing
    type: secondary
    quote: Please sign up via our enterprise form with details about your project and expected usage, and our team
      can discuss pricing options for your organization.
    retrieved: '2026-10-21'
  recheck_by: '2026-11-20'
  note: Terms of Service last updated 2026-05-01. "Output" in the Terms covers data Terra delivers, so a paper comparing
    Terra-delivered data with a reference device may fall under 1.2(v); ask Terra for written permission before
    publishing such work. The Terms also say raw End User data belongs to the End User (clause 1.3).
