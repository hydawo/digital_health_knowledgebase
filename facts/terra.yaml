- field: developer_program_status
  status: stated
  value: Open and self-serve. Sign up on the dashboard, choose a plan and get API keys; there is no separate gating
    step for production. The Terms add compliance reviews (questionnaires, information requests) that Terra may run
    for development or production access.
  confidence: Verified
  sources:
  - url: https://docs.tryterra.co/introduction/account-setup-and-api-keys
    type: vendor_docs
    quote: During onboarding you'll be prompted to select your plan and enter billing details.
    retrieved: '2026-10-21'
  - url: https://docs.tryterra.co/help-center/help-topics/billing-account/environments-config-and-going-to-production/production-rollout-billing
    type: vendor_docs
    quote: There is no separate gating step to start prod.
    retrieved: '2026-10-21'
  - url: https://tryterra.co/terms-of-service
    type: vendor_legal
    quote: To access or use the Services, whether Development Accounts or Production Access, Customer must successfully
      pass Terra's compliance reviews
    retrieved: '2026-10-21'
  recheck_by: '2026-11-20'
- field: developer_program_status
  scope: Garmin through Terra
  status: stated
  value: Terra's Garmin integration page now says the customer supplies its own Garmin app credentials and applies
    at developerportal.garmin.com. Until at least 2026-10-14 the same page said Terra manages the Garmin credentials.
    With Garmin's own programme taking no new applications, a new Terra customer may have no Garmin route.
  confidence: Verified
  sources:
  - url: https://tryterra.co/integrations/garmin
    type: vendor_page
    quote: You supply your own Garmin app credentials . Apply at developerportal.garmin.com
    retrieved: '2026-10-21'
  - url: https://web.archive.org/web/20261014145651/https://tryterra.co/integrations/garmin
    type: secondary
    quote: Terra manages the Garmin API credentials, so there is nothing to register
    retrieved: '2026-10-21'
  - url: https://tryterra.co/blog/garmin-connect-developer-program-pause
    type: vendor_page
    quote: Terra is working with Garmin as a partner and will fold any new requirements into its integration
    retrieved: '2026-10-21'
  recheck_by: '2026-11-20'
  note: Changed between 2026-10-14 and 2026-10-21. The task brief and the gap hunt (2026-10-11) said Terra holds its
    own Garmin credentials; the live page no longer says so. Whether existing customers keep Terra-managed Garmin
    credentials, and whether a new customer without Garmin approval can connect Garmin users at all, is not stated.
    Ask Terra before treating it as a Garmin route.
- field: developer_program_status
  scope: Google Health and Fitbit through Terra
  status: stated
  value: Terra's docs say Terra manages the credentials for its Google Health connection (the Google Health API
    replacement for the Fitbit Web API), so the customer registers no Google app; each user re-consents once. Its
    Fitbit (legacy Fitbit Web API) page says the same for Fitbit. Google Health became generally available in Terra
    connections in August 2026.
  confidence: Verified
  sources:
  - url: https://docs.tryterra.co/help-center/help-topics/data-api-sdk/account-config-environments-and-going-live/fitbit-to-google-migration
    type: vendor_docs
    quote: add Google Health to your environment in the dashboard. Terra manages the credentials, so there is no
      Google app for you to register.
    retrieved: '2026-10-21'
  - url: https://tryterra.co/integrations/fitbit
    type: vendor_page
    quote: Terra manages the Fitbit API credentials, so there is nothing to register
    retrieved: '2026-10-21'
  - url: https://tryterra.co/blog/august-2026-product-update
    type: vendor_page
    quote: Google Health is now generally available in connections, having been in preview through the summer.
    retrieved: '2026-10-21'
  recheck_by: '2026-11-20'
  note: This contradicts the knowledge base's general statement (facts/fitbit-google.yaml export_routes, Intermediaries
    scope, from Thryve and Validic) that unified APIs need the customer's own Google Cloud project, verified app and
    CASA; for Terra, its own docs say otherwise. Terra does not say whether its shared Google project has completed
    Google's restricted-scope review and CASA, or whether any user cap applies to it. Ask Terra before relying on it.
- field: developer_program_status
  scope: WHOOP, Strava, Dexcom, Huawei (bring your own credentials)
  status: stated
  value: The customer supplies its own provider credentials for WHOOP, Strava, Dexcom and Huawei, so the study needs
    its own developer approval from each of these providers.
  confidence: Verified
  sources:
  - url: https://tryterra.co/integrations/whoop
    type: vendor_page
    quote: You supply your own WHOOP app credentials
    retrieved: '2026-10-21'
  - url: https://tryterra.co/integrations/strava
