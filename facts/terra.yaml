- field: ai_training_terms
  status: stated
  value: 'No clause names AI or model training for end-user data. The End User Privacy Policy lets Terra use collected
    data for product development and to conduct "statistical, scientific, or market research" and publish
    aggregated or de-identified results, and to keep de-identified derivatives without a stated limit. The research
    wording was added between 2025-10-16 and 2026-02-24. Terra''s Integration Onboarding Terms (updated 2026-10-12)
    let Terra use de-identified data from partner integrations for any lawful purpose. Anthropic and OpenAI are
    subprocessors for AI-assisted support on anonymised end-user data, with a customer opt-out.'
  confidence: Verified
  sources:
