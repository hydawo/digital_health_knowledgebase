# ---------------- Research access ----------------
- field: research_program
  status: stated
  value: No academic or research-access programme for outside researchers. The nearest route is the Terra Startup
    Accelerator (up to $100,000 in API credits over up to six months), whose FAQ says research projects are eligible
    if Terra is credited. "Terra Research" is Terra's in-house team publishing its own analyses of pooled end-user
    data, not an access programme.
  confidence: Corroborated
  sources:
  - url: https://tryterra.co/startup-accelerator
    type: vendor_page
    quote: The Terra Startup Accelerator gives early-stage startups building on health data, including AI health
      apps and clinical tools, up to $100,000 in Terra API credits over up to six months.
    retrieved: '2026-10-21'
  - url: https://tryterra.co/startup-accelerator
    type: vendor_page
    quote: Are research projects eligible? Yes, if health data is central to the work and you credit Terra in any
      resulting publications and datasets.
    retrieved: '2026-10-21'
  - url: https://tryterra.co/research
    type: vendor_page
    quote: Here you can find all research papers on health data published by the Terra Research team.
    retrieved: '2026-10-21'
  recheck_by: '2026-11-20'
  note: The absence of an academic programme is a search result (pricing, enterprise, accelerator and community pages),
    not a statement by Terra. On the community forum Terra staff point a non-profit asking about special pricing to
    the enterprise contact form. Terra Research has published a peer-reviewed paper on its own pooled data (Akhtar,
    Brownlee and Crawford, npj Biological Timing and Sleep 3, 27, 2026, doi 10.1038/s44323-026-00092-2; 697 people,
    185,143 nights), relying on platform consent; see ai_training_terms.
- field: program_eligibility
  scope: Startup Accelerator
  status: stated
  value: Pre-revenue or early-revenue teams that cannot yet afford paid API access, with health data central to the
    product. Research projects qualify if health data is central to the work and Terra is credited in resulting
    publications and datasets.
  confidence: Verified
  sources:
  - url: https://tryterra.co/startup-accelerator
    type: vendor_page
    quote: You are pre-revenue or early-revenue and genuinely cannot afford paid API access yet.
    retrieved: '2026-10-21'
  - url: https://tryterra.co/startup-accelerator
    type: vendor_page
    quote: Are research projects eligible? Yes, if health data is central to the work and you credit Terra in any
      resulting publications and datasets.
    retrieved: '2026-10-21'
  recheck_by: '2026-11-20'
- field: program_application
  scope: Startup Accelerator
  status: stated
  value: Short-answer online form (about 20 to 30 minutes), rolling admission, decision within 10 business days, about
    0.8% of applications accepted. A card is required to activate the credits.
  confidence: Verified
  sources:
  - url: https://tryterra.co/startup-accelerator
    type: vendor_page
    quote: A structured short-answer form, about 20 to 30 minutes.
    retrieved: '2026-10-21'
  - url: https://tryterra.co/startup-accelerator
    type: vendor_page
    quote: Rolling admission, no equity taken, no cost to apply, with a decision within 10 business days. About
      0.8% of applications are accepted.
    retrieved: '2026-10-21'
  - url: https://tryterra.co/startup-accelerator
    type: vendor_page
    quote: A card is required to activate; nothing is charged while your credit covers your invoices.
    retrieved: '2026-10-21'
  recheck_by: '2026-11-20'
  note: The gap hunter saw an acceptance rate of about 1.8% in a search summary only; the page says 0.8%.
- field: program_status
  scope: Startup Accelerator
  status: stated
  value: Open, rolling admission (2026-10-21).
  confidence: Verified
  sources:
