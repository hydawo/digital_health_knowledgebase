facts:
# ---------------- Research access ----------------
- field: research_program
  status: stated
  value: 'Oura for research, part of Oura for Organizations: the Oura Enterprise Platform (research dashboards, group
    and access management, download by individual or group, Oura API integration, CSV/JSON export) with a customer
    success team, plus a separate Oura Research App (iOS) for enrolled participants, in which the Research Sponsor
    is the data controller and Oura may act as processor.'
  confidence: Verified
  sources:
  - url: https://organizations.ouraring.com/solutions/researchers
    type: vendor_page
    quote: Oura offers a solution for researchers, combining the unparalleled accuracy of Oura Ring with customizable
      dashboards and simple data integration
    retrieved: '2026-10-10'
  - url: https://ouraring.com/privacy-policy
    type: vendor_legal
    quote: The Oura Research App is a separate application that enables individuals to participate in research studies
      conducted by or on behalf of Oura or an independent research sponsor
    retrieved: '2026-10-10'
  - url: https://ouraring.com/privacy-policy
    type: vendor_legal
    quote: the Research Sponsor acts as the controller (or equivalent legal role under applicable data protection
      laws) of research data collected for the study
    retrieved: '2026-10-10'
  - url: https://apps.apple.com/us/app/oura-research/id6748037636
    type: app_store
    quote: For participants enrolled in research studies using the Oura Ring.
    retrieved: '2026-10-10'
  recheck_by: '2026-11-09'
  note: No free or grant-style academic program found; the offering is sold through the Oura for Organizations sales
    channel. Research App studies can blind participants to their scores while the ring keeps collecting (privacy
    policy). Oura also runs institutional partnerships outside any published program (Oura-NUS Joint Lab, opened
    January 2026; Oura listed as collaborator on registered trials such as NCT07646054 and NCT07736729); these are
    partnerships, not an open program. Oura Labs (in-app member studies) is not a researcher access route.
- field: research_program
  scope: Oura Teams (name used in published studies)
  status: stated
  value: Published studies from 2022 to 2026 describe a researcher portal called "Oura Teams" (one paper also calls
    it "Oura on the Web") used to manage participant accounts and export CSV files, including one-minute MET data.
    Oura's current pages do not use the name, and whether it is the same product as today's Oura Enterprise Platform
    is not stated anywhere found.
  confidence: Reported
  sources:
  - url: https://www.ebi.ac.uk/europepmc/webservices/rest/PMC8957400/fullTextXML
    type: paper
    quote: Device data were exported from online portals set up by the device companies for researchers to manage
      participant accounts
    retrieved: '2026-10-10'
  - url: https://www.ebi.ac.uk/europepmc/webservices/rest/PMC13626187/fullTextXML
    type: paper
    quote: Data were exported from the Oura Teams platform as comma-separated value files
    retrieved: '2026-10-10'
  - url: https://www.ebi.ac.uk/europepmc/webservices/rest/PMC12440682/fullTextXML
    type: paper
    quote: Data were exported from Oura Teams platform (Oura on the Web, Oura Health Oy, 2021)
    retrieved: '2026-10-10'
  recheck_by: '2026-11-09'
  note: Chinoy et al. 2022 (Nat Sci Sleep, PMC8957400), Haimovich et al. 2026 (JMIR Form Res, PMC13626187) and a
    2025 paper (PMC12440682); 18 Europe PMC records mention "Oura Teams" (gap hunter query, 2026-10-10). teams.ouraring.com
    does not resolve (DNS, 2026-10-10). Consumer "Oura on the Web" was discontinued on 5 October 2026 (see deprecations);
    whether that affected a researcher portal is unknown. Ask Oura.
- field: program_eligibility
  status: stated
  value: The research page names target customers (academic researchers, life science researchers, academic medical
    centers, government and non-profits, CROs, consumer product researchers). No eligibility criteria are published.
    Research App participants are selected by the Research Sponsor.
  confidence: Verified
  sources:
  - url: https://organizations.ouraring.com/solutions/researchers
    type: vendor_page
    quote: Academic researchers Life science researchers Academic medical centers Government and non-profits Contract
      research organizations (CRO) Consumer product researchers
    retrieved: '2026-10-10'
  - url: https://ouraring.com/terms-and-conditions
    type: vendor_legal
    quote: Individuals will be selected for Study participation by a Research Sponsor.
    retrieved: '2026-10-10'
  recheck_by: '2026-11-09'
  note: The pilot record had not_public on the reading that a list of target segments is not an eligibility rule.
    Both are true; the value states the list and the absence of criteria.
- field: program_application
  status: stated
  value: Contact form only; no application, review criteria or timeline published. Organizational purchases run
    on an Order under the Oura for Business Products and Services Agreement, and a Research Sponsor may sign a separate
    Research Agreement with Oura.
  confidence: Verified
  sources:
  - url: https://organizations.ouraring.com/solutions/researchers
    type: vendor_page
    quote: Track participant metrics with research-grade accuracy across a variety of research studies. Contact us
    retrieved: '2026-10-10'
  - url: https://ouraring.com/business/terms-and-conditions
    type: vendor_legal
    quote: if Buyer is a Research Sponsor, Oura and Buyer may enter into a Research Agreement incorporating this Agreement
      and Order(s) by reference
    retrieved: '2026-10-10'
  recheck_by: '2026-11-09'
  note: The absence of a published review step is an observation from the pages checked. The self-serve API route
    (register an app, submit for review above 10 users) is under developer_program_status and user_cap.
- field: program_status
  status: stated
  value: Active. The research page is live and claims 200+ active research collaborations; the Oura Research App
    was last updated to version 1.0.11 (15 Sep) on the US App Store.
  confidence: Verified
  sources:
  - url: https://organizations.ouraring.com/solutions/researchers
    type: vendor_page
    quote: 200+ active research collaborations worldwide
    retrieved: '2026-10-10'
  - url: https://apps.apple.com/us/app/oura-research/id6748037636
    type: app_store
    quote: Oura Research App collects data from your Oura Ring and shares it securely with your study's research
      team with your consent.
    retrieved: '2026-10-10'
  recheck_by: '2026-11-09'
  note: The 200+ figure is a vendor claim. The App Store listing shows no year on its version dates.
- field: developer_program_status
  status: stated
  value: Open. Anyone with an Oura account can register an OAuth2 API application in the developer portal; the previous
    portal remains for editing existing applications. Personal access tokens were withdrawn in December 2025, so
    OAuth2 is the only route.
  confidence: Verified
  sources:
  - url: https://partnersupport.ouraring.com/hc/en-us/articles/20949682312211-Using-the-Oura-API
    type: vendor_docs
    quote: You can use the Oura API by creating an API application in our developer portal
    retrieved: '2026-10-10'
  - url: https://cloud.ouraring.com/v2/docs
    fetch_url: https://cloud.ouraring.com/v2/static/json/openapi-1.41.json
    type: vendor_docs
    quote: personal access tokens were deprecated in December 2025 and are no longer available for use
    retrieved: '2026-10-10'
  recheck_by: '2026-11-09'
  note: Oura's partners page also offers custom integration options and dedicated partner support for the API.
- field: user_cap
  status: stated
  value: 10 users per API application until Oura approves it; no limit after approval. Approval is requested from
    the application's page once development is finished.
  confidence: Verified
  sources:
  - url: https://cloud.ouraring.com/v2/docs
    fetch_url: https://cloud.ouraring.com/v2/static/json/openapi-1.41.json
    type: vendor_docs
    quote: API Applications are limited to **10** users before requiring approval from Oura. There is no limit once
      an application is approved.
    retrieved: '2026-10-10'
  - url: https://cloud.ouraring.com/docs/
    type: vendor_docs
    quote: Once you have finished developing your application, you can submit it for review from the application's
      page.
    retrieved: '2026-10-10'
  recheck_by: '2026-11-09'
  note: Approval criteria and turnaround are not published.
- field: academic_vs_commercial
  status: stated
  value: The public API is free today for personal and commercial apps alike, under one agreement, but the agreement
    reserves the right to introduce fees including differentiated pricing for business users. On the Enterprise
    Platform, Oura says academic researchers can access premium metrics, which are not defined.
  confidence: Corroborated
  sources:
  - url: https://cloud.ouraring.com/v2/docs
    fetch_url: https://cloud.ouraring.com/v2/static/json/openapi-1.41.json
    type: vendor_docs
    quote: Yes, the Oura API is free to use for both personal and commercial applications.
    retrieved: '2026-10-10'
  - url: https://cloud.ouraring.com/legal/api-agreement
    type: vendor_legal
    quote: including, without limitation, rated pricing and/or differentiated pricing for business users
    retrieved: '2026-10-10'
  - url: https://organizations.ouraring.com/solutions/researchers
    type: vendor_page
    quote: Academic researchers can access premium metrics
    retrieved: '2026-10-10'
  recheck_by: '2026-11-09'
  note: Corroborated because what "premium metrics" adds is undefined. The pilot record had this as unclear; the
    docs FAQ and the premium-metrics line were not in its sources.
