- field: ai_training_terms
  scope: Oura API and MCP Server
  status: stated
  value: 'Three overlapping clauses. s.4(a)(iii): training, fine-tuning, developing or improving any AI model, or
    putting data in a training, evaluation or benchmark dataset, is a Prohibited Use unless Oura gives prior written
    consent. s.4(d): the Oura API may not be used to develop, train, fine-tune, evaluate, prompt or otherwise provide
    input to any AI model or platform, and LLM use is permitted only through the MCP Server; no consent route. s.6(g):
    using User Data to train or improve any AI or ML system is barred and a material breach; no consent route. s.4(c):
    a user''s own consent does not lift any Prohibited Use. Oura may audit for compliance.'
  confidence: Verified
