# ---------------- Data access and terms ----------------
- field: raw_streams
  scope: Oura API
  status: stated
  value: None. The API serves processed data only (scores, summaries, 5-minute heart rate and HRV series, 30-second
    sleep movement); raw PPG, accelerometer and temperature signals are not exposed.
  confidence: Corroborated
  sources:
  - url: https://cloud.ouraring.com/v2/docs
    fetch_url: https://cloud.ouraring.com/v2/static/json/openapi-1.41.json
    type: vendor_docs
    quote: 'Processing**: Algorithms analyze raw data to generate insights and scores 4. **API Availability**: Processed
      data becomes available through API endpoints'
    retrieved: '2026-10-10'
  recheck_by: '2026-11-09'
  note: Corroborated, not Verified, because the absence of raw signals is read from the data-flow description and
    the endpoint list in OpenAPI 1.41 (no raw-signal route), not stated outright. The API Agreement also bars deriving
    Oura's signal processing techniques (s.4(a)(xi)).
- field: raw_streams
  scope: Oura Enterprise Platform
  status: unclear
  value: The research page advertises raw data export to CSV or JSON, but no page defines whether this means sensor-level
    signals or the same processed metrics in tabular form.
  confidence: Unclear
  sources:
  - url: https://organizations.ouraring.com/solutions/researchers
    type: vendor_page
    quote: Flexible data export of raw data to CSV or JSON file
    retrieved: '2026-10-10'
  - url: https://ouraring.com/assets/documents/public-security-whitepaper.pdf
    type: vendor_docs
    quote: Research partners may receive data that has been processed to protect data subject privacy
    retrieved: '2026-10-10'
  recheck_by: '2026-11-09'
  note: Needs vendor confirmation. Published studies exporting from "Oura Teams" describe one-minute MET data, not
    sensor signals.
