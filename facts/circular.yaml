facts:
- field: research_program
  status: stated
  value: No named program. The science page invites research partners to "bring us a protocol"; Circular supplies devices,
    raw signal access under agreement and engineering time for studies run against a reference standard.
  confidence: Verified
  sources:
  - url: https://www.circular.xyz/science
    type: vendor_page
    quote: Bring us a protocol. We supply devices, raw signal access under agreement and engineering time for studies that
      hold us to a reference standard.
    retrieved: '2026-10-22'
  recheck_by: '2026-11-21'
  note: The same page lists six internal study protocols (sleep apnoea, AFib after ablation, cycle phase, illness detection,
    shift work, athletes) whose summaries partners can request. No terms, cost or agreement template is published.
- field: program_eligibility
  status: stated
  value: Clinical, academic and enterprise partners; no further criteria published beyond studies that use a reference standard.
  confidence: Verified
  sources:
  - url: https://www.circular.xyz/science
    type: vendor_page
    quote: Clinical, academic and enterprise partners are all welcome.
    retrieved: '2026-10-22'
  recheck_by: '2026-11-21'
- field: program_application
  status: stated
  value: Contact the research team through the science page (typical reply within five working days); no application form,
    review criteria or timeline published. API access for business customers is by contact and limited to selected projects.
  confidence: Verified
