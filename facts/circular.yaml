- field: program_status
  status: unclear
  value: The research offer is live on the site, but the original operator Circular SAS (SIREN 850 542 804) was converted
    to judicial liquidation on 14 October 2025. The current terms of use and sale name Circular Health Limited, registered
    in the Paris trade register under 990 900 326; the founders told press the headquarters moved to Hong Kong. Whether research
    agreements signed with the old entity carry over is not published.
  confidence: Unclear
  sources:
  - url: https://www.circular.xyz/science
    type: vendor_page
    quote: Six active protocols, each with a named reference standard and a defined read-out date. Partners can request the
      protocol summary for any of them.
    retrieved: '2026-10-22'
  - url: https://www.societe.com/societe/circular-850542804.html
    type: secondary
    quote: 14/10/2025 Annonce BODACC - Jugement de conversion en liquidation judiciaire
    retrieved: '2026-10-22'
  - url: https://www.circular.xyz/terms-of-use
    type: vendor_legal
    quote: Circular Health Limited, which is registered in the Paris Register of Trade & Companies under the number 990 900
      326
    retrieved: '2026-10-22'
  - url: https://gadgetsandwearables.com/2026/02/14/circular-ring-liquidation/
    type: secondary
    quote: The French company behind the Circular Ring officially entered judicial liquidation at the end of last year as
      part of a major corporate shuffle.
    retrieved: '2026-10-22'
  - url: https://gadgetsandwearables.com/2026/02/14/circular-ring-liquidation/
    type: secondary
    quote: They moved the headquarters to Hong Kong and established a new entity called Circular Health Limited.
    retrieved: '2026-10-22'
  recheck_by: '2026-11-21'
  note: societe.com (a secondary reproduction of the official BODACC and RNE notices) shows the redressement judiciaire opened
    2024-10-08 (cessation of payments 2024-08-31) and converted to liquidation on 2025-10-14, liquidator Selarl Asteren. The
    official gazette (bodacc.fr and its open-data API) disallows scripted access in robots.txt, so it was not read by script
    and the liquidation stays at secondary-source confidence. The Hong Kong move rests on the founders' account to press (relayed
    by Gadgets & Wearables from Android Police); the vendor's own terms give only a Paris registered office.
