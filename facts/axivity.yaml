- field: history_depth
  status: conflict
  scope: AX3
  value: One recording is bounded by battery and memory, and Axivity's own figures disagree. The AX3v2 datasheet
    description says up to 21 days; the same datasheet's spec table and the product page say 30 days at 12.5 Hz
    and 14 days at 100 Hz; the Open Movement FAQ gives about 13.5 days at 100 Hz and about 65 days at 12.5 Hz
    (packed mode). There is no vendor-side history; downloaded files are held by the researcher.
  confidence: Unclear
  sources:
  - url: https://axivity.com/files/resources/AX3v2_Datasheet.pdf
    type: vendor_docs
    quote: sensor will record for up to 21 days of continuous data
    retrieved: '2026-10-31'
  - url: https://axivity.com/files/resources/AX3v2_Datasheet.pdf
    type: vendor_docs
    quote: Maximum Logging Periods 30 days at 12.5 Hz or 14 days at 100 Hz
    retrieved: '2026-10-31'
  - url: https://axivity.com/product/ax3
    type: vendor_page
    quote: Battery Life 30 days @ 12.5Hz; 14 days @ 100Hz
    retrieved: '2026-10-31'
  - url: https://github.com/openmovementproject/openmovement/blob/master/Docs/ax3/ax3-faq.md
    type: vendor_docs
    quote: Approximate maximum recording duration from a single full battery charge.
    retrieved: '2026-10-31'
  recheck_by: '2026-11-30'
  note: The datasheet (v1.8, 18/04/2023) gives "up to 21 days" with no rate attached, against its own 30-day
    maximum at 12.5 Hz. The 14 days at 100 Hz figure agrees across sources. The FAQ table marks some low-rate
    figures as uncertain and gives 9 days at 100 Hz in unpacked mode. UK Biobank's activity monitor document
    (v2.0, 2025) reports 17% incomplete kits in season 1 of its repeat study, attributed to battery performance in
    reused devices, so plan for shorter windows on old units.
