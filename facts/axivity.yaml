# ---------------- Data access and terms ----------------
- field: raw_streams
  status: stated
  value: 'Raw, unfiltered triaxial acceleration (AX3: Analog Devices ADXL345; AX6: Bosch BMI160) plus triaxial
    gyroscope on the AX6, each block timestamped. Both devices also always record low-rate auxiliary channels:
    light level, internal device temperature and battery voltage. All stored raw on device flash in the open .CWA
    format and read over USB by the researcher. No vendor cloud.'
  confidence: Verified
  sources:
  - url: https://axivity.com/product/ax6
    type: vendor_page
    quote: All data is stored in its raw unaltered format on the embedded flash memory.
    retrieved: '2026-10-11'
  - url: https://github.com/openmovementproject/openmovement/blob/master/Docs/ax3/ax3-faq.md
    type: vendor_docs
    quote: Analog Devices ADXL345 Bosch BMI160
    retrieved: '2026-10-11'
  - url: https://axivity.com/product/ax3
    type: vendor_page
    quote: The light sensor can be used to help determine periods of wear as well as provide useful environmental
      data.
    retrieved: '2026-10-11'
  - url: https://axivity.com/product/ax3
    type: vendor_page
    quote: The temperature sensor gives a rough sense of outside environment temperature and also if the sensor is
      being worn or not.
    retrieved: '2026-10-11'
  - url: https://axivity.com/product/ax6
    type: vendor_page
    quote: The AX6 has additional light and temperature sensors, their output is inserted in to the recorded data
      stream.
    retrieved: '2026-10-11'
  - url: https://github.com/openmovementproject/openmovement/blob/master/Docs/ax3/ax3-auxiliary.md
    type: vendor_docs
    quote: This data is always recorded, regardless of configuration, whenever the device is logging movement data.
    retrieved: '2026-10-11'
  - url: https://github.com/openmovementproject/openmovement/blob/master/Docs/ax3/ax3-auxiliary.md
    type: vendor_docs
    quote: The temperature sensor measures the internal temperature of the device, and it is primarily useful to
      help with sensor auto-calibration.
    retrieved: '2026-10-11'
  - url: https://github.com/openmovementproject/openmovement/blob/master/Docs/ax3/ax3-auxiliary.md
    type: vendor_docs
    quote: The sensor arrangement is most suitable as a general, relative, indicator of light
    retrieved: '2026-10-11'
  - url: https://github.com/openmovementproject/openmovement/issues/11
    type: repository
    quote: the correct temperature conversion from ADC values is
    retrieved: '2026-10-11'
  recheck_by: '2026-11-30'
  note: Temperature is internal device temperature (affected by skin, coupling and environment), mainly for
    accelerometer auto-calibration; light reads through the case and is a relative indicator, not calibrated lux.
    GitHub issue 11 records that OmGui, cwa-convert and the Axivity help pages had used different temperature
    conversion formulas; the maintainer settled the correct one in July 2023, and absolute readings from the old
    formula need converting. No PPG, ECG or heart rate.
- field: derived_metrics
  status: stated
  value: The device stores raw data only and computes nothing. OmGui (through omconvert) has built-in, open
    analysis run by the researcher locally, which derives signal vector magnitude epochs, MET cut-point time in
    activity intensity bands, wear-time validation and a simple sleep-period detector. Richer metrics come from
    third-party open-source tools the docs recommend, chiefly GGIR.
  confidence: Verified
  sources:
  - url: https://axivity.com/downloads/ax3
    type: vendor_page
    quote: Software for the AX3 sensors with built-in analysis (Windows)
    retrieved: '2026-10-11'
  - url: https://github.com/openmovementproject/openmovement/blob/master/Docs/ax3/ax3-research.md
    type: vendor_docs
    quote: Some simple analysis methods are available through the open source OmGui configuration tool
    retrieved: '2026-10-11'
  - url: https://github.com/openmovementproject/openmovement/wiki/AX3-GUI
    type: vendor_docs
    quote: The signal vector magnitude (SVM) has been shown to be a useful measure for working with when axis
      specific information is not required.
    retrieved: '2026-10-11'
  - url: https://github.com/openmovementproject/openmovement/wiki/AX3-GUI
    type: vendor_docs
    quote: The Cut-point analysis reports the time user has spent in a specific intensity of physical activity where
      each intensity band is categorized in units of Metabolic Equivalent of Task (METS).
    retrieved: '2026-10-11'
  - url: https://github.com/openmovementproject/openmovement/wiki/AX3-GUI
    type: vendor_docs
    quote: The wear time validation (WTV) algorithm is designed to give a high level view if the device has been worn
      or not.
    retrieved: '2026-10-11'
  - url: https://github.com/openmovementproject/openmovement/wiki/AX3-GUI
    type: vendor_docs
    quote: The algorithm detects periods of sleep.
    retrieved: '2026-10-11'
  - url: https://github.com/openmovementproject/openmovement/blob/master/Docs/ax3/ax3-research.md
    type: vendor_docs
    quote: For a richer analysis, a popular option in research is the open source GGIR software, which includes
      sleep analysis and can also produce more visual reports.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-30'
  note: These are published, open algorithms run on the researcher's own computer, not proprietary vendor metrics.
    No step count is offered. biobankAccelerometerAnalysis is academic-use only and does not read AX6 files (see
    academic_vs_commercial).
