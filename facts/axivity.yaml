- field: export_routes
  status: stated
  value: 'USB only. The device mounts as a USB drive holding CWA-DATA.CWA. OmGui (Windows) downloads it and exports
    CSV or WAV; omconvert and cwa-convert do the same from the command line; the file loads directly into GGIR,
    openmovement-python, pampro, MATLAB and others. libOMAPI (C) and the third-party axR (R) let teams build
    their own download software. AX-Deploy handles mass deployment with per-device configuration but not AX6
    gyroscopes; the web configurator AX Config configures one device at a time and cannot download.'
  confidence: Verified
  sources:
  - url: https://github.com/openmovementproject/openmovement/wiki/AX3-GUI
    type: vendor_docs
    quote: Data files can be downloaded by simply by mounting the AX device as USB-stick and copying (or moving off)
      the data file CWA-DATA.CWA from the devices.
    retrieved: '2026-10-11'
  - url: https://github.com/openmovementproject/openmovement/wiki/AX3-GUI
    type: vendor_docs
    quote: You can process or export the data with omconvert or cwa-convert .
    retrieved: '2026-10-11'
  - url: https://github.com/openmovementproject/openmovement/wiki/AX3-GUI
    type: vendor_docs
    quote: 'You can also directly load the data into analysis environments with software such as: GGIR , openmovement-python
