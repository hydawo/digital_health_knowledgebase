    retrieved: 2026-10-11
  - url: https://raw.githubusercontent.com/awareframework/aware-client/main/aware-core/src/main/java/com/aware/Aware.java
    type: repository
    quote: 'if (Aware.getSetting(getApplicationContext(), Aware_Preferences.AWARE_DONATE_USAGE).equals("true")) {'
    retrieved: 2026-10-11
  recheck_by: 2027-01-09
  note: 'Self-claim, so Corroborated at most; it describes a design, not a compliance certification, and a study''s
    GDPR position depends on the researcher''s own server. Still current: the local-first storage, direct upload to
    the researcher''s server and withdrawal model. Stale: the policy is dated 24 January 2019 and covers clients
    "offered by AWARE Framework in the Play Store", which no longer exist; the free hosted dashboard it describes is
    gone; and the 15-minute ping (device ID, timestamp, platform, package and version) goes to api.awareframework.com,
    which no longer resolves. In the current Android source the ping runs only when the aware_donate_usage setting is
    "true", and that preference is commented out of the settings screen. The "no personal identifiers" claim sits
    uneasily with the later keyboard, screenshot and screentext sensors.'
