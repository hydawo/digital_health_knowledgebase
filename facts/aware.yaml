- field: deprecations
  status: stated
  value: In January 2025 AWARE-Light became the main Android AWARE and the original client became AWARE Legacy
    (denzilferreira/aware-client, archived 2023-06-18). The old free hosted dashboard at api.awareframework.com is
    not compatible with AWARE Micro and the host no longer resolves. The Google Fit add-on depends on Google Fit
    APIs that Google is deprecating in 2026.
  confidence: Verified
  sources:
  - url: https://awareframework.com/changes-to-the-aware-ecosystem/
    type: vendor_page
    quote: "The version of AWARE formerly known as AWARE-Light has now become the main version of AWARE, whilst the archived original AWARE is now known as AWARE Legacy"
    retrieved: 2026-10-11
  - url: https://github.com/denzilferreira/aware-client
    type: repository
    quote: "This repository was archived by the owner on Jun 18, 2023. It is now read-only."
    retrieved: 2026-10-11
  - url: https://github.com/awareframework/aware-micro-server
    type: repository
    quote: "This is not compatible with the old dashboard located at api.awareframework.com"
    retrieved: 2026-10-11
  - url: https://developers.google.com/fit
    type: secondary
    quote: "The Google Fit APIs, including the Google Fit REST API, will be deprecated in 2026"
    retrieved: 2026-10-11
  recheck_by: 2026-11-10
  note: api.awareframework.com returned NXDOMAIN on 2026-10-11. The changes post is dated 2025-01-13. Three pages
