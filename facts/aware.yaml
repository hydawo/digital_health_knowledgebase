- field: sampling_rates
  status: stated
  scope: Android
  value: Configurable per sensor. The accelerometer is set as a sampling delay in microseconds (200000 normal, 60000
    UI, 20000 game, 0 fastest) and is hardware-dependent and non-deterministic. GPS location is checked every 180
    seconds by default.
  confidence: Verified
  sources:
  - url: https://awareframework.com/accelerometer/
    type: vendor_docs
    quote: "non-deterministic frequency in microseconds (dependent of the hardware sensor capabilities and resources), e.g., 200000 (normal), 60000 (UI), 20000 (game), 0 (fastest)"
    retrieved: 2026-10-11
  - url: https://awareframework.com/locations/
    type: vendor_docs
    quote: "how frequent to check the GPS location, in seconds. By default, every 180 seconds"
    retrieved: 2026-10-11
  recheck_by: 2026-11-10
  note: The V3 iOS app lets sampling frequency, save interval and sample interval be set in Settings; per-sensor
    iOS rates were not itemized.
- field: history_depth
  status: stated
  value: No vendor-held copy or limit. Phones upload straight to the researcher's own server, so history is whatever
    the study keeps; data not yet uploaded sits in the phone's local database.
  confidence: Corroborated
  sources:
  - url: https://awareframework.com/use-aware/
    type: vendor_docs
    quote: "AWARE runs on Android devices, and those devices directly upload data to your MySQL server, without any intermediate servers or cloud services"
    retrieved: 2026-10-11
  recheck_by: 2026-11-10
  note: An inference from the self-hosted architecture; no page states a history depth. Terms of the hosted service
    are not published.
- field: export_routes
  status: stated
  value: Android phones upload to the researcher's MySQL database at a configured offload frequency. iOS and AWARE
    Legacy upload to a self-run AWARE Micro server. Local data can also be copied off the phone and opened with an
    SQLite client. No vendor API.
  confidence: Verified
  sources:
  - url: https://awareframework.com/use-aware/
    type: vendor_docs
    quote: "“Offload frequency” determines the frequency at which the mobile app will try to send the collected data to the database"
    retrieved: 2026-10-11
  - url: https://awareframework.com/downloads/
    type: vendor_page
    quote: "To operate the iPhone AWARE setup, you will also need to run the AWARE server"
    retrieved: 2026-10-11
  - url: https://awareframework.com/privacy/
    type: vendor_legal
    quote: "it can be backed up and opened by connecting the device to your computer and using an SQLite client"
    retrieved: 2026-10-11
  recheck_by: 2026-11-10
  note: Setting up a study in the hosted configurator requires entering the database's root credentials, which the
    page says it does not store permanently. Deduplicate records on (device_id, timestamp).
- field: rate_limits
  status: not_applicable
  note: No hosted API. Throughput is bounded by the researcher's own server; AWARE Micro is documented as handling
    thousands of requests per second on one machine.
- field: retention_terms
  status: stated
  value: By default the client stores data only on the phone; in a study it is uploaded to the study server.
    Participants can withdraw and remove their data from the server and phone from the app. Retention on the server
    is otherwise the researcher's decision.
  confidence: Corroborated
  sources:
