- field: derived_metrics
  status: stated
  value: The clients mostly store raw records; some sensors add higher-level context (for example call availability
    in Communication, OS activity labels on iOS). Behavioural features come from the separate RAPIDS pipeline
    (AGPL-3.0, maintained outside AWARE). The AWARE Narrator tool turns records into English statements for LLM use
    and can optionally send coordinates to the Google Maps API for reverse geocoding.
  confidence: Verified
  sources:
  - url: https://awareframework.com/rapids/
    type: vendor_page
    quote: "RAPIDS can generates various behavioral features from AWARE sensor data"
    retrieved: 2026-10-11
