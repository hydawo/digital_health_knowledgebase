- field: gdpr_statement
  status: stated
  value: The 2019 privacy policy has a GDPR section. It says a random 128-bit ID is generated on install, no
    personal identifiers are collected by design, data stays on the phone by default, encryption and obfuscation
    are on by default, and participants can withdraw and delete their data.
  confidence: Corroborated
