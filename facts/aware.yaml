facts:
- field: research_program
  status: stated
  value: No research access program. AWARE is open-source academic software that anyone can download and self-host.
    The only researcher offering is a paid service from the University of Melbourne team, covering dedicated study
    set-up or fixing support and hosting a study on their AWARE hosting service, arranged by contacting Dr Simon
    D'Alfonso.
  confidence: Verified
  sources:
  - url: https://awareframework.com/support/
    type: vendor_page
    quote: "For those who would like dedicated support in setting up a study or fixing an issue, we offer a paid service option, with all payment going back into further development of AWARE"
    retrieved: 2026-10-11
  - url: https://awareframework.com/support/
    type: vendor_page
    quote: "we can set it up and host it for you on our AWARE hosting service based at the University of Melbourne"
    retrieved: 2026-10-11
  - url: https://awareframework.com/open/
    type: vendor_page
    quote: "AWARE is available to everyone on GitHub under the Apache Software License 2.0"
    retrieved: 2026-10-11
  recheck_by: 2026-11-10
  note: Orygen (Melbourne youth mental health) says its partnership with the university gives it unrestricted access
    to AWARE (https://www.orygen.org.au/Research/Research-Areas/Orygen-Digital/Personal-sensing). That is an informal
    partnership, not a published program.
- field: program_eligibility
  status: not_applicable
  note: No access program, so no eligibility rule. The software is open to anyone under Apache 2.0 (see
    academic_vs_commercial). No eligibility rule is published for the paid support or hosting service either.
- field: program_application
  status: not_applicable
  note: No application or approval step. A study is set up by building a JSON configuration in the public
    configurator (configurator.awareframework.com) and sending participants its link, or by scanning a QR code on
    iOS. The paid service is by contact only (see quote_required).
- field: program_status
  status: not_applicable
  note: The field describes an access program's status, and AWARE has none. The project's own status (maintainers,
    releases) is recorded under developer_program_status, and the AWARE-Light rename and archived clients under
    deprecations. The paid support and hosting service is advertised on the Support page (modified 2025-09-29); no
    intake status is published.
- field: developer_program_status
  status: stated
  value: Open source with no developer program or sign-up. Actively maintained by a team in the University of
    Melbourne's School of Computing and Information Systems (Dr Simon D'Alfonso, Prof Vassilis Kostakos); AWARE was
    created by Denzil Ferreira in his PhD, co-supervised by Kostakos and Anind K. Dey. Android stable is 4.2.1 and
    beta 4.7.3 (GitHub release 2026-08-07). The iOS apps are published under Yuuki Nishiyama's developer account.
    Contributions go to D'Alfonso or Kostakos; community support is on Discord.
  confidence: Verified
