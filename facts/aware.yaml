- field: raw_streams
  status: stated
  scope: Android (AWARE, formerly AWARE-Light)
  value: Raw phone sensor and event streams written to the researcher's own database, including accelerometer,
    gyroscope, magnetometer, gravity, linear accelerometer, rotation, barometer, light, proximity, temperature,
    locations (GPS and network), battery, Bluetooth, WiFi, network, telephony, calls and messages, applications,
    installations, keyboard, touch, notifications, screen, screenshot, screentext and ESM/EMA answers.
    Applications, touch, notifications, keyboard and screentext need Android Accessibility access. Keyboard logs
    keystrokes on any keyboard, Screenshot captures full screen images, and Screentext captures on-screen text.
  confidence: Verified
  sources:
  - url: https://awareframework.com/sensors/
    type: vendor_docs
    quote: "Accelerometer Applications Aware Barometer Battery Bluetooth Communication ESM/EMA Gravity Gyroscope Installations Light Linear Accelerometer Locations Magnetometer MQTT Network Keyboard Processor Proximity Rotation Scheduler Screen Screenshot Screentext Telephony Touch Temperature Timezone WiFi"
    retrieved: 2026-10-11
  - url: https://github.com/awareframework/aware-client
    type: repository
    quote: "Accessibility needs to be turned on for AWARE for special sensors to work: Applications, Touch, Notifications, Keyboard, Crash logs, Screen reader"
    retrieved: 2026-10-11
  - url: https://awareframework.com/keyboard/
    type: vendor_docs
    quote: "This sensor records the users' keystrokes regardless of which keyboard is used"
    retrieved: 2026-10-11
  - url: https://awareframework.com/screenshot-sensor/
    type: vendor_docs
    quote: "This sensor records screenshots that include all visual elements displayed on the screen at the moment of capture"
    retrieved: 2026-10-11
  - url: https://awareframework.com/screentext/
    type: vendor_docs
    quote: "Application passwords may be captured by screen readers if the show-password functionality is enabled by the smartphone user"
    retrieved: 2026-10-11
  - url: https://github.com/awareframework/aware-client/issues/31
    type: repository
    quote: "Need to detect and anonymize sensitive information, e.g., passwords, username"
    retrieved: 2026-10-11
  - url: https://awareframework.com/notes-advice/
    type: vendor_docs
    quote: "An unresolved issue with AWARE concerns duplication of data records"
    retrieved: 2026-10-11
  recheck_by: 2026-11-10
  note: 'Decision-relevant for ethics review: the Screentext page says the sensor "does not record password inputs",
    but AWARE''s own test list shows some apps expose passwords to it when the participant turns on show-password.
    Issue #31 on sensitive-data handling (passwords, usernames) has been open since 2024-02-28. Records can also be
    duplicated (same device_id and timestamp), so deduplicate during cleaning. The Google Fit module is not in the
    standard build and must be requested.'
- field: raw_streams
  status: stated
  scope: iOS, AWARE Client V3 (App Store, released 2026-06-28)
  value: Motion (accelerometer, gyroscope, gravity, magnetometer, linear accelerometer, rotation, barometer,
    pedometer, activity recognition labels, significant motion, AirPods head motion), device and connectivity
    (battery, screen, device, processor, network, Bluetooth LE, timezone, app lifecycle), HealthKit records (heart
    rate, sleep, activity, workouts, ECG, activity summaries, audiograms), Apple Watch sensors, music and photo
    metadata, keyboard metadata from AWARE's own bundled keyboard, location, Wi-Fi, iBeacon, call events,
    OpenWeather, notifications and Shortcuts triggers. Ambient noise (decibels and sound labels) was added in a
    version update. Enrolment is by QR code.
  confidence: Verified
