# ---------------- Data access and terms ----------------
- field: raw_streams
  status: stated
  value: 'Raw PPG, through the PPG Recordings API: sessions the account holder starts and stops in the app''s Developer
    Mode, downloaded as gzip-compressed NDJSON from pre-signed links. The API returns only the token holder''s own
    recordings, so it does not reach a participant cohort without per-participant accounts and manual sessions.
    UltraSignal also names temperature and accelerometer streams for developer-kit holders, but no public endpoint
    documents raw temperature or accelerometer data. The daily metrics API returns processed values only.'
  confidence: Verified
  sources:
  - url: https://vision.ultrahuman.com/developer-docs?api=ppg
    type: vendor_docs
    quote: The PPG Recordings API provides access to raw photoplethysmography (PPG) data recorded through Developer Mode
      on Ultrahuman Ring.
    retrieved: '2026-10-21'
  - url: https://vision.ultrahuman.com/developer-docs?api=ppg
    type: vendor_docs
    quote: This API returns only your own PPG recordings (associated with your partner account email)
    retrieved: '2026-10-21'
  - url: https://vision.ultrahuman.com/developer-docs?api=ppg
    type: vendor_docs
    quote: Use the Ultrahuman app's Developer Mode to start and stop PPG recording sessions.
    retrieved: '2026-10-21'
  - url: https://vision.ultrahuman.com/developer-docs?api=ppg
    type: vendor_docs
    quote: Recording data is stored in NDJSON format (gzip compressed)
    retrieved: '2026-10-21'
  - url: https://www.ultrahuman.com/us/ultrasignal/
    type: vendor_page
    quote: Using the Ring AIR's Photoplethysmography (PPG), temperature and accelerometer data stream, developers can now
      build bespoke algorithms on top of their data.
    retrieved: '2026-10-21'
  recheck_by: '2026-11-20'
  note: The profile says the UltraSignal stream is not called raw and that format and rates are undocumented; the PPG
    Recordings API docs now call it raw and give the format and the rate (see sampling_rates).
- field: derived_metrics
  status: stated
  value: 'Daily metrics API: heart rate, skin temperature, HRV, steps, motion, night and sleep resting HR, sleep (score,
    total, efficiency, time in bed, REM/deep/light, temperature deviation, HR drop, restorative sleep, movements, morning
    alertness, full cycles, tosses and turns, average body temperature), recovery and recovery index, movement index,
    VO2 max, SpO2, active minutes; with CGM: glucose, metabolic score, glucose variability, average glucose, estimated
    HbA1c, time in target. Separate endpoints cover Home environment metrics and Blood Vision reports. Workouts are not
    exposed.'
  confidence: Verified
  sources:
  - url: https://vision.ultrahuman.com/developer-docs?api=daily
    type: vendor_docs
    quote: hr Heart rate measurements throughout the day in beats per minute (BPM)
    retrieved: '2026-10-21'
