- field: academic_vs_commercial
  status: unclear
  value: No separate academic API tier or terms are published. Developer docs mention unpublished enterprise "dedicated
    subscription plans". The only researcher-specific offer found is Heroes special ring pricing for scientists and
    researchers. The API Agreement defines commercial use but applies one set of terms to every partner, and bars using
    API data for research or analysis against Ultrahuman.
  confidence: Unclear
  sources:
  - url: https://www.ultrahuman.com/us/heroes/
    type: vendor_page
    quote: Scientists & Researchers
    retrieved: '2026-10-21'
  - url: https://vision.ultrahuman.com/developer-docs?api=blood_reports
    type: vendor_docs
    quote: For enterprise partners with dedicated subscription plans, special access can be configured to retrieve patient
      data directly by email.
    retrieved: '2026-10-21'
  - url: https://ultrahumanapp.notion.site/API-Agreement-for-Developers-and-Partners-120755317a9180999ce3edcfc1047f58
    type: vendor_legal
    retrieved: '2026-10-21'
  recheck_by: '2026-11-20'
  note: 'API Agreement clauses below were read from Notion''s page data (loadPageChunk) on 2026-10-21 and cannot be
    checked by script; check by hand. It says commercial usage "includes, but is not limited to, applications, products,
    or services that are monetized or generate revenue through integration with our platform", and under "No Data
    Mining or Analytics for Competitive Purposes" that partners may not use the API or its data "to conduct research,
    analysis, or competitive studies against Ultrahuman or its products", including reverse-engineering its algorithms
    or metrics. Read that clause before any study that compares Ultrahuman against other devices or re-derives its
    metrics.'
