- field: developer_program_status
  status: stated
  scope: Personal API token
  value: Open and self-serve. Any Ultrahuman account holder can generate a Personal API token in the developer portal
    (vision.ultrahuman.com/developer, sign-in required). The token reads the holder's own data, and another user's data
    once that user links their account by entering the developer's data sharing code (Partner ID) in the app. No
    approval step is described for this route.
  confidence: Verified
  sources:
  - url: https://vision.ultrahuman.com/developer
    type: vendor_docs
    quote: Generate a token to access your own data through the Ultrahuman API.
    retrieved: '2026-10-21'
  - url: https://vision.ultrahuman.com/developer
    type: vendor_docs
    quote: This token grants access to your own personal data and can also be used to access other users’ data
    retrieved: '2026-10-21'
  - url: https://vision.ultrahuman.com/developer-docs?api=ppg
    type: vendor_docs
