# ---------------- Research access ----------------
- field: research_program
  status: stated
  value: 'No dedicated academic data program with published terms. Three routes: (1) research partnerships, a "Research
    Institutions" offering on the partners page (devices plus an enterprise dashboard) reached through a "Become a partner"
    form; (2) Pulsomics, Ultrahuman''s own opt-in in-app research program, registered with CTRI, which invites
    universities, hospitals and research groups to collaborate on study design, cohort access and co-authored papers
    while keeping the raw recordings with the Ultrahuman science team; (3) UltraSignal, an application-based developer
    platform with a loaned developer kit for PPG, temperature and accelerometer streams.'
  confidence: Verified
  sources:
  - url: https://www.ultrahuman.com/us/partners/
    type: vendor_page
    quote: Ultrahuman enables researchers to collect high-resolution, longitudinal biomarker data in real-world settings.
    retrieved: '2026-10-21'
  - url: https://www.ultrahuman.com/us/partners/
    type: vendor_page
    quote: A unified enterprise-grade dashboard for teams and clinicians to track sleep, recovery, movement, cycles, and
      long-term health using continuous biomarkers.
    retrieved: '2026-10-21'
  - url: https://www.ultrahuman.com/us/pulsomics/
    type: vendor_page
    quote: Universities, hospitals and research groups can work with us on study design, cohort access and co-authored
      publications.
    retrieved: '2026-10-21'
  - url: https://www.ultrahuman.com/science/explainers/pulsomics/
    type: vendor_page
    quote: Access to the raw recordings is limited to the Ultrahuman science team.
    retrieved: '2026-10-21'
  - url: https://www.ultrahuman.com/us/ultrasignal/
    type: vendor_page
    quote: Using the Ring AIR's Photoplethysmography (PPG), temperature and accelerometer data stream, developers can now
      build bespoke algorithms on top of their data.
    retrieved: '2026-10-21'
  recheck_by: '2026-11-20'
  note: 'Pulsomics is Ultrahuman''s own study (CTRI/2026/08/115584, ethics approval from Medstar Speciality Hospital
    Ethics Committee), not a data service. What an outside institution can get, as published: collaboration on study
    design, access to the opted-in cohort, and co-authorship. What it cannot get: the raw pulse recordings, which stay
    with Ultrahuman''s science team; published outputs are aggregated across many users ("Anything published is
    aggregated across many users", /us/pulsomics/). No collaboration terms, data-sharing agreement, IP terms or cost are
    published. The partnership dashboard''s export and data rights are also undocumented.'
- field: program_eligibility
  status: stated
  value: 'UltraSignal: open application; priority goes to applicants building an app on Ring AIR data. Pulsomics
    collaboration: universities, hospitals and research groups, no further criteria. Pulsomics participants: anyone 18
    or over actively using a Ring AIR or Ring PRO. Partnerships: no eligibility criteria published.'
  confidence: Verified
  sources:
  - url: https://www.ultrahuman.com/us/ultrasignal/
    type: vendor_page
    quote: Applications will be reviewed and priority will be given to applicants creating an app that takes advantage of
      Ultrahuman Ring AIR’s data.
    retrieved: '2026-10-21'
  - url: https://www.ultrahuman.com/us/pulsomics/
    type: vendor_page
    quote: Universities, hospitals and research groups can work with us on study design, cohort access and co-authored
      publications.
    retrieved: '2026-10-21'
  - url: https://www.ultrahuman.com/us/pulsomics/
    type: vendor_page
    quote: Anyone aged 18 or over actively using an Ultrahuman Ring AIR or Ring PRO.
    retrieved: '2026-10-21'
  recheck_by: '2026-11-20'
- field: program_application
  status: stated
  value: 'UltraSignal: a brief application (Typeform linked from the page); applications are reviewed and selected
    applicants are loaned a developer kit. Personal API tokens and OAuth app registration: created by the account holder
    in the developer portal (see developer_program_status). Ultrahuman''s September 2025 Partner API guide lists the OAuth
    client ID and secret as coming from "partner onboarding". Research partnerships and Pulsomics collaboration: a
    "Become a partner" / "Partner with us" contact route, with no criteria, review step or timeline published. Pulsomics
    participants opt in inside the app.'
