    retrieved: '2026-10-21'
  recheck_by: '2026-11-20'
  note: The developer docs are a Next.js app. The query-string routes (?api=daily, ?api=ppg, ?api=blood_reports,
    ?type=oauth, ?type=mcp) are server-rendered, so plain fetches see each tab's text; they replace the drafts' hashed
    chunk (_next/static/chunks/5898-7e1e79f1b88fcd98.js, which was 977-a694c83c... on 2026-10-11) as the cited route.
    Not tested from an account, since that needs a sign-in.
- field: developer_program_status
  status: stated
  scope: Partner OAuth API
  value: 'Open, with an unclear approval step. The developer portal lets a signed-in account holder create an OAuth
    application, and Open Wearables'' setup guide walks through doing so without any review. Ultrahuman''s own Partner
    API guide (19 September 2025) still says "approved apps" with credentials from "partner onboarding", and an Open
    Wearables blog post (May 2026) says credentials are not self-serve. Reading the exact wording together: registering
    an app is self-serve today; whether an app needs Ultrahuman''s approval before users outside the developer''s own
    account can authorise it, or before production use, is not documented.'
  confidence: Corroborated
