# ---------------- Research access ----------------
- field: research_program
  status: stated
  value: 'Garmin Health x Fitrockr research grants, run as regional or themed rounds (EMEA 2023, Americas 2023, India
    2024, Biomarkers 2024, Australia and New Zealand 2025, Asia 2026). The Asia 2026 award was 5 Garmin vivoactive 5
    watches, 6 months of unrestricted Fitrockr platform access for up to 50 participants, and a possible feature in
    Garmin Health communications; earlier rounds gave 3 months of access for up to 50 users. There is no standing
    academic program.'
  confidence: Corroborated
  sources:
  - url: https://www.garmin.com/en-PH/newsroom/press-release/news-2026-mar-fitrockr/
    type: secondary
    quote: 'Professional Hardware: 5 Garmin vívoactive 5 smartwatches, featuring advanced health monitoring and long
      battery life.'
    retrieved: '2026-10-21'
    note: Garmin Philippines press release dated 2026-03-05, read live. Garmin is the co-sponsor.
  - url: https://www.garmin.com/en-PH/newsroom/press-release/news-2026-mar-fitrockr/
    type: secondary
    quote: 'Full Platform Access: 6 months of unrestricted access to the Fitrockr Health Solutions Platform.'
    retrieved: '2026-10-21'
