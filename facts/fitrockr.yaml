# ---------------- Pricing ----------------
- field: device_price
  status: not_applicable
  note: Fitrockr sells software only; teams buy the wearables (Garmin, Withings, Oura, Polar and others) from their
    makers. The grants supply 5 Garmin watches.
- field: subscription_price
  status: not_applicable
  note: No consumer membership. Participants use the free Fitrockr Sync app; the organisation licence is under
    api_platform_fees.
- field: academic_pricing
  status: stated
  value: No published academic price or discount. Teams with limited research funds are asked to contact Fitrockr for a
