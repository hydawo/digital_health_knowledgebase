# ---------------- Data access and terms ----------------
- field: raw_streams
  status: stated
  value: 'Through the Fitrockr app''s direct device sync (not Garmin Connect): raw and enhanced beat-to-beat intervals
    (every beat), accelerometer (fixed 25 Hz) and gyroscope (fixed 32 Hz) as a paid add-on, actigraphy, zero crossing
    and skin temperature, plus heart rate, stress, SpO2 and respiration at configurable epochs. Syncing through Garmin
    Connect "supports less data". GPS can be switched off per study. Garmin is the main source; other brands
    (Apple, Google, Withings, Oura, Polar and others) are supported.'
  confidence: Reported
  sources:
  - url: https://www.fitrockr.com/research/pricing/
    fetch_url: https://web.archive.org/web/20260713062111/https://www.fitrockr.com/research/pricing/
