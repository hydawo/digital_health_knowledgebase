- field: api_platform_fees
  status: stated
  value: 'Research & Clinical Trials plans per month, as researcher B read them on 2026-10-21: Basic from EUR 50 (USD
    55), Pro from EUR 150 (USD 165), each with 5 device licences; extra device licences EUR 1 to 7.5 (Basic) or EUR 1 to
    15 (Pro) per month. Add-ons: API access +20% on licence; accelerometer and gyroscope collection +25%; live
    streaming +20%; surveys +20%; on-premise hosting EUR 5,000 + 20%; Data Vault EUR 250 per month after the project;
    historic Garmin Connect import EUR 500 setup. Germany cloud hosting, support and admin accounts included.'
  confidence: Reported
