    OAuth2 client credentials, host consumer-api.metricwire.com). The API returns workspaces, studies, surveys, intakes,
    survey, diary and analysis submissions (with a PII option), media, participants, device snapshot and study activity,
    cognitive-task submissions, phone sensor data, Fitbit and Polar data, and can create, update and delete API
    triggers and digital interventions. No SDK. Portal export file formats are not documented.'
