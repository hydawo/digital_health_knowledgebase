- field: retention_terms
  status: stated
  value: Data sync to US servers and are removed from the phone. When the study ends the research team deletes the data
    from MetricWire servers and MetricWire says it keeps no further copies, except that one archival copy may be kept
    where law requires. No fixed retention period is stated.
  confidence: Verified
  sources:
  - url: https://metricwire.com/participant-privacy-policy/
    type: vendor_legal
    quote: When the study is over, the Research Team will delete your data from the MetricWire servers. MetricWire does
      not retain any additional copies of your data on our servers or in the MetricWire Mobile Application.
    retrieved: '2026-10-11'
  - url: https://metricwire.com/participant-privacy-policy/
    type: vendor_legal
    quote: there may be situations where we are obligated to retain one archival copy of your information to allow us to
      comply with laws or respond to legal processes
    retrieved: '2026-10-11'
  - url: https://metricwire.com/participant-privacy-policy/
    type: vendor_legal
    quote: your data are immediately synced to HIPAA-Compliant servers located in the United States and removed from your
      mobile device.
    retrieved: '2026-10-11'
  - url: https://play.google.com/store/apps/datasafety?id=com.metricwire.digitalhealth&hl=en_US
    type: app_store
    quote: App interactions App functionality, Analytics, Advertising or marketing, Personalization
    retrieved: '2026-10-11'
  recheck_by: '2026-11-25'
  note: Deletion at study end depends on the research team acting; nothing says it is automatic. Separately, the Google
    Play data-safety form for Catalyst By MetricWire lists app interactions under "Data shared" for app functionality,
    analytics, advertising or marketing, and personalization. That developer self-declaration sits oddly against the
    participant policy's "no commercial interest" wording and is worth raising with the vendor for IRB review.
