# ---------------- Data access and terms ----------------
- field: raw_streams
  status: stated
  value: 'The Consumer API sensor endpoint lists 31 phone stream types: accelerometer, gyroscope, magnetometer, passive
    location, linear acceleration, pedometer, ambient, gravity, activity types, device information, activity, steps,
    noise, light, mobility, battery, Bluetooth, screen events, messages, calls, apps, app usage, app usage events,
    mobility places/stops/moves, and iOS-specific usage events, usage, calls, messages and light. Wearables: Fitbit (19
    types including intraday heart rate, HRV, breathing rate, SpO2, plus ECG and temperature) and Polar (continuous heart
    rate, training heart rate, sleep and hypnogram, Nightly Recharge HRV and breathing rate). Apple HealthKit and Android
    Health Connect are also integrated. Routes: researcher portal and the Consumer API.'
  confidence: Corroborated
  sources:
