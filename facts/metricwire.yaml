    and daily HRV; Polar daily activity, sleep and Nightly Recharge; HealthKit sleep, steps, exercise, distance). The API
    also lists phone stream types named mobility, mobility places, stops and moves, and activity types, but their
    derivation is not documented. No platform-native feature-extraction documentation found.
  confidence: Reported
