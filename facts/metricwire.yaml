# ---------------- Research access ----------------
- field: research_program
  status: stated
  value: Metricwire Academic Site Licence, an institution-level licence that adds beta programs, academic advisory
    boards, product updates, a dedicated account manager and dedicated engineering support for novel protocols.
  confidence: Verified
  sources:
  - url: https://metricwire.com/site-licence/
    type: vendor_page
    quote: The Metricwire Academic Site Licence program is designed to provide researchers at leading institutions with
      technology solutions that support the future direction of their work and transform their field.
    retrieved: '2026-10-11'
  - url: https://metricwire.com/site-licence/
    type: vendor_page
    quote: As part of the Metricwire site licence, researchers gain access to advanced beta programs, academic advisory
      board(s), up to date product advancements and a dedicated account manager.
    retrieved: '2026-10-11'
  - url: https://metricwire.com/site-licence/
    type: vendor_page
    quote: Site licence partners benefit from dedicated engineering resources to support novel protocol designs and
      leverage unique data sources.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-25'
  note: A separate third-party route exists through Penn State's Survey Research Center, which holds an enterprise
    licence and sub-licenses it (see academic_pricing, scope Penn State SRC).
- field: program_eligibility
