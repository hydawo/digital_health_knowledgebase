  recheck_by: '2026-11-10'
  note: The roadmap card predates the how-to article. It most likely covers a fuller, OpenAPI-style API, but the card
    does not say so, and its To Do status has not been updated since the API article appeared.
- field: user_cap
  status: stated
  value: The free Trial licence has no participant-number limit, but trial data is wiped monthly and the study deleted
    after one year. No caps are published for licensed studies.
  confidence: Verified
  sources:
  - url: https://forum.avicennaresearch.com/t/frequently-asked-questions/5
    type: vendor_docs
    quote: The trial version is free of charge, allowing full access to the default features without any restrictions
      (e.g., number of participants).
    retrieved: '2026-10-11'
  recheck_by: '2026-11-10'
