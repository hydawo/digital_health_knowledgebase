# ---------------- Data access and terms ----------------
- field: raw_streams
  status: stated
  value: 'Raw phone sensors through the Avicenna app (accelerometer, gyroscope, magnetic field, light, pressure, proximity,
    GPS, Wi-Fi, Bluetooth and beacons, battery, screen state, app usage, keyboard, web activity), with many sources
    Android-only; iOS app usage via hourly Screen Time summaries (added 2026-04). Garmin Health SDK raw watch data (25 Hz
    accelerometer, 32 Hz gyroscope, beat-to-beat intervals and more). Apple SensorKit streams including ECG and PPG,
    on approved studies with a custom app. Cloud data from Fitbit, Garmin Health API, Oura, WHOOP, Polar, HealthKit,
    Hexoskin and Mira. Exported via the dashboard, Kibana or the Data Export API.'
  confidence: Verified
  sources:
  - url: https://forum.avicennaresearch.com/t/raw-data/1241
    type: vendor_docs
    quote: 1 Accelerometer 2 Ambient Temperature 3 Gyroscope 4 Gravity 5 Light 6 Linear Acceleration 7 Magnetic Field
    retrieved: '2026-10-11'
  - url: https://forum.avicennaresearch.com/t/raw-data/1241
    type: vendor_docs
    quote: 138 SensorKit ECG 139 SensorKit PPG
    retrieved: '2026-10-11'
  - url: https://forum.avicennaresearch.com/t/garmin-health-sdk/1261
    type: vendor_docs
    quote: Records 25Hz accelerometer data from all three axes in milli-Gs.
    retrieved: '2026-10-11'
  - url: https://forum.avicennaresearch.com/t/sensorkit/1290
    type: vendor_docs
    quote: Access to SensorKit data is limited to research uses and requires a private entitlement, which Apple reviews
      separately for each study.
    retrieved: '2026-10-11'
  - url: https://forum.avicennaresearch.com/t/1512
    type: vendor_page
    quote: which collects hourly Screen Time–based usage summaries
    retrieved: '2026-10-11'
  - url: https://avicennaresearch.com/features/sensor-based-data
    type: vendor_page
    quote: You can access the raw or processed data in real-time
    retrieved: '2026-10-11'
  recheck_by: '2026-11-10'
  note: The full list of data-source IDs is on the Raw Data page. A separate iOS keyboard app, Avicenna Keyboard,
    collects keystroke data (App Store, released 2025-12-16).
- field: derived_metrics
  status: stated
  value: Phone-derived step count and activity type; vendor-computed wearable metrics pulled from cloud accounts (Garmin,
    Fitbit, Oura readiness and sleep, WHOOP recovery, Polar sleep). An Analysis page for data quality, engagement and
    retention (added 2026-03). Kibana and Vega charts in the dashboard. Whether Avicenna still computes GPS mobility
    features is unclear (see note).
  confidence: Verified
  sources:
  - url: https://avicennaresearch.com/features/sensor-based-data
    type: vendor_page
    quote: from raw motion sensors like accelerometer, to processed data such as step count and activity type
    retrieved: '2026-10-11'
  - url: https://forum.avicennaresearch.com/t/raw-data/1241
    type: vendor_docs
    quote: 124 Oura Daily Readiness 125 Oura Daily Sleep
    retrieved: '2026-10-11'
  - url: https://forum.avicennaresearch.com/t/raw-data/1241
    type: vendor_docs
    quote: 58 WHOOP Workout 59 WHOOP Sleep 60 WHOOP Recovery
    retrieved: '2026-10-11'
  - url: https://forum.avicennaresearch.com/t/1508
    type: vendor_page
    quote: We introduced the Analysis page in the researcher dashboard
    retrieved: '2026-10-11'
  recheck_by: '2026-11-10'
  note: A vendor forum reference (forum.avicennaresearch.com/t/1460, dated 2025-12-16, read 2026-10-11) described GPS
    mobility features computed in a nightly batch (daily distance, radius of gyration, location entropy, time at home).
    By 2026-10-19 that topic returned 404 and it is absent from forum search (2026-10-21). The security page says
    "Avicenna does not perform any processing on the data collected for a given study". Ask Avicenna whether the
    feature still exists.
- field: sampling_rates
  status: stated
  value: Phone sensors are polled once per data-collection cycle, every 5 minutes by default, configurable from 1 to
    60 minutes (iOS honours the interval, Android may not). Burst sources sample for a fixed window per cycle (accelerometer
    60 seconds; GPS cycles stay active 60 seconds). Garmin Health SDK accelerometer 25 Hz, gyroscope 32 Hz, heart rate
    or SpO2 configurable from 1 second to 1 hour. SensorKit motion downsampled to 32 Hz. Cloud wearable data is fetched
    daily; Fitbit intraday activity is 1-minute, Garmin Health API 15-minute slices.
  confidence: Verified
  sources:
  - url: https://forum.avicennaresearch.com/t/data-sources/1266
    type: vendor_docs
    quote: Standard (Every 5 minutes) Frequent (Every 2 minutes) Custom (Between 1 and 60 minutes)
    retrieved: '2026-10-11'
  - url: https://forum.avicennaresearch.com/t/data-sources/1266
    type: vendor_docs
    quote: 'Accelerometer: collects data for 60 seconds.'
    retrieved: '2026-10-11'
  - url: https://forum.avicennaresearch.com/t/data-sources/1266
    type: vendor_docs
    quote: Avicenna fetches this data at the end of every day.
    retrieved: '2026-10-11'
  - url: https://forum.avicennaresearch.com/t/location/1255
    type: vendor_docs
    quote: Each collection cycle stays active for 60 seconds, and every reading received during that cycle is saved.
    retrieved: '2026-10-11'
  - url: https://forum.avicennaresearch.com/t/1645
    type: vendor_page
    quote: You can also configure sampling rates for metrics such as heart rate or SpO2 from every 1 second to once
      an hour
    retrieved: '2026-10-11'
  - url: https://forum.avicennaresearch.com/t/sensorkit/1290
    type: vendor_docs
    quote: Data is downsampled to 32Hz (default is 100Hz).
    retrieved: '2026-10-11'
  - url: https://forum.avicennaresearch.com/t/fitbit/1259
    type: vendor_docs
    quote: Offers a snapshot of the user’s activity in 1-minute intervals.
    retrieved: '2026-10-11'
  - url: https://forum.avicennaresearch.com/t/garmin-health-api/1260
    type: vendor_docs
    quote: Garmin Health records are provided in 15-minute time slices.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-10'
- field: history_depth
  status: stated
  value: Data is collected from study participation onward; Fitbit daily summaries dated before the study start are
    excluded. No backfill of pre-enrolment history is documented for any source. SensorKit data becomes exportable
    about 30 hours after collection.
  confidence: Corroborated
  sources:
  - url: https://forum.avicennaresearch.com/t/fitbit/1259
    type: vendor_docs
    quote: If a participant joins mid-day, the summary for that first day is excluded because its timestamp precedes
      the study start.
    retrieved: '2026-10-11'
  - url: https://forum.avicennaresearch.com/t/sensorkit/1290
    type: vendor_docs
    quote: any data collected now will be available for export approximately 30 hours later
    retrieved: '2026-10-11'
  recheck_by: '2026-11-10'
  note: Only the Fitbit exclusion is stated outright; the absence of backfill for other sources is inferred from the
    documentation, hence Corroborated.
- field: export_routes
  status: stated
  value: 'Researcher Dashboard export (ZIP of CSV; GPS also KML/GPX, Bluetooth Beacon also GEXF; the marketing page
    also names JSON), each file downloadable for 7 days. In-dashboard Kibana querying and charts. A Data Export API for
    sensor data: POST to /api/study/export/create/, poll GET /api/v1/filter/export/, header "Authorization: ApiKey
    USERNAME:API_KEY", key issued by support. Direct database access on request (an older forum answer says only for
    self-hosted deployments). Participants can ask support for a machine-readable copy of their own data.'
  confidence: Verified
  sources:
  - url: https://forum.avicennaresearch.com/t/raw-data/1241
