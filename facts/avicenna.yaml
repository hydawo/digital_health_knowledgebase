- field: hosting_options
  status: stated
  value: 'Default: managed cloud service run by Avicenna. White-label option: rebranded apps, with installation ranging
    from in-house data storage to a full on-premises installation of the (closed-source) Avicenna services on the
    customer''s infrastructure, data routed to the customer''s own servers. On-premise deployments are in use: a product
    card plans per-organisation login pages for on-premise subdomains, and the 2026-09-22 Garmin SDK post routes data
    to "an institution''s own Avicenna infrastructure where applicable". Terms and prices are not published.'
