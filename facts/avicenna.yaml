facts:
# ---------------- Research access ----------------
- field: research_program
  status: stated
  value: No separate academic or research program; the platform itself is sold to researchers. Each study starts on
    a free Trial licence (full default features, no participant cap, for testing only) and must be upgraded to a paid
    full licence before field research with real participants.
  confidence: Verified
  sources:
  - url: https://forum.avicennaresearch.com/t/frequently-asked-questions/5
    type: vendor_docs
    quote: The trial version is intended only for test purposes.
    retrieved: '2026-10-11'
  - url: https://forum.avicennaresearch.com/t/frequently-asked-questions/5
    type: vendor_docs
    quote: If you plan to conduct actual field research with real participants, upgrading to the full license is
      necessary.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-10'
- field: program_eligibility
  status: stated
  value: Open self sign-up for a researcher account (name, organization, email, password; email must be verified before
    a study can be created). The privacy policy defines a Researcher as someone affiliated with an academic institution,
    and the terms require account holders to be at least 18. Whether non-academic customers are excluded is not stated,
    and the homepage markets clinical-trial use.
  confidence: Corroborated
  sources:
  - url: https://forum.avicennaresearch.com/t/step-1-create-a-researcher-account/1160
    type: vendor_docs
    quote: a page in which you can enter some basic information including your name, organization, email address,
      and password
    retrieved: '2026-10-11'
  - url: https://forum.avicennaresearch.com/t/step-1-create-a-researcher-account/1160
    type: vendor_docs
    quote: given that your email address is not verified yet, you are not allowed to create a study or modify the
      features of the dashboard
    retrieved: '2026-10-11'
  - url: https://avicennaresearch.com/legal
    type: vendor_legal
    quote: is a researcher affiliated with an academic institution who uses Avicenna Research to design and conduct
      scientific studies
    retrieved: '2026-10-11'
  - url: https://avicennaresearch.com/legal
    type: vendor_legal
    quote: declares that he or she is at least eighteen (18) years of age
    retrieved: '2026-10-11'
  - url: https://avicennaresearch.com/
    type: vendor_page
    quote: Patient-centric Clinical Trial and Health Research Software Platform
    retrieved: '2026-10-11'
  recheck_by: '2026-11-10'
  note: Corroborated rather than Verified because the published sign-up flow and the privacy-policy definition point
    different ways on whether academic affiliation is required.
- field: program_application
  status: stated
  value: Self-serve sign-up creates Trial studies. Moving a study from Trial to Licensed is done by emailing support
    with the study ID; a demo can be booked. No review or approval criteria are published. Studies using Apple SensorKit
    also need a per-study Apple entitlement, applied for by the institution, for which Avicenna builds a separate app.
  confidence: Verified
  sources:
  - url: https://forum.avicennaresearch.com/t/frequently-asked-questions/5
    type: vendor_docs
    quote: To upgrade your study from Trial to Licensed, you can contact us directly via email at support@avicennaresearch.com
      and send your study ID.
    retrieved: '2026-10-11'
  - url: https://forum.avicennaresearch.com/t/sensorkit-approval/1563
    type: vendor_docs
    quote: Apple reviews every request and grants the entitlement for a single study and a single app
    retrieved: '2026-10-11'
  - url: https://forum.avicennaresearch.com/t/sensorkit-approval/1563
    type: vendor_docs
    quote: Build the study app and assign the Bundle ID
    retrieved: '2026-10-11'
  recheck_by: '2026-11-10'
- field: program_status
  status: stated
  value: Active. Self sign-up and the free Trial are open and weekly release notes continue (latest read 2026-10-06).
    Renamed from Ethica Data to Avicenna Research in 2023-2024; the Ethica name was to be dropped by July 2024.
  confidence: Verified
  sources:
  - url: https://forum.avicennaresearch.com/t/weekly-release-notes-2026-10-06/2188
    type: vendor_docs
    quote: This week’s release improves participant invitations with CSV import and new options for each invitee
