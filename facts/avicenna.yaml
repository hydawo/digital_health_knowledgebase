- field: retention_terms
  status: stated
  value: After contract termination Avicenna keeps data for at least two years unless immediate deletion is requested,
    then deletes it unless law requires retention. Trial-licence study data is wiped monthly and the study deleted after
    a year. Export files are deleted after 7 days. Participants can delete all or part of their data at any time.
  confidence: Verified
  sources:
  - url: https://avicennaresearch.com/legal
    type: vendor_legal
