- field: developer_program_status
  status: stated
  value: No public self-serve developer program. A Data Export API exists and is documented in a how-to article (posted
    2026-02-09); researchers request an API key from support, tied to their researcher account. There is no full API
    reference. A Product Ideas card "Export Data with API" (2025-09-29), to follow "OpenAPI Compatible APIs", is still
    filed under To Do.
  confidence: Verified
  sources:
  - url: https://forum.avicennaresearch.com/t/how-to-export-study-data-using-the-api/1496
    type: vendor_docs
    quote: Contact Avicenna Support to request an API key for your researcher account.
