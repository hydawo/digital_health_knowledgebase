    retrieved: '2026-10-11'
  - url: https://m-path.io/manual/knowledge-base/wearables-garmin-direct-integration/
    type: vendor_docs
    quote: Raw gyroscope at 32Hz. Not configurable.
    retrieved: '2026-10-11'
  - url: https://m-path.io/manual/knowledge-base/wearables/
    type: vendor_docs
    quote: Through the Thryve platform , m-Path supports most commercial wearables, including Garmin, Fitbit, Apple and
      Polar.
    retrieved: '2026-10-11'
  - url: https://m-path.io/manual/knowledge-base/wearables/
