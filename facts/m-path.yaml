facts:
# ---------------- Research access ----------------
- field: research_program
  status: stated
  value: No separate research or academic program. Research use runs on the research licences themselves (Free,
    Essential, Standard, Comfort), sold on a page titled "Research & Academic Licenses", with paid add-ons, consulting
    and a first-ESM-study support package. The research page claims 1000+ researchers, 150+ institutions and 90000+
    participants (vendor figures).
  confidence: Verified
  sources:
  - url: https://m-path.io/pricing/
    type: vendor_page
    quote: m-Path Pricing | Research & Academic Licenses
    retrieved: '2026-10-11'
  - url: https://m-path.io/manual/knowledge-base/subscriptions-and-billing/
    type: vendor_docs
    quote: m-Path offers four subscription plans designed to support different types of research projects.
    retrieved: '2026-10-11'
  - url: https://m-path.io/landing/research/
    type: vendor_page
    quote: Institutions 150+
    retrieved: '2026-10-11'
  recheck_by: '2026-11-25'
  note: Operated by m-Path Software BV (Leuven), which the about page describes as a 2024 spin-off of KU Leuven's
    Faculty of Psychology. The research page no longer carries the "250+ Universities" figure the profile cites; the
    usage counts are vendor claims (Reported strength).
- field: program_eligibility
  status: stated
  value: Anyone can open a free dashboard account; paid subscriptions are optional and no eligibility criteria are
    published for them. Individual practitioners (therapy use) get the basic version free. Participants aged 13 to 16
    need a parent's or guardian's consent, subject to national law.
  confidence: Verified
  sources:
  - url: https://m-path.io/manual/knowledge-base/create-an-online-dashboard-account/
    type: vendor_docs
    quote: A researcher or practitioner can always create an account for free.
    retrieved: '2026-10-11'
