# ---------------- Data access and terms ----------------
- field: raw_streams
  status: stated
  value: 'Phone, continuous (Sensing full, m-Path Sense app, CARP-based): location, device, weather, pedometer, activity,
    screen (Android), battery, app usage (Android), connectivity, Wi-Fi, periodic accelerometer features, light (Android),
    memory (Android); a vendor comparison page also lists gyroscope, Bluetooth and anonymised call and text data. JSON
    files go straight to the researcher''s cloud. Phone, in-survey (Sensing lite): location, noise level, step count,
    app usage (Android; iOS only with a study-specific SensorKit app), nearby Bluetooth, audio, photo, video. m-Path
    Keyboard: keystroke and typing data sent to the researcher. Wearables: direct Garmin gives heart rate down to 1 s,
    all beat-to-beat intervals, raw accelerometer 25 Hz and gyroscope 32 Hz, plus SpO2, stress, respiration and skin
    temperature; Garmin, Fitbit, Apple Health and Polar via Thryve at lower resolution. Empatica, movisens and ActiGraph
    are not integrated.'
  confidence: Verified
  sources:
  - url: https://m-path.io/manual/knowledge-base/mobile-sensing-full/
    type: vendor_docs
    quote: All sensor data is immediately uploaded to the cloud provider of the researcher.
    retrieved: '2026-10-11'
  - url: https://m-path.io/manual/knowledge-base/mobile-sensing-full/
    type: vendor_docs
    quote: m-Path uses the CARP open source package to gather sense data.
    retrieved: '2026-10-11'
  - url: https://m-path.io/manual/knowledge-base/full-sensing-vs-sensing-lite-which-do-you-need/
    type: vendor_docs
    quote: Call and text data (cryptographically anonimized)
    retrieved: '2026-10-11'
  - url: https://m-path.io/manual/knowledge-base/full-sensing-vs-sensing-lite-which-do-you-need/
    type: vendor_docs
    quote: GPS location (at this moment) App usage data (of the last day) Step count data (since last boot) Noise level
      (at this moment) Nearby bluetooth devices (at this moment) Audio/Picture/Video recording (as an answer to a question)
    retrieved: '2026-10-11'
  - url: https://m-path.io/manual/knowledge-base/mobile-sensing-lite-version/
    type: vendor_docs
    quote: By default, app usage only works on Android. It is possible to collect app usage on iOS, but this requires
      a new, study-specific app that includes Apple’s SensorKit features.
    retrieved: '2026-10-11'
  - url: https://m-path.io/manual/knowledge-base/m-path-keyboard/
    type: vendor_docs
    quote: sent directly to the researcher, bypassing MPath servers entirely
    retrieved: '2026-10-11'
