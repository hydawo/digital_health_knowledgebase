    retrieved: '2026-10-11'
  - url: https://m-path.io/terms-and-conditions/
    fetch_url: https://m-path.io/LegalPage/terms.html
    type: vendor_legal
    quote: The grant of this access and use right does not include the right to use the m-Path Services to provide services
