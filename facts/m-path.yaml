  recheck_by: '2026-11-25'
  note: The sensing-full sensor table lists screen, app usage, light and memory as Android only, and does not list
    gyroscope or call and text data, which the comparison page does; per-stream iOS and Android parity is not fully
    stated. The Module 3 Niemeijer profile says calls and SMS were left out of the Play Store build of m-Path Sense;
    current docs give no such caveat. The which-integration page names Garmin, Fitbit and Apple Health for Thryve; the
    wearables page adds Polar.
- field: derived_metrics
  status: stated
  value: Phone accelerometer comes as window summary features (means, SDs, energy and so on), not raw samples, and
    light as lux summaries; activity type with confidence. Thryve wearables include computed measures such as sleep
    scores, sleep stages and daily summaries. The m-Path keyboard derives sentiment and typing behaviour without storing
    raw text. Dashboard visualisations and compliance monitoring; R packages mpathr and mpathsenser for processing.
  confidence: Verified
  sources:
  - url: https://m-path.io/manual/knowledge-base/mobile-sensing-full/
    type: vendor_docs
    quote: This is a summary of all accelerometer data collected from sensorStartTime to sensorEndTime.
    retrieved: '2026-10-11'
  - url: https://m-path.io/manual/knowledge-base/which-wearable-integration-is-right-for-my-project/
    type: vendor_docs
    quote: Thryve provides higher-level computed measures such as sleep scores, sleep stages, and daily activity summaries
      that are derived from raw sensor data.
    retrieved: '2026-10-11'
  - url: https://m-path.io/mobile-sensing/
