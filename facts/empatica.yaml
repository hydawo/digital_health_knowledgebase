  status: stated
  scope: Academic & Basic Research plan
  value: One Care Lab Portal account with 1 study, 1 site, 1 study manager and up to 1000 participants. The sensor
    mode is fixed per account, so a protocol needing two modes needs two accounts
  confidence: Verified
  sources:
  - url: https://www.empatica.com/platform/research-studies/
    type: vendor_page
    retrieved: '2026-10-10'
    quote: This allows the creation of 1 Study, 1 Site and 1000 participants.
  - url: https://www.empatica.com/store/platform-professional/
