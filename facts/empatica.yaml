# ---------------- research access ----------------
- field: research_program
  status: stated
  value: 'Academic & Basic Research plan of the Empatica Health Monitoring Platform: EmbracePlus or EmbraceMini
    bundled with 3 or 5 years of Care Lab App, Care Lab Portal and Empatica Cloud data access, sold self-serve.
    A separate Enterprise plan serves large clinical trials with dedicated services'
  confidence: Verified
  sources:
  - url: https://academic-support.empatica.com/hc/en-us/articles/36980797675549-Available-Features
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: 'The Platform features two different plans: Academic & Basic Research or enterprise The two plans differ
      and are attributed to studies based on their size and nature.'
  - url: https://www.empatica.com/store/platform-professional/
    type: vendor_page
    retrieved: '2026-10-10'
    quote: Empatica Cloud data access for your selected bundle duration (3 or 5 years) Care Lab Portal access for
      study management and data visualization for your selected bundle duration (3 or 5 years)
  - url: https://www.empatica.com/platform/research-studies/
    type: vendor_page
    retrieved: '2026-10-10'
    quote: Empatica Health Monitoring Platform for Academic Research Access comprehensive raw data, EDA, vital signs,
      activity and more, in one wearable solution.
  recheck_by: '2026-11-09'
  note: Institutional deals outside the store plan exist (for example Boston University's MODES study with EmbraceMini,
    2026, and the BARDA-funded PROJECT REMOTE with Allucent, 4,000 participants on EmbracePlus via the Cloud API,
    2024) but are deployments, not a program anyone can join.
- field: program_eligibility
  status: stated
  value: Academic Subscriptions are limited to educational institutions and qualified non-profit research organizations,
    used by their own staff or students for non-commercial teaching and research. The 25% academic discount code
    needs a university institutional email. The platform as a whole is sold to not-for-profit and for-profit research
    institutions; Enterprise qualification is decided with sales
  confidence: Verified
  sources:
  - url: https://www.empatica.com/purchase-agreement/
    type: vendor_legal
    retrieved: '2026-10-10'
    quote: such as educational institutions or qualified non-profit organizations that are organized and operated
      exclusively for the purpose of education or research
  - url: https://www.empatica.com/purchase-agreement/
    type: vendor_legal
    retrieved: '2026-10-10'
    quote: 'Use of the Empatica Health Monitoring Platform pursuant to an Academic Subscription is limited as follows:
      (i) Users must be employed by, or enrolled in a course of academic study at, the Academic Institution'
  - url: https://lp.empatica.com/academic-discount-professional-plan
    type: vendor_page
    retrieved: '2026-10-10'
    quote: Only University institutional email addresses will be considered.
  - url: https://www.empatica.com/privacy-participant
    type: vendor_legal
    retrieved: '2026-10-10'
    quote: EHMP products are exclusively sold to researchers belonging to not-for-profit research institutions (like
      hospitals and universities) and for-profit research institutions (like pharmaceutical companies)
  - url: https://academic-support.empatica.com/hc/en-us/articles/36980797675549-Available-Features
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: Speak with our Sales Team to understand if you qualify for our Enterprise Plan.
  recheck_by: '2026-11-09'
- field: program_application
  status: stated
  scope: Academic & Basic Research plan
  value: No application review. Buy through the online store (recommended for 30 devices or fewer) or through sales;
    the subscription activates on shipment and the Care Lab Portal account is self-registered. The academic discount
    code is requested by form; Pay Later orders wait on purchase-order verification
  confidence: Verified
  sources:
  - url: https://academic-support.empatica.com/hc/en-us/articles/36980797675549-Available-Features
    type: vendor_docs
    retrieved: '2026-10-10'
