# ---------------- data access and terms ----------------
- field: raw_streams
  status: stated
  scope: EmbracePlus
  value: Accelerometer, gyroscope (gyroscope modes only), blood volume pulse (PPG), EDA, skin temperature, systolic
    peaks (IBI), steps and user tags, delivered as Avro files in the Empatica S3 bucket. Which streams are recorded
    depends on the sensor mode (PPG and EDA only in Pulse Rate Pro and Actigraphy Pro)
  confidence: Verified
  sources:
  - url: https://academic-support.empatica.com/hc/en-us/articles/36981046788765-Raw-Data-in-the-Empatica-Cloud
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: 'Raw data streams contained within Empatica''s Avro files are the following: Accelerometer Blood Volume Pulse
      ElectroDermal Activity (EDA) Gyroscope Steps Systolic Peaks Tags'
  - url: https://academic-support.empatica.com/hc/en-us/articles/36981046788765-Raw-Data-in-the-Empatica-Cloud
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: High-frequency raw data is delivered in Avro format.
  - url: https://academic-support.empatica.com/hc/en-us/articles/36980797675549-Available-Features
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: Systolic Peaks (IBI)
  - url: https://www.empatica.com/platform/research-studies/
    type: vendor_page
    retrieved: '2026-10-10'
    quote: 'Accelerometer and gyroscope: Raw acceleration and angular velocity data, with the gyroscope enabled in
      selected sensor modes'
  recheck_by: '2026-11-09'
- field: raw_streams
  status: stated
  scope: EmbraceMini
  value: Accelerometer, gyroscope (gyroscope modes only), ambient light, steps and user tags. No PPG, EDA or temperature.
    No magnetometer stream is offered to researchers
  confidence: Verified
  sources:
  - url: https://www.empatica.com/blog/embracemini-is-now-available-for-academic-and-basic-research-plan/
    type: vendor_page
    retrieved: '2026-10-10'
