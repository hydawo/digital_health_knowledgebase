- field: developer_program_status
  status: stated
  scope: Academic & Basic Research plan
  value: No developer program and no SDK for academic research. Data access is by file download from the Care Lab
    Portal and the S3 bucket
  confidence: Verified
  sources:
  - url: https://www.empatica.com/platform/research-studies/
    type: vendor_page
    retrieved: '2026-10-10'
    quote: We do not provide an SDK for academic research purposes.
  recheck_by: '2026-11-09'
- field: developer_program_status
  status: stated
  scope: Enterprise, clinical trial sponsors and remote patient monitoring
  value: No open developer program. A Cloud API, with developer documentation given to clients, is sold through
    sales to clinical trial sponsors and CROs. A remote-patient-monitoring page still describes a plug-and-play SDK
    for building a patient app, with no public documentation or sign-up
  confidence: Corroborated
  sources:
  - url: https://www.empatica.com/cloud-api
    type: vendor_page
    retrieved: '2026-10-10'
    quote: All Cloud API clients will be provided with full developer documentation.
  - url: https://www.empatica.com/cloud-api
    type: vendor_page
    retrieved: '2026-10-10'
    quote: If you’re a clinical trial sponsor or CRO looking to integrate our set of APIs into your existing platform,
      our team is here to help.
  - url: https://www.empatica.com/platform/remote-patient-monitoring/
    type: vendor_page
    retrieved: '2026-10-10'
    quote: Use the Empatica Health Monitoring Platform SDK to create a patient app that collects and streams EmbracePlus
      data to your infrastructure.
  recheck_by: '2026-11-09'
  note: 'Judge decision, 2026-10-10: the "no SDK" and "SDK" statements are not a conflict, because they describe
    different offers. The research-studies page limits its denial to academic research; the remote-patient-monitoring
    page (live and in the sitemap, though not in the main navigation) describes an SDK for patient apps outside the
    research plans. Corroborated, not Verified, because nothing shows the SDK is still offered to new customers.
    The E4 SDK is gone (see deprecations).'
