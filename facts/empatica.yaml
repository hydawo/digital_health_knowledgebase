    quote: Study setup 1 study 1 site 1 study manager Up to 1000 participants
  - url: https://academic-support.empatica.com/hc/en-us/articles/38901007393053-What-is-a-Sensor-Mode
    type: vendor_docs
    retrieved: '2026-10-10'
