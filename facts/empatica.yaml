  recheck_by: '2026-11-09'
- field: user_cap
  status: stated
  scope: Enterprise plan
  value: Minimum order of 100 devices; no published participant cap
  confidence: Verified
  sources:
  - url: https://academic-support.empatica.com/hc/en-us/articles/36980797675549-Available-Features
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: 'Speak with our Sales Team to understand if you qualify for our Enterprise Plan. *MOQ: 100 devices'
  recheck_by: '2026-11-09'
- field: academic_vs_commercial
  status: stated
  value: 'Academic & Basic Research: self-serve, 25% discount, 1 study and 1 site, no dedicated account manager,
    no SDK, non-commercial use only. Until 16 September 2026 it offered EmbracePlus in one mode only (now Pulse
    Rate Pro). Enterprise: large clinical trials, 100-device minimum, multiple studies and sites, IRB support, audit
    trails, Cloud API, quoted pricing, and third-party algorithms such as the McRoberts set'
  confidence: Verified
  sources:
  - url: https://academic-support.empatica.com/hc/en-us/articles/36980797675549-Available-Features
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: Designed with smaller research studies in mind. For example, an academic study that does not require
      dedicated Account Manager support.
  - url: https://academic-support.empatica.com/hc/en-us/articles/36980797675549-Available-Features
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: For example, a clinical trial that requires one-on-one support with IRB submissions, audit trails, and
      custom materials for global studies.
  - url: https://www.empatica.com/purchase-agreement/
    type: vendor_legal
    retrieved: '2026-10-10'
    quote: Academic Subscriptions may not be used for commercial, professional, or productive purposes, for commercial
      training, or for any other for-profit purposes.
  - url: https://www.empatica.com/platform/clinical-trials/
    type: vendor_page
    retrieved: '2026-10-10'
    quote: Manage multiple studies and sites through a secure online portal
  - url: https://www.empatica.com/blog/embracemini-is-now-available-for-academic-and-basic-research-plan/
    type: vendor_page
    retrieved: '2026-10-10'
    quote: 'Previously, the Academic & Basic Research Plan offered EmbracePlus in a single configuration, focused
      on cardiac activity: the mode now designated Pulse Rate Pro.'
  - url: https://www.empatica.com/blog/empatica-and-mcroberts-partnership-achieves-20-endpoints-and-opens-platform-to-external-algorithm-developers/
    type: vendor_page
    retrieved: '2026-10-10'
    quote: The McRoberts algorithms are available to all Enterprise plan users of the Empatica Health Monitoring
      Platform.
  recheck_by: '2026-11-09'
  note: The academic Gyroscope 100 mode computes no activity biomarkers but its raw data are described as compatible
    with the McRoberts and Mobilise-D libraries, so academics can run those algorithms themselves.
