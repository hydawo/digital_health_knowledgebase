# ---------------- research access ----------------
- field: research_program
  status: stated
  value: 'Investigator Support Program: Apple devices (mostly Apple Watch; Apple Vision Pro and AirPods Pro where
    available) and app development resources, including the Study App Template, for approved studies. No funding.'
  confidence: Verified
  sources:
  - url: https://www.researchandcare.org/investigator-support-program/
    type: vendor_page
    retrieved: '2026-10-10'
    quote: The program provides researchers with the opportunities to receive Apple devices to use in their research
      studies, as well as access to app development resources to enhance their projects.
  - url: https://www.researchandcare.org/investigator-support-program/
    type: vendor_page
    retrieved: '2026-10-10'
    quote: The Investigator Support Program does not provide study sponsorship or funding.
  - url: https://www.researchandcare.org/faq/
    type: vendor_page
    retrieved: '2026-10-10'
    quote: The Investigator Support Program most commonly focuses on Apple Watch devices. Apple Vision Pro and AirPods
      Pro can now be requested through this program where available.
  - url: https://pmc.ncbi.nlm.nih.gov/articles/PMC13438180/
    type: paper
    retrieved: '2026-10-24'
    quote: Apple has multiple partnerships with the research community, including an Investigator Support Program
      that provides free devices.
  recheck_by: '2026-11-09'
  scope: Investigator Support Program
- field: research_program
  status: stated
  value: 'Study App Template: Apple study app for approved applicants, free, needing little or no coding; exports
    encrypted data to the researcher''s servers'
  confidence: Verified
  sources:
  - url: https://www.researchandcare.org/resources/study-app-template/
    type: vendor_page
    retrieved: '2026-10-10'
    quote: Available at no cost for approved applicants so you can focus on what truly matters
  - url: https://www.researchandcare.org/investigator-support-program/
    type: vendor_page
    retrieved: '2026-10-10'
    quote: Using Study App Template, minimal to no coding experience is required to build a study data collection
      app.
  recheck_by: '2026-11-09'
  scope: Study App Template
- field: research_program
  status: stated
  value: 'SensorKit: research-only framework exposing extra iPhone and Apple Watch data types (including PPG, ECG,
    accelerometer, keyboard, phone and messages usage, visits) through a private entitlement reviewed per study'
  confidence: Verified
  sources:
  - url: https://www.researchandcare.org/faq/
    type: vendor_page
    retrieved: '2026-10-10'
    quote: The SensorKit framework makes additional data types available for research use through an entitlement.
  - url: https://www.researchandcare.org/resources/accessing-sensorkit-data/
    type: vendor_page
    retrieved: '2026-10-10'
    quote: Access to these data types is limited to research uses and requires an app to have a private entitlement,
      which is reviewed separately for each study.
  recheck_by: '2026-11-09'
  scope: SensorKit
- field: research_program
  status: stated
  value: 'HealthKit Research Entitlement (iOS 27.1+): removes the 30-day history limit option from new HealthKit
    permission requests and reduces access reminders for health research apps. It does not gate access to data types.'
  confidence: Verified
  sources:
  - url: https://www.researchandcare.org/resources/healthkit-research-entitlement/
    type: vendor_page
    retrieved: '2026-10-10'
    quote: 'If granted, this entitlement will do two things: 1) New HealthKit permission requests will not include
      the option to limit historical data to 30 days and 2) the entitlement will reduce the number of reminders study
      participants receive.'
  - url: https://www.researchandcare.org/resources/healthkit-research-entitlement/
    type: vendor_page
    retrieved: '2026-10-10'
    quote: HealthKitResearch requires iOS 27.1 or later.
  - url: https://www.researchandcare.org/faq/
    type: vendor_page
    retrieved: '2026-10-10'
    quote: No this entitlement does not gate access to HealthKit data types.
  recheck_by: '2026-11-09'
  scope: HealthKit Research Entitlement
- field: research_program
  status: stated
