- field: raw_streams
  status: stated
  scope: Google Health API
  value: No raw PPG, accelerometer, gyroscope or EDA streams are documented. The only raw signal is single-lead ECG waveform
    voltage samples per on-demand reading (ecg.readonly scope). Finest continuous stream is heart-rate samples at 1-second
    storage resolution; exercise GPS comes as TCX. Devices sync only with the Google Health app, and third parties read from
    the cloud after sync.
  confidence: Corroborated
  sources:
  - url: https://developers.google.com/health/data-types/vitals
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: Single-lead ECG session results, containing a classification ( SINUS_RHYTHM , ATRIAL_FIBRILLATION , INCONCLUSIVE
      ), average heart rate, sampling frequency, and raw waveform voltage samples.
  - url: https://developers.google.com/health/data-types
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: 'Heart Rate dataType: heart-rate filter parameter: heart_rate Record type: Sample Storage resolution: 1 second'
  - url: https://developers.google.com/health/data-types
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: Fitbit devices can't communicate directly with third-party applications or services.
  - url: https://developers.google.com/health/release-notes
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: 'Location : GPS data based on a recorded exercise exposed in TCX format'
  recheck_by: '2026-11-25'
  note: Absence of raw PPG and accelerometry is read from the full data-types list and scopes, not stated outright. ECG waveform
    access not tested with a real pull.
