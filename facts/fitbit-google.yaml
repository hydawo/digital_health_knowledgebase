- field: history_depth
  status: stated
  scope: Google Health API
  value: All recorded history, with no API limit; rollup and daily rollup queries are capped at 14 or 90 days per request
    depending on type.
  confidence: Verified
  sources:
  - url: https://developers.google.com/health/endpoints
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: You can query a user's data as far back as it has been recorded; the API imposes no limitations or restrictions
      on the amount of historical data your application can consume.
  - url: https://developers.google.com/health/endpoints
    type: vendor_docs
