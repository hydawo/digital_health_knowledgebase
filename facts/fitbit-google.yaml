facts:
- field: research_program
  status: stated
  value: No named research program or academic tier. Research through the Google Health API runs under the Google Health API
    User Data and Health Research Policy, which designates approved apps Health Research Applications or Web Services. The
    Google Health published-studies page links a "Research Application" form, and the Google Health Enterprise (formerly Fitbit
    Enterprise) sales form lists "Researcher" as an organization type; neither publishes terms.
  confidence: Verified
  sources:
  - url: https://developers.google.com/health/policies/health-api-user-data-and-research-policy
    type: vendor_legal
    retrieved: '2026-10-10'
    quote: Fitbit approved applications and web services using the Google Health API for health research will be labeled Health
      Research Applications or Health Research Web Services
  - url: https://healthapp.google/published-studies
    type: vendor_page
    retrieved: '2026-10-10'
    quote: Want to run a research study with our devices and platform? Research Application
  - url: https://healthapp.google/enterprise-solutions/
    type: vendor_page
    retrieved: '2026-10-10'
    quote: Google Health Enterprise, formerly Fitbit Enterprise, is a digital health solution that helps organizations improve
      health outcomes at scale.
  - url: https://healthapp.google/enterprise-contact
    type: vendor_page
    retrieved: '2026-10-10'
    quote: Health Plan Clinical Care Partner Wellness Partner Health System Employer Broker/Consultant Researcher
  recheck_by: '2026-11-25'
  note: 'The research application form (forms.gle) needs a Google sign-in and was not read. healthsolutions.fitbit.com/research/
    and the former enterprise researcher pages redirect to the Google Health Enterprise page, which has no researcher section
    (curl, 2026-10-10). Historical: the Fitbit Health Equity Research Initiative with Fitabase (2021, six awardees) had no
    later round found; https://fitabase.com/blog/post/announcing-the-awardees-of-the-fitbit-health-equity-research-initiative/'
- field: program_eligibility
  status: stated
  value: Human subjects research only if submitted to, reviewed or approved by an independent review board (IRB, EC or equivalent).
    Research apps must confirm each participant is eligible before consent. No restriction by organization type is published.
  confidence: Verified
  sources:
  - url: https://developers.google.com/health/policies/health-api-user-data-and-research-policy
    type: vendor_legal
    retrieved: '2026-10-10'
    quote: The Google Health API may only be used for human subjects research, referred to as health research in this policy,
      if the research is submitted for review, reviewed or approved by an independent board
  - url: https://developers.google.com/health/policies/health-api-user-data-and-research-policy
    type: vendor_legal
    retrieved: '2026-10-10'
    quote: Health Research Applications and Web Services must confirm the eligibility of a participant before obtaining informed
      consent and requesting permission to access participant
  recheck_by: '2026-11-25'
  note: 'Operational constraint: Google Health cannot be linked to a Google Workspace account, so institution-managed Workspace
    accounts cannot serve as provisioned participant accounts (see deprecations).'
- field: program_application
  status: stated
  value: 'Health Research Attestation: intake form, IRB/EC approval or waiver letter, IRB/EC accreditation, and the exact
    data requested with rationale. Separately, any restricted-scope app above 100 users needs OAuth app verification and a
    CASA security assessment. Under the legacy Fitbit Web API, Fitbit''s clinical research team reviewed the intake form,
    usually within 7 business days.'
  confidence: Verified
  sources:
  - url: https://developers.google.com/health/policies/health-api-user-data-and-research-policy
    type: vendor_legal
    retrieved: '2026-10-10'
    quote: 'Health Research Applications and Web Services must submit: A completed intake form IRB/EC (or substantially similar
      equivalent) Approval/Waiver Letter IRB/EC (or substantially similar equivalent) Accreditation Exact data requested and
      rationale for use'
  - url: https://developers.google.com/health/app-verification
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: 'The verification process has two parts: OAuth app verification'
  - url: https://dev.fitbit.com/legal/health-research-policy-faq/
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: clinical research team will review your submission and contact you, usually within 7 business days
  recheck_by: '2026-11-25'
  note: No review time is published for the Google Health API attestation; the 7-day figure is from the legacy Fitbit FAQ.
- field: program_status
  status: stated
  value: The Health Research Policy has been in force since March 24, 2026. The About page no longer says Google is not
    onboarding new Google Health API projects (the sentence was removed between 2026-10-12 and 2026-10-19) and now invites
    developers to get started; Google has not announced a reopening. The legacy Fitbit Web API turns off November 2, 2026
    (moved from October 30 on 2026-10-23).
    A research application form is still linked from the published-studies page; what it leads to is not published.
  confidence: Corroborated
  sources:
  - url: https://developers.google.com/health/policies/health-api-user-data-and-research-policy
    type: vendor_legal
    retrieved: '2026-10-10'
    quote: Effective as of March 24, 2026
  - url: https://developers.google.com/health/about
    type: vendor_docs
    retrieved: '2026-10-21'
    quote: Like what you see? Get started now
  - url: https://healthapp.google/published-studies
    type: vendor_page
    retrieved: '2026-10-10'
    quote: Want to run a research study with our devices and platform? Research Application
  recheck_by: '2026-11-25'
- field: developer_program_status
  status: stated
  scope: Google Health API
  value: Launched March 24, 2026. Apparently open to new projects again. On 2026-10-10 the About page said Google was "not
    onboarding new projects at this time"; by 2026-10-19 that sentence was gone and the page invites developers to "Get started
    now". Google has not announced the change (release notes checked to October 14, 2026). Every scope is Restricted and needs
    Google's privacy and security review, so approval is not automatic.
  confidence: Corroborated
  sources:
  - url: https://developers.google.com/health/about
    type: vendor_docs
    retrieved: '2026-10-21'
    quote: Like what you see? Get started now
  - url: https://developers.google.com/health/about
    type: vendor_docs
    retrieved: '2026-10-21'
    quote: All Google Health API scopes are categorized as Restricted, necessitating a privacy and security review for access.
  - url: https://developers.google.com/health/release-notes
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: Google Health API Launch Announcement The Google Health API is the next generation of the Fitbit Web API
  - url: https://trust.validic.com/incidents/8lzmtg20hp90
    type: secondary
    retrieved: '2026-10-10'
    quote: Switching to Google Health is no small task. It requires a new Google Cloud project, credentials, OAuth verification
      from Google
  recheck_by: '2026-11-25'
  note: The profile dates availability to late May 2026; the release notes date the launch announcement to March 24, 2026.
    May 26 added ECG and IRN scopes, rate limits and verification content. Who exactly Google is onboarding is not stated
    (Unclear).
- field: developer_program_status
  status: stated
  scope: Legacy Fitbit Web API
  value: 'Being turned down: support ended September 30, 2026, the API and the Fitbit OAuth endpoints turn off November 2,
    2026 (Google moved the date from October 30 on 2026-10-23), and new registrations are closed (integrator report).'
  confidence: Verified
  sources:
  - url: https://developers.google.com/health/about
    type: vendor_docs
    retrieved: '2026-10-30'
    quote: 'November 2, 2026 (API turn-off): The Fitbit Web API and Fitbit OAuth endpoints will be turned off and will no longer
      function or sync data to or from Fitbit users.'
  - url: https://dev.fitbit.com/build/reference/web-api/intraday/
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: On October 30, 2026, the Fitbit Web API will be turned off and will no longer function or sync data to or from
      Fitbit users.
  - url: https://openwearables.io/blog/fitbit-web-api-shutdown-2026-migration-guide
    type: secondary
    retrieved: '2026-10-10'
    quote: New developer registrations are closed. If you do not already have Fitbit API credentials, you cannot get them.
  recheck_by: '2026-11-25'
  note: The closed-registration point is from one integrator only (Reported). The dev.fitbit.com intraday page still said
    October 30 on 2026-10-30; Google's About page (last updated 2026-10-23) is newer and governs.
- field: user_cap
  status: stated
  scope: Google Health API
  value: Unverified apps are limited to 100 users (250 QPS in total); OAuth verification plus a CASA security assessment lifts
    the cap.
  confidence: Verified
  sources:
  - url: https://developers.google.com/health/app-verification
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: If your app isn't verified, it's limited to 100 users. To support more users, you must complete the verification
      process.
  - url: https://developers.google.com/health/rate-limits
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: 'Unverified applications : Max 250 QPS total (capped at 100 users @ 2.5 QPS per user)'
  - url: https://trust.validic.com/incidents/8lzmtg20hp90
    type: secondary
    retrieved: '2026-10-10'
    quote: Until CASA is completed, you are limited by Google to 100 connected users with your production Google Health credentials.
  recheck_by: '2026-11-25'
  note: Internal-use apps skip the cap only for users inside the Workspace or Cloud Identity organization (support.google.com/cloud/answer/13464323),
    which excludes typical study participants.
- field: academic_vs_commercial
  status: stated
  scope: Legacy Fitbit Web API
  value: Intraday access to other users' data was granted case by case; non-profit research and personal projects were favoured,
    commercial apps got thorough review.
  confidence: Verified
  sources:
  - url: https://dev.fitbit.com/build/reference/web-api/intraday/
    type: vendor_docs
    retrieved: '2026-10-10'
    quote: Fitbit is very supportive of non-profit research and personal projects. Commercial applications require thorough
      review and are subject to additional requirements.
  recheck_by: '2026-11-25'
  note: Moot after November 2, 2026.
- field: academic_vs_commercial
  status: not_public
  scope: Google Health API
  confidence: Verified
  sources:
  - url: https://developers.google.com/health/about
    type: vendor_docs
    retrieved: '2026-10-10'
  - url: https://developers.google.com/health/app-verification
    type: vendor_docs
    retrieved: '2026-10-10'
  - url: https://developers.google.com/health/policies/health-api-user-data-and-research-policy
    type: vendor_legal
    retrieved: '2026-10-10'
  - url: https://developers.google.com/health/policies/health-api-developer-user-data-policy
    type: vendor_legal
    retrieved: '2026-10-10'
  recheck_by: '2026-11-09'
  note: No academic tier, price or access difference is published. Research apps carry extra obligations (review board, attestation,
    participant disclosures) under the Health Research Policy, which the Developer and User Data Policy makes mandatory for
    IRB-overseen research. Intraday data is available through the list endpoint for all developers, so the legacy intraday
    approval step has no counterpart.
