# ---------------- Research access ----------------
- field: research_program
  status: stated
  value: 'No named academic program. Research is one of the marketed segments of the Sensor Bio B2B platform (raw
    data access, IRB-friendly workflows). The legacy Biostrap research page, still live under a "Biostrap is now
    Sensor Bio" banner, describes a Research Mode in the RPM dashboard with data access hierarchies, de-identified
    user IDs and de-identified downloads.'
  confidence: Verified
  sources:
  - url: https://sensorbio.com/
    type: vendor_page
    quote: Raw data access, IRB-friendly workflows, and reproducible signal quality for academic and research studies.
    retrieved: '2026-10-21'
  - url: https://biostrap.com/research/
    type: vendor_page
    quote: assign de-identified Unique User ID's or download de-identified data, and efficiently manage participant
      compliance via the Biostrap User Management dashboard
    retrieved: '2026-10-21'
  recheck_by: '2026-11-20'
  note: The Research Mode features are described only on biostrap.com, which also lists Biostrap-era hardware
    (Activity Pod, Thermo Patch); sensorbio.com does not repeat them. Whether Research Mode carried over to Sensor
    Bio V2 is not stated. Sensor Bio joined the American Heart Association Center for Health Technology and Innovation
    Innovators' Network in May 2026 (press release); that is a company partnership, not an access route for outside
    researchers.
- field: program_eligibility
  status: stated
  value: Aimed at IRB-approved studies, institutional deployments and population-level programs. No eligibility
    criteria are published.
  confidence: Verified
  sources:
  - url: https://sensorbio.com/
    type: vendor_page
    quote: Built for IRB-approved studies, institutional deployments, and population-level programs.
    retrieved: '2026-10-21'
  - url: https://sensorbio.com/get-started/
    type: vendor_page
    retrieved: '2026-10-21'
  - url: https://biostrap.com/research/
    type: vendor_page
    retrieved: '2026-10-21'
  recheck_by: '2026-11-20'
  note: The sentence describes the platform's target market, not an admission rule. The legacy RPM page offers "special
    packages for qualified partners" without defining qualification.
