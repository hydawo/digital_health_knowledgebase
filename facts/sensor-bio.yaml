# ---------------- Data access and terms ----------------
- field: raw_streams
  status: stated
  scope: Sensor Bio V2
  value: 'Three sensors: multi-wavelength PPG (green, red, infrared), a three-axis accelerometer and skin temperature.
    No gyroscope is listed. Raw PPG, inter-beat intervals and accelerometer export at up to 100 Hz through the RPM
    dashboard; the SDK live stream carries raw PPG, IBI, HR, HRV, respiratory rate, SNR and motion during active
    recording sessions. The REST API raw-download endpoint does not support V2 ("planned for a future release").'
  confidence: Verified
  sources:
  - url: https://sensorbio.com/product/sensor-bio-v2/
    type: vendor_page
    quote: 'Three sensors: multi-wavelength PPG, three-axis accelerometer, skin temperature'
    retrieved: '2026-10-21'
  - url: https://sensorbio.com/product/sensor-bio-v2/
    type: vendor_page
    quote: Raw PPG, IBI, and accelerometer export up to 100 Hz
    retrieved: '2026-10-21'
  - url: https://sensorbio.com/product/sensor-bio-v2/
    type: vendor_page
    quote: During an active recording session the band streams HR, HRV, respiratory rate, beat-to-beat intervals,
      raw PPG, signal-to-noise ratio, and motion.
    retrieved: '2026-10-21'
  - url: https://developers.sensorbio.com
    type: vendor_docs
    fetch_url: https://developers.sensorbio.com/swagger.json
    quote: It will not work for Sensor Bio v1/v2 or newer generation devices. Support for newer devices is planned
      for a future release.
    retrieved: '2026-10-21'
  recheck_by: '2026-11-20'
  note: 'Gyroscope: the Science page still says "Built-in accelerometer and gyroscope sensors" and offers raw gyroscope
    data via the RPM dashboard. That text is carried over from Biostrap and matches EVO hardware (see the EVO entry),
    not the V2 specification. Treat gyroscope as unavailable on V2 unless Sensor Bio confirms otherwise.'
- field: raw_streams
  status: conflict
  scope: Sensor Bio V2, who can get raw export
  value: 'Sensor Bio''s pages disagree on whether raw export is tier-gated. The V2 specification page says raw
    export is "gated to enterprise-tier accounts". The Sensor Bio V2 vs Polar 360 comparison page says raw waveform
    export is "the default data product for every partner, not a gated upsell", and, in the same SDK paragraph
    where the specification page has its enterprise-tier sentence, says "No separate license. No gated tier."'
  confidence: Unclear
  sources:
  - url: https://sensorbio.com/product/sensor-bio-v2/
    type: vendor_page
    quote: Raw data export is available to partners, gated to enterprise-tier accounts
    retrieved: '2026-10-21'
  - url: https://sensorbio.com/product/sensor-bio-v2/
    type: vendor_page
    quote: Raw waveform export is available to partners on enterprise-tier accounts.
    retrieved: '2026-10-21'
  - url: https://sensorbio.com/comparison/sensor-bio-v2-vs-polar-360/
    type: vendor_page
    quote: Raw waveform export is the default data product for every partner, not a gated upsell.
    retrieved: '2026-10-21'
  - url: https://sensorbio.com/comparison/sensor-bio-v2-vs-polar-360/
    type: vendor_page
    quote: No separate license. No gated tier.
    retrieved: '2026-10-21'
  recheck_by: '2026-11-20'
  note: Scope of each statement. The specification page is the more specific product document and states the gate
    twice. The comparison page is marketing against Polar; its "No gated tier" sentence follows the description of
    the SDK's eight data categories, so on its own it may refer to SDK data rather than raw waveform export, but
    its "default data product for every partner" sentence is about raw waveform export directly. Ask Sensor Bio
    whether an academic study needs an enterprise-tier account for raw export.
