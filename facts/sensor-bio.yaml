    hostnames will continue to work until 30 September 2026," from the API reference on 2026-10-11; on 2026-10-21
    that sentence and every getsensr.io mention are gone from the reference, so it is not quoted here. Both old hostnames
    still answer HTTP requests (404 at the root, the same as the new api.sensorbio.com), so retirement could not be
    confirmed from outside. The MCP server README still points at platform.getsensr.io.'
