- field: derived_metrics
  status: stated
  value: Heart rate, HRV (rMSSD, HRV-CV, LF/HF; SDNN and SD1/SD2 on spot checks), respiratory rate, skin temperature
    deviation, steps, calories, activity score, recovery score, sleep stages (REM, deep, light, awake) and sleep,
    circadian score and sleep debt, workouts, stress index and ANS balance. Available through the SDK, the REST API
    and the RPM dashboard. HRV and respiratory rate need at least 50 Hz PPG sampling. SpO2 on V2 is announced but
    not live.
  confidence: Verified
  sources:
  - url: https://sensorbio.com/product/sensor-bio-v2/
    type: vendor_page
    quote: Eight categories of physiological data, fetchable per day or across a range, with the raw datapoint series
      underneath every summary.
    retrieved: '2026-10-21'
  - url: https://sensorbio.com/product/sensor-bio-v2/
    type: vendor_page
    quote: Reports rMSSD, HRV-CV, and sympathetic-shifted LF/HF
    retrieved: '2026-10-21'
  - url: https://sensorbio.com/product/sensor-bio-v2/
    type: vendor_page
    quote: 'Stages: REM, deep, light, and awake, derived from HR, HRV, respiratory rate, and movement'
    retrieved: '2026-10-21'
  - url: https://sensorbio.com/product/sensor-bio-v2/
    type: vendor_page
    quote: Like HRV, requires at least 50 Hz PPG sampling. Not available at 25 Hz.
    retrieved: '2026-10-21'
  - url: https://sensorbio.com/product/sensor-bio-v2/
    type: vendor_page
    quote: Wellness-level SpO₂ in the 85 to 100% range is planned but not yet live.
    retrieved: '2026-10-21'
  recheck_by: '2026-11-20'
  scope: Sensor Bio V2
  note: Several API endpoints (insights, monitoring, device lock) are EVO-only and deprecated; arterial and peripheral
    elasticity are EVO-era metrics tied to a Heart Health subscription.
- field: sampling_rates
  status: conflict
  scope: Sensor Bio V2
  value: 'The V2 specification: PPG sampling 50 Hz by default, configurable to 25 or 100 Hz per organization, with
    up to 100 Hz raw export and a configurable duty cycle; HR at 1-second resolution during active captures and 1-minute
    averages otherwise; HRV sampled every 2 minutes overnight. Sensor Bio''s May 2026 AHA press release says the
    platform "captures raw physiological signals at 15,000 samples per second". The press wording names no channel,
    sensor or aggregate, so it cannot be read as a different measure from the text; the two vendor statements conflict
    as written.'
  confidence: Unclear
  sources:
  - url: https://sensorbio.com/product/sensor-bio-v2/
    type: vendor_page
    quote: Sampling 50 Hz by default, configurable to 25 or 100 Hz per organization Up to 100 Hz raw export.
    retrieved: '2026-10-21'
  - url: https://sensorbio.com/product/sensor-bio-v2/
    type: vendor_page
    quote: 1-second sampling during active captures, 1-minute averages otherwise
    retrieved: '2026-10-21'
  - url: https://sensorbio.com/product/sensor-bio-v2/
    type: vendor_page
    quote: Sampled every 2 minutes through the night, during the day when available, and on spot check
    retrieved: '2026-10-21'
  - url: https://sensorbio.com/press/sensor-bio-joins-innovators-network-at-american-heart-association-center-for-hea/
    type: vendor_page
    quote: captures raw physiological signals at 15,000 samples per second
    retrieved: '2026-10-21'
  recheck_by: '2026-11-20'
  note: 'Decision on the 15,000 figure: an aggregate across exported channels does not explain it (three PPG wavelengths
    plus three accelerometer axes at the 100 Hz maximum is 600 samples per second), and the release gives no other
    basis, so it stays a conflict rather than being reinterpreted. It may be an internal ADC or oversampling rate,
    but nothing published says so. For study planning, 100 Hz is the documented researcher-facing ceiling. Ask Sensor
    Bio what the 15,000 figure measures.'
- field: history_depth
  status: stated
  value: 'Cloud history is retained per deployment as configured with the partner; API queries cannot go back before
    the user''s account creation. Per-request windows: raw export 1 to 7 days and computed metrics 1 to 30 days in
    the dashboard; at most 6 hours per API timeseries call. The band buffers about 14 days at default sampling, overwriting
    the oldest data.'
  confidence: Verified
  sources:
  - url: https://sensorbio.com/product/sensor-bio-v2/
    type: vendor_page
    quote: Configured per deployment to retain the history the partner actually needs
    retrieved: '2026-10-21'
  - url: https://sensorbio.com/product/sensor-bio-v2/
