- field: deprecations
  status: stated
  value: 'API: the continuous-mode biometrics timeseries and normalized activity timeseries endpoints were to be
    discontinued on 30 September 2026; the raw-download endpoint is deprecated and works only for legacy EVO devices
    (V1/V2 support "planned for a future release"); several other EVO-only endpoints are deprecated. The old api.getsensr.io
    and auth.getsensr.io hostnames were to stop working after 30 September 2026 (read 2026-10-11; that text has since
    been removed). Brand: Biostrap renamed Sensor Bio, with EVO and Kairos continuity pages; Terra marked its Biostrap
    integration deprecated in July 2026.'
  confidence: Verified
  sources:
