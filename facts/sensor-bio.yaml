- field: developer_program_status
  status: stated
  value: 'A public REST API reference (Sensor Bio Developers API) is online, but it is not self-serve: API keys
    are created in the web dashboard by an organisation administrator whose account has the developer feature enabled,
    on request to developers@sensorbio.com. Mobile SDK keys are issued the same way and the Mobile SDK documentation
    is not public. OAuth2 per-user access is unclear: the API reference describes an OAuth2 Bearer token with in-browser
    user consent, while Sensor Bio''s own MCP server README (repository last pushed 2026-02-19) says the auth server
    does not support the authorization_code grant for external OAuth2 apps.'
  confidence: Verified
  sources:
  - url: https://developers.sensorbio.com
    type: vendor_docs
    fetch_url: https://developers.sensorbio.com/swagger.json
    quote: Organisation administrator access with the developer feature enabled is required.
    retrieved: '2026-10-21'
  - url: https://developers.sensorbio.com
    type: vendor_docs
    fetch_url: https://developers.sensorbio.com/swagger.json
    quote: Contact developers@sensorbio.com if your account does not yet have this feature.
    retrieved: '2026-10-21'
  - url: https://developers.sensorbio.com
    type: vendor_docs
    fetch_url: https://developers.sensorbio.com/swagger.json
    quote: OAuth2 only pays for itself when the people whose data you are reading are not your organization's members
      and must each grant you access individually.
    retrieved: '2026-10-21'
  - url: https://github.com/Biostrap/sensr-mcp-server
    type: repository
    fetch_url: https://raw.githubusercontent.com/Biostrap/sensr-mcp-server/main/README.md
    quote: Org API Key is the only supported auth method for third-party integrations.
    retrieved: '2026-10-21'
  recheck_by: '2026-11-20'
  note: 'Draft A (2026-10-11) read a fuller OAuth2 section and a version number (v1.4.0) in the API reference; on
    2026-10-21 the reference keeps only the comparison table and passing OAuth2 mentions, with no version and no grant
    type named. The README sentence about authorization_code is on the page but its backticks make the probe read
    it as reworded, so the adjacent sentence is quoted. Ask developers@sensorbio.com whether per-user OAuth2 is live.
    Draft B said no public API documentation exists; that is wrong, it missed developers.sensorbio.com.'
