# ---------------- Data access and terms ----------------
- field: raw_streams
  status: stated
  value: 'Active data only: timestamped EMA, ESM and eDiary responses across 13 question types (including media
    uploads), with GPS coordinates captured once per response when the participant allows location. No passive
    smartphone sensing and no wearable, HealthKit or Health Connect integration is documented. Route: the web study
    builder and data download.'
  confidence: Corroborated
  sources:
  - url: https://www.lifedatacorp.com/solutions-research/
    type: vendor_page
    quote: All responses are timestamped and geolocation reporting is standard.
    retrieved: '2026-10-11'
  - url: https://www.lifedatacorp.com/solutions-research/
    type: vendor_page
    quote: Gather GPS coordinates with each user response.
    retrieved: '2026-10-11'
  - url: https://www.lifedatacorp.com/features/
    type: vendor_page
    quote: Choose from 13 question types, including multiple choice, scales, free text, media uploads, and web.
    retrieved: '2026-10-11'
  - url: https://www.lifedatacorp.com/features/
    type: vendor_page
    quote: Capture location data with participant responses for deeper insights.
    retrieved: '2026-10-11'
  - url: https://pmc.ncbi.nlm.nih.gov/articles/PMC12481226/
    fetch_url: https://www.ebi.ac.uk/europepmc/webservices/rest/PMC12481226/fullTextXML
    type: paper
    quote: geolocation tracking data were collected through Google Maps (Google), while participants completed a series
      of ecological momentary assessment questions each day through the RealLife Exp application (LifeData, LLC)
    retrieved: '2026-10-11'
  recheck_by: '2026-11-10'
  note: The absence of passive sensing and wearables comes from searching the site (sensor, wearable, Fitbit, passive
    return only blog literature roundups); the gated help centre cannot rule out an undocumented option, so
    Corroborated. Published deployments that wanted continuous location or wearables ran a separate app alongside
    (Google Maps Timeline in the JAMA Netw Open 2025 study cited; Fitbit and Oura in others found by the gap hunter).
    The LifeData+ App Store privacy label lists "Audio Data" and "Health Fitness"; the console's question types
    include video responses but no audio or sensor type, so the label most likely covers video sound and survey
    answers. That reading is inference.
- field: derived_metrics
  status: stated
  value: Study-defined scores computed from responses (usable in display logic), response-rate and engagement
    monitoring, session metadata in the export, and real-time dashboards for individuals and groups. No
    sensor-derived or behavioural features.
  confidence: Verified
  sources:
  - url: https://www.lifedatacorp.com/
    type: vendor_page
    quote: Well-labeled datasets in multiple formats with timestamps, scores, and session metadata; ready for immediate
      analysis.
    retrieved: '2026-10-11'
  - url: https://www.lifedatacorp.com/features/
    type: vendor_page
    quote: Use display logic, piped text, and scores to create adaptive study experiences.
    retrieved: '2026-10-11'
  - url: https://www.lifedatacorp.com/features/
    type: vendor_page
    quote: Track participant engagement, response rates, and study activity in real time.
    retrieved: '2026-10-11'
  - url: https://www.lifedatacorp.com/features/
    type: vendor_page
    quote: Visualize participant data in real time with customizable dashboards for individuals and groups.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-10'
- field: sampling_rates
  status: stated
  value: Event-based, not continuous. Prompts follow fixed, random, triggered or event-based schedules set by the
    researcher; GPS is captured once per response, not at a fixed rate; notification delivery and response timestamps
    are recorded to the millisecond.
  confidence: Verified
  sources:
  - url: https://www.lifedatacorp.com/features/
    type: vendor_page
    quote: Track notification delivery, response timing, and participant engagement with millisecond precision.
    retrieved: '2026-10-11'
  - url: https://www.lifedatacorp.com/solutions-research/
