    complies with GDPR. Its privacy policy (updated December 12, 2024) says it complies with the EU-U.S. Data Privacy
    Framework, the UK Extension and the Swiss-U.S. DPF; the Terms of Use (effective December 12, 2014) still say it
    participates in the invalidated Privacy Shield.
