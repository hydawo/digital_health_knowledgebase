# ---------------- Research access ----------------
- field: research_program
  status: stated
  value: No separate research or academic program. LifeData is itself a paid research platform (EMA, experience
    sampling, eDiary, eCOA, ePRO) sold as Individual, Team, Enterprise, Clinical and Monitoring subscriptions, with
    optional paid services such as protocol building, user acceptance testing, audit trails and data analysis
    consultation.
  confidence: Verified
  sources:
  - url: https://www.lifedatacorp.com/products-2/
    type: vendor_page
    quote: Individual State of the science mobile data collection Academic and commercial pricing Half-year and annual
      subscriptions All features included
    retrieved: '2026-10-11'
  - url: https://www.lifedatacorp.com/products-2/
    type: vendor_page
    quote: With a wide range of additional paid services
    retrieved: '2026-10-11'
  recheck_by: '2026-11-10'
  note: Academic pricing and the graduate-student discount are recorded under academic_pricing and program_eligibility.
    The VA contracts under subscription_price are procurement, not a program.
- field: program_eligibility
