- field: history_depth
  status: conflict
  value: On-device recording length at a given rate is stated three ways. The product sheet and the IFU's
    specification table give 14 days at 100 Hz and 60 days at 20 Hz; the IFU's own per-version table gives, for
    versions 1.2 and 1.3, 14 days at 100 Hz, 44 at 20 Hz and 56 at 10 Hz (version 1.1, 7 and 30); the FAQ gives 7
    days at 100 Hz and 30 at 20 Hz. Once extracted, files sit in the study's own storage with no vendor limit.
  confidence: Unclear
  scope: GENEActiv
  sources:
  - url: https://activinsights.com/wp-content/uploads/2026/02/Product-Information-Sheet-Rev.002.pdf
    type: vendor_docs
    quote: Maximum Logging Periods 60 days @20hz, 14 days @100hz
    retrieved: '2026-10-11'
  - url: https://activinsights.com/wp-content/uploads/2026/02/IFU-GENEActiv-Rev.010.pdf
    type: vendor_docs
    quote: Measurement Max. Measurement Period (Days) Frequency Ver Ver Ver 1.1 1.2 1.3 10 30 56 56 20 30 44 44
    retrieved: '2026-10-11'
  - url: https://activinsights.com/resources/faqs/
    type: vendor_page
    quote: For example, recording at 100Hz lasts for 7 days and 20Hz records for 30 days.
    retrieved: '2026-10-11'
  - url: https://activinsights.com/research-study-services/apps-software/
    type: vendor_page
    quote: As wearables are returned from the field, the GENEActiv software will extract sensor-level, raw data to
      local, sovereign data stores.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-10'
  note: 'Most likely reading: the FAQ describes version 1.1 (its figures match the 1.1 column exactly), and 14 days
    at 100 Hz holds for 1.2 and 1.3. The 60-days-at-20-Hz figure is contradicted by the IFU''s own table, where no
    rate reaches 60 days; plan on 44 days at 20 Hz until the vendor confirms. The IFU also says a start delay cuts
    the achievable period by about 5% per week, and its "Duration of use 14 to 60 days" line is followed by an
    unremoved editorial comment, so the document was published mid-edit. The comparison sheet (Jan 2025) gives
    battery life as 2 weeks to 2 months and data capacity as 1 Gb, about 3 weeks of wear. Plugging a recording
    device into the cradle ends the recording (IFU).'
