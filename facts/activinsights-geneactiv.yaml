- field: deprecations
  status: stated
  value: No product shutdown announced. GENEActiv is moving from the EU Medical Device Directive to the EU MDR under
    the Regulation 2023/607 transition. A GENEActiv 1.3 hardware revision (Bluetooth adherence) shipped in 2026. The
    Band uploader app was rebranded ActivInsights Companion and now supports both devices. Support for the oldest
    GENEActiv units (serials starting 0) is by request.
  confidence: Verified
  sources:
  - url: https://activinsights.com/digital-health-technologies/professional-wearables/geneactiv/
    type: vendor_page
    quote: we will be transitioning to compliance with the EU Medical Device Regulation (EU MDR)
