# ---------------- Research access ----------------
- field: research_program
  status: stated
  value: No named academic or research access program. Research is the core market, served by device sales on
    quotation plus paid, quoted Study Services (study design, logistics and deployment, GENEActiv and R Markdown
    training, data acquisition and analysis, algorithm development), and by free sleep tools (Actigraphy Sleep
    Toolkit; Advanced Sleep Toolkit free up to 10 participants).
  confidence: Verified
  sources:
  - url: https://activinsights.com/research-study-services/
    type: vendor_page
    quote: We offer a full-scale service for clinical trials and academic research projects.
    retrieved: '2026-10-11'
