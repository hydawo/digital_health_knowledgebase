- field: export_routes
  status: stated
  value: 'USB route: the free GENEActiv Software (Windows, macOS) extracts .bin files over the 4-unit USB cradle and
    converts them to raw CSV, epoch CSV or epoch AWD (for Actiware-style scoring or the Sleep Toolkit); the open R
    packages read .bin. GENEActiv 1.3 adds Bluetooth adherence extraction by a background app (Windows, macOS,
    Android; iOS adherence only), repeating roughly every five hours. Optional cloud route: the ActivInsights Device
    Manager uploads .bin files to the Study Management Hub.'
  confidence: Verified
  scope: GENEActiv
  sources:
  - url: https://activinsights.com/wp-content/uploads/2026/02/IFU-GENEActiv-Rev.010.pdf
    type: vendor_docs
    quote: Data extraction is the process of reading recorded data from a device at the end of a recording and saving
      it to a GENEActiv .bin file.
    retrieved: '2026-10-11'
  - url: https://activinsights.com/wp-content/uploads/2026/02/IFU-GENEActiv-Rev.010.pdf
    type: vendor_docs
    quote: The process will typically repeat at roughly five-hour intervals, supporting the provision of near
      real-time adherence information.
    retrieved: '2026-10-11'
  - url: https://activinsights.com/wp-content/uploads/2026/02/IFU-GENEActiv-Rev.010.pdf
    type: vendor_docs
    quote: Bluetooth 5 is required for adherence data extraction
    retrieved: '2026-10-11'
  - url: https://activinsights.com/resources/faqs/
    type: vendor_page
    quote: The GENEActiv software allows you to set up the device and extract raw data as a .bin file.
    retrieved: '2026-10-11'
  - url: https://activinsights.com/digital-health-technologies/advance_sleeptoolkit/
    type: vendor_page
    quote: Upload a .bin file to the ActivInsights Study Management Hub (this is automated with the ActivInsights
      Device Manager).
    retrieved: '2026-10-11'
  - url: https://cran.r-project.org/web/packages/GENEAread/index.html
    type: repository
    quote: Functions and analytics for GENEA-compatible accelerometer data into R objects.
    retrieved: '2026-10-11'
  recheck_by: '2026-11-10'
  note: Each adherence sync extracts and then erases the adherence data on the device (IFU). The Study Management Hub
    (demo by request) gives real-time device and participant status and adherence.
