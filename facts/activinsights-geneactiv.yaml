  note: 'openFDA 510(k) searches on 2026-10-11 returned no matches for applicant:activinsights and
    device_name:geneactiv. The IKK classification record has submission_type_id 4 (510(k) exempt), so the
    vendor''s "510(k) exempt" wording matches the listing. The vendor''s class statements do not: IFU Rev.010 cites
    21 CFR 882.1400 (electroencephalograph) and 882.5050 (biofeedback), neither of which is IKK, and calls GENEActiv
    EU MDR Class IIa; the web page and the comparison sheet call it Class I, which is the EU MDD class, not an FDA
    class. In openFDA, 882.5050 includes product code LEL (sleep assessment device), which needs a 510(k); the IKK
    listing does not cover that use. The FDA database is the authority for US status.'
