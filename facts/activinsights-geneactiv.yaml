# ---------------- Data access ----------------
- field: raw_streams
  status: stated
  value: Raw, unfiltered tri-axial acceleration in SI units (+/- 8 g, 12 bit), ambient light, near-body temperature
    and event-button presses, stored on the device and extracted to an open-format .bin file over the USB cradle.
    GENEActiv 1.3 also sends adherence data over Bluetooth during wear; raw data still come off by USB.
  confidence: Verified
  scope: GENEActiv
  sources:
  - url: https://activinsights.com/digital-health-technologies/professional-wearables/geneactiv/
    type: vendor_page
    quote: It produces raw, unfiltered tri-axial acceleration data in SI units in an open data format.
    retrieved: '2026-10-11'
